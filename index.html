nosul"},{"t":"ius honorarium","d":"a praetori jog (ius praetorium) – az edictumok jogszabályi jellege megszilárdul"},{"t":"ius publicum","d":"közjog – az államszervezetre és a vallási szervezetre vonatkozik, közérdek"},{"t":"ius privatum","d":"magánjog – a polgárok személyi, vagyoni és családi viszonyaira vonatkozik, magánérdek"},{"t":"ius cogens","d":"kényszerítő jellegű jog – közjogi"},{"t":"ius dispositivum","d":"engedő, hézagpótló jellegű jog – magánjogi"},{"t":"boni mores","d":"„jó erkölcsök” – szokásjogi jellegű, kiemelt jelentőségű alapelv"}],"drills":[{"q":"Sorold fel Róma szabad társadalmának rétegeit a principátus korában!","a":["császár (a társadalmi piramis csúcsán)","senatori rend (ordo senatorius)","lovagrend (ordo equester)","városok nemessége (ordo decurionum)","köznép (plebs)"]},{"q":"Sorold fel a princeps élethossziglan viselt jogosítványait és címeit!","a":["tribunicia potestas (sérthetetlenség, senatus és népgyűlés összehívása, vétójog)","imperium proconsulare (a provinciák feletti legfelsőbb kormányzat)","imperator","pontifex maximus"]},{"q":"Sorold fel a császári kancellária négy osztályát!","a":["naplók vezetése és adminisztrációs feladatok","hivatalos levelezés","jogi beadványokkal foglalkozás","a császári magánkincstár (fiscus Caesaris) számvitele"]},{"q":"Sorold fel a praefectus praetorio feladatait!","a":["a császári testőrség főparancsnoksága (katonai jogosítványok)","egész Itáliára kiterjedő törvénykezési hatóság","a princeps helyettesítése a provinciai fellebbezéseknél","általános rendeletek kibocsátása (császári rendelettel ellentétes nem lehet)"]},{"q":"Sorold fel a klasszikus jog fogalompárjait!","a":["ius civile – ius honorarium (ius praetorium)","ius publicum – ius privatum","ius cogens – ius dispositivum"]}]},{"num":6,"title":"A római állam és jog a késői császárkorban","essay":[{"prompt":"Fejtsd ki a késő császárkor társadalmának tagozódását!","keyPoints":["a szabadok kettős felosztása: honestiores és humiliores","honestiores („előkelők”): arisztokrácia, papság, hivatalnokok, katonatisztek, a „magasabb foglalkozások művelői”","a honestiores felső osztálya (nobiles): senatorok és lovagok, akikből a birodalmi főméltóságok és jelentős hivatalok viselői kerülnek ki","a honestiores alsó osztálya (curiales): a városi nemesség","a humiliores alatt már csak a rabszolgák állnak","városi köznép (plebs): szakmai egyesületekbe tömörülés","colonusok: félszabadok, két kategóriában – szabad bérlők és röghöz kötöttek"]},{"prompt":"Mutasd be a késő császárkor államszervezetét (dominátus, birodalmi adminisztráció, egyház)!","keyPoints":["új államforma: a dominátus (a dominus = uralkodó szóból) – alig burkolt abszolutizmus","tetrarchia („négyes uralom”, Diocletianus): 2 főcsászár (Augusti) + 2 alcsászár (Caesares)","az államhatalom a császár kezében: kizárólagos törvényhozó, igazságszolgáltató és végrehajtó hatalom, valamint az államvagyon tulajdonosa","a hatalomgyakorlás eszköze a hivatalnokapparátus; a köztársasági szervek (néhány magistratus, senatus) elveszítik jelentőségüket","egységes, funkcionálisan és hierarchikusan tagolt birodalmi adminisztráció","központi kormányzat a császári udvarban: államtanács (sacrum consistorium) – a palota tisztségviselői, a közigazgatás vezetői és az udvari főméltóságok, gyűlése a trónteremben","négy udvari főméltóság: magister officiorum (főudvarmester), quaestor sacri palatii (főkancellár), comes sacrarum largitionum (pénzügyek), notarii (írnokok)","területi polgári igazgatás: 4 praefectus praetorio, 1-1 praefectus urbi a két fővárosban, vicariusok, valamint a helytartók (bíráskodás, közrend, önkormányzati felügyelet)","katonai igazgatás: a császár közelében tartózkodó, a belső tartományokban letelepített és a határokat védő alakulatok","egyházszervezet: püspök (episcopus), a provincia központjában székelő metropolita, patriarcha – Róma püspöke, a pápa kiemelkedő"]},{"prompt":"Fejtsd ki a késő császárkor jogrendszerének (posztklasszikus és iustinianusi jog) jellemzőit!","keyPoints":["egyesülés a birodalmi jogrendszerben","a ius civile mellett megjelenik a ius criminale (a közbűncselekményekre vonatkozó jog), de a ius civile eredeti jelentése megmarad","a ius publicum és a ius privatum határainak elhalványulása","jogszabálygyűjtő munkák: idézési törvények, jogegységesítő aktusok, iustinianusi kodifikáció","a birodalmi jogok és a helyi jogok egységesedése; a kereszténység hatása","a vulgárjog oka: a fejlett gazdasági és szellemi élet lehanyatlott, a klasszikusok gondolkodásmódja nem érvényesült","posztklasszikus római vulgárjog: a leegyszerűsödött jogászi gondolkodásmódot tükröző római jog","a iustinianusi törvényhozás: a XII táblás törvény óta az első, a teljes jogot összefoglaló joganyag","a korábbi kodifikációk csak császári rendeletanyagot vagy edictumanyagot fogtak át","a iustinianusi kodifikáció = a jogtudósok művei (ius) + a császári rendeletek (leges)"]}],"terms":[{"t":"honestiores","d":"a szabadok felső rétege, az „előkelők”: arisztokrácia, papság, hivatalnokok, katonatisztek, magasabb foglalkozások művelői"},{"t":"humiliores","d":"a szabadok alsó rétege (városi köznép, colonusok), alattuk már csak a rabszolgák"},{"t":"nobiles","d":"a honestiores felső osztálya: senatorok és lovagok, a birodalmi főméltóságok viselői"},{"t":"curiales","d":"a honestiores alsó osztálya: a városi nemesség"},{"t":"plebs","d":"a városi köznép, amely szakmai egyesületekbe tömörült"},{"t":"colonus","d":"félszabad; két kategóriája a szabad bérlő és a röghöz kötött"},{"t":"dominatus","d":"a késő császárkor új államformája: alig burkolt abszolutizmus (a dominus = uralkodó szóból)"},{"t":"tetrarchia","d":"„négyes uralom” (Diocletianus): 2 főcsászár és 2 alcsászár"},{"t":"Augusti","d":"a tetrarchia két „főcsászára”"},{"t":"Caesares","d":"a tetrarchia két „alcsászára”"},{"t":"sacrum consistorium","d":"államtanács: a császári palota tisztségviselői, a közigazgatás felelős vezetői és az udvari főméltóságok; gyűlése a trónteremben"},{"t":"magister officiorum","d":"főudvarmester: a császári döntések formába öntése, hivatali ügyek intézése"},{"t":"quaestor sacri palatii","d":"főkancellár (ma az igazságügyi miniszternek felel meg)"},{"t":"comes sacrarum largitionum","d":"udvari főméltóság, ma a pénzügyminiszternek felel meg"},{"t":"notarii","d":"írnokok (udvari főméltóság)"},{"t":"praefectus praetorio","d":"a polgári igazgatás vezetője (négy volt belőlük)"},{"t":"praefectus urbi","d":"a két főváros külön igazgatója (1-1)"},{"t":"vicarius","d":"a praefectus praetoriók segítője, később önállóságra tett szert"},{"t":"episcopus","d":"püspök"},{"t":"metropolita","d":"a provincia központjában székelő püspök"},{"t":"patriarcha","d":"a legtekintélyesebb püspöki székek viselője; közülük kiemelkedő Róma püspöke, a pápa"},{"t":"ius criminale","d":"a közbűncselekményekre vonatkozó jog"}],"drills":[{"q":"Sorold fel a késő császárkori szabadok két fő rétegét!","a":["honestiores","humiliores"]},{"q":"Sorold fel a honestiores két osztályát!","a":["felső osztály (nobiles): senatorok és lovagok","alsó osztály (curiales): városi nemesség"]},{"q":"Sorold fel a humiliores rétegeit!","a":["városi köznép (plebs)","colonusok (félszabadok)"]},{"q":"Sorold fel a colonusok két kategóriáját!","a":["szabad bérlők","röghöz kötöttek"]},{"q":"Sorold fel a tetrarchia szereplőit!","a":["2 főcsászár (Augusti)","2 alcsászár (Caesares)"]},{"q":"Sorold fel a négy udvari főméltóságot!","a":["magister officiorum (főudvarmester)","quaestor sacri palatii (főkancellár)","comes sacrarum largitionum (pénzügyek)","notarii (írnokok)"]},{"q":"Sorold fel a területi polgári igazgatás szerveit!","a":["4 praefectus praetorio","1-1 praefectus urbi (két főváros)","vicariusok","helytartók"]},{"q":"Sorold fel a katonai igazgatás alakulattípusait!","a":["a császár közelében tartózkodó alakulatok","a belső tartományokban letelepített alakulatok","a határokat védő alakulatok"]}]},{"num":7,"title":"Róma államközi kapcsolatai","essay":[{"prompt":"Fejtsd ki Róma államközi kapcsolatait az archaikus korban és a kései köztársaság idején!","keyPoints":["az archaikus korban szövetség a latinokkal, amelyet később a latin szövetségesek háborúja követ","hospitium (privatum): két különböző etnikumú család hosszú időre szóló védelmi megállapodása","barátsági szerződés (amicitia): városállamok között jön létre, alapja a hospitium","harmadik intézmény: a szövetségi szerződések","a kései köztársaságban Róma célja Itália uralma, ennek eszközei a szerződéskötések","Itálián kívül a hódítás eszköze a provinciák megszerzése","a szövetségi szerződések (foedera) két fajtája: foedus aequum és foedus iniquum","foedus aequum (egyenlő): nem fosztja meg a másik felet szerződési és hadüzeneti jogától","foedus iniquum (egyenlőtlen): a „római nép felségének” formális elismerése"]},{"prompt":"Fejtsd ki a császárkori államközi kapcsolatokat és az államközi kapcsolatok jogi megjelenését (ius fetiale, ius gentium)!","keyPoints":["a császárkorban Róma gondolkodásmódja az „egyhatalmi ideológia”, a szerződések ennek érdekében születnek","ius fetiale: a városállamok közötti érintkezést – elsősorban a hadüzenetet és a békekötést – rendező vallási előírások összessége","a ius fetiale eredetileg a fas területén helyezkedik el (nem ius)","a szerződésszegés istensértés, ezért háború indítását vonja maga után – a háború „istenítéleti párbaj”","ius gentium eleinte: Róma államközi érintkezéseit rendező, szakrális jellegüket elvesztett szabályok összessége","ius gentium később: a minden népnél megtalálható, közös magánjogi szabályok összessége","egyik sem nemzetközi jog a mai értelemben, mert a szuverenitás fogalma – a mai nemzetközi jog alapja – ismeretlen volt"]}],"terms":[{"t":"hospitium (privatum)","d":"két különböző etnikumú család hosszú időre szóló védelmi megállapodása"},{"t":"amicitia","d":"barátsági szerződés városállamok között, amelynek alapja a hospitium"},{"t":"foedus (foedera)","d":"szövetségi szerződés(ek)"},{"t":"foedus aequum","d":"egyenlő szövetségi szerződés: nem fosztja meg a másik felet szerződési és hadüzeneti jogától"},{"t":"foedus iniquum","d":"egyenlőtlen szövetségi szerződés: a „római nép felségének” formális elismerése"},{"t":"ius fetiale","d":"a városállamok közötti érintkezést (hadüzenet, békekötés) rendező vallási előírások összessége; eredetileg a fas területén"},{"t":"ius gentium","d":"eleinte Róma államközi érintkezéseit rendező, szakrális jellegét vesztett szabályok összessége; később a minden népnél közös magánjogi szabályok összessége"}],"drills":[{"q":"Sorold fel az archaikus Róma államközi érintkezésének intézményeit!","a":["hospitium (privatum)","barátsági szerződés (amicitia)","szövetségi szerződések"]},{"q":"Sorold fel a szövetségi szerződések (foedera) fajtáit!","a":["foedus aequum (egyenlő)","foedus iniquum (egyenlőtlen)"]}]},{"num":8,"title":"A jog (ius) fogalma és forrásai a rómaiaknál","essay":[{"prompt":"Fejtsd ki a jog (ius) fogalmát, a jogi dogmatika alapfogalmait és a jog különböző felosztásait!","keyPoints":["a ius kettős jelentése: jogosultság, alanyi jog (facultas agendi) és jogszabályok, tárgyi jog (norma agendi)","facultas agendi: a személynek cselekvési, perindítási lehetősége van bizonyos körben","a norma agendihez kötődik a jog filozofikus megközelítése és a jogszabályok forrásai","a jog ősi fogalmi eleme Rómában az igazságosság (iustitia), a cél ennek érvényre juttatása","jogviszony: olyan emberek közötti viszony, amelyet a tárgyi jog szabályoz (pl. tulajdonos és nem tulajdonos viszonya)","jogi tény: joghatásokat kiváltó tény (pl. jogügyletek)","jogintézmény: nagyobb jelentőségű jogviszonyokra vonatkozó jogszabályok rendszerezett összessége (pl. apai hatalom, tulajdon)","jogág: egymáshoz hasonló jogviszonyokat rendező jogszabályok összessége (pl. ius publicum – ius privatum)","jogrendszer: az adott államban hatályos jogszabályok összessége (a tárgyi jog legfelső kategóriája)","ius universale – ius particulare: az állam egész területére kiterjedő, illetve egyes részterületeken érvényesülő jog","ius generale – ius speciale: általános jelleg (főszabály) és különös jelleg (kivétel)","ius commune – ius singulare: a jog rendszerinti, illetve kivételes alkalmazása","ius primarium – ius subsidiarium: elsődleges és kisegítő jogszabály","további párok: ius vetus – ius novum, ius ordinarium – ius extraordinarium, ius sacrum – ius profanum, ius divinum – ius humanum, ius scriptum – ius non scriptum"]},{"prompt":"Fejtsd ki a jogalkalmazás folyamatát: a jogszabály kiválasztását, az értelmezést (interpretatio) és az analógiát!","keyPoints":["a jogalkalmazás folyamata: a vonatkozó jogszabály kiválasztása, a jog kötelező erejének megállapítása, majd értelmezés (interpretáció)","kiválasztási elv: lex posterior derogat legi priori („a későbbi törvény lerontja a korábbi törvényt”)","kiválasztási elv: lex specialis derogat legi generali („a különös törvény lerontja az általános törvényt”)","kiválasztási elv: lex primaria derogat legi subsidiariae („az elsődleges törvény lerontja a kisegítő törvényt”)","az interpretatio logikai művelet: a jogszabály rendelkezéseinek konkrét esetre való kimondása ítéletként","az értelmezési folyamat módjai: nyelvtani (grammatica), logikai (logica), rendszertani (systematica), történeti (historica)","általános elv: a jogszabály értelmezése a maga egészében","általános elv: a törvény kijátszásának (in fraudem legis) és a törvényhozó akaratának (voluntas legis) vizsgálata","általános elv: az enyhébb megoldás alkalmazása – in dubio pro reo („kétség esetén a vádlott javára kell ítélni”)","általános elv: a logika általános szabályainak követése","az interpretáció eredménye szerint: megállapító (declarativa), kiterjesztő (extensiva), megszorító (restrictiva)","az analógia a tényállás hasonlóságán alapuló jogalkalmazói eljárás, egyben a jogalkotás egyik neme (a praetorok és pontifexek eljárása)","az analógia korlátja a jogrendszer belső logikájának betartása"]},{"prompt":"Fejtsd ki a jogforrás fogalmát, valamint a szokásjogot (consuetudo) és a törvényt (lex) mint jogforrást!","keyPoints":["a jogforrás (fons iuris) ismeretelméleti fogalma: a jog megjelenési formája, ahonnan az megismerhető (fons cognoscendi); lételméleti fogalma: ami a jogot létrehozza (fons essendi)","a római jog forrásai: consuetudo, lex, senatus consultum, edictum, iurisprudentia, constitutio","a szokásjog a legrégebbi forrás: a jogi tartalmat nyert szokások (jogszokások) összessége, állami biztosítékkal","a szokásjog íratlanul keletkezik (ius non scriptum), gyökere közös az erkölccsel (de nem azonos a mosszal)","ismérvei: a nép hallgatólagos egyetértése fogad el egy gyakorlatot, írásba foglalás nélkül, és mindenkit kötelez","a principátus alatt kettős arculat: a törvények magyarázója és törvényrontó szokás (desuetudo); a dominátus alatt a törvényrontó hatály már nincs meg","a lex fogalma: előírt módon írásban megszövegezett, a népgyűlések (comitia centuriata és tributa) által megszavazott és szabályszerűen kihirdetett határozat, ideértve a plebiscitumokat is","a lex rogata meghozatalában mindhárom állami főszerv részt vesz: a magistratus (összehívás, javaslat), a comitia (szavazás), a senatus (megerősítés – patrum auctoritas)","később a plebiscitum (a plebejusi népgyűlésen meghozott törvény) mindenkire kötelező","a lex rogata részei: praescriptio (fejirat), rogatio (rendelkező rész), sanctio (joghátrányok)","a sanctio szerint: lex perfecta (tilalom + érvénytelenítés), lex minus quam perfecta (büntetés, de érvénytelenítés nincs), lex imperfecta (tilalom joghatás nélkül)","lex data: egyes, törvényhozásra jogosított magistratus által kiadott törvény; a császárkorban a lex a császári rendeleteket jelenti","a XII táblás törvényt (lex duodecim tabularum) a decemviri legibus scribundis (10 fős, consuli hatalmú bizottság) szövegezte; magánjogi jellegű szabályok, a római fejlődés kizárólagos alapja","a XII táblás törvény utáni törvényhozásnak a római magánjog fejlődésében csekély szerepe volt"]},{"prompt":"Fejtsd ki a senatusi határozatot, a magistratusok hirdetményeit és a császári rendeleteket mint jogforrást!","keyPoints":["senatus consultum: a köztársaság korában nem jogforrás; a császárkorban mögötte a princeps akarata áll, így törvényerővel bír","az edictum fehér fatáblán közzétett hirdetmény, kiadói a magistratus curules (kiadási joguk: ius edicendi)","legjelentősebb a praetori edictum (egész vagyonjog, részben családjog); az aedilis curulisi edictum a szavatossági kört fedi le; provinciai megfelelőik a helytartói és a provinciai quaestori hirdetmények","a praetornak a civiljogban nincs jogalkotása: hatalma imperiumon alapuló pervezető hatalom (kereset)","a jogfejlődés számottevő tényezői a praetor urbanus peren kívüli jogsegélyei","a fejlődés legnagyobb mérföldköve a praetor peregrinus által kialakított formuláris perrend: olyan igények is érvényesülhetnek, amelyek a civiljog alapján nem","az edictum tartalma nem változott minden kibocsátáskor: a praetorok átvették egymástól a korábbi gyakorlatot, kiegészítő rendelkezésekkel","az edictum jogforrási jellege eleinte bizonytalan; a lex Cornelia (Kr. e. 67) óta a praetor köteles tartani magát a meghirdetett edictumhoz","Salvius Iulianus Hadrianus megbízásából rendszerezte az edictumanyagot (Kr. u. 130 körül): az Edictum perpetuumot a császár megváltoztathatatlannak és kötelezőnek nyilvánította","a császári rendelet (constitutio) eleinte nem jogforrás, a birodalmi szervezet kiépülésével válik azzá; fajtái: constitutio generalis (általános) és specialis (egyedi)","principátus kori rendeletek: edictum (a princeps mint a „köztársaság” első képviselője), rescriptum (elvi döntés vitás helyzetekben, a responsum mintájára), mandatum (utasítás közigazgatási ügyekben), decretum (határozat a fellebbezett ügyekben)","dominátus kori új formák: oratio principis és pragmatica sanctio (ünnepélyes, privilégiumot vagy tartományi rendtartást tartalmaz)","Codex Theodosianus (438): II. Theodosius és III. Valentinianus alatt a birodalom mindkét felén érvényesül; a császári constitutiók összefoglalása I. Constantinustól, 16 könyv, a közjog kiemelkedő szerepével","az idézési törvény (lex citationis, 426) öt kiemelkedő jogtudós műveit ruházta fel kötelező erővel – a császári rendeletek (lex) összefonódtak a jogtudománnyal (ius)"]},{"prompt":"Fejtsd ki a római jogtudomány (iurisprudentia) fejlődését, a iustinianusi kodifikációt és a római jog írásos emlékeit!","keyPoints":["a iurisprudentia a jogi fejlődés egyik legfontosabb eleme: a mindennapi élet tudománya, nem elvont és elméleti","pontifikális jogtudomány: a pontifexek a jog hivatott ismerői, meghatározzák a dies fastit; pontifikális interpretáció: az új jogi dilemmák megoldása analógiával a XII táblás törvény alapján","a világi jogtudomány kezdete: Ius Flavium és a dies fasti jegyzék nyilvánossá tétele, majd responsák osztogatása; Ti. Coruncanius a nyilvános jogtanítás megkezdője","preklasszikus jogtudomány: a iurisconsultus alakja szónoki tevékenységgel párosul; a veteres a római magánjog alapjait lefektető korai jogtudósok","a preklasszikus kor kiemelkedő alakjai: Sex. Aelius (Tripertita, Ius Aelianum), Cato Licinianus (regula), Q. Mucius Scaevola (a jogtudomány rendszere, első iskolaalapító), Servius Sulpicius Rufus (edictum-kommentárok), Cicero (a római jogfilozófia nagy része)","a preklasszikus jogtudósi tevékenység négy iránya: a felek kioktatása a szerződésekről, a perbeli cselekmények irányítása, a magistratusok ellátása tanácsokkal, jogi szakvélemények (responsumgyűjtemények)","klasszikus kor: ius (publice) respondendi (Augustus) – privilégium a császári pecsét alatti véleményadásra; Hadrianus egyes véleményeket törvényerőre emel, a jogászi vélemény formailag jogforrás lesz","két iskola: schola Sabiniana (Sabinus – a civiljog végleges rendszerének megalapozója) és schola Proculiana (Labeo – terjedelmes magánjogi irodalmi munkásság)","érett klasszikusok: a szabiniánus P. Salvius Iulianus (90 könyves Digesta, Edictum perpetuum) és a prokuliánus P. Iuventius Celsus (39 könyves Digesta, SC Iuventianum)","kései klasszikus csúcspont – a legnagyobb öt jogtudós: Gaius, Papinianus, Paulus, Ulpianus, Modestinus","Gaius: az egyetlen teljes terjedelmében fennmaradt tankönyv (Institutionum commentarii IV) szerzője; institúció-rendszere (personae – res – actiones) a iustinianusi kodifikáció szerkezeti alapja; Ulpianus irodalmi összefoglalásai (Sabinus-kommentár, 80 könyves edictum-magyarázat) a kodifikáció alapját képezik","posztklasszikus jogtudomány: vulgárjogi gondolkodás, kivonatok a klasszikus művekből, a görög filozófia újbóli érvényesülése, keresztény befolyás (Arcadius Charisius, Hermogenianus)","Iustinianus (527–565) célja: az egységes birodalom helyreállítása és a teljes római joganyag törvénykönyvekbe szerkesztése; menet: 528 – 10 tagú bizottság (Codex Iustinianus), 530 – Tribonianus megbízása a ius összegyűjtésére, 533 – Digesta seu Pandectae, tankönyvként az Institutiones seu Elementa, 534 – Codex Iustinianus repetitae praelectionis, majd a Novellae; a kompilátorok szükség esetén módosíthattak a szövegen (interpolatio)","a kodifikáció önálló alkotómunka is volt, nem lett kizárólagosan alkalmazott, de élő jog; a Corpus iuris civilis (= Codex + Digesta + Institutiones + Novellae) a törvénymű utólagos összefoglaló neve; a római jog írásos emlékei: feliratos, okiratos és irodalmi emlékek"]}],"terms":[{"t":"ius","d":"a jog: jelenthet jogosultságot (alanyi jog) és jogszabályokat (tárgyi jog)"},{"t":"facultas agendi","d":"alanyi jog: a személy cselekvési, perindítási lehetősége bizonyos körben"},{"t":"norma agendi","d":"tárgyi jog: a jogszabályok"},{"t":"iustitia","d":"igazságosság – a jog ősi fogalmi eleme Rómában, cél az érvényre juttatása"},{"t":"ius universale – ius particulare","d":"az állam egész területére kiterjedő jog – egyes részterületeken érvényesülő jog"},{"t":"ius generale – ius speciale","d":"általános jellegű jog (főszabály) – különös jellegű jog (kivétel)"},{"t":"ius commune – ius singulare","d":"a jog rendszerinti alkalmazása – a jog kivételes alkalmazása"},{"t":"ius primarium – ius subsidiarium","d":"elsődleges jogszabály – kisegítő jogszabály"},{"t":"ius vetus – ius novum","d":"a köztársasági kor joganyaga („régi jog”) – a császárkor joganyaga („új jog”)"},{"t":"ius ordinarium – ius extraordinarium","d":"rendes jog – rendkívüli jog"},{"t":"ius sacrum – ius profanum","d":"szakrális jog – világi jog"},{"t":"ius divinum – ius humanum","d":"isten alkotta jog – ember alkotta jog"},{"t":"ius scriptum – ius non scriptum","d":"írott jog – szokásjog (íratlan jog)"},{"t":"lex posterior derogat legi priori","d":"a későbbi törvény lerontja a korábbi törvényt"},{"t":"lex specialis derogat legi generali","d":"a különös törvény lerontja az általános törvényt"},{"t":"lex primaria derogat legi subsidiariae","d":"az elsődleges törvény lerontja a kisegítő törvényt"},{"t":"interpretatio","d":"értelmezés: logikai művelet, a jogszabály rendelkezéseinek konkrét esetre való kimondása ítéletként"},{"t":"interpretatio grammatica","d":"nyelvtani értelmezés"},{"t":"interpretatio logica","d":"logikai értelmezés"},{"t":"interpretatio systematica","d":"rendszertani értelmezés"},{"t":"interpretatio historica","d":"történeti értelmezés"},{"t":"interpretatio declarativa","d":"megállapító értelmezés: a jogszabály pontos értelmének feltárása"},{"t":"interpretatio extensiva","d":"kiterjesztő értelmezés: a szó szerinti értelmezés tágítása"},{"t":"interpretatio restrictiva","d":"megszorító értelmezés: a szó szerinti értelmezés szűkítése"},{"t":"in fraudem legis","d":"a törvény kijátszása (értelmezéskor vizsgálandó)"},{"t":"voluntas legis","d":"a törvényhozó akarata (értelmezéskor vizsgálandó)"},{"t":"in dubio pro reo","d":"kétség esetén a vádlott javára kell ítélni (az enyhébb megoldás elve)"},{"t":"fons iuris","d":"jogforrás"},{"t":"fons cognoscendi","d":"a jogforrás ismeretelméleti fogalma: a jog megjelenési formája, ahonnan az megismerhető"},{"t":"fons essendi","d":"a jogforrás lételméleti fogalma: ami a jogot létrehozza"},{"t":"consuetudo","d":"szokásjog: a jogszokások összessége, a legrégebbi jogforrás"},{"t":"desuetudo","d":"törvényrontó szokás: a joggyakorlat néha a törvény helyett a szokásjogot követi"},{"t":"lex","d":"törvény: előírt módon írásban megszövegezett, a népgyűlések által megszavazott, szabályszerűen kihirdetett határozat"},{"t":"lex rogata (lex lata)","d":"„megszavazott/meghozott törvény”: mindhárom állami főszerv (magistratus, comitia, senatus) részvételével jön létre"},{"t":"lex data","d":"egyes, törvényhozásra jogosított magistratus által kiadott törvény"},{"t":"plebiscitum","d":"a concilium plebisben (plebejusi népgyűlésen) elfogadott törvény, később mindenkire kötelező"},{"t":"patrum auctoritas","d":"a megszavazott törvény senatusi megerősítése"},{"t":"praescriptio","d":"a lex rogata fejirata: a javaslattevő magistratus neve, a meghozatal helye és ideje, az először szavazó század vagy kerület neve"},{"t":"rogatio","d":"a lex rogata rendelkező része: a törvényi parancs (előírás vagy tiltás)"},{"t":"sanctio","d":"a lex rogata joghátrányokat tartalmazó része: az érvényesülés biztosítéka"},{"t":"lex perfecta","d":"tilalom + érvénytelenítés (pl. a házastársak közötti ajándékozási tilalom)"},{"t":"lex minus quam perfecta","d":"büntetés előírása érvénytelenítés nélkül (pl. minor becsapásával kötött szerződés – büntetőkereset)"},{"t":"lex imperfecta","d":"tilalom, amelyhez joghatás nincs fűzve (pl. az ajándékozási keret túllépése)"},{"t":"lex duodecim tabularum","d":"a XII táblás törvény: magánjogi jellegű szabályok, a római fejlődés kizárólagos alapja"},{"t":"decemviri legibus scribundis","d":"a XII táblás törvényt megszövegező, 10 fős, consuli hatalommal felruházott bizottság"},{"t":"senatus consultum","d":"senatusi határozat: a köztársaságban nem jogforrás, a császárkorban törvényerővel bír"},{"t":"edictum","d":"fehér fatáblán közzétett magistratusi hirdetmény"},{"t":"ius edicendi","d":"a magistratus curules edictumkiadási joga"},{"t":"Edictum perpetuum","d":"az edictumanyag Salvius Iulianus általi rendszerezése (Kr. u. 130 körül), a császár megváltoztathatatlannak és kötelezőnek nyilvánította"},{"t":"iurisprudentia","d":"jogtudomány: a mindennapi élet tudománya, nem elvont és elméleti"},{"t":"dies fasti","d":"a törvénykezésre az istenek által alkalmasnak nyilvánított napok"},{"t":"responsum (responsa)","d":"jogi vélemény(ek), később önálló műfaj: responsumgyűjtemény"},{"t":"iurisconsultus","d":"jogtudós, akinek tevékenysége szónoki (orator) tevékenységgel párosult"},{"t":"veteres","d":"a „régiek”: a római magánjog alapjait lefektető korai (preklasszikus) jogtudósok"},{"t":"regula","d":"általános jogelv (Cato Licinianus nevéhez fűződik)"},{"t":"ius (publice) respondendi","d":"Augustus által adott privilégium egyes jogászoknak, hogy a császári pecsét alatt adjanak ki véleményeket"},{"t":"constitutio","d":"a császári rendeletek összefoglaló neve; lehet generalis (általános) és specialis (egyedi)"},{"t":"rescriptum","d":"elvi döntés vitás helyzetekben, a jogi szakvélemény (responsum) mintájára – a princeps mint a birodalmi jog legfőbb forrása"},{"t":"mandatum","d":"utasítás/parancs közigazgatási ügyekben – a princeps mint a hivatalnoki kar feje"},{"t":"decretum","d":"határozat a fellebbezett ügyekben – a princeps mint a birodalom legfőbb bírája"},{"t":"pragmatica sanctio","d":"dominátus kori ünnepélyes rendelet, privilégiumot vagy tartományi rendtartást tartalmaz"},{"t":"lex citationis","d":"idézési törvény (426): öt kiemelkedő jogtudós műveinek kötelező erővel való felruházása"},{"t":"interpolatio","d":"a kompilátorok módosítása az eredeti szövegen a kodifikáció során"},{"t":"Digesta seu Pandectae","d":"„mindent átfogni”: a teljes összegyűjtött jogtudósi joganyag, 533-ban lépett hatályba"},{"t":"Institutiones seu Elementa","d":"a kodifikáció során összeállított tankönyv, később törvényerővel felruházva"},{"t":"Novellae","d":"a három törvénykönyv után keletkezett rendeletek, magánszemélyek gyűjtésében"},{"t":"Corpus iuris civilis","d":"a iustinianusi törvénymű utólagos összefoglaló neve: Codex Iustinianus + Digesta + Institutiones + Novellae"}],"drills":[{"q":"Sorold fel a római jog egyes forrásait!","a":["szokásjog (consuetudo)","törvény (lex)","senatusi határozat (senatus consultum)","magistratusi hirdetmény (edictum)","jogtudomány (iurisprudentia)","császári rendelet (constitutio)"]},{"q":"Sorold fel a jog felosztásainak kategóriapárjait!","a":["ius universale – ius particulare","ius generale – ius speciale","ius commune – ius singulare","ius primarium – ius subsidiarium","ius vetus – ius novum","ius ordinarium – ius extraordinarium","ius sacrum – ius profanum","ius divinum – ius humanum","ius scriptum – ius non scriptum"]},{"q":"Sorold fel a lex rogata három részét!","a":["praescriptio (fejirat)","rogatio (rendelkező rész)","sanctio (joghátrányok)"]},{"q":"Sorold fel a törvények sanctio szerinti típusait!","a":["lex perfecta (tilalom + érvénytelenítés)","lex minus quam perfecta (büntetés, érvénytelenítés nélkül)","lex imperfecta (tilalom joghatás nélkül)"]},{"q":"Sorold fel a principátus kori császári rendeletek típusait!","a":["edictum","rescriptum","mandatum","decretum"]},{"q":"Sorold fel a legnagyobb öt (kései klasszikus) jogtudóst!","a":["Gaius","Papinianus","Paulus","Ulpianus","Modestinus"]},{"q":"Sorold fel a Corpus iuris civilis részeit!","a":["Codex Iustinianus","Digesta seu Pandectae","Institutiones seu Elementa","Novellae"]},{"q":"Sorold fel a római jog írásos emlékeinek három nagyobb kategóriáját!","a":["feliratos emlékek","okiratos emlékek","irodalmi emlékek"]}]},{"num":9,"title":"A római jog továbbélése a középkorban és az újkorban","essay":[{"prompt":"Fejtsd ki a római jog helyzetét Nyugaton a iustinianusi kodifikációig, valamint a római jog és jogtudomány alakulását a középkori Európában!","keyPoints":["Róma germán szövetségesei a személyiségi elv alapján saját szokásjoguk szerint éltek","leges Romanae: a római alattvalókra vonatkozó latin joganyag kodifikációja germán uralkodó által","leges barbarorum: a germán lakosságra vonatkozó latin joganyag kodifikációja","Lex Romana Visigothorum (Breviarium Alaricianum): kódex a római törvénykönyvek alapján a nyugati gót királyságban","Lex Romana Burgundionum: kódex a római polgárok számára a burgund királyságban; Edictum Theodorici: a keleti gót királyság római jogi ihletésű törvénykönyve","a továbbélés három formája: folytatólagos továbbélés, újjáéledés, recepció (a római jog befogadása a helyi jogrendszerbe)","a ius civile fejlődése máig nem záródott le: az újkori polgári jog = magánjog","görög területeken: a iustinianusi kodifikáció kommentálása és kivonatolása","Itáliában a recepció feltételei csak a X. századra teljesültek, ekkor éledt újjá a római jog","glosszátorok iskolája: bolognai egyetem (studium generale), Irnerius; a iustinianusi kodifikáció kiegészítése glosszákkal; kiemelkedők: Bulgarus, Martinus, Iacobus, Hugo, később Accursius","kommentátorok (consiliatorok): a glosszák ellátása terjedelmes magyarázatokkal; inkább gyakorlati szerep, közös anyajog létrehozása; Bartolus (kereskedelmi jog és nemzetközi magánjog alapítója) és Baldus","ius commune: a kommentátorok munkássága (iustinianusi jog + longobárd hűbéri jog + kánonjog), más értelmezésben a középkori Európában közös jogként funkcionáló továbbélő római jog","kánonjog (ius canonicum): a keresztény szokásjog egységesítése gyűjteményekben (collectiones); források: helyi zsinatok határozatai, püspöki rendelkezések, pápák ügylevelei","Gratianus Decretum Gratianija és kommentálói, a dekretisták; az egyház a IX. századtól a római jog recepcióját hirdette"]},{"prompt":"Mutasd be a római jog továbbélését Európa egyes területein és Európán kívül!","keyPoints":["Franciaország: délen a római jog hatása tovább élt (nyugati gót és burgund királyság), északon germán hűbéri szokásjog; később az egész területre hatottak a glosszátori tevékenységek","Ibériai-félsziget: a római jog továbbélése csak a keresztény területeken, a többi terület arab fennhatóság alatt állt","Szent Római Birodalom: a birodalmi szemlélet lehetőséget adott a római jog megújulására, tartósabb eredmény I. (Barbarossa) Frigyeshez kötődik; a középkori Németországban általános recepció","1495, wormsi birodalmi gyűlés: a birodalmi kamarai bírósági rendtartás elfogadása – a római jog általánosan, kisegítő jelleggel használható","Németalföld: hűbéri jog + kánonjog + római jog; Svájc: recepció, helyenként szubszidiárius használat; osztrák örökös tartományok: kisegítő szerep; Cseh- és Morvaország: egyes római jogi intézmények alkalmazása","Lengyelország: az itáliai egyetemeken tanuló lengyel diákok honosították meg a római jogot; Litvánia: a római jog idővel szubszidiárius jog, formális recepció német mintára","Brit-szigetek: a szász és frank-normann jogból bírósági gyakorlattal kialakult common law (nem azonos a ius communéval); Angliában a római jog később némileg befolyásoló tényező, Skóciában a kommentátorok hatására jelent meg","Észak-Európa: Dánia és Izland kismértékű római jogi hatás (a Decretum Gratianiból); Svédország: jogi partikularizmus, a római jog szinte nem érvényesült, később a magánjog egységesítésekor megjelent a pandektajoggal","Balkán: Bulgáriában és Szerbiában a bizánci jog befolyása (Szerbiában római jogi hatás a közjogban); a román fejedelemségekre a bizánci római jog nagymértékben hatott","Oroszország és a Baltikum: a római jog bizánci kereskedelmi kapcsolatok és ortodox közvetítés útján hatolt be","USA: angol, spanyol és francia közvetítéssel beszivárgó római jog; a brit gyarmatokon common law alapú jogrendszer, de az egyházi bíráskodás és a kereskedelmi jog a római jogra épült","spanyol és francia gyarmatok: 1808-ban első polgári törvénykönyv, francia hatással (konzervatív alkotók: több római jog, mint a Code civilben) és spanyol joggal; a későbbi törvénykönyvekben még több római jog, már common law hatással","az amerikai jogtudományra az angol jogirodalom és a német pandektisztika hatott; szakaszai: kommentátorok időszaka, kodifikáció, konszolidáció","Kanada (Québec): a franciák átengedték az angoloknak, de a francia hatás sokáig érvényesült, a polgári törvénykönyv egyes részei a Code civil mintájára készültek; Latin-Amerika: spanyol-portugál gyarmatok, római jogi hagyományok, a kodifikáció mintája a Code civil; Dél-Afrika (Fokváros): római-holland jog, majd a brit hódítás után common law; Ázsia: szokásjog, később a gyarmatosító államok jogrendszerei"]},{"prompt":"Ismertesd a római jog tudományának újkori fejlődését és a modern irányzatokat!","keyPoints":["humanisták: elegáns jogtudomány – kifejezetten tudományos jogirányzat a reneszánsz és a humanizmus idején","alapos történeti, irodalmi és nyelvtudományi felkészültséggel dolgoztak","elsőként állapították meg, hogy a iustinianusi kodifikáció nem egységes joganyag, hanem különböző időben keletkezett jogszabályok gyűjteménye","Hollandia: a magánjog természetjogi megalapozása (Hugo Grotius)","usus modernus Pandectarum: gyakorlati irányzat, a kommentátorok római jogának feldolgozása a bíróságok számára – pandektajog; az elnevezés a Digesta (Pandectae) után","természetjogi iskola: a római jogi intézmények összhangba hozása a természetjoggal (Christian Thomasius)","történeti jogi iskola: a XVIII. század végén jött létre, alapítója Gustav Hugo; merít az előző két irányzatból, de alapvetően ellenük van; két vezető iránya a germanisták és a pandektisták","Savigny szerezte meg a valódi tekintélyt az iskolának: visszatérés a római jog forrásaihoz, a birtoktan új alapokra helyezése, 7 kötetes mű a római jog középkori továbbéléséről, 8 kötetes mű (jogviszonyszemlélet, a modern nemzetközi magánjog megalapozása)","Theodor Mommsen: a legnagyobb római történész és római jogász","később elvált a jogtörténeti irány és a fogalmi jogtudomány; a pandektisztika fejlődésének vége a BGB hatálybalépése (1900. január 1.), amikor a pandektajog hatályát vesztette","modern irányzatok: interpoláció-kutatás (a klasszikus részek megállapítása), jogi papirológia (a mindennapi jogi élet feltárása papirusziratokból), vulgárjog-kutatás, a görög filozófia és a keresztény eszmék hatásának vizsgálata, összehasonlító ókori jogtörténet","jelenkori jogi romanisztika: nincs egy uralkodó irányzat, sok irányzat túljutott a hagyományos történeti-dogmatikai kettősségen"]},{"prompt":"Fejtsd ki a római jog magyarországi történetét!","keyPoints":["a római jog közvetlen hatása a glosszátorok révén jelentkezett (magyar tanulók a bolognai egyetemen)","1367: az első magyar egyetem Pécsett – valószínűsíthetően volt római jogi oktatás","a római jog megjelenése: Árpád- és Anjou-kori krónikák, hazai oklevelek, formagyűjtemények; nagyon kis mértékben királyi törvények és városi jogkönyvek","Mátyás: a római jog hazai recepciójának gondolata (Decretum maius)","Werbőczy István Tripartituma (jogkönyv); római jogi bizonyítékok: institúció-rendszerű beosztás, általános fogalmak és jogelvek, jogi terminológia és intézmények","Pozsonyi formuláskönyv: kísérlet a korabeli megélénkülő gazdasági viszonyok jogi rendezésére","a Tripartitum hatására a hazai jogfejlődés és jogtudomány megmerevedett; a magyar humanisták feloldási kísérlete nem sikerült","a XIX. században az első jelentős változás a Savigny-féle pandektisztika, további hatást gyakorolt az érdekkutató irányzat","oktatás: a nagyszombati egyetem jogi kara (1667), Digesta- és Institutiones-kommentárok alapján, jogesetekkel"]}],"terms":[{"t":"leges Romanae","d":"a római alattvalókra vonatkozó latin joganyag kodifikációja germán uralkodó által"},{"t":"leges barbarorum","d":"a germán lakosságra vonatkozó latin joganyag kodifikációja"},{"t":"Lex Romana Visigothorum (Breviarium Alaricianum)","d":"a római törvénykönyvek alapján készült kódex a nyugati gót királyságban"},{"t":"Lex Romana Burgundionum","d":"a római polgárok számára készült kódex a burgund királyságban"},{"t":"Edictum Theodorici","d":"a keleti gót királyságra vonatkozó, római jogi ihletésű törvénykönyv"},{"t":"ius civile","d":"a római (polgári) jog, amelynek fejlődése máig nem záródott le – az újkori polgári jog = magánjog"},{"t":"studium generale","d":"középkori egyetem – a bolognai egyetem, a glosszátoriskola kiindulópontja"},{"t":"ius commune","d":"„közös jog” – a kommentátorok munkássága (iustinianusi jog + longobárd hűbéri jog + kánonjog), más értelmezésben a középkori Európában közös jogként továbbélő római jog"},{"t":"ius canonicum","d":"kánonjog – a keresztény szokásjog egységesítésével kialakult egyházi joganyag"},{"t":"collectiones","d":"a keresztény szokásjogot egységesítő gyűjtemények"},{"t":"Decretum Gratiani","d":"Gratianus kánonjogi összefoglaló műve, kommentálói a dekretisták"},{"t":"usus modernus Pandectarum","d":"„a Pandekták modern gyakorlása” – gyakorlati irányzat: a kommentátorok római jogának feldolgozása a bíróságok számára (pandektajog)"},{"t":"Decretum maius","d":"Mátyás törvénykönyve, amelyhez a római jog hazai recepciójának gondolata kötődik"},{"t":"Tripartitum","d":"Werbőczy István jogkönyve, római jogi elemekkel (institúció-rendszer, fogalmak, jogelvek, terminológia)"}],"drills":[{"q":"Sorold fel a római jog továbbélésének formáit!","a":["folytatólagos továbbélés","újjáéledés","recepció (befogadás a helyi jogrendszerbe)"]},{"q":"Sorold fel a leges Romanae körébe tartozó, germán királyságokban készült törvénykönyveket!","a":["Lex Romana Visigothorum (Breviarium Alaricianum)","Lex Romana Burgundionum","Edictum Theodorici"]},{"q":"Sorold fel a kiemelkedő glosszátorokat!","a":["Bulgarus","Martinus","Iacobus","Hugo","később: Accursius"]},{"q":"Sorold fel a kánonjog forrásait!","a":["helyi zsinatok határozatai","püspöki rendelkezések","pápák ügylevelei"]},{"q":"Miből tevődött össze a ius commune a kommentátorok munkássága szerint?","a":["iustinianusi jog","longobárd hűbéri jog","kánonjog"]},{"q":"Sorold fel a római jog tudományának irányzatait az újkori Németországban!","a":["usus modernus Pandectarum","természetjogi iskola","pandektisztika (történeti jogi iskola)"]},{"q":"Sorold fel a jogi romanisztika modern irányzatait!","a":["interpoláció-kutatás","jogi papirológia","vulgárjog kutatása","a görög filozófia és a keresztény eszmék hatásának vizsgálata","összehasonlító ókori jogtörténet"]},{"q":"Sorold fel az amerikai jogtudomány fejlődésének szakaszait!","a":["kommentátorok időszaka","kodifikáció","konszolidáció"]}]},{"num":10,"title":"Általános tanok","essay":[{"prompt":"Fejtsd ki a jogérvényesítés eszközeit a római jogban!","keyPoints":["a jogkövető magatartás biztosítja a rendet; jogellenes magatartás esetén a megsértett alanyi jogot orvosolni kell","önhatalmú jogérvényesítés: eredetileg magánharc (olykor csoportos)","államilag szervezett társadalomban jogos önhatalom ott, ahol az állam által biztosított jogvédelem nem elégséges","önvédelem: jogtalan, közvetlen és másként el nem hárítható támadás visszaverése","önsegély: már bekövetkezett sérelem önhatalmú korrigálása","tilos önhatalom: bűncselekmény; tendencia: az önhatalmat a törvény egyre inkább visszaszorítja","vim vi repellere elv: az erőszak erőszakkal visszaverhető","állami úton történő jogérvényesítés: bíróságok folytatják le, három típusa a peres eljárás, a nem peres eljárás és az egyéb hatóságok eljárása (főleg végrehajtási eljárás)","a peres eljárás (processus) contradictio (ellentmondás) jellegű: a keresettel fellépő felperes (actor) kérelmét az alperes (reus) vitatja","a per olyan kontradiktórius eljárás, amelyben a bíró a felek jogvitáját a felperes keresetére, a perjog szabályai szerint lefolytatott eljárás után ítéletével eldönti","az ítélet szerint a per lehet marasztaló (sententia condemnatoria) vagy felmentő (sententia absolutoria); tárgya lehet jogi tény megállapítása is","Rómában eljárási szabályok csak a magánjogon belül léteztek (ma: polgári eljárásjog, polgári perjog); az eljárásjog a „római magánjog bölcsője”"]},{"prompt":"Fejtsd ki a kereset (actio) fogalmát és jelentőségét, valamint az elévülés szabályait!","keyPoints":["az actio jelentései: magistratus előtt végzett cselekvés (az in iure szakasz vagy maga a per), a felperes perkezdő cselekménye, perindítási engedély (a praetor válasza a felperesi cselekményre), keresetjog, meghatározott perfajta, magasabb kategóriát jelentő keresettípus","a keresetjog elemei: perjogi jogosultság, alanyi jog, igény","Rómában az alanyi jog a keresetből származott; a modern jogban a kereset az alanyi jog természetéből fakad, és egyféle kereset van az összes alanyi jog érvényesítésére","keresetjogi gondolkodás: Rómában „a praetor keresetet ad valamire”, ma „valamire jogom van”; a modern magánjogban önálló anyagi jogszabályok vannak","a kereset elnevezései: vindicatio (tulajdonjogi, dologi jogi érvényesítés), petitio (hagyaték kiadása), condictio (jogalap nélküli gazdagodás, kölcsönösszeg visszaperlése), querela (a köteles résztől végrendeletileg megfosztott örökös keresete)","elévülés: valamely jog állami úton való érvényesíthetőségének időmúlás következtében való megszűnése – az actio (kereseti jog) elévülése","az elévülést csak alperesi kifogásra (praescriptio) veszik figyelembe, hivatalból nem; kifogás hiányában az alperes az elévülés ellenére is marasztalható","ha az adós elévült követelést teljesít, azt utólag nem követelheti vissza","magyarázata: régi jogosultságok perlése igazságtalan lehet, és aki sokáig nem él jogaival, hanyag","kezdete az a nap, amikor a kereseti jog létrejött (pl. a tulajdonjog megsértésének napja), vége a határidő utolsó napja","dologi jogi kereset az ellen évül el, aki ellen éppen indítható lett volna; kötelmi jogi kereset csak a kötelemben lévő személy ellen – ha ellene elévült, többé nem érvényesíthető","az elévülés félbeszakad (interrumpitur) a jogosult jogfenntartó vagy a kötelezett jogelismerő nyilatkozatával; nyugszik (dormit), amíg a kereset megindításának lehetősége kizárt, és a kiváltó körülmény elmúltával folytatódik","halál (mors) esetén a keresetjog az örökösre száll át"]},{"prompt":"Ismertesd a perbeli bizonyítást, a vélelmet és a fikciót!","keyPoints":["bizonyítási eljárás: a per azon szakasza, amikor a bíró értékeli a bizonyítékokat, majd mérlegel","bizonyítékok: a felek esküje, tanúk vallomása, okiratok, tárgyak szemléje","a bizonyítás terhe azt terheli, aki állít","a bíró a bizonyítékokat szabadon mérlegeli; kivételes esetben vélelem vagy fikció érvényesül","vélelem (praesumptio): a jogszabály előírja, hogy a bíró ítéletét ne közvetlenül bizonyított, hanem csak valószínű tényállásra alapítsa","egyszerű/megdönthető vélelem (praesumptio iuris): van ellenbizonyítási lehetőség (pl. a férj apasága)","megdönthetetlen vélelem (praesumptio iuris et de iure): nincs ellenbizonyítás (pl. a gyermek fogamzási ideje, a stipulatióról szabályosan kiállított okirat)","fikció (fictio): a jogszabály (adott esetben a praetor) előírja, hogy a bíró ítéletét valótlan, képzelt tényállásra alapítsa; ellenbizonyításnak nincs helye","példák: a méhmagzatot úgy kell tekinteni, mintha megszületett volna; a hadifogságba esett római a fogságba esés pillanatában meghaltnak számít"]},{"prompt":"Mutasd be a római bírósági szervezetet és a peres eljárás, illetve a jogélet további résztvevőit!","keyPoints":["kezdetben nincs élesen elkülönülő hatáskör (a törvényhozó és a büntetőbírói hatalom nem különült el), a bírói hatáskörök nem meghatározottak; a büntető- és polgári ügyek összefonódtak, de megkülönböztethetők a magánjogi és a büntetőügyi bírák","civiljogi perrend: a peres eljárás kétosztatú – in iure szakasz (imperiummal bíró magistratus előtt) és apud iudicem szakasz (kijelölt esküdtbíró előtt)","a jogszolgáltatói hatáskör (iurisdictio) birtokosai: rex, majd consulok, majd praetor, továbbá tartományi helytartók és küldöttek","a iurisdictio lehet peres (iurisdictio contentiosa) és peren kívüli (iurisdictio voluntaria – színleges per formájában)","esküdtbírák: iudex (közönséges civiljogi per), arbiter (szakértői esküdtbírót igénylő ügyek), recuperatores (állami ügyek, 3–5 fős tanács); speciális magánjogi bíróságok: százszemélyes és tízszemélyes bíróság","praetori perrend: a bírói döntés ellen nincs fellebbezés (korábban sem volt); főhivatalnokok: praetor urbanus, praetor peregrinus, aedilis curulis (imperium nélkül), helyi főmagistratusok, praetori tisztviselők, helytartók, helytartói képviselők","császári perrend: a civiljogi és a praetori perrend mellett működött; modern bírósági szervezet a princeps élén, fellebbezési (appellatio) lehetőséggel","a principátus bírósági rendszere: császári hivatalnokok és köztársasági magistratusok; a dominátusé formailag is egységes","büntetőperekben csak crimina (közüldözési bűncselekmények) esetén folyt eljárás; a delicta magánjogi útra, vagyonjogi keresetre tartozott","a büntetőbírói hatalom alakulása: etruszk kor – rex; köztársaság – imperiummal rendelkező magistratus és a népgyűlés, alkalmi bizottságok, majd az első állandó bizottság Kr. e. 149-ben zsarolási ügyekben; principátus – állandó bíróság (4 decuria); dominátus – császár","perbeli képviselet: a felek helyett megbízás alapján fellépő egyének; a civiljogi perrendben nem volt rá lehetőség, először a praetori perrendben jelent meg","cognitor: az ellenfél előtti megbízói kinevezéssel; procurator: alakszerűtlen vagy megbízás nélküli képviselő; később alakult ki, hogy a marasztalás nem a képviselőre, hanem a képviseltre hárult","az ügyvéd (advocatus) nem képviselő, de a peres eljárás résztvevője; a jogélet további szereplői a tabelliók és tabellariusok, a közjegyzők elődei"]}],"terms":[{"t":"processus","d":"peres eljárás"},{"t":"contradictio","d":"ellentmondás – a keresettel fellépő fél kérelmét a másik fél vitatja"},{"t":"actor","d":"felperes, a kérelmező fél"},{"t":"reus","d":"alperes, a védekező fél"},{"t":"sententia condemnatoria","d":"marasztaló ítélet"},{"t":"sententia absolutoria","d":"felmentő ítélet"},{"t":"actio","d":"kereset – többek közt a felperes perkezdő cselekménye, perindítási engedély, keresetjog, meghatározott perfajta"},{"t":"vindicatio","d":"tulajdonjogi, dologi jogi igény érvényesítésére szolgáló kereset"},{"t":"petitio","d":"a hagyaték kiadására irányuló kereset"},{"t":"condictio","d":"jogalap nélküli gazdagodás, illetve kölcsönösszeg visszaperlésének keresete"},{"t":"querela","d":"a köteles résztől végrendeletileg megfosztott örökös keresete"},{"t":"vim vi repellere","d":"elv: az erőszak erőszakkal visszaverhető"},{"t":"praescriptio","d":"alperesi kifogás (pl. az elévülésre hivatkozva)"},{"t":"interrumpitur","d":"félbeszakad az elévülés – jogfenntartó vagy jogelismerő nyilatkozat hatására"},{"t":"dormit","d":"nyugszik az elévülés – amíg a kereset megindításának lehetősége kizárt"},{"t":"mors","d":"halál – a keresetjog az örökösre száll át"},{"t":"praesumptio","d":"vélelem – a bíró ítéletét csak valószínű tényállásra alapítja, ha a jogszabály így írja elő"},{"t":"praesumptio iuris","d":"egyszerű, megdönthető vélelem – ellenbizonyításnak van helye"},{"t":"praesumptio iuris et de iure","d":"megdönthetetlen vélelem – ellenbizonyításnak nincs helye"},{"t":"fictio","d":"fikció – a bíró ítéletét valótlan, képzelt tényállásra alapítja, ellenbizonyítás nélkül"},{"t":"in iure","d":"a peres eljárás első szakasza, az imperiummal bíró magistratus előtt"},{"t":"apud iudicem","d":"a peres eljárás második szakasza, a kijelölt esküdtbíró előtt"},{"t":"iurisdictio","d":"jogszolgáltatói hatáskör"},{"t":"iurisdictio contentiosa","d":"peres jogszolgáltatás"},{"t":"iurisdictio voluntaria","d":"peren kívüli jogszolgáltatás, színleges per formájában"},{"t":"iudex","d":"a közönséges civiljogi per esküdtbírája"},{"t":"arbiter","d":"szakértői esküdtbírót igénylő ügyek bírája"},{"t":"recuperatores","d":"állami ügyekben eljáró, 3–5 fős esküdtbírói tanács"},{"t":"appellatio","d":"fellebbezés – a császári perrendben nyílt rá lehetőség"},{"t":"crimina","d":"közüldözési bűncselekmények – csak ezek esetén folyt büntetőeljárás"},{"t":"delicta","d":"magánjogi útra tartozó bűncselekmények, vagyonjogi keresettel"},{"t":"cognitor","d":"perbeli képviselő, akit a megbízó az ellenfél előtt nevez ki"},{"t":"procurator","d":"alakszerűtlenül vagy megbízás nélkül eljáró perbeli képviselő"},{"t":"advocatus","d":"ügyvéd – nem képviselő, de a peres eljárás résztvevője"}],"drills":[{"q":"Sorold fel a jogos önhatalom fajtáit!","a":["önvédelem (jogtalan, közvetlen, másként el nem hárítható támadás visszaverése)","önsegély (már bekövetkezett sérelem önhatalmú korrigálása)"]},{"q":"Sorold fel az állami úton történő jogérvényesítés három típusát!","a":["peres eljárás (processus)","nem peres eljárás","egyéb hatóságok eljárása (főleg végrehajtási eljárás)"]},{"q":"Sorold fel a kereset elnevezéseit a római jogban!","a":["vindicatio","petitio","condictio","querela"]},{"q":"Sorold fel a keresetjog elemeit!","a":["perjogi jogosultság","alanyi jog","igény"]},{"q":"Sorold fel a perbeli bizonyítékok fajtáit!","a":["felek esküje","tanúk vallomása","okiratok","tárgyak szemléje"]},{"q":"Sorold fel az esküdtbírák típusait a civiljogi perrendben!","a":["iudex (közönséges civiljogi per)","arbiter (szakértői ügyek)","recuperatores (állami ügyek, 3–5 fős tanács)"]},{"q":"Sorold fel a büntetőbírói hatalom alakulását korszakonként!","a":["etruszk kor: rex","köztársaság: imperiummal rendelkező magistratus + népgyűlés (első állandó bizottság: Kr. e. 149, zsarolási ügyek)","principátus: állandó bíróság (4 decuria)","dominátus: császár"]},{"q":"Sorold fel a perbeli képviselők fajtáit!","a":["cognitor (megbízói kinevezés az ellenfél előtt)","procurator (alakszerűtlen vagy megbízás nélküli)"]}]},{"num":11,"title":"A peres eljárás","essay":[{"prompt":"Fejtsd ki a civiljogi perrendet (legis actiós eljárást)!","keyPoints":["a legis actiók hatósági felügyelet alá helyezett önhatalmú jogérvényesítő cselekmények","lényegük az ősi időkből származó, ünnepélyes formulák (leges) alakszerű elmondása","legis actio sacramento: ünnepélyes fogadás arra, hogy kinek van igaza – mindkét fél letette a pertárgy értékét","a nyertes visszakapta a letett összeget, a vesztesé az államhoz került","az in iure szakasz kezdete az idézés (in ius vocatio): a felperesnek kellett az alperest a magistratus elé vinnie, akár erőszakkal","dolog kiadása iránti per: legis actio sacramento in rem – az ingatlan jelképét vagy magát a dolgot a bíró elé vitték","vindicatio (a dolog pálcával való megérintése) – contravindicatio; indefensus, confessus; majd litis contestatio (a bizonyítási szakasz)","követelésre irányuló per: legis actio in personam – csak a felperes állít","apud iudicem szakasz: alakszerűtlen zárás, a bíró közvetve döntötte el a jogvitát","legis actio per iudicis seu arbitri postulationem: a felperes kötelessége megjelölni a civiljogi jogalapot, vagyis hogy a követelés formailag micsoda","alkalmazási területe: stipulatiós ügyek, közös tulajdon és örököstársi viszony megszüntetése","legis actio per condictionem: határozott pénzösszegre (certa pecunia) vagy határozott dologra (certa res) ment","itt a fogadás és a fogadási összeg elmaradt, a felperes nem jelölt meg követelési jogalapot, csak a tartozást"]},{"prompt":"Ismertesd a formula fogalmát és alkatrészeit, valamint a keresetek fajtáit a praetori perrendben!","keyPoints":["formula: a praetor által az esküdtbíróhoz intézett, a per eldöntésének előfeltételeit tartalmazó írásbeli utasítás","két mondatból áll: a bíró kinevezése és egy összetett, feltételes mondat","rendes alkatrészek: az esküdtbíró kinevezése (első helyen), intentio, condemnatio, demonstratio, adiudicatio","intentio: a felperes követelése (és hogy miket kell bizonyítani a pernyeréshez); intentio certa – a per tárgya konkrétan meghatározott; intentio incerta – a per tárgya nem konkrét (kártérítésnél bírói meghatározás)","condemnatio: a praetor felhatalmazása, hogy a perben a bíró döntsön; a marasztalás mindig pénzben történt – előzetes becslő eljárás (arbitratus), majd újabb becslő eljárás (litis aestimatio), ha az alperes nem tesz eleget","demonstratio: az intentio pontosabb megjelölése, ha szükséges; adiudicatio: csak meghatározott formulákban (többnyire osztóperekben) – a bíró civiljogi tulajdont ruházhat át","rendkívüli alkatrészek valamelyik peres fél kérelmére: exceptio, praescriptio, fictio","exceptio: kifogás, további körülmények vizsgálata; ellene replicatio adható; időbeli hatály szerint végleges (exceptio peremptoria) vagy halasztó (exceptio dilatoria); személyi hatálya szerint bárkivel szemben vagy csak meghatározott személyek ellen érvényesíthető","praescriptio: demonstratio-szerepet tölt be vagy az exceptiót pótolja; fictio: a praetor ad hoc jellegű alkalmazása (egyes actióknál rendes alkatrész)","keresetfajták: actiones civiles – actiones honorariae (történeti eredet); actiones in ius conceptae (civiljogi jogalap) – actiones in factum conceptae (tényekre alapozott, praetori jogalap; ediktális – nem ediktális norma)","actiones in rem (bárki ellen, abszolút hatály) – actiones in personam (meghatározott személy ellen, relatív hatály): a keresetek legfontosabb felosztása, máig a magánjog két fő ága, a dologi jog és a kötelmi jog alapja","actiones stricti iuris (régi stipulatiós keresetek) – actiones bonae fidei (vételi, bérleti, letéti, megbízási keresetek); a bona fides Rómában objektív: jóhiszeműség és tisztesség, szótartás; a stricti iuris actiókon belül a condictio absztrakt (kauzátlan) in personam actio","további párok: actiones ficticiae (a bíró úgy kezeli, mintha a civiljogi tényállástól való kis különbség nem állna fenn); actiones directae – utiles (meglévő kereset továbbfejlesztése); actiones directae – contrariae (egyenlőtlenül kétoldalú kötelmek fő- és ellenkövetelése); actiones condemnationales – praeiudiciales (pénzbeli marasztalás – jogosultság vagy tény vizsgálata); actiones generales – speciales","actiones rei persecutoriae (vagyoni megtérítés) – actiones poenales (magánbírság); a poenalis actiókon belül: actiones vindictam spirantes (a sértett személyes elégtétele) és actiones populares (közérdek védelmében bárki indíthatja)"]},{"prompt":"Mutasd be a formuláris per lefolyását, a jogerőt és a rendkívüli jogorvoslatot!","keyPoints":["az in iure szakasz az idézéssel és a felperesnek a formula kibocsátására irányuló kérelmével indul; a praetor dönt a formula kibocsátásáról","a kereset megtagadásának esetei: nincs kereseti alap (sem civiljogi, sem praetori jogi), meghiúsító kifogás igazolása az in iure szakaszban, a követelés tárgyában korábban már volt ítélet","litis contestatio: a formula elfogadása a felperes és az alperes által – perszerződés","joghatása: a felperes kereseti joga felemésztődik (consumptio actionis)","a felperesi igény pénzköveteléssé alakul (condemnatio pecuniaria) – a formuláris perben csak pénzbeli marasztalás lehetséges","a litis contestatio az irányadó időpont; az alperes kötelezettsége halál esetén átszáll az örökösre","apud iudicem szakasz: bizonyítási eljárás, majd ítélet (sententia) – a per vége","fellebbezés eleve kizárt (a litis contestatio miatt)","alaki jogerő: a praetor megadja az alperesnek az ítélt dolog kifogását (exceptio rei iudicatae)","anyagi jogerő: res iudicata pro veritate accipitur – a jogerősen megítélt dolgot igazságként kell elfogadni","rendkívüli jogorvoslat: a praetor kivételesen replicatio dolit ad az exceptio rei iudicatae ellen (perújítás); súlyos eljárási hiba esetén; praetori méltányosságból az eredeti állapot visszaállítása (in integrum restitutio)"]},{"prompt":"Fejtsd ki a császári perrend (cognitiós eljárás) lefolyását!","keyPoints":["nincs kettéosztott per: egységes, hivatalnokbíró előtt lefolyó eljárás","litis denuntiatio: írásbeli idézés a felperes (és a hatóság) által","libellus: a felperes követelésének tárgya és megalapozó tényei – írásban","az alperesi védekezés is írásban történik; a kifogások a perben, szóban adhatók elő","az alperes távolmaradása esetén az ügyet távollétében letárgyalták; a felperes távolmaradásakor az ügyet nem tárgyalták","litis contestatio: a kontradiktórius eljárás kezdete – már nem perszerződés, hanem tanúfelhívás; az alperes védekezésével a perbe bocsátkozás automatikus","a litis contestatióval kezdődik a perelévülés (döntés híján a per elenyészett)","az első tárgyaláson kerül sor az alperes védekezésének és a felperes keresetének előterjesztésére","kötött bizonyítási rendszer a bírói szabad mérlegelés helyett","az okirat nagyobb bizonyító erejű, mint a tanúvallomás; egy tanú alkalmatlan bizonyíték (unus testis nullus testis); a vélelmek szerepe megnő","az ítélet (sententia) a per vége; a perköltséget marasztalás esetén az alperes, felmentés esetén a felperes viseli","fellebbezési (appellatio) lehetőség volt"]}],"terms":[{"t":"legis actio","d":"hatósági felügyelet alá helyezett önhatalmú jogérvényesítő cselekmény, ünnepélyes formulák (leges) alakszerű elmondásával"},{"t":"legis actio sacramento","d":"ünnepélyes fogadáson alapuló eljárás – mindkét fél letette a pertárgy értékét, a vesztesé az államhoz került"},{"t":"in ius vocatio","d":"idézés – a felperes vitte az alperest a magistratus elé, akár erőszakkal"},{"t":"legis actio sacramento in rem","d":"dolog kiadása iránti per – a dolgot vagy az ingatlan jelképét a bíró elé vitték"},{"t":"legis actio in personam","d":"követelésre irányuló per, amelyben csak a felperes állít"},{"t":"vindicatio","d":"a vitatott dolog pálcával való megérintése a jogigény kinyilvánítására"},{"t":"contravindicatio","d":"az alperes ellen-vindicatiója a legis actio sacramento in rem eljárásban"},{"t":"litis contestatio","d":"a legis actiónál a bizonyítási szakasz; a formuláris perben a formula elfogadása (perszerződés); a cognitiós perben a kontradiktórius eljárás kezdete (tanúfelhívás)"},{"t":"legis actio per iudicis seu arbitri postulationem","d":"eljárás, amelyben a felperes köteles megjelölni a civiljogi jogalapot (stipulatiós ügyek, közös tulajdon, örököstársi viszony megszüntetése)"},{"t":"legis actio per condictionem","d":"határozott pénzösszegre vagy dologra menő eljárás – fogadás és jogalap-megjelölés nélkül, csak a tartozás megjelölésével"},{"t":"certa pecunia","d":"határozott pénzösszeg"},{"t":"certa res","d":"határozott dolog"},{"t":"formula","d":"a praetor által az esküdtbíróhoz intézett, a per eldöntésének előfeltételeit tartalmazó írásbeli utasítás"},{"t":"intentio","d":"a formula rendes alkatrésze: a felperes követelése (és a pernyeréshez bizonyítandók)"},{"t":"intentio certa","d":"a per tárgya konkrétan meghatározott"},{"t":"intentio incerta","d":"a per tárgya nem konkrét – kártérítésnél bírói meghatározás"},{"t":"condemnatio","d":"a praetor felhatalmazása, hogy a perben a bíró döntsön – a marasztalás mindig pénzben"},{"t":"arbitratus","d":"előzetes becslő eljárás a pénzbeli marasztaláshoz"},{"t":"litis aestimatio","d":"újabb becslő eljárás, ha az alperes nem tesz eleget"},{"t":"demonstratio","d":"a formula rendes alkatrésze: az intentio pontosabb megjelölése, ha kell"},{"t":"adiudicatio","d":"a formula alkatrésze meghatározott (többnyire osztó-) perekben – a bíró civiljogi tulajdont ruházhat át"},{"t":"exceptio","d":"kifogás – rendkívüli formulaalkatrész, további körülmények vizsgálata"},{"t":"replicatio","d":"a kifogás elleni felperesi válasz (kifogás elleni kereset)"},{"t":"exceptio peremptoria","d":"végleges hatályú kifogás"},{"t":"exceptio dilatoria","d":"halasztó hatályú kifogás"},{"t":"praescriptio","d":"rendkívüli formulaalkatrész – demonstratio-szerepet tölt be vagy az exceptiót pótolja"},{"t":"fictio","d":"a praetor ad hoc jellegű utasítása, hogy a bíró a tényállást a valóságtól eltérően kezelje (egyes actióknál rendes alkatrész)"},{"t":"actiones civiles","d":"a civiljog szabályait érvényre juttató keresetek"},{"t":"actiones honorariae","d":"praetori (hivatali) jogon alapuló keresetek – az actiones civiles történeti eredet szerinti párja"},{"t":"actiones in ius conceptae","d":"civiljogi jogalapra fogalmazott keresetek"},{"t":"actiones in factum conceptae","d":"tényekre alapozott jogalapú keresetek a praetori jog alapján"},{"t":"actiones in rem","d":"bárki ellen érvényesíthető keresetek (abszolút hatály) – a dologi jog alapja"},{"t":"actiones in personam","d":"meghatározott személy ellen érvényesíthető keresetek (relatív hatály) – a kötelmi jog alapja"},{"t":"actiones stricti iuris","d":"szigorú jogú keresetek – a régi stipulatiós keresetek"},{"t":"actiones bonae fidei","d":"jóhiszeműségen alapuló keresetek – vételi, bérleti, letéti, megbízási keresetek"},{"t":"bona fides","d":"jóhiszeműség – Rómában objektív értelemben: jóhiszeműség és tisztesség, szótartás"},{"t":"condictio","d":"keresetalapító tényállás megjelölése nélküli, absztrakt (kauzátlan) in personam actio a stricti iuris keresetek körében"},{"t":"actiones ficticiae","d":"fikción alapuló keresetek – a bíró úgy kezeli, mintha a civiljogi tényállástól való kis különbség nem állna fenn"},{"t":"actiones directae","d":"alapkeresetek – a továbbfejlesztett (utiles), illetve ellenkövetelési (contrariae) keresetek párjai"},{"t":"actiones utiles","d":"már meglévő kereset továbbfejlesztésével képzett keresetek"},{"t":"actiones contrariae","d":"az egyenlőtlenül kétoldalú kötelmekben a másik fél esetleges ellenkövetelésének keresetei"},{"t":"actiones condemnationales","d":"közvetlen pénzbeli marasztalásra irányuló keresetek"},{"t":"actiones praeiudiciales","d":"jogosultság vagy tény fennállásának vizsgálatára irányuló keresetek"},{"t":"actiones rei persecutoriae","d":"vagyoni megtérítésre irányuló keresetek"},{"t":"actiones poenales","d":"magánbírság megfizetésére irányuló keresetek"},{"t":"actiones vindictam spirantes","d":"a sértett személyes elégtételét szolgáló poenalis keresetek"},{"t":"actiones populares","d":"a közérdek védelmében bárki által indítható poenalis keresetek"},{"t":"actiones generales","d":"különféle jogviszonyokból keletkezett igények keresetei"},{"t":"actiones speciales","d":"egy-egy meghatározott tényállásból, jogviszonyból eredő keresetek (alanyi jogok védelme)"},{"t":"consumptio actionis","d":"a felperes kereseti jogának felemésztődése a litis contestatio hatására"},{"t":"condemnatio pecuniaria","d":"a felperesi igény pénzköveteléssé alakulása – a formuláris perben csak pénzbeli marasztalás"},{"t":"sententia","d":"ítélet – a per vége"},{"t":"exceptio rei iudicatae","d":"az ítélt dolog kifogása, amelyet a praetor ad meg az alperesnek (alaki jogerő)"},{"t":"res iudicata pro veritate accipitur","d":"a jogerősen megítélt dolgot igazságként kell elfogadni (anyagi jogerő)"},{"t":"replicatio doli","d":"az exceptio rei iudicatae elleni kivételes replicatio – perújítás"},{"t":"in integrum restitutio","d":"az eredeti állapot visszaállítása praetori méltányosságból"},{"t":"litis denuntiatio","d":"írásbeli idézés a cognitiós eljárásban, a felperes (és a hatóság) által"},{"t":"libellus","d":"a felperes követelésének tárgyát és megalapozó tényeit tartalmazó írásbeli beadvány"},{"t":"unus testis nullus testis","d":"egy tanú nem tanú – egyetlen tanú alkalmatlan bizonyíték"},{"t":"appellatio","d":"fellebbezés – a cognitiós eljárásban volt rá lehetőség"}],"drills":[{"q":"Sorold fel a legis actiós eljárások fajtáit!","a":["legis actio sacramento","legis actio per iudicis seu arbitri postulationem","legis actio per condictionem"]},{"q":"Sorold fel a formula rendes alkatrészeit!","a":["esküdtbíró kinevezése (első helyen)","intentio","condemnatio","demonstratio","adiudicatio"]},{"q":"Sorold fel a formula rendkívüli alkatrészeit!","a":["exceptio (kifogás)","praescriptio","fictio"]},{"q":"Sorold fel a keresetek (actiones) felosztási párjait!","a":["actiones civiles – actiones honorariae","actiones in ius conceptae – actiones in factum conceptae","actiones in rem – actiones in personam","actiones stricti iuris – actiones bonae fidei","actiones ficticiae","actiones directae – actiones utiles","actiones directae – actiones contrariae","actiones condemnationales – actiones praeiudiciales","actiones rei persecutoriae – actiones poenales","actiones generales – actiones speciales"]},{"q":"Sorold fel a kereset megtagadásának eseteit az in iure szakaszban!","a":["nincs kereseti alap (sem civiljogi, sem praetori jogi)","meghiúsító kifogás igazolása az in iure szakaszban","a követelés tárgyában korábban már volt ítélet"]},{"q":"Sorold fel a litis contestatio joghatásait a formuláris perben!","a":["a felperes kereseti joga felemésztődik (consumptio actionis)","a felperesi igény pénzköveteléssé lesz (condemnatio pecuniaria)","irányadó időpont","az alperes kötelezettsége halál esetén átszáll az örökösre"]},{"q":"Sorold fel a rendkívüli jogorvoslat eseteit a formuláris perben!","a":["replicatio doli az exceptio rei iudicatae ellen (perújítás)","súlyos eljárási hiba","in integrum restitutio (praetori méltányosság, eredeti állapot visszaállítása)"]},{"q":"Sorold fel a poenalis actiók fajtáit!","a":["actiones vindictam spirantes (a sértett személyes elégtétele)","actiones populares (közérdek védelmében bárki)"]}]},{"num":12,"title":"Nem peres eljárások","essay":[{"prompt":"Fejtsd ki a peren kívüli eljárás és a peren kívüli jogsegélyek fogalmát Rómában, valamint mutasd be a megjelenési szempont szerinti típusokat!","keyPoints":["Peren kívüli eljárásra a praetornak és (korlátozottan) az aedilis curulisnak volt lehetősége – színleges per formájában","A peren kívüli jogsegélyek hatósági aktusok: a praetor (és az aedilis curulis) kötelezettséget rótt az egyik félre vagy mindkettőre","A jogsegélyek a praetor imperiumán alapuló aktusok","Típusaik megjelenési és tartalmi szempont szerint csoportosíthatók","Megjelenési szempontból: interdictum (eredetileg tilalom), valamint decretum (határozat) és iussum (parancs)","A decretum és a iussum nem különült el következetesen egymástól","Az interdictum alapján per indítható (actio ex interdicto), amely a rendes perhez képest egyszerűbb, gyorsabb és hatékonyabb","Interdictum prohibitorium: a jogsértő magatartás abbahagyására irányul","Interdictum restitutorium: a dolog birtokának visszaadására irányul","Interdictum exhibitorium: a dolog felmutatására irányul"]},{"prompt":"Mutasd be a peren kívüli jogsegélyek tartalmi szempont szerinti típusait!","keyPoints":["In integrum restitutio: az eredeti állapot visszaállítása","Az in integrum restitutio méltányosságon (aequitas) alapuló, kivételes jogsegély","Nyomós indok kell hozzá: a minor károsodott a szerződésből, megtévesztéssel (dolus malus) kötött szerződés, vagy erőszakkal, illetve fenyegetéssel (vis ac metus) kikényszerített szerződés","Eredetileg 1 éven belül lehetett kérni, később a határidő 4 év lett","Stipulatio praetoria: civiljogi kötelezettség elrendelése – a praetor vagy az aedilis curulis stipulatióra utasítja a felet","A stipulatio praetoria egyfajta cautio (biztosíték)","Missio in possessionem: birtokba utalás – a kérelmező feljogosítása vagyontárgy(ak) birtokba vételére"]}],"terms":[{"t":"interdictum","d":"megjelenési szempontú peren kívüli jogsegély, eredetileg tilalom"},{"t":"actio ex interdicto","d":"interdictum alapján indítható per – a rendes pernél egyszerűbb, gyorsabb, hatékonyabb"},{"t":"interdictum prohibitorium","d":"interdictum a jogsértő magatartás abbahagyására"},{"t":"interdictum restitutorium","d":"interdictum a dolog birtokának visszaadására"},{"t":"interdictum exhibitorium","d":"interdictum a dolog felmutatására"},{"t":"decretum","d":"határozat – a iussumtól nem különült el következetesen"},{"t":"iussum","d":"parancs – a decretumtól nem különült el következetesen"},{"t":"in integrum restitutio","d":"az eredeti állapot visszaállítása; méltányosságon alapuló kivételes jogsegély"},{"t":"aequitas","d":"méltányosság – az in integrum restitutio alapja"},{"t":"dolus malus","d":"megtévesztés (megtévesztéses szerződés mint az in integrum restitutio indoka)"},{"t":"vis ac metus","d":"erőszak és fenyegetés (ilyen módon kikényszerített szerződés mint restitutio-indok)"},{"t":"stipulatio praetoria","d":"civiljogi kötelezettség elrendelése stipulatióra utasítással; egyfajta cautio"},{"t":"cautio","d":"biztosíték – a stipulatio praetoria ennek egy fajtája"},{"t":"missio in possessionem","d":"birtokba utalás: a kérelmező feljogosítása vagyontárgy(ak) birtokba vételére"}],"drills":[{"q":"Sorold fel az interdictum fajtáit!","a":["interdictum prohibitorium (jogsértő magatartás abbahagyása)","interdictum restitutorium (dolog birtokának visszaadása)","interdictum exhibitorium (dolog felmutatása)"]},{"q":"Sorold fel a peren kívüli jogsegélyeket megjelenési szempont szerint!","a":["interdictum","decretum (határozat)","iussum (parancs)"]},{"q":"Sorold fel a peren kívüli jogsegélyeket tartalmi szempont szerint!","a":["in integrum restitutio","stipulatio praetoria","missio in possessionem"]},{"q":"Sorold fel az in integrum restitutio nyomós indokait!","a":["a minor károsodott a szerződésből","megtévesztéses (dolus malus) szerződés","erőszakkal vagy fenyegetéssel (vis ac metus) kikényszerített szerződés"]}]},{"num":13,"title":"A végrehajtási eljárás","essay":[{"prompt":"Fejtsd ki a végrehajtási eljárás fogalmát, valamint a végrehajtást a civiljogi perrendben!","keyPoints":["A végrehajtás a jogerős ítéletben foglalt marasztalás kikényszerítésének jogszabályban előírt módja","A civiljogi perrendben személyi végrehajtás, a praetori és a császári perrendben vagyoni végrehajtás érvényesült","A praetori perrend vagyoni végrehajtása univerzális: az egész vagyonra kiterjed","A császári perrend vagyoni végrehajtása szinguláris: egyes vagyontárgyakra terjed ki","A civiljogi (legis actiós) végrehajtás az önhatalmú jogérvényesítésből ered","Legis actio per manus iniectionem: hatósági felügyelet melletti önhatalmú fellépés","Kötelmi perben, ha az adós 30 napig nem fizetett, a hitelező a praetor elé hurcolhatta („adósrabszolga”)","Legis actio per pignoris capionem: hatósági közreműködés nélküli, önhatalmú vagyontárgy-lefoglalás az adóstól"]},{"prompt":"Mutasd be a végrehajtást a praetori perrendben!","keyPoints":["A praetori perrendben a vagyoni végrehajtás áll a középpontban","Actio iudicati („végrehajtási per”): a győztes felperes indíthatja, ha az adós a 30 nap letelte után sem teljesít","A vagyoni végrehajtás univerzális és csődszerű","A marasztalt adós további 30 napot kap a teljesítésre, de már kétszeres összegre (duplum) felel","Ha nem teljesít: infamia éri, és párhuzamosan a személyi végrehajtás lehetősége is fennáll","A hitelezők maguk közül magister bonorumot választanak","A magister bonorum a csődvagyont elárverezi a legtöbbet ígérő hitelezőnek (bonorum emptor)","A bonorum emptorral szemben a többi hitelező a vállalt elkötelezési hányad erejéig léphetett fel (pl. az összes követelés 40%-át vállalta); az adós továbbra is egyetemlegesen felelt","A hitelezők megkárosítása (in fraudem creditorum) ellen praetori védelem járt","Cessio bonorum: ha az adós önként átengedi vagyonát, elkerüli az infamiát és a személyi végrehajtást","A cessio bonorum után szerzett vagyonra is praetori védelem járt: beneficium competentiae","Személyi végrehajtás: a felperes fogságban tarthatta az alperest; a fogság vége: fizet vagy ledolgozza a tartozást"]},{"prompt":"Mutasd be a végrehajtást a császári perrendben!","keyPoints":["A korábbi gyakorlat továbbélt, de újítás: a vagyoni végrehajtás szinguláris és nem csődszerű","Egyes vagyontárgyakra irányuló végrehajtás: pénzösszeg esetén zálogosítással lefoglalás – ha az adós nem fizet, a hitelező eladhatta a lefoglalt dolgot","Határozott tárgyra irányuló végrehajtásnál a dolgot szükség esetén hatósági segítséggel vették el","Az egész vagyonra kiterjedő végrehajtás esetei: adósi csőd, elszökés, önkéntes átadás – ilyenkor is árverezés következett","Személyi végrehajtás: a magánfogság helyébe állami fogság lépett"]}],"terms":[{"t":"legis actio per manus iniectionem","d":"hatósági felügyelet melletti önhatalmú fellépés a civiljogi végrehajtásban"},{"t":"legis actio per pignoris capionem","d":"hatósági közreműködés nélküli, önhatalmú vagyontárgy-lefoglalás az adóstól"},{"t":"actio iudicati","d":"„végrehajtási per” – a győztes felperes indítja, ha az adós 30 nap után sem teljesít"},{"t":"duplum","d":"kétszeres összeg – a marasztalt adós a további 30 napos határidő alatt már
