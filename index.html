A személyhez fűződő jogok terjedelme és védelme"]},{"q":"Sorolj fel példákat a copyright rendszerekben is megtalálható személyhez fűződő jogokra!","a":["Névjog","A mű integritásához való jog","A szerző joga eldönteni, hogy nyilvánosságra hozza-e a művet vagy titokban tartja"]},{"q":"Hová sorolja a polgári jog a két megközelítést?","a":["Tiszta copyright-elméletek: a tulajdonjog körébe","Szerzői jogi megközelítések: a személyiségi jogok körébe"]}]},{"num":103,"title":"A szerzői jogvédelem legfontosabb hazai és nemzetközi intézményei","essay":[{"prompt":"Mutasd be a Szellemi Tulajdon Világszervezetét (WIPO): létrejöttét, célját, tagságát és szerkezetét!","keyPoints":["A megalapításáról szóló egyezményt 1967. július 14-én, a Stockholmi konferencián írta alá 42 állam, köztük Románia; az egyezmény 1970-ben lépett hatályba","Célja a szellemi tulajdon nemzetközi oltalmának előmozdítása az államok és nemzetközi szervezetek együttműködése révén, valamint az „uniók” közötti igazgatási együttműködés biztosítása","A BIRPI (Szellemi Tulajdon Védelmének Egyesített Nemzetközi Irodája) jogutódja, 1974-től az UNESCO szakosított szerveként működik; székhelye Genf","Jelenleg 191 tagja van; csatlakozhat az az állam, amely tagja a Párizsi Uniós Egyezménynek vagy a Berni Egyezménynek, tagja az ENSZ-nek vagy valamelyik szakosított szervezetének, a Nemzetközi Atomerő Ügynökségnek, részese a Nemzetközi Bíróság Alapszabályainak, vagy a közgyűlés meghívja","Bármely tag kiléphet: a kilépési szándékot írásban kell közölni a főigazgatóval, a felmondás a kézbesítést követő 6 hónap elteltével lép hatályba","Legfőbb feladatai: a szellemi tulajdon hatékony nemzetközi oltalmának elősegítése és a nemzeti jogszabályok összhangja, a Berni Unió igazgatása, valamint nemzetközi megállapodások megkötésének elősegítése és igazgatása","Szervei: Közgyűlés, Konferencia, Koordinációs bizottság, Nemzetközi Iroda","A Közgyűlés a valamelyik unióhoz tartozó részes államokból áll; a Konferencia minden részes államból, uniós tagságtól függetlenül; mindkettőben minden államot egy-egy küldött képvisel, és együtt a Szervezet legfőbb döntéshozó szervei","A Koordinációs bizottság korlátozott számú tagja a Párizsi Unió vagy a Berni Unió végrehajtó bizottságának (vagy mindkettőnek) tagjai közül kerül ki","A Nemzetközi Iroda a Szervezet titkársága, amelyet a főigazgató irányít 2 vagy több helyettes segítségével","A főigazgató a Szervezet legfőbb tisztviselője: képviseli a Szervezetet, beszámol a közgyűlésnek; kinevezése meghatározott időre szól, amely nem lehet rövidebb 6 évnél, és megújítható"]},{"prompt":"Ismertesd a TRIPS Tanács (a Szellemi Tulajdon Kereskedelmi Vonatkozásai Tanács) szerepét!","keyPoints":["A TRIPS-megállapodás 68. cikke alapján működik","Figyelemmel kíséri a TRIPS-megállapodás működését, különösen azt, hogy a tagok eleget tesznek-e kötelezettségeiknek","A tagországok konzultációs fóruma a szellemi tulajdonjogok kereskedelmi vonatkozású kérdéseiben","Vitás helyzetekben minden segítséget megad a vitarendezési eljárásokat illetően","Feladatai ellátása során belátása szerint bárkivel konzultálhat és bármilyen forrásból szerezhet információt","Együttműködik a Szellemi Tulajdon Világszervezetével (WIPO)"]},{"prompt":"Mutasd be a Szerzői Jog Nemzeti Hivatalát (ORDA): jogállását, célját, hatásköreit és szervezetét!","keyPoints":["A kormány felügyelete alatt működő, a szerzői és szomszédos jogok védelmére szakosodott szerv; legfőbb célja a hatékony szerzői és szomszédos jogi védelem biztosítása Romániában","Célkitűzése olyan szerzői jogi rendszer kifejlesztése és megerősítése, amely serkenti az alkotó tevékenységet, és biztosítja az alkotások védelmét és értékesítését","A szerzői és szomszédos jogokról szóló 1996. évi 8-as törvény hozta létre; működését e törvény és a 2006. évi 401-es kormányhatározat szabályozza","Hatáskörébe jogalkotási, nyilvántartási, felügyeleti, engedélyezési, választottbíráskodási és tudományos-műszaki megállapítások megfogalmazására vonatkozó tevékenységek tartoznak","Közreműködik a szerzői jogot alkalmazó hatóságokkal és intézményekkel, a közös jogkezelő szervezetekkel, a kalózkodás elleni civil szervezetekkel és a gazdasági szereplők társult szerveivel","Feladatai ellátásához ingyenesen hozzáfér a szerzői joghoz kötődő tevékenységet ellátó közintézmények információihoz","Jogi személyiséggel rendelkezik, székhelye Bukarest; költségeit az állami költségvetésből a kulturális és vallásügyi minisztérium fedezi","Vezetését, igazgatását és bel- és külföldi képviseletét a főigazgató látja el, aki munkaadói, pénzügyi-költségvetési és kapcsolattartói feladatokat is ellát, határozatokat bocsát ki, és módosíthatja a Hivatal szerkezetét","A főigazgatót igazgatóhelyettes segíti; mindkettőjüket a miniszterelnök nevezi ki a kulturális és vallásügyi minisztérium javaslatára","A szakmai irányvonalat a Tanácsadó Testület határozza meg (tagjai a főigazgató, helyettese és a többi igazgató)","A Hivatal mellett Választottbírói Testület működik: tagjait a közös jogkezelő szervezetek, a műfelhasználók, előadóművészek és hangfelvétel-előállítók társult szervei, valamint a Román Televízió és Rádió Társaság által megnevezett 3-3 személyből választják ki"]}],"terms":[{"t":"WIPO (Szellemi Tulajdon Világszervezete)","d":"1967-ben Stockholmban alapított, 1970-től működő, genfi székhelyű szervezet a szellemi tulajdon nemzetközi oltalmának előmozdítására és az uniók igazgatási együttműködésére; 191 tagja van."},{"t":"BIRPI","d":"A Szellemi Tulajdon Védelmének Egyesített Nemzetközi Irodája, a WIPO jogelődje."},{"t":"WIPO Közgyűlés","d":"A valamelyik unióhoz tartozó részes államokból álló szerv (államonként egy küldött); a Konferenciával együtt a Szervezet legfőbb döntéshozó szerve."},{"t":"WIPO Konferencia","d":"Az egyezmény összes részes államából álló szerv, uniós tagságtól függetlenül; a Közgyűléssel együtt legfőbb döntéshozó szerv."},{"t":"Koordinációs bizottság (WIPO)","d":"Korlátozott taglétszámú szerv azokból az államokból, amelyek a Párizsi vagy a Berni Unió végrehajtó bizottságának (vagy mindkettőnek) tagjai."},{"t":"Nemzetközi Iroda (WIPO)","d":"A WIPO titkársága, amelyet a főigazgató irányít 2 vagy több helyettes főigazgató segítségével."},{"t":"WIPO-főigazgató","d":"A Szervezet legfőbb tisztviselője: képviseli a Szervezetet és beszámol a közgyűlésnek; kinevezése legalább 6 évre szól és megújítható."},{"t":"TRIPS Tanács","d":"A TRIPS-megállapodás 68. cikke alapján a megállapodás működését és a tagok kötelezettségeinek teljesítését figyelemmel kísérő szerv, konzultációs fórum, amely a vitarendezésben is segít és együttműködik a WIPO-val."},{"t":"ORDA (Szerzői Jog Nemzeti Hivatala)","d":"A román kormány felügyelete alatt működő, bukaresti székhelyű, jogi személyiségű szerv a szerzői és szomszédos jogok hatékony védelmére; az 1996. évi 8-as törvény hozta létre."},{"t":"Tanácsadó Testület (ORDA)","d":"A Hivatal szerzői jogi szakmai irányvonalát meghatározó testület; tagjai a főigazgató, helyettese és a többi igazgató."},{"t":"Választottbírói Testület (ORDA)","d":"A Hivatal mellett működő testület, amelynek tagjait a közös jogkezelő szervezetek, a műfelhasználók, előadóművészek és hangfelvétel-előállítók társult szervei, valamint a Román Televízió és Rádió Társaság által megnevezett 3-3 személyből választják ki."}],"drills":[{"q":"Sorold fel, milyen feltételek valamelyikét kell teljesítenie egy államnak a WIPO-hoz való csatlakozáshoz!","a":["Tagja a Párizsi Uniós Egyezménynek vagy a Berni Egyezménynek","Tagja az ENSZ-nek, valamelyik szakosított szervezetének vagy a Nemzetközi Atomerő Ügynökségnek, vagy részese a Nemzetközi Bíróság Alapszabályainak","A közgyűlés meghívja, hogy legyen az egyezmény részese"]},{"q":"Sorold fel a WIPO szerkezetét alkotó szerveket!","a":["Közgyűlés","Konferencia","Koordinációs bizottság","Nemzetközi Iroda"]},{"q":"Sorold fel a WIPO legfőbb feladatait!","a":["A szellemi tulajdon hatékony nemzetközi oltalmának elősegítése és a nemzeti jogszabályok összhangjának biztosítása","A Berni Unió igazgatása","A szellemi tulajdon oltalmát célzó nemzetközi megállapodások megkötésének elősegítése és igazgatása"]},{"q":"Sorold fel az ORDA hatáskörébe tartozó tevékenységtípusokat!","a":["Jogalkotási","Nyilvántartási","Felügyeleti","Engedélyezési","Választottbíráskodási","Tudományos-műszaki megállapítások megfogalmazása"]}]},{"num":104,"title":"Szerzői jog és nemzetközi együttműködés: a Berni Uniós Egyezmény","essay":[{"prompt":"Fejtsd ki a nemzetközi szerzői jogi együttműködés kialakulásának előzményeit a 19. században!","keyPoints":["A szellemi alkotások joga a történelem során mindig összefüggött a technika haladásával (Jakab Éva), valamint a gazdasági fejlődéssel és a kereskedelmi érdekekkel.","A szerzői jogot kezdettől fogva a territorialitás (területiség elve) jellemezte, mert a privilégiumrendszerek lényege a területi kizárólagosság volt.","A szellemi tulajdon territoriális jellege a mai napig változatlanul megmaradt.","A szerzők kezdettől fogva pártolták jogaik külföldi védelmét és a külföldi művek jogosulatlan belföldi utánnyomásának tilalmát.","A 19. századi európai államok a kiadói érdekek szerint két táborra oszlottak: a műveket exportáló országok (pl. Franciaország, Anglia) szorgalmazták a külföldi védelmet, míg a jogosulatlan utánnyomásokból gazdálkodó országok (pl. Belgium, USA) ellenezték azt.","A vitában leginkább az azonos nyelvterületeken és a világnyelveken publikáló szerzők és kiadók voltak érintettek.","A helyzetet az államok előbb kétoldalú, majd multilaterális nemzetközi egyezményekkel próbálták enyhíteni.","A nemzetközi együttműködés ötlete Poroszországban született: 1827 és 1829 között a porosz állam 32 szerződést kötött a német szövetség államaival a szerzői jogok kölcsönös védelméről.","Ebben az időszakban Lipcse volt a könyvkereskedelem egyik világszinten elismert központja.","Franciaország a 19. században 23 állammal írt alá kétoldalú szerzői jogi egyezményt, Nagy-Britannia pedig az Egyesült Államokkal harcolt a külföldi szerzői jogok kölcsönös elismeréséért."]},{"prompt":"Mutasd be a Berni Uniós Egyezmény létrejöttét, szerkezetét és célját!","keyPoints":["A BUE alapozta meg a nemzetközi szerzői jogi együttműködést.","1886-ban írták alá, 3 évvel az ipari tulajdon védelmét szolgáló Párizsi Uniós Egyezmény elfogadása után.","1887. december 5-én lépett hatályba 9 állam viszonylatában: Belgium, Franciaország, Haiti, Nagy-Britannia, Németország, Olaszország, Spanyolország, Svájc és Tunézia.","Szövegét 7 alkalommal módosították; a jelenleg hatályos változat az 1971-es párizsi diplomáciai konferencián felülvizsgált szöveg, amely Párizsi Szerződés néven 1974. október 10-én lépett hatályba.","Jelenleg 181 tagja van, amelyek az egyezmény különböző változatait ratifikálták.","Románia az 1926. évi 152-es törvénnyel csatlakozott a Berlinben felülvizsgált változathoz, a Párizsi Szerződést pedig az 1988. évi 77-es törvénnyel ratifikálta.","Szerkezetileg 3 részre osztható: az 1–21. cikkek a szerzői jog érdemi szabályozását, a 22–38. cikkek az adminisztratív rendelkezéseket (a Berni Unió működése, csatlakozás, felmondás) tartalmazzák, a Függelék pedig a fejlődő országok különleges bánásmódjának feltételeit tárgyalja.","A preambulum második francia bekezdése és az 1. cikk szerint az egyezmény célja az irodalmi és művészeti művekre vonatkozó szerzői jogok lehető leghatékonyabb és legegyöntetűbb védelmezése.","Tárgyi hatálya csak az érintett alkotások körére, a védendő jogokra, a védelem alapelveire és a védelem korlátozásának lehetőségeire terjed ki.","A többi nemzetközi szellemi tulajdonjogi szerződéshez hasonlóan 3 pillérre épül: a szerzői jog territoriális védelmére, a nemzeti bánásmódra és a minimumjogok biztosítására."]},{"prompt":"Ismertesd a Berni Uniós Egyezmény alapelveit és minimumszabályait!","keyPoints":["Az alapelvek teremtik meg a szerzői jog nemzetközi védelmének keretét.","A belföldiekkel azonos elbírálás elve (5. cikk (1) bek.): a szerzők – a mű származási országa kivételével – az Unió valamennyi országában a belföldieknek biztosított jogokat élvezik; a származási országban annak saját joga alkalmazandó.","A szerzői jogok territorialitásának elve (5. cikk (2) bek.): egy mű minden ország területén más-más szerzői jogi szabályozás alá kerül; a BUE által közvetlenül nem szabályozott kérdésekre annak az országnak a joga alkalmazandó, amelyre a védelmet igénylik.","A védelmi minimum elve (19. cikk): a részes államok kötelesek biztosítani az egyezmény szerinti védelmi szintet, de kedvezőbb rendelkezéseket is törvénybe iktathatnak.","Az alakszerűtlenség elve (5. cikk (2) bek.): tilos a szerzői jogi védelmet alaki feltételekhez kötni.","Az oltalom függetlenségének elve (5. cikk (2) bek.): a részes államnak attól függetlenül kell védenie a művet, hogy az a származási országában védelem alatt áll-e.","Az utóbbi elvek is a belföldiekkel azonos bánásmód szavatolását szolgálják.","A minimumszabályok alanyi jogokat biztosítanak a védett irodalmi és művészeti művek szerzőinek, és a minimális védelmi időt, valamint a minimumjogokat szabályozzák.","A 7. cikk szerint a védelem időtartama a szerző életére és halála után 50 évre terjed, de az uniós országok hosszabb védelmi időt is biztosíthatnak (pl. az USA, Brazília és Ausztria 70 évre hosszabbította).","A műfajták sajátosságaira tekintettel az egyezmény kivételeket szab a filmek, az árva művek, a fényképészeti művek és az alkalmazott művészet körében létrejövő művek védelmi idejére."]}],"terms":[{"t":"Territorialitás (területiség elve)","d":"A szerzői jogot kezdettől jellemző elv: a védelem területhez kötött, gyökere a privilégiumrendszerek területi kizárólagossága; a szellemi tulajdon territoriális jellege máig megmaradt."},{"t":"Berni Uniós Egyezmény (BUE)","d":"Az 1886-ban aláírt, a nemzetközi szerzői jogi együttműködést megalapozó egyezmény az irodalmi és művészeti művek szerzői jogainak lehető leghatékonyabb és legegyöntetűbb védelmére; jelenleg 181 tagja van."},{"t":"Párizsi Szerződés (a BUE 1971-es változata)","d":"A BUE jelenleg hatályos, az 1971-es párizsi diplomáciai konferencián felülvizsgált szövege, amely 1974. október 10-én lépett hatályba."},{"t":"Párizsi Uniós Egyezmény","d":"Az ipari tulajdon védelmét szolgáló egyezmény, amelyet 3 évvel a BUE aláírása előtt fogadtak el."},{"t":"A belföldiekkel azonos elbírálás elve","d":"BUE 5. cikk (1) bek.: a szerzők – a származási ország kivételével – az Unió minden országában a belföldieknek biztosított jogokat élvezik."},{"t":"A védelmi minimum elve","d":"BUE 19. cikk: a részes államok kötelesek az egyezmény szerinti védelmi szintet biztosítani, de kedvezőbb rendelkezéseket is elfogadhatnak."},{"t":"Az alakszerűtlenség elve","d":"BUE 5. cikk (2) bek.: a részes államok a szerzői jogi védelmet nem köthetik alaki feltételekhez."},{"t":"Az oltalom függetlenségének elve","d":"BUE 5. cikk (2) bek.: a művet attól függetlenül kell védeni, hogy a származási országában védelem alatt áll-e."},{"t":"Minimumszabályok (BUE)","d":"Alanyi jogokat biztosítanak a védett művek szerzőinek; a minimális védelmi időt és a minimumjogokat szabályozzák."},{"t":"Védelmi idő (BUE 7. cikk)","d":"A szerző élete és halála után 50 év; a tagországok hosszabb időt is biztosíthatnak (pl. USA, Brazília, Ausztria: 70 év), és kivételek vonatkoznak a filmekre, árva művekre, fényképészeti és alkalmazott művészeti művekre."}],"drills":[{"q":"Melyik két táborra oszthatók a 19. századi európai államok a kiadói érdekek szempontjából, és melyik mit képviselt?","a":["Műveket exportáló országok (pl. Franciaország, Anglia): a szerzői jogok külföldi védelmét szorgalmazták","Jogosulatlan utánnyomásokból gazdálkodó országok (pl. Belgium, USA): ellenezték a külföldi szerzők jogainak védelmét"]},{"q":"Sorold fel a BUE 1887-es hatálybalépésekor részes 9 államot!","a":["Belgium","Franciaország","Haiti","Nagy-Britannia","Németország","Olaszország","Spanyolország","Svájc","Tunézia"]},{"q":"Milyen 3 szerkezeti részre osztható a BUE?","a":["1–21. cikkek: a szerzői jog érdemi szabályozása","22–38. cikkek: adminisztratív rendelkezések (a Berni Unió működése, csatlakozás feltételei, felmondás körülményei)","Függelék: a fejlődő országok különleges bánásmódjának feltételei"]},{"q":"Melyik 3 pillérre épül a BUE?","a":["A szerzői jog territoriális védelme","A nemzeti bánásmód","A minimumjogok biztosítása"]},{"q":"Sorold fel a BUE alapelveit!","a":["A belföldiekkel azonos elbírálás elve (5. cikk (1) bek.)","A szerzői jogok territorialitásának elve (5. cikk (2) bek.)","A védelmi minimum elve (19. cikk)","Az alakszerűtlenség elve (5. cikk (2) bek.)","Az oltalom függetlenségének elve (5. cikk (2) bek.)"]},{"q":"Mely műfajtákra szab kivételt a BUE a védelmi idő tekintetében?","a":["Filmek","Árva művek","Fényképészeti művek","Alkalmazott művészet körében létrejövő művek"]}]},{"num":105,"title":"Vagyoni jogok és személyiségi jogok a BUE-ban","essay":[{"prompt":"Hasonlítsd össze a BUE által biztosított vagyoni jogokat és személyiségi jogokat!","keyPoints":["A vagyoni jogok a szerző pénzügyi-gazdasági érdekeit szolgálják: a mű megalkotásába fektetett tőke és energia megtérítését, valamint a szerző újabb művek alkotására való sarkallását biztosítják.","A vagyoni jogok monopóliumokhoz hasonló kizárólagos jogot adnak a szerzőnek arra, hogy engedélyezze művének felhasználását.","Az egyezmény nem zárja ki a vagyoni jogok átruházását.","A BUE 16 vagyoni jogot biztosít, amelyek 4 nagy kategóriába sorolhatók: a többszörözés engedélyezésének joga; a fordítás és adaptálás engedélyezésének joga; az előadás, sugárzás és nyilvánossághoz közvetítés engedélyezésének joga; valamint a követő jog.","A követő jog kivételével a felsorolt jogok alkotják a minimumjogok rendszerét, amelyet minden részes állam köteles biztosítani az egyezmény által tett engedmények határain belül.","A személyhez fűződő (személyiségi) jogok a szerzőnek a művéhez kapcsolódó személyes jogainak tiszteletben tartását biztosítják.","A személyiségi jogok szorosan a szerző személyéhez kötődnek, és nem átruházhatók.","Személyiségi minimumjogok: a szerző magának követelhesse a mű szerzőségét, és tiltakozhassék a mű mindenfajta eltorzítása, megcsonkítása vagy más olyan megváltoztatása, illetve csorbítása ellen, amely becsületére vagy hírnevére sérelmes.","A szerzői személyiségi jogokat az 1928. évi Római Konferencián szabályozták, és a későbbi felülvizsgálati konferenciákon fejlesztették tovább."]}],"terms":[{"t":"Vagyoni jogok (BUE)","d":"A szerző pénzügyi-gazdasági érdekeit szolgáló, monopóliumszerű kizárólagos jogok a mű felhasználásának engedélyezésére; átruházhatók, a BUE 16 ilyen jogot biztosít 4 kategóriában."},{"t":"Személyiségi (személyhez fűződő) jogok","d":"A szerző művéhez kapcsolódó személyes jogainak tiszteletben tartását biztosító, a szerző személyéhez kötődő, nem átruházható jogok (szerzőség követelése, torzítás elleni tiltakozás)."},{"t":"Követő jog","d":"A BUE vagyoni jogainak egyik kategóriája; kivétel a minimumjogok rendszere alól, azaz nem kötelező minden részes államnak biztosítania."},{"t":"1928. évi Római Konferencia","d":"A BUE felülvizsgálati konferenciája, amelynek keretében a szerzői személyiségi jogok szabályozásra kerültek."}],"drills":[{"q":"Sorold fel a BUE 16 vagyoni jogának 4 nagy kategóriáját!","a":["Többszörözés engedélyezésére irányuló jog","Fordításhoz és adaptálás engedélyezéséhez való jog","Előadás, sugárzás és nyilvánossághoz közvetítés engedélyezésének joga","Követő jog"]},{"q":"Milyen személyiségi minimumjogokat biztosít a BUE a szerzőnek?","a":["Magának követelhesse a mű szerzőségét","Tiltakozhassék a mű mindenfajta eltorzítása, megcsonkítása vagy becsületére, hírnevére sérelmes megváltoztatása, csorbítása ellen"]},{"q":"Nevezz meg 3 fő különbséget a vagyoni és a személyiségi jogok között!","a":["Vagyoni jogok: gazdasági érdekeket szolgálnak – személyiségi jogok: a szerző személyes jogainak tiszteletét biztosítják","Vagyoni jogok: átruházhatók – személyiségi jogok: nem átruházhatók","Vagyoni jogok: kizárólagos felhasználás-engedélyezési monopólium – személyiségi jogok: szorosan a szerző személyéhez kötődnek"]}]},{"num":106,"title":"Az Egyetemes Szerzői Jogi Egyezmény (EJSZE)","essay":[{"prompt":"Mutasd be az Egyetemes Szerzői Jogi Egyezmény létrejöttét, jellemzőit és viszonyát a BUE-hoz!","keyPoints":["Az EJSZE 1951-ben az UNESCO égisze alatt jött létre.","1955-ben lépett hatályba 12 állam viszonylatában.","Létrehozását az USA kezdeményezte, amely nem kívánta összhangba hozni jogrendszerét a BUE szigorú követelményrendszerével.","Szempont volt az is, hogy a gyarmatok és gyámsági területek felszámolásával önállósuló országok is nehezen tudtak volna megfelelni az uniós követelményrendszernek.","A BUE-nál alacsonyabb védelmi szintet biztosít.","Az USA szempontjából az egyik legfőbb eltérés, hogy nem követeli meg az alakszerűtlenség elvének betartását: a részes államok a védelem elismerésének feltételeként kérhetik a mű lajstromozását.","Az EJSZE mára elvesztette jelentőségét, mert aláíróinak nagy része a BUE-nak is részes állama.","A két egyezmény viszonyát az EJSZE VII. cikke és az egyezmény részét képező Nyilatkozat szabályozza: a BUE rendelkezései feltétlen elsőbbséget élveznek."]}],"terms":[{"t":"Egyetemes Szerzői Jogi Egyezmény (EJSZE)","d":"1951-ben az UNESCO égisze alatt, az USA kezdeményezésére létrejött, 1955-ben hatályba lépett egyezmény, amely a BUE-nál alacsonyabb védelmi szintet biztosít; mára elvesztette jelentőségét."},{"t":"EJSZE VII. cikke és a Nyilatkozat","d":"A BUE és az EJSZE viszonyát szabályozó rendelkezések, amelyek kimondják, hogy a BUE rendelkezései feltétlen elsőbbséget élveznek."},{"t":"Lajstromozás az EJSZE-ben","d":"Az EJSZE nem követeli meg az alakszerűtlenség elvét, így a részes államok a védelem elismerésének feltételeként kérhetik a mű lajstromozását."}],"drills":[{"q":"Sorold fel az EJSZE fő eltéréseit a BUE-hoz képest!","a":["Alacsonyabb védelmi szintet biztosít","Nem követeli meg az alakszerűtlenség elvét (a védelem lajstromozáshoz köthető)","A BUE rendelkezései feltétlen elsőbbséget élveznek vele szemben"]}]},{"num":107,"title":"A Római egyezmény és a Genfi egyezmény","essay":[{"prompt":"Ismertesd a szomszédos jogok nemzetközi védelmét: a Római Egyezményt és a Genfi Egyezményt!","keyPoints":["A szomszédos jogok fogalma 4 nagy kategóriát foglal magába: az előadóművészek, a hangfelvétel-előállítók, a műsorsugárzó szervezetek és a filmelőállítók jogait és jogosultságait.","Nemzetközi szabályozásuk igénye már a 20. század elején felmerült; a hangfelvétel-előállítók jogait az 1928-as és 1948-as felülvizsgálati konferenciákon eredménytelenül próbálták a BUE-ba beilleszteni.","1961-ben fogadták el az előadóművészek, a hangfelvétel-előállítók és a műsorsugárzó szervezetek védelméről szóló Római Egyezményt.","A Római Egyezményt a WIPO az ILO-val és az UNESCO-val közösen igazgatja.","Az egyezmény zárt jellegű: csak azok az ENSZ-tagok lehetnek tagjai, amelyek a BUE vagy az EJSZE tagjai.","Jelenleg 97 részes állama van; Románia 1998-ban csatlakozott.","Szerkezete 3 pillérre épül: a szomszédos jogok territoriális védelmére, a nemzeti bánásmódra és a minimumvédelem biztosítására.","Az egyezmény számos helyen megengedi a fenntartások megfogalmazását, ezért a Berni Uniónál sokkal töredezettebb rendszert keletkeztetett.","A Római Egyezmény 1. cikke szerint az általa biztosított védelem nem érinti és semmilyen módon nem befolyásolja az irodalmi és művészeti művekre vonatkozó szerzői jog védelmét.","A 20. században elterjedt hanglemez-kalózkodás megfékezésére 1971-ben jött létre a Genfi Egyezmény a hangfelvételek előállítóinak a hangfelvételeik engedély nélküli sokszorosítása elleni védelmére, amely mintegy másfél év után hatályba lépett; Románia 1998-tól tagja."]}],"terms":[{"t":"Szomszédos jogok","d":"Négy nagy kategóriát átfogó fogalom: az előadóművészek, a hangfelvétel-előállítók, a műsorsugárzó szervezetek és a filmelőállítók jogai és jogosultságai."},{"t":"Római Egyezmény (1961)","d":"Az előadóművészek, a hangfelvétel-előállítók és a műsorsugárzó szervezetek védelméről szóló egyezmény; a WIPO, az ILO és az UNESCO közösen igazgatja, 97 részes állama van, Románia 1998-ban csatlakozott."},{"t":"Genfi Egyezmény (1971)","d":"A hangfelvételek előállítóinak védelmére, hangfelvételeik engedély nélküli sokszorosítása ellen létrejött egyezmény, a hanglemez-kalózkodás megfékezésére; Románia 1998-tól tagja."},{"t":"A Római Egyezmény zárt jellege","d":"Csak azok az ENSZ-tagok lehetnek részesei, amelyek a BUE vagy az EJSZE tagjai."},{"t":"Fenntartások a Római Egyezményben","d":"Az egyezmény sok helyen megengedi a részes államoknak fenntartások megfogalmazását, ami a Berni Uniónál töredezettebb rendszert eredményezett."}],"drills":[{"q":"Sorold fel a szomszédos jogok 4 nagy kategóriáját!","a":["Előadóművészek jogai","Hangfelvétel-előállítók jogai","Műsorsugárzó szervezetek jogai","Filmelőállítók jogai"]},{"q":"Melyik 3 pillérre épül a Római Egyezmény?","a":["A szomszédos jogok territoriális védelme","A nemzeti bánásmód","A minimumvédelem biztosítása"]},{"q":"Mely szervezetek igazgatják közösen a Római Egyezményt?","a":["WIPO","ILO","UNESCO"]}]},{"num":108,"title":"A WIPO internetszerződései és a TRIPS-megállapodás","essay":[{"prompt":"Fejtsd ki, miért vált szükségessé a nemzetközi szerzői jogi együttműködés újragondolása a 20. század második felében, és mutasd be a TRIPS-megállapodást!","keyPoints":["A 20. század második felének műszaki és gazdasági-társadalmi fejlődése megkövetelte a nemzetközi szerzői jogi együttműködés jogi keretének újragondolását.","A műszaki fejlődés, köztük a szellemi termékek digitális felhasználását lehetővé tevő eszközök megjelenése, olyan újszerű jogviszonyokat és érdekellentéteket keletkeztetett, amelyekre a Berni Unió és a Római Egyezmény nem tudott megoldást nyújtani (pl. a kiadók és a fotomechanikus másolásban érdekeltek, a filmgyártók és a kábeles műsorterjesztők, illetve az audiovizuális rögzítőipar közötti érdekellentétek).","A gyarmati államok függetlenedése és a szocialista államok rendszerváltása révén a nemzetközi közösség különböző fejlettségi szintű országokat foglalt magában, amelyek szellemi tulajdonjogi érdekei rendszerint nem egyeztek meg.","A legfejlettebb ipari országok érdeke a magas szintű szellemi tulajdonjogi és szerzői jogi védelem kialakítása volt, míg a fejlődő országok nehezen tudtak megfelelni a szigorú követelményrendszereknek.","Az 1980-as évektől a továbbfejlesztést 2 nemzetközi szervezet valósította meg: a WIPO (1996-ban elfogadott 2 internetszerződésével) és az 1994-ben megalakult Kereskedelmi Világszervezet (WTO).","A TRIPS-megállapodást a WTO mellékleteként fogadták el; a szellemi tulajdon kereskedelemmel összefüggő kérdéseiről rendelkezik, és elfogadása a WTO-hoz való csatlakozás feltétele volt.","A TRIPS rendelkezései a szellemi tulajdon kereskedelmi vonatkozású nemzetközi fejlesztésére, a jogérvényesítésre és a vitarendezés szabályozására irányulnak.","A TRIPS a szellemi tulajdon territoriális jellegére alapozva megerősíti a nemzeti bánásmód elvét, és minimumkövetelmény-rendszert állít a részes államoknak.","A védelem alapjaként megköveteli – a személyiségi jogok kivételével – a Berni és a Párizsi Uniós Egyezményekben felsorolt minimumjogok betartását, majd újabbakkal egészíti ki a jogok skáláját.","Rendelkezik a nemzeti jogérvényesítés biztosításáról (az eljárás alapelvei és más minimumkövetelmények), a tagállamok közötti vitákat pedig a WTO vitarendezési eljárásának veti alá."]},{"prompt":"Mutasd be a WIPO két internetszerződését (WCT és WPPT), céljukat és a köztük lévő alapvető különbséget!","keyPoints":["A WIPO 1996-ban fogadta el a 2 úgynevezett internetszerződését: a WIPO Szerzői Jogi Szerződését (WCT) és a WIPO Előadásokról és Hangfelvételekről szóló Szerződését (WPPT).","Az internetszerződések a meglévő egyezmények korszerű anyagi jogi kiegészítésére vállalkoztak.","A WCT és a WPPT gyakorlatilag a Berni Uniós, illetve a Római Egyezmény meghosszabbításának tekinthető.","Alapvető különbség: a WCT (1. cikk (4) bek.) beemeli anyagi rendelkezései közé a BUE 1–21. cikkeibe és Függelékébe foglalt rendelkezéseket, azaz beépíti azokat saját anyagi jogi szabályozásába.","A WPPT (1. cikk) ezzel szemben nem csorbítja, nem befolyásolja és nem érinti a többi szerzői és szomszédos jogi egyezményt, és nem kötelezi tagállamait a Római Egyezmény globális betartására.","A WPPT azonban átvesz bizonyos rendelkezéseket a Római Egyezményből, és az ezekben biztosított jogokat szavatolja a WPPT-tagállamok állampolgárai számára.","A 2 szerződés célja a létező szerzői és szomszédos jogi szerződések korszerűsítése és kiegészítése, hogy megfeleljenek az új technológiai és versenypiaci feltételeknek.","Mindkét szerződés megerősíti a nemzeti bánásmód elvét, korszerűsíti a meglévő szerződések foglalórendszerét, és új típusú jogokkal egészíti ki a létező szerzői, illetve szomszédos jogokat.","A WCT kiterjeszti a szerzői művek fogalmát a számítógépes programokra, amelyeket a BUE alá eső szerzői jog tárgyaként, írásműként kell védeni.","A WCT korszerűsíti az adatbázisok fogalmát is, de a védelem nem terjed ki azokra az adatbázisokra, amelyek nem teljesítik a szerzői jogi mű eredetiségi kritériumát."]}],"terms":[{"t":"TRIPS-megállapodás","d":"A WTO mellékleteként elfogadott megállapodás a szellemi tulajdon kereskedelemmel összefüggő kérdéseiről; megerősíti a nemzeti bánásmód elvét, minimumkövetelményeket állít, jogérvényesítési szabályokat ad, és a vitákat a WTO vitarendezési eljárásának veti alá; elfogadása a WTO-csatlakozás feltétele volt."},{"t":"WTO (Kereskedelmi Világszervezet)","d":"1994-ben megalakult nemzetközi szervezet, amelynek mellékleteként fogadták el a TRIPS-megállapodást."},{"t":"WIPO internetszerződései","d":"A WIPO által 1996-ban elfogadott két szerződés (WCT és WPPT), amelyek a meglévő szerzői és szomszédos jogi egyezmények korszerű anyagi jogi kiegészítésére vállalkoztak."},{"t":"WCT (WIPO Szerzői Jogi Szerződése)","d":"A Berni Uniós Egyezmény meghosszabbításának tekinthető 1996-os szerződés; beemeli a BUE 1–21. cikkeit és Függelékét saját anyagi jogi szabályozásába, kiterjeszti a művek fogalmát a számítógépes programokra és korszerűsíti az adatbázisok fogalmát."},{"t":"WPPT (WIPO Előadásokról és Hangfelvételekről szóló Szerződése)","d":"A Római Egyezmény meghosszabbításának tekinthető 1996-os szerződés; nem érinti a többi egyezményt és nem kötelez a Római Egyezmény globális betartására, de átvesz belőle rendelkezéseket, és az azokban biztosított jogokat szavatolja tagállamai állampolgárainak."}],"drills":[{"q":"Melyik 2 nemzetközi szervezet valósította meg az 1980-as évektől a nemzetközi szerzői jogi együttműködés továbbfejlesztését, és mivel?","a":["WIPO: az 1996-ban elfogadott 2 internetszerződéssel (WCT, WPPT)","WTO (1994): a mellékleteként elfogadott TRIPS-megállapodással"]},{"q":"Mire irányulnak a TRIPS-megállapodás rendelkezései?","a":["A szellemi tulajdon kereskedelmi vonatkozású nemzetközi fejlesztésére","A jogérvényesítésre","A vitarendezés szabályozására"]},{"q":"Nevezd meg a WIPO 2 internetszerződését!","a":["WIPO Szerzői Jogi Szerződése (WCT)","WIPO Előadásokról és Hangfelvételekről szóló Szerződése (WPPT)"]},{"q":"Mi az alapvető különbség a WCT és a WPPT között a korábbi egyezményekhez való viszonyukban?","a":["WCT: beemeli a BUE 1–21. cikkeit és Függelékét saját anyagi jogi szabályozásába","WPPT: nem csorbítja, nem befolyásolja és nem érinti a többi szerzői és szomszédos jogi egyezményt; csak bizonyos rendelkezéseket vesz át a Római Egyezményből"]}]},{"num":109,"title":"További fontos nemzetközi szerződések","essay":[{"prompt":"Sorold fel és jellemezd röviden a további fontos nemzetközi szerzői jogi szerződéseket!","keyPoints":["A műholdas műsort hordozó jelek védelméről szóló Brüsszeli Egyezmény (1974).","Az audiovizuális előadóművészi teljesítmények védelméről szóló Pekingi Szerződés (2012).","A Marrakesh Szerződés a vak, látáskárosult és olvasási képességükben akadályozott személyeknek a kiadott szerzői művekhez való könnyebb hozzáféréséről (2013)."]}],"terms":[{"t":"Brüsszeli Egyezmény (1974)","d":"A műholdas műsort hordozó jelek védelméről szóló nemzetközi egyezmény."},{"t":"Pekingi Szerződés (2012)","d":"Az audiovizuális előadóművészi teljesítmények védelméről szóló nemzetközi szerződés."},{"t":"Marrakesh Szerződés (2013)","d":"A vak, látáskárosult és olvasási képességükben akadályozott személyeknek a kiadott szerzői művekhez való könnyebb hozzáférését szolgáló szerződés."}],"drills":[{"q":"Sorold fel a további fontos nemzetközi szerzői jogi szerződéseket évszámukkal!","a":["Brüsszeli Egyezmény a műholdas műsort hordozó jelek védelméről (1974)","Pekingi Szerződés az audiovizuális előadóművészi teljesítmények védelméről (2012)","Marrakesh Szerződés a vak, látáskárosult és olvasási képességükben akadályozott személyek hozzáféréséről (2013)"]}]},{"num":110,"title":"A román szerzői jog általános elméleti kérdései","essay":[{"prompt":"Fejtsd ki a szellemi alkotások jogának fogalmát, helyét a polgári jog rendszerében és két fő részterületét!","keyPoints":["Tág értelemben azokat a jogintézményeket foglalja magába, amelyek az új gondolatokat tartalmazó szellemi termékek létrehozásával és felhasználásával kapcsolatos szabályokat tartalmazzák","Meghatározás: azon jogi normák összessége, amelyek a szellemi alkotások megvalósításával, átalakításával és hasznosításával összefüggő vagyoni és személyi jellegű társadalmi viszonyokat szabályozzák","A polgári jog részét képezi, szabályrendszere a polgári jogból fejlődött önálló jogággá","Két fő részterülete: a szerzői jog és az iparjogvédelem","Szerzői jog: az irodalom, a tudomány és a művészet körébe tartozó szellemi alkotások létrehozásával és felhasználásával összefüggő jogviszonyok sajátos szabályai","A szerzői jog alapvető jellemzője az individualitás: az alkotó és műve kapcsolatában a szubjektív mozzanatok dominálnak; területe homogén","Iparjogvédelem: a domináns szakirodalmi vélemény szerint három, természetét tekintve eltérő intézménycsoportot foglal magába","Első csoport: műszaki-gazdasági természetű alkotások védelme (szabadalom, használati mintaoltalom, mikroelektronikai félvezetők topográfiájának oltalma, újítás, know-how)","E csoport jellemzője: nem esztétikai megközelítésű alkotások, az alkotóhoz való kötődés kevésbé szoros, a gazdasági-vagyoni aspektus hangsúlyosabb","Második csoport: vállalat- és árujelzők oltalma (kereskedelmi név, védjegy, földrajzi árujelzők) – nem tisztán szellemi alkotásokat oltalmazó intézmények","Harmadik, legtágabb értelemben a versenyjog (a tisztességtelen verseny szabályai) is ide köthető"]},{"prompt":"Mutasd be a szellemi alkotások jogára vonatkozó elméleteket, valamint a szellemi alkotáshoz fűződő jog és a tulajdonjog összefüggéseit!","keyPoints":["A szakirodalomban három fő elmélettípus található: vagyoni elméletek, személyiségi jogi elmélet, kombinációs elméletek","A vagyoni elméletek a szellemi alkotások és a szerzői jog vagyoni jellegét tartják elsődlegesnek; ide tartozik a tulajdoni elmélet, az immateriális javak elmélete és a versenyjogi elmélet","Tulajdoni elmélet: az embernek saját szellemi alkotásán éppúgy lehet tulajdonjoga, mint a fizikai tárgyakon – ezt tükrözik a „szellemi tulajdon”, „ipari tulajdon” kifejezések","A tulajdonnal való hasonlóság: az oltalom mindkét esetben abszolút szerkezetű és negatív tartalmú jogviszonyok útján valósul meg","Immateriális javak elmélete (J. Kohler): a szellemi alkotások eszmei javak; elismeri a tulajdonjoggal való szerkezeti hasonlóságot, de a jogviszonyokat a polgári jogi jogviszonyok sajátos csoportjának tekinti","Versenyjogi elmélet (A. Elster): nem az oltalom a lényeges, hanem a felhasználás – az intézményeket gazdasági szempontból, versenyfunkciójuk alapján kell vizsgálni","Személyiségi jogi elmélet (O. Gierke): a kanti filozófia alapján a szerzői jog a legszemélyesebb jog; a vagyoni elemek másodlagosak, nem is szükségszerű velejárói","Kombinációs elméletek: a vagyoni és személyiségi jellemzőket hangolják össze, mivel e jogosítványok szétválaszthatatlanok","Liga Cantuna szerint a szellemi tulajdonjog fogalma hármas értelmezésű: polgári jogi terület, a szabályozást összesítő jogintézmény, valamint az alkotót megillető személyiségi jog","Viorel Roș: bár a testetlen javak képezhetik tulajdonjog tárgyát, a RPtk. és az 1996. évi 8. törvény nem támasztja alá, hogy a szerzői jog tulajdonjogként kezelhető","A szellemi alkotáson fennálló „tulajdonjog” sajátossága: gondolati jellegű, helyhez nem kötött (egyszerre több helyen használható), egyéni-eredeti módon azonosítható, és az alkotó–alkotás kapcsolat személyes jellegű"]},{"prompt":"Ismertesd a szellemi alkotások jogviszonyainak típusait és a román szerzői jog jogforrásait!","keyPoints":["A jogviszonyok szerkezetük és létrejöttük időrendje szerint háromfélék: alapjogviszonyok, létrehozási és felhasználási jogviszonyok","Alapjogviszonyok: a szellemi alkotás védelmének jogviszonyai; ezek foglalják magukba a vagyoni és nem vagyoni jogokat, amelyek útján megvalósul az alkotás és az alkotó védelme","A védelem – akárcsak a tulajdonjognál – abszolút szerkezetű jogviszonyban valósul meg: csak a jogosult ismert, minden más személy köteles tartózkodni jogai megsértésétől","A szerzői jognál az alapjogviszony az alkotás létrejöttével egyidőben, a törvény hatálya által keletkezik; az iparjogvédelemnél előzetes eljárás teljesítését követően","Létrehozás jogviszonyai: az alapviszonyt megelőzően létesülnek, az alkotót ösztönzik a mű létrehozására; szerződéses jogviszonyok (pl. kutatási szerződés, kiadási szerződés)","Felhasználási jogviszonyok: szintén szerződésen alapulnak; céljuk az alkotáshoz fűződő jogosultságok érvényre juttatása anyagi ellenszolgáltatásért cserébe (pl. színpadi felhasználási vagy megfilmesítési szerződés)","A jogforrások megkülönböztethetők: hazai (belső) és nemzetközi jogforrások","Legfőbb jogforrás az 1996. évi 8. törvény a szerzői jogról és a szomszédos jogokról (Hivatalos Közlöny 60/26.03.1996, újraközölve 489/14.06.2018)","A törvény mellett számos jogszabály rendezi különösen a közös jogkezelést és egyes intézmények – köztük a Román Szerzői Jogi Hivatal – működését"]}],"terms":[{"t":"Szellemi alkotások joga","d":"Azon jogi normák összessége, amelyek a szellemi alkotások megvalósításával, átalakításával és hasznosításával összefüggő vagyoni és személyi jellegű társadalmi viszonyokat szabályozzák."},{"t":"Szerzői jog","d":"Az irodalom, a tudomány és a művészet körébe tartozó szellemi alkotások létrehozásával és felhasználásával összefüggő jogviszonyok sajátos szabályai; jellemzője az individualitás és a szubjektív mozzanatok dominanciája."},{"t":"Iparjogvédelem","d":"A szellemi alkotások jogának szerteágazó részterülete, amelybe három eltérő intézménycsoport tartozik: műszaki-gazdasági alkotások védelme, vállalat- és árujelzők oltalma, tágabb értelemben a versenyjog."},{"t":"Tulajdoni elmélet","d":"Vagyoni elmélet, amely szerint az embernek saját szellemi alkotásán éppúgy lehet tulajdonjoga, mint a fizikai tárgyakon; ezt tükrözi a „szellemi tulajdon” kifejezés."},{"t":"Immateriális javak elmélete (J. Kohler)","d":"A szellemi alkotásokat eszmei javakként fogja fel; elismeri a tulajdonjoggal való szerkezeti hasonlóságot, de a jogviszonyokat a polgári jogi jogviszonyok sajátos csoportjának tekinti."},{"t":"Versenyjogi elmélet (A. Elster)","d":"Szerinte nem az oltalom, hanem a felhasználás a lényeges: az alkotásokat védő jogintézményeket gazdasági szempontból, versenyfunkciójuk alapján kell vizsgálni."},{"t":"Személyiségi jogi elmélet (Gierke)","d":"A kanti filozófiából kiindulva a szerzői jogot a legszemélyesebb jognak tekinti, amely összefűzi az alkotót művével; a vagyoni elemek másodlagosak."},{"t":"Kombinációs elméletek","d":"A vagyoni és a személyiségi jellemzőket összehangoló elméletek, abból kiindulva, hogy a személyiségi és vagyoni jogosítványok szétválaszthatatlanok."},{"t":"Alapjogviszonyok","d":"A szellemi alkotás védelmének abszolút szerkezetű jogviszonyai, amelyek a szerzői jognál a mű létrejöttével egyidőben, az iparjogvédelemnél előzetes eljárás után keletkeznek."},{"t":"Létrehozás jogviszonyai","d":"Az alapviszonyt megelőző szerződéses jogviszonyok, amelyek az alkotót szellemi alkotás létrehozására ösztönzik (pl. kutatási vagy kiadási szerződés)."},{"t":"Felhasználási jogviszonyok","d":"Szerződésen alapuló jogviszonyok, amelyek célja az alkotáshoz fűződő jogosultságok érvényre juttatása anyagi ellenszolgáltatásért (pl. megfilmesítési szerződés)."},{"t":"1996. évi 8. törvény","d":"A román szerzői jog legfőbb jogforrása a szerzői jogról és a szomszédos jogokról; 1996-ban jelent meg, 2018-ban újraközölték."},{"t":"Liga Cantuna hármas értelmezése","d":"A szellemi tulajdonjog fogalma egyszerre polgári jogi terület, a szellemi alkotások szabályozását összesítő jogintézmény és az alkotót megillető személyiségi jog."}],"drills":[{"q":"Sorold fel az iparjogvédelem körébe tartozó három intézménycsoportot!","a":["A műszaki-gazdasági természetű szellemi alkotások védelme (szabadalom, használati mintaoltalom, félvezetők topográfiájának oltalma, újítás, know-how)","A vállalat- és árujelzők oltalma (kereskedelmi név, védjegy, földrajzi árujelzők)","Tágabb értelemben a versenyjog (a tisztességtelen verseny szabályai)"]},{"q":"Sorold fel a szellemi alkotásokra vonatkozó elméletek három fő típusát és az egyes típusokba tartozó elméleteket!","a":["Vagyoni elméletek: tulajdoni elmélet, immateriális javak elmélete (Kohler), versenyjogi elmélet (Elster)","Személyiségi jogi elmélet (Gierke)","Kombinációs elméletek (a vagyoni és személyiségi jellemzők összehangolása)"]},{"q":"Sorold fel a szellemi alkotások jogviszonyainak típusait létrejöttük időrendje szerint!","a":["Létrehozás jogviszonyai (az alapviszonyt megelőző, ösztönző szerződéses viszonyok)","Alapjogviszonyok (a szellemi alkotás védelmének abszolút szerkezetű jogviszonyai)","Felhasználási jogviszonyok (a jogosultságok hasznosítását biztosító szerződéses viszonyok)"]},{"q":"Sorold fel a szellemi tulajdonjog fogalmának hármas értelmezését Liga Cantuna szerint!","a":["A polgári jog területe","A szellemi alkotásokra vonatkozó szabályozást összesítő jogintézmény","A szellemi alkotás létrehozóját megillető személyiségi jog"]}]},{"num":111,"title":"A szerzői jogviszony alanyai","essay":[{"prompt":"Fejtsd ki, ki tekinthető szerzőnek a román szerzői jogban, kitérve a szerzőségi vélelemre, a másodlagos művekre és a kiskorúság kérdésére!","keyPoints":["A szerzői jogviszony alanya az a természetes vagy jogi személy, aki az oltalom alá helyezendő alkotás megszületéséből fakadó szerzői jogok jogosultja, és minden más jogalanytól megkövetelheti jogai tiszteletben tartását","Az 1996. évi 8. törvény 3. cikk (1) bek. szerint szerző az a személy vagy azok a személyek, aki/akik a művet megalkották","Vélelem [4. cikk (1) bek.]: az tekinthető szerzőnek, akinek a neve alatt a művet először nyilvánosságra hozták","Álnéven vagy név nélkül közzétett alkotásoknál a szerzői jogokat az a személy gyakorolja, aki a szerző jóváhagyásával közzétette azokat, amíg a szerző fel nem fedi kilétét [4. cikk (2) bek.]","A nemzetközi normák szerint szerző az, aki egyéni gondolatokat tartalmazó, eredeti formába öntött alkotást hoz létre a művészetek vagy a tudomány területén","A 3. cikk (2)-(3) bek. szerint a szerzőt megillető jogokkal más természetes vagy jogi személyek is rendelkezhetnek, és a szerzői jogok öröklés útján is átszállhatnak","A 8. cikk alapján a szerzővel azonos jogvédelemben részesül az eredeti mű fordítója, átdolgozója vagy feldolgozója, aki másodlagos művet hoz létre","A másodlagos mű oltalmának kettős feltétele: jogainak gyakorlása ne sértse az eredeti mű alkotójának jogait, és a feldolgozás a szerző engedélyével történjék","Az új román Ptk. 42. cikke szerint a kiskorú szülői vagy gyámhatósági felügyelet mellett köthet munkavégzésre, művészeti vagy sporttevékenységre vonatkozó jogi aktusokat, és egyedül rendelkezik az így szerzett jövedelemmel","A szerzői jogi törvény nem köti a szerzőség elismerését életkorhoz vagy teljes cselekvőképességhez, így kiskorú személy is lehet a szerzői jog alanya"]},{"prompt":"Mutasd be a több szerző által alkotott művekre vonatkozó szerzőségi szabályokat: a közös művet, a szerzőtársi és társszerzői viszonyt, a kollektív és a gyűjteményes művet!","keyPoints":["Több szerző esetén a szerzői jogvédelem konkrét terjedelme az együttesen létrehozott mű szétválaszthatóságának függvénye","A törvény szerzőtársi és társszerzői kapcsolat között tesz különbséget; a román terminológia mindkettőt „operă comună” néven említi, ezektől elkülönül a kollektív mű (operă colectivă)","Közös mű: több szerző együttműködésének eredménye, valamennyi alkotót megilletik a szerzői jogosultságok; lehet főszerzője annak, aki a mű túlnyomó részét alkotta","Ellenkező megegyezés hiányában a közösen alkotó szerzők csak közös akarattal használhatják fel a művet; az ellenszegülést alapos indokkal kell alátámasztani","Szerzőtársak: az egyéni hozzájárulás nem határolható el, a mű részei önállóan nem használhatók fel, a szerzői jog együttesen és egyenlő arányban illeti meg őket, jogaikat csak együtt gyakorolhatják","Társszerzők: az egyes szerzők hozzájárulása pontosan elhatárolható, a részek önállóan is felhasználhatók (összekapcsolt művek), a saját rész tekintetében a jogok önállóan gyakorolhatók, a védelmi idő is autonóm","A társszerző saját jogait csak úgy gyakorolhatja, hogy ne sértse a többi társszerző jogait és a közös mű felhasználásából származó jogokat","A felhasználásból származó jövedelemnek arányosnak kell lennie a hozzájárulás mértékével; a megegyezésnek nem érvényességi feltétele az írott forma","Kollektív mű (6. cikk): több szerző hozzájárulása önálló egésszé olvad össze, a hozzájárulások nem választhatók szét; egyfajta álszerzőtársi viszony, egyetlen jogosultja van a szerzői jogoknak","A kollektív mű jogait ellenkező megegyezés hiányában az a személy gyakorolja, akinek kezdeményezésére, felelőssége mellett vagy neve alatt jelent meg az alkotás","Gyűjteményes mű: az egészre vonatkozóan a szerzői jog a szerkesztőt illeti meg, ha az összeválogatás egyéni jellegű; a felvett művek alkotóinak önálló jogait ez nem érinti","Munkaköri feladatként több szerző által létrehozott számítógépes programok szerzői jogai főszabály szerint a munkáltatót illetik meg; a közös előadás is kollektív alkotás","Az adatbázis a gyűjteményes művek újfajta típusa: védelme nem terjed ki a tartalmát képező adatokra, feltétele a tartalom egyéni-eredeti összeválogatása, elrendezése"]},{"prompt":"Ismertesd a szomszédos jogokkal rendelkező jogalanyok kategóriáit, kitérve a statiszta megítélésének kérdésére!","keyPoints":["Az 1996. évi 8. törvény 94. cikke sorolja fel a szerzői joggal szomszédos jogok alanyait","Három kategória: az előadóművészek a saját előadásaik, a hangfelvétel-előállítók a saját felvételeik, a rádió- és televízió-orgánumok a saját műsoraik vonatkozásában","E kategóriákra jellemző, hogy teljes alkotói tevékenységüket a művészetek, illetve az audiovizuális alkotás területén fejtik ki","Előadóművészek (95. cikk): színészek, énekesek, zenészek, táncosok, illetve minden személy, aki bemutat, zenél, táncol, szaval, előad, rendez, vezényel vagy más módon kivitelez egy irodalmi vagy művészeti alkotást, beleértve a folklór-, varieté-, cirkuszi előadást vagy bábjátékot","A statiszta kérdése: a törvényes felsorolásban nincs helye kiegészítésnek, és a statiszta nem kerül említésre, így főszabályként nem szomszédos jogok alanya","Ez a megoldás egyezik a Római Egyezmény államainak véleményével: a színházi vagy filmben szereplő statiszták nem tekintendők jogalanynak","A határ egyéni mérlegelést igényel, a szakmai szabályok és szokások alapján, figyelembe véve a hozzájárulás mértékét és nélkülözhetőségét","Amikor a statiszta jogalanyisága elismerhető, az esetek általában a kollektív alkotások köréből kerülnek ki","Hangfelvétel-előállító [103. cikk (2) bek.]: aki kezdeményezi és vállalja egy hangfelvétel első elkészítésének megszervezését és finanszírozását, függetlenül attól, hogy a felvett hangok szellemi alkotásnak minősülnek-e","A rádió- és televízió-orgánumokra a szerzői jogi törvény mellett a 2002. évi 504. audiovizuális törvény rendelkezései is irányadók"]},{"prompt":"Mutasd be a törvény külön szabályozása alapján szerzői jogok alanyának tekintett személyeket: az audiovizuális alkotás szerzőit, a számítógépes programok alkotóit és az adatbázis-készítőket!","keyPoints":["Audiovizuális alkotás szerzői (67. cikk): a rendező/kivitelező, az adaptálás elkészítője, a szövegkönyv írója, a párbeszédek írója, az eredeti, a műhöz írt zene szerzője, valamint jelentős animációs mű/részlet esetén az azt elkészítő grafikus","A producer és a rendező közötti szerződés alapján szerzőként kezelhető minden más alkotó is, aki jelentősen hozzájárult a mű létrehozásához","A 70. cikk csak a meghatározott szerzők számára ismer el személyhez fűződő szerzői jogokat","Az audiovizuális alkotás fő szerzője a rendező/kivitelező, aki a producerrel szerződéses jogviszonyban vállalja az alkotás elkészítését","68. cikk (4) bek.: a nem fő alkotónak tekintett szerzők nem tilthatják meg a végleges formájú mű részleges vagy teljes nyilvánosságra hozatalát és sajátos felhasználását","71. cikk (1) bek.: ellenkező megegyezés hiányában a törvény feltételezi, hogy méltányos díjazás ellenében – az eredeti zene zeneszerzőjén kívül – az összes szerző kizárólagos jelleggel a producerre ruházta a mű felhasználására és a feliratozás vagy szinkronizálás engedélyezésére vonatkozó jogokat","72. cikk (3) bek.: ha a producer a szerződéstől számított 5 éven belül nem véglegesíti az alkotást, vagy a véglegesítéstől számított 1 éven belül nem mutatja be, a szerzők kérhetik a szerződés felbontását","Számítógépes programok alkotóira a 73-82. cikkek tartalmaznak sajátos rendelkezéseket; nem részesülnek oltalomban a program elemét képező ötletek, eljárások, működési módszerek, matematikai fogalmak és elvek kitalálói","Adatbázis-készítő (140. cikk): az a természetes vagy jogi személy, aki jelentős mennyiségi és minőségi befektetést tett az adatbázis tartalmának megszerzése, ellenőrzése vagy bemutatása érdekében","Az adatbázis jogszerű felhasználója az, aki a készítő vagy a jogok gyakorlójának engedélyével, a szerzői jogokat tiszteletben tartva használja azt"]},{"prompt":"Fejtsd ki a szerzői jogok alanya és a harmadik személyek közötti kapcsolatot, valamint a szerzőség bizonyítási eszközeit!","keyPoints":["A 25. cikk szerint az alkotás tulajdonosa vagy birtokosa köteles a művet a szerző rendelkezésére bocsátani vagy hozzáférést biztosítani, ha ez a szerzői jogok érvényesítéséhez szükséges, feltéve hogy ez nem sérti a tulajdonos törvényes érdekeit","A tulajdonos vagy birtokos ilyenkor megkövetelheti: megfelelő garanciát a mű védelmére, az eredeti alkotás piaci értékének megfelelő biztosítás megkötését, valamint megfelelő összegű díjazást – ezek halmozottan is követelhetők, de nem kötelezően","A törvény szelleme az, hogy elsődlegesen a szerző érdekeit oltalmazza; a joggyakorlásnak ugyanakkor meg kell felelnie a jóhiszeműség követelményének","A 26. cikk szerint a tulajdonos vagy birtokos nem semmisítheti meg az alkotást anélkül, hogy azt a felhasznált anyag értékén visszavásárlásra fel ne ajánlotta volna a szerzőnek","Ha az eredeti alkotás visszaadása nem lehetséges, a szerzőnek lehetőséget kell adni megfelelő másolat készítésére; építészeti műveknél a szerző fényképeket készíthet és kérheti a tervrajzok másolatát","A szerző érdekeinek elsődleges védelmét szolgálja a vagyoni jogok közös jogkezelésére létrehozott intézmények szabályozása is","A szerzői jogvédelem születése egybeesik a mű megalkotásának pillanatával, függetlenül a nyilvánosságra hozataltól; az oltalomhoz a mű akár befejezetlen formában való létezése is elegendő","Egyetlen kivétel: az adatbázisokra vonatkozó szerzői jogok az adatbázis végleges formában való elkészültével lépnek életbe","Az oltalom mű születésétől való megléte alapvető különbség a szerzői jog és az iparjogvédelem között, ahol előzetes eljárás teljesítése kötelező","A szerző kérheti műve nyilvántartásba vételét a Román Szerzői Jogi Hivatalnál (ORDA – Registrul Național de Opere); ez nem kötelező, nem jogszerző hatású, információs és védelmi célt szolgál, díjfizetéssel jár, és csak kiegészítő bizonyítási erővel rendelkezik","A szerzői jogok gyakorlója a művet a kizárólagos felhasználást jelentő „©” jelzéssel láthatja el, mellette a névvel és az első megjelenés helyével, dátumával","Az előadóművészek és hangfelvétel-készítők a „®” jelzést használhatják, szintén a névvel és az első megjelenés helyével, dátumával"]}],"terms":[{"t":"Szerző","d":"Az a személy vagy azok a személyek, aki/akik a művet megalkották [1996. évi 8. tv. 3. cikk (1) bek.]; egyéni gondolatokat tartalmazó, eredeti formába öntött alkotást hoz létre."},{"t":"Szerzőségi vélelem","d":"Az a személy tekinthető a mű szerzőjének, akinek a neve alatt azt először nyilvánosságra hozták [4. cikk (1) bek.]."},{"t":"Álnéven vagy név nélkül közzétett mű","d":"A szerzői jogokat az a személy gyakorolja, aki a szerző jóváhagyásával közzétette a művet, amíg a szerző fel nem fedi kilétét [4. cikk (2) bek.]."},{"t":"Másodlagos mű","d":"Az eredeti mű fordítása, átdolgozása vagy feldolgozása; alkotója a szerzőt megillető jogvédelemben részesül, ha nem sérti az eredeti mű alkotójának jogait és a szerző engedélyével jár el (8. cikk)."},{"t":"Kiskorú szerzősége","d":"A szerzői jogi törvény nem köti a szerzőséget életkorhoz vagy cselekvőképességhez, így kiskorú is lehet a szerzői jog alanya; a Ptk. 42. cikke szerint felügyelet mellett köthet művészeti tevékenységre vonatkozó jogi aktusokat."},{"t":"Közös mű (operă comună)","d":"Több szerző együttműködésének eredményeként létrejövő szellemi alkotás; valamennyi alkotót megilletik a szerzői jogosultságok, és ellenkező megegyezés hiányában csak közös akarattal használható fel."},{"t":"Szerzőtársak","d":"Közösen alkotó szerzők, akiknek egyéni hozzájárulása nem határolható el; a mű részei önállóan nem használhatók fel, a szerzői jog együttesen és egyenlő arányban illeti meg őket."},{"t":"Társszerzők","d":"Közösen alkotó szerzők, akiknek hozzájárulása pontosan elhatárolható; a részek önállóan is felhasználhatók (összekapcsolt művek), és a saját rész jogai önállóan gyakorolhatók."},{"t":"Kollektív mű (operă colectivă)","d":"Több szerző hozzájárulásával készült, önálló egészet alkotó mű, amelyben a hozzájárulások nem választhatók szét; a jogokat az gyakorolja, akinek kezdeményezésére, felelőssége mellett vagy neve alatt jelent meg (6. cikk)."},{"t":"Gyűjteményes mű","d":"Olyan mű, amelynek egészére a szerzői jog a szerkesztőt illeti meg, ha az összeválogatás egyéni jellegű; a felvett művek alkotóinak önálló jogait nem érinti."},{"t":"Adatbázis","d":"A gyűjteményes művek újfajta típusa; védelme nem terjed ki a tartalmát képező adatokra, és feltétele a tartalom egyéni-eredeti összeválogatása, elrendezése, szerkesztése."},{"t":"Előadóművész","d":"Színész, énekes, zenész, táncos, illetve minden személy, aki bemutat, zenél, szaval, előad, rendez, vezényel vagy más módon kivitelez egy irodalmi vagy művészeti alkotást (95. cikk); szomszédos jogok alanya."},{"t":"Hangfelvétel-előállító","d":"Az a természetes vagy jogi személy, aki kezdeményezi és vállalja egy hangfelvétel első elkészítésének megszervezését és finanszírozását [103. cikk (2) bek.]; szomszédos jogok alanya."},{"t":"Rádió- és televízió-orgánumok","d":"Saját műsoraik vonatkozásában szomszédos jogok alanyai; rájuk a szerzői jogi törvény mellett a 2002. évi 504. audiovizuális törvény is irányadó."},{"t":"Statiszta","d":"A törvényes felsorolásban nem szerepel, ezért – a Római Egyezmény államainak véleményével egyezően – főszabályként nem szomszédos jogok alanya; megítélése egyéni mérlegelést igényel."},{"t":"Audiovizuális alkotás fő szerzője","d":"A rendező/kivitelező, aki a producerrel szerződéses jogviszonyban vállalja az adott alkotás elkészítését."},{"t":"Adatbázis készítője","d":"Az a természetes vagy jogi személy, aki jelentős mennyiségi és minőségi befektetést tett az adatbázis tartalmának megszerzése, ellenőrzése vagy bemutatása érdekében (140. cikk)."},{"t":"ORDA-nyilvántartás (Registrul Național de Opere)","d":"A Román Szerzői Jogi Hivatal nem kötelező, nem jogszerző hatású nyilvántartása; információs és védelmi célt szolgál, díjköteles, és csak kiegészítő bizonyítási erővel rendelkezik."},{"t":"© jelzés","d":"A szerzői jogok gyakorlója az eredeti alkotást a kizárólagos felhasználást jelentő © jelzéssel láthatja el, mellette a névvel és az első megjelenés helyével, dátumával."},{"t":"® jelzés","d":"Az előadóművészek és hangfelvétel-készítők az eredeti alkotást a kizárólagos felhasználást jelentő ® jelzéssel láthatják el, a nevükkel és az első megjelenés helyével, dátumával."}],"drills":[{"q":"Sorold fel a másodlagos mű (fordítás, átdolgozás, feldolgozás) oltalmának kettős feltételét!","a":["A jogok gyakorlása ne sértse az eredeti mű alkotóját megillető jogokat","A feldolgozás, átdolgozás vagy fordítás a szerző engedélyével történjék"]},{"q":"Sorold fel a szerzői joggal szomszédos jogok alanyait a 94. cikk alapján!","a":["Előadóművészek – a saját előadásaik vonatkozásában","Hangfelvétel-előállítók – a saját felvételeik vonatkozásában","Rádió- és televízió-orgánumok – a saját műsoraik vonatkozásában"]},{"q":"Sorold fel az audiovizuális alkotás szerzőit a 67. cikk alapján!","a":["A rendező/kivitelező","Az adaptálás elkészítője","A szövegkönyv írója","A párbeszédek írója","Az eredeti, a műhöz írt zene szerzője","A mű szempontjából jelentős animációs mű/részlet elkészítője (grafikus)"]},{"q":"Sorold fel, mit követelhet meg a mű tulajdonosa vagy birtokosa a szerzőtől a mű rendelkezésre bocsátásáért cserébe (25. cikk)!","a":["Megfelelő garanciát a mű védelmére","Az eredeti alkotás piaci értékének megfelelő biztosítás megkötését","Megfelelő összegű díjazást"]},{"q":"Sorold fel a több szerzős művek típusait a román szerzői jogban!","a":["Közös mű szerzőtársi kapcsolattal (a hozzájárulások nem elhatárolhatók, együttes joggyakorlás)","Közös mű társszerzői kapcsolattal (elhatárolható hozzájárulások, önálló joggyakorlás a saját részen)","Kollektív mű (önálló egész, egyetlen jogosult gyakorolja a jogokat)","Gyűjteményes mű (az egészre a szerkesztő, a részekre a szerzők jogosultak)"]}]},{"num":112,"title":"A szerzői jogi jogviszony tárgya","essay":[{"prompt":"Fejtsd ki a szerzői jogvédelem tárgyának meghatározását és a román szabályozás megközelítését!","keyPoints":["A szerzői jogi védelem abszolút szerkezetű, negatív kötelezettséget alkotó jogviszony, amely jellegében a tulajdonviszonyhoz hasonlít.","Tárgya szellemi alkotás, amely a szerző személyiségéhez kötődő jogosultságok elismerését és oltalmazását is igényli.","A román szerzői jogi törvény kettős irányú szabályozást ad: egyrészt pontosan meghatározza a védelem tárgyát, másrészt részletes felsorolásban ismerteti a védett művek kategóriáit.","A törvény emellett taxatíve felsorolja azokat a szellemi alkotásokat is, amelyek nem részesülnek oltalomban.","A 7. cikk szerint a védelem tárgyát az irodalom, művészet vagy tudomány területén létrehozott eredeti szellemi alkotások képezik.","A védelem független az alkotás módjától, kifejezési módozatától vagy formájától, valamint a mű értékétől és rendeltetésétől.","A törvényes felsorolás nem taxatív: több helyen csupán általános meghatározását adja egy-egy alkotástípus-kategóriának.","Az oltalom szempontjából a mű értéke vagy esztétikai színvonala nem releváns.","A jogvédelem feltétele csupán bizonyos minimális szellemi színvonal, továbbá az, hogy a mű eredeti, egyéni gondolatot tartalmazzon és kifejezési formát öltsön."]},{"prompt":"Ismertesd az elsődleges és másodlagos alkotások megkülönböztetését, valamint a rögzítettség követelményét!","keyPoints":["Az individualitás módja és mértéke szerint elsődleges és másodlagos alkotásokat különböztetünk meg.","Az elsődleges alkotások más műtől nem függenek, tartalmukban és formájukban egyaránt önállók.","A másodlagos alkotások tartalmukban, formájukban vagy mindkettőben egy másik szerzői alkotástól függenek.","Másodlagos alkotás csak annyiban használható fel, amennyiben az elsődleges alkotás szerzője ehhez hozzájárul.","A másodlagos alkotások az önálló művekhez hasonlóan oltalomban részesülnek, ha kielégítik az oltalmazható művekkel szembeni általános követelményeket.","A 8. cikk szerint másodlagos alkotásként védett az irodalmi, művészi vagy tudományos alkotás fordítása, feldolgozása, magyarázata, dokumentációs munkái és zenei átdolgozása, ha szellemi alkotó tevékenységet feltételeznek.","Védettek a gyűjteményes művek is (enciklopédiák, antológiák, adat- és anyagösszeállítások, adatbázisok), ha az anyagok kiválasztása és elrendezése tekintetében szellemi alkotásnak minősülnek.","A szerzői alkotás kritériuma, hogy valamilyen módon rögzítettnek kell lennie, formát kell öltenie.","A rögzítettség azért szükséges, hogy a gondolat tartalmát reprodukálni lehessen; enélkül a szerzői jogbitorlás ténye sem lenne megállapítható.","A rögzítettség általános, de nem kizárólagos követelmény: a törvény a nyilvánosan tartott beszéd egyes formáit és az előadóművészek alkotásait is oltalomban részesíti."]},{"prompt":"Mutasd be az oltalomból kizárt szellemi alkotások körét!","keyPoints":["A 9. cikk sorolja fel azokat a szellemi termékeket, amelyek nem képezhetik a szerzői jogvédelem tárgyát.","Kizártak az ötletek, elméletek, fogalmak, tudományos felfedezések, eljárások, működési módszerek, matematikai fogalmak és az önmagukban vett találmányok, kifejezésük módjától függetlenül.","Kizártak a politikai, jogalkotói, közigazgatási és bírósági jellegű hivatalos szövegek, valamint ezek hivatalos fordításai.","Kizártak az állami és közhivatali hivatalos szimbólumok: címer, pecsét, zászló, jelvény, kitűző, érem.","Kizártak a fizetési eszközök.","Kizártak a sajtóban megjelenő információk és hírek, valamint az egyszerű tények és adatok.","A 9. cikk felsorolása zárt, taxatív jellegű.","Bár minden esetben szellemi tevékenység eredményéről van szó, ezek alapvetően a közérdekre való hivatkozással nem részesülhetnek oltalomban."]}],"terms":[{"t":"A szerzői jogvédelem tárgya","d":"Az irodalom, művészet vagy tudomány területén létrehozott eredeti szellemi alkotások, az alkotás módjától, kifejezési formájától, értékétől és rendeltetésétől függetlenül (7. cikk)."},{"t":"Elsődleges alkotás","d":"Más műtől nem függő, tartalmában és formájában egyaránt önálló szerzői alkotás."},{"t":"Másodlagos alkotás","d":"Tartalmában és/vagy formájában más szerzői alkotástól függő mű (pl. fordítás, feldolgozás), amely csak az elsődleges mű szerzőjének hozzájárulásával használható fel, de maga is oltalomban részesül."},{"t":"Gyűjteményes mű","d":"Enciklopédia, antológia, adat- és anyagösszeállítás, adatbázis, amely az anyagok kiválasztása és elrendezése tekintetében minősül szellemi alkotásnak (8. cikk)."},{"t":"Rögzítettség követelménye","d":"A szerzői alkotásnak valamilyen formát kell öltenie, hogy tartalma reprodukálható és a jogbitorlás megállapítható legyen; általános, de nem kizárólagos feltétel."},{"t":"Oltalomból kizárt alkotások","d":"A 9. cikk zárt, taxatív felsorolása (ötletek, hivatalos szövegek, állami szimbólumok, fizetési eszközök, hírek, tények), amelyek közérdekből nem részesülnek szerzői jogi oltalomban."}],"drills":[{"q":"Sorold fel a szerzői jogi törvény 7. cikkében védett műkategóriákat!","a":["irodalmi és publicisztikai írások, konferenciák, prédikációk, perbeszédek, előadások, egyéb írott vagy szóbeli művek, számítógépes programok","írott vagy szóbeli tudományos alkotások (közlemények, tanulmányok, egyetemi jegyzetek, tankönyvek, tervezetek, tudományos dokumentációk)","szöveges vagy szöveg nélküli zenei szerzemények","drámai művek, zenés drámák, koreográfiák, pantomim alkotások","filmművészeti és más audiovizuális alkotások","fényképészeti vagy azzal analóg eljárással létrehozott alkotások","képzőművészeti és grafikai alkotások (szobrok, festmények, metszetek, litográfiák, emlékművek, jelmez- és díszlettervek, kárpitok, kerámia, üveg- vagy fémplasztikák, rajzok, dizájnelemek, alkalmazott művészeti alkotások)","építészeti alkotások, beleértve a metszeteket, maketteket és az építészeti terveket","topográfiai, földrajzi vagy tudományos térképek, rajzok, plasztikák"]},{"q":"Sorold fel a 8. cikk szerint másodlagos alkotásként védett műveket!","a":["irodalmi, művészi vagy tudományos alkotás fordítása, feldolgozása, magyarázata, dokumentációs munkái, zenei átdolgozása (ha szellemi alkotó tevékenységet feltételeznek)","gyűjteményes művek: enciklopédiák, antológiák, adat- és anyagösszeállítások, adatbázisok (ha a kiválasztás és elrendezés szellemi alkotásnak minősül)"]},{"q":"Sorold fel a 9. cikk szerint az oltalomból kizárt szellemi alkotásokat!","a":["ötletek, elméletek, fogalmak, tudományos felfedezések, eljárások, működési módszerek, matematikai fogalmak, önmagukban vett találmányok","politikai, jogalkotói, közigazgatási, bírósági jellegű hivatalos szövegek és hivatalos fordításaik","állami, közhivatali hivatalos szimbólumok (címer, pecsét, zászló, jelvény, kitűző, érem)","fizetési eszközök","sajtóban megjelenő információk és hírek","egyszerű tények és adatok"]},{"q":"Sorold fel a szerzői jogi oltalom feltételeit a mű oldaláról!","a":["bizonyos minimális szellemi színvonal","eredeti, egyéni gondolat","kifejezési forma (rögzítettség)"]}]},{"num":113,"title":"A szerzői jogi jogviszony tartalma","essay":[{"prompt":"Fejtsd ki a szerzői jogi jogviszony tartalmának fogalmát, a személyhez fűződő jogok általános jellemzőit és polgári jogi alapjait!","keyPoints":["A szerzői jogi jogviszony tartalma alatt a vonatkozó jogok és az azokkal összefüggő kötelezettségek összességét értjük.","Jellegzetessége, hogy létrejötte pillanatában egyaránt tartalmazza a személyhez fűződő és a vagyoni jellegű jogokat.","A személyhez fűződő jogok az oltalmi idő tekintetében megelőzik a vagyoni jogok születését, és túl is élik azokat.","A személyhez fűződő jogok állandó jellegűek és intuitu personae kötöttek a szerző személyéhez.","E jogokról a szerző nem mondhat le, elévülhetetlenek és általában elidegeníthetetlenek (forgalomképtelenek).","Mortis causa meghatározatlan időre átszállhatnak az örökösökre; a 11. cikk (2) bekezdése szerint öröklés útján csak a nyilvánosságra hozatal joga, a szerzőség elismerésének joga és az integritáshoz való jog száll át.","Törvényes örökösök hiányában a jogok a szerző által megbízott, vagy annak hiányában a legnagyobb taglétszámú közös jogkezelő szervezetre szállnak át.","A szerzői jogi törvény szabályozásának kiegészítésére a Ptk. rendelkezései az irányadók.","A RPtk. 71. cikk (3) bekezdése (magánélethez való jog) tiltja a levelezés, kéziratok, személyes dokumentumok és magánéleti információk beleegyezés nélküli felhasználását.","A RPtk. 73. cikke szerint mindenkinek joga van a saját képmásához, és megtilthatja fizikai megjelenésének vagy hangjának reprodukálását és annak felhasználását.","A RPtk. 74. cikk e), f) és h) pontjai a magánélet megsértésének tekintik többek között a magánhelyiségben tartózkodó személy képmásának/hangjának beleegyezés nélküli rögzítését és felhasználását, a magánéletre vonatkozó hírek és riportok beleegyezés nélküli nyilvánosságra hozatalát, valamint a név, képmás, hang vagy hasonlóság rosszhiszemű felhasználását."]},{"prompt":"Ismertesd a nyilvánosságra hozatal jogát, a szerzőség elismeréséhez való jogot és a névjogot a román szerzői jogi törvény alapján!","keyPoints":["A szerzői jogi törvény 10. cikke sorolja fel a szerzőt megillető személyhez fűződő jogokat.","A nyilvánosságra hozatal joga alapján a szerző maga dönt arról, hogy művét egyáltalán nyilvánosságra hozza-e, valamint hogy mikor és milyen módon.","A mű jogvédelme teljes mértékben független a nyilvánosságra hozataltól; a szerző azt is kikötheti, hogy művét csak meghatározott idő elteltével lehessen nyilvánosságra hozni.","A nyilvánosságra hozatal előtt a mű lényeges tartalmáról csak a szerző engedélyével adható tájékoztatás; a jog csak a mű közléséig tart.","Nyilvánosságra hozatalnak minősül a mű olyan publikálása, amely által bárki számára hozzáférhetővé válik, akár csak elméleti lehetőségként is.","Ha a mű csak a szerző halála után kerül elő, és ellenkező nyilatkozat nincs, vélelmezhető, hogy a szerző nyilvánosságra kívánta hozni.","A 28. cikk (2) bekezdése szerint aki a jogvédelmi idő lejárta után törvényes feltételek mellett hoz nyilvánosságra egy addig ismeretlen alkotást, a vagyoni szerzői jogokéval megegyező védelemben részesül, de csak 25 évre, a törvényes nyilvánosságra hozataltól számítva.","Közös vagy kollektív alkotásnál: ha a jogokat írásban elismert fő alkotó gyakorolja, őt illeti a nyilvánosságra hozatal joga; ilyen megegyezés hiányában a szerzők csak együttesen dönthetnek.","Közös alkotásnál a hozzájárulás megtagadását indokolni kell; indokolatlan, rosszhiszemű megtagadás esetén a többi szerző bírósági úton érvényesítheti jogait.","A szerzőség elismeréséhez való jog a mű és a szerző közötti szoros kapcsolatból ered: a szerző bármikor megkövetelheti szerzőségének elismerését, és ellenállhat a szerzői minőségét megkérdőjelező cselekedeteknek.","A névjog alapján a szerzőnek joga van ahhoz, hogy nevét a művön és a művére vonatkozó minden utalásban feltüntessék; a nevét idézés, ismertetés és részátvétel esetén is jelezni kell.","Másodlagos mű (átdolgozás, feldolgozás, fordítás) létrehozása esetén az alapul szolgáló mű szerzőjének nevét is fel kell tüntetni.","A szerző dönthet úgy, hogy művét név nélkül, álnéven vagy felvett néven hozza nyilvánosságra; ez a döntés nem végleges, a mű újabb felhasználásakor módosítható.","Közös mű esetében a névről való döntés joga minden szerzőt egyaránt megillet."]},{"prompt":"Mutasd be az integritáshoz való jogot, a visszavonáshoz való jogot, valamint az előadóművészek személyhez fűződő jogait!","keyPoints":["Az integritáshoz való jog alapján a szerző megkövetelheti műve egységének tiszteletben tartását, és ellenállhat minden olyan változtatásnak, torzításnak, amely becsületét sérti vagy jó hírnevét rontja.","A szerző csak a személyiségét hátrányosan érintő változtatások ellen tiltakozhat; a jelentéktelen, pl. technikai jellegű változtatások hozzájárulása nélkül is elvégezhetők.","A törvény több rendelkezése biztosítja a mű sérthetetlenségét: kiadási szerződésnél korrektúrázási jog, színpadi felhasználásnál részvétel a próbákon.","Egyes felhasználásoknál a törvény vélelmezi a szerző hozzájárulását a szükséges és indokolt módosításokhoz (pl. regény színpadi vagy filmforgatókönyvi átdolgozása).","Képzőművészeti alkotásoknál a törvény elismeri a szerző hozzáférési jogát, és megtiltja a tulajdonosnak a mű megsemmisítését a visszavásárlás felajánlása nélkül.","Köztéri képzőművészeti alkotások és építészeti művek esetében az integritáshoz való jog a hasznosítás miatt szükséges mértékben korlátozható; a változtatások jogszerűségét a jóhiszeműség feltétele írja körül.","A visszavonáshoz való jog a nyilvánosságra hozatal jogából ered: a szerző úgy dönthet, hogy a már nyilvánosságra hozott művét a továbbiakban ne használhassák fel.","A visszavonás jogszerűségéhez két feltétel együttes megléte szükséges: alapos indok, valamint a felhasználónak a nyilatkozat időpontjától felmerült kára megtérítése.","Az alapos indok szubjektív is lehet (pl. a szerző művészi vagy tudományos felfogásának megváltozása); a törvény más alaki vagy tartalmi feltételt nem támaszt.","Közös mű visszavonása esetén a törvény a többi szerző kártérítési igényét is elismeri.","A 96. cikk szerint az előadóművészeket megilleti a saját előadásmód szerzőségének elismeréséhez való jog, a névjog (nevük/művésznevük közzététele minden előadásnál és a felvétel minden lejátszásakor), valamint az integritáshoz való jog (az előadás minőségének tiszteletben tartása, ellenállás a deformálásnak, hamisításnak, lényeges módosításnak).","Az előadóművészek e jogai elidegeníthetetlenek és nem lehet róluk lemondani; mortis causa meghatározatlan időre az örökösökre, azok hiányában a közös jogkezelőre szállnak (97. cikk)."]},{"prompt":"Fejtsd ki a vagyoni jellegű szerzői jogok általános elveit, valamint a többszörözés, a terjesztés, a kereskedelmi célú import, a bérbeadás és a kölcsönzés jogát!","keyPoints":["A 12. cikk szerint a szerzőnek kizárólagos joga van a mű egészének vagy részeinek felhasználására és a harmadik személy általi felhasználás engedélyezésére; a felhasználási engedély főszabályként felhasználási szerződésben testesül meg.","A szerző engedélye kell a mű sajátos címének felhasználásához is, és a szerzőt illeti a műben szereplő jellegzetes, eredeti alak kereskedelmi hasznosításának kizárólagos joga.","A román szerzői jog a kötelező díjazás elvén áll: a szerzőt vagy jogutódját a mű felhasználása ellenében díjazás illeti; a díjazásról a szerződésben le lehet mondani, és a törvény szabályozza a szabad felhasználás eseteit.","A polgári jogi alapokból kiindulva a vagyoni jellegű szerzői jogok két fajtája a dologi jogok (forgalomképesek, időben behatároltak, abszolút jellegűek, érvényességük a törvény erejéből következik) és a kötelmi (követelési) jogok (relatív jellegűek, elévülhetnek, időben behatároltak).","A román szakirodalomban vitatott a vagyoni előjogok száma: egyes vélemények szerint három (felhasználás joga, a felhasználásból származó haszon szerzésének joga, kártérítéshez való jog jogtalan felhasználásnál), más elmélet szerint kettő (felhasználás és anyagi kártérítés); a különbség elméleti, gyakorlati jelentősége nincs.","A törvény nem határozza meg a mű használatba vételének pillanatát: erről kizárólag a szerző dönthet; közös műnél a szerzők írott, ad probationem szerződésben eltérhetnek.","A 13. cikk taxatíve sorolja fel a vagyoni jellegű szerzői jogokat; egyes alkotói területeken (audiovizuális művek, előadóművészek, számítógépes program, adatbázis) sajátos vagyoni jogok is megjelennek.","A többszörözés (13. cikk a), 14. cikk) a mű egészéről vagy részleteiről való másolatkészítés, közvetlen vagy közvetett módon, időlegesen vagy véglegesen, bármely eszközzel, beleértve a hang- és audiovizuális felvételt és az elektronikus tárolást.","A többszörözés lehet teljes vagy részleges, közvetlen vagy közvetett, időleges vagy végleges; megvalósulásához az szükséges, hogy az eredeti mű és a nyert alkotások azonos területen szülessenek (pl. szoborról készült fénykép nem többszörözés).","Gyakorlatban többszörözés pl. a fénymásolás, szkennelés, nyomtatás, felvétel rögzítése, CD-re írás, digitális tárolás, sugárzási célú rögzítés, építészeti alkotás terv szerinti utánépítése.","A terjesztés joga (13. cikk b), 15. cikk) a mű eredeti példányának vagy másolatainak visszterhes vagy ingyenes átruházását, illetve felkínálását jelenti; az első, szerző általi vagy engedélyével történt átruházással jogkimerülés lép fel.","A jogkimerülés európai uniós eredetű intézmény: a szellemi alkotásokra vonatkozó jogok az egyszeri forgalomba hozatallal kimerülnek, a továbbiakban nem gyakorolhatók.","A kereskedelmi célú import joga (13. cikk c), 16. cikk) a többszörözött példányok belső piacon való forgalomba hozatalára vonatkozik; a 16. cikk magyarázata tágabb a 13. cikknél (az eredeti alkotásra is kiterjed), és a behozott másolatok készítésének jogszerűnek kell lennie.","A bérbeadás joga (13. cikk d), 17. és 19. cikk) a mű meghatározott időre, közvetett vagy közvetlen gazdasági/kereskedelmi haszon ellenében történő használatra átadása; a kölcsönzés joga (13. cikk e), 18-19. cikk) haszonszerzés nélküli rendelkezésre bocsátás olyan intézmény által, amely a közönség hozzáférését lehetővé teszi.","A könyvtári kölcsönzéshez nem kell a szerző engedélye, de méltányossági juttatás jár (kivéve oktatási intézmények könyvtárai és ingyenes közkönyvtárak); a kölcsönzési jogról a szerző nem mondhat le, hang- és audiovizuális felvételek csak az első terjesztést követő 6 hónap után kölcsönözhetők, és a kölcsönzésnél nem érvényesül a jogkimerülés."]},{"prompt":"Ismertesd a nyilvánossághoz való közvetítés, a rádiós sugárzás, a kábeles továbbközvetítés és a származtatott alkotások létrehozásának jogát, valamint a követő jogot!","keyPoints":["A nyilvánossághoz való közvetítés joga (13. cikk f), 20. cikk) a mű bármely eszközzel, közvetve vagy közvetlenül megvalósuló hozzáférhetővé tételét jelenti, beleértve azt is, amikor a közönség tagjai a hozzáférés helyét és idejét egyénileg választják meg.","Megvalósítható közvetlenül vagy technikai eszközzel, a közönség számára nyitott helyen vagy bárhol, ahol az átlagos családi és ismeretségi körnél nagyobb számú személy gyűlt össze.","Ide tartozik a nyilvános előadás, felolvasás és bemutatás, a képzőművészeti, alkalmazott művészeti, fényképészeti és építészeti alkotások kiállítása, az audiovizuális és filmalkotások nyilvános vetítése, valamint az internetes, számítógépes hálózati közvetítés.","A nyilvánossághoz való közvetítés joga tekintetében nem érvényes a jogkimerülés szabálya.","A rádiós sugárzás jogának (13. cikk g), 21. cikk) két megjelenési formája van: a rádió- vagy tévétársaság vezeték nélküli vagy szatelliten keresztüli közvetítése, illetve a vezetékes, kábeles, optikai kábeles vagy hasonló módszerű közvetítés (kivéve a számítógépes rendszert); célja mindkét esetben a mű közönséghez juttatása.","A kábeles továbbközvetítés joga (13. cikk h), 22. cikk) egyidejű, módosítások nélküli és teljes továbbközvetítést jelent.","A származtatott alkotások létrehozásának joga (13. cikk i), 23. cikk) a fordítást, gyűjteményes kötetben való kiadást, átdolgozást és bármilyen más feldolgozást öleli fel, amelynek eredményeként új másodlagos alkotás jön létre.","Átdolgozni csak szerzői jogi értelemben műnek minősülő alkotást lehet, és csak akkor beszélünk átdolgozásról, ha az új mű is egyéni, eredeti jellegű; ha nem tartalmaz eredeti elemeket, másolatnak (plágiumnak) minősül.","Az átdolgozásban mind az átdolgozott, mind a származékos mű egyedi vonásai megjelennek; ha az átdolgozott mű elemei egyáltalán nem lelhetők fel, nincs átdolgozás, és engedélyre sincs szükség.","A követő jog (24. cikk) csak egyes alkotások esetében létező vagyoni jog; a román szabályozásban először az 1996. évi 8. számú szerzői jogi törvényben jelent meg.","Lényege, hogy a szerző alkotása esetleges értéknövekedéséből arányosan részesülhessen: az eredeti grafikai, képzőművészeti vagy fényképészeti alkotás szerzője az első tulajdonoscserét követő minden visszterhes átruházáskor a nettó ár meghatározott részére jogosult, és értesítést kérhet arról, hol található az alkotása.","A követő jog csak a műkereskedők közreműködésével történő átruházásoknál létezik; a szerző által készített vagy jóváhagyott korlátozott számú másolatok is eredeti műnek tekintendők.","A díj sávosan csökkenő (5%-tól 0,25%-ig), felső határa 12.500 euró; az eladó az adásvételtől számított 2 hónapon belül köteles értesíteni és kifizetni a szerzőt.","A jogosult az adásvételtől számított 3 éves határidőn belül indíthat keresetet a jog érvényesítésére és információszerzésre (az általános elévülési szabályok érvényesek).","A követő jogról a szerző nem mondhat le és nem ruházhatja át, de a törvényes oltalmi idő alatt az örökösök gyakorolhatják."]}],"terms":[{"t":"A szerzői jogi jogviszony tartalma","d":"A vonatkozó jogok és az azokkal összefüggő kötelezettségek összessége; létrejöttekor egyaránt tartalmaz személyhez fűződő és vagyoni jogokat."},{"t":"Személyhez fűződő szerzői jogok","d":"Állandó jellegű, intuitu personae kötött, lemondhatatlan, elévülhetetlen és általában elidegeníthetetlen jogok, amelyek megelőzik és túlélik a vagyoni jogokat."},{"t":"Nyilvánosságra hozatal joga","d":"A szerző kizárólagos joga eldönteni, hogy művét nyilvánosságra hozza-e, valamint mikor és milyen módon; a mű közléséig tart."},{"t":"Szerzőség elismeréséhez való jog","d":"A szerző bármikor megkövetelheti szerzőségének elismerését, és ellenállhat a szerzői minőségét megkérdőjelező cselekedeteknek.
