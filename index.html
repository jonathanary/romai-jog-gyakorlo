ptias (házasság előtti ajándékozás): az ajándékozás szabályai alá esik","Donatio propter nuptias: ajándék, amelyet a férj ígér a feleségnek a házasság megszűnése esetére"]}],"terms":[{"t":"matrimonium, nuptiae","d":"házasság – a férfi és nő egész életre szóló, isteni és emberi jog szerinti közössége"},{"t":"manus","d":"férji hatalom"},{"t":"capitis deminutio minima","d":"a feleség státuszváltozása, amikor manusos házasságban a férj hatalma alá kerül"},{"t":"sponsalia","d":"eljegyzés – formátlan kölcsönös ígéret, jogi igény nélkül a házasságkötésre"},{"t":"arrha sponsalicia","d":"eljegyzési foglaló – az indok nélkül visszalépő elveszíti"},{"t":"conubium","d":"római házasságkötési képesség"},{"t":"matrimonium legitimum","d":"civiljogi házasság két conubiummal rendelkező római polgár között"},{"t":"confarreatio","d":"manusos házasságkötés 10 tanúval, ünnepélyes formulákkal, szertartással"},{"t":"coemptio","d":"manusos házasságkötés mancipatióval végbemenő (színleges) vételi szerződéssel"},{"t":"matrimonium non legitimum","d":"idegenek nem elismert házassága (pl. peregrinusok között)"},{"t":"concubinatus","d":"ágyasság – a születő gyermekkel kapcsolatos jogokkal, öröklési szabályozással"},{"t":"contubernium","d":"rabszolgák életközössége"},{"t":"furiosus","d":"elmebeteg – abszolút házassági akadály alatt áll"},{"t":"eunuchus","d":"kasztrált – abszolút házassági akadály alatt áll"},{"t":"mors","d":"halál – a házasság megszűnésének egyik esete"},{"t":"dos","d":"hozomány – a házasság terheinek megkönnyítésére a nő (családja) által adott vagyon"},{"t":"dos profecticia","d":"a nő apja által adott hozomány"},{"t":"dos adventicia","d":"az önjogú nő által adott hozomány"},{"t":"dos recepticia","d":"stipulatióval biztosított hozomány – a praetor peresíthetővé tette a visszakövetelést"},{"t":"retentio","d":"a férj visszatartási joga a hozományból (gyermekenként, a nő kötelezettségszegése esetén)"},{"t":"donatio ante nuptias","d":"házasság előtti ajándékozás – az ajándékozás szabályai alá esik"},{"t":"donatio propter nuptias","d":"a férj által a feleségnek a házasság megszűnése esetére ígért ajándék"}],"drills":[{"q":"Sorold fel a manusos házasság megkötésének formáit!","a":["confarreatio (10 tanú, ünnepélyes formulák, szertartás)","coemptio (mancipatióval végbemenő színleges vételi szerződés)"]},{"q":"Sorold fel a manus nélküli házasság külső jeleit!","a":["a nő bevezetése a férj házába","censor előtti eskü","hozományi okirat"]},{"q":"Sorold fel az abszolút házassági akadályokat!","a":["serdületlen","rabszolga","elmebeteg (furiosus)","már érvényes házasságban élő","kasztrált (eunuchus)"]},{"q":"Sorold fel a relatív házassági akadályokat!","a":["vérrokonság","örökbefogadott egyenes ágon","sógorság (egyenes ágon korlátlan, oldalágon a testvér volt házastársa)","gyám a gyámoltjával","gondnok a gondnokolttal","speciális római tilalmak (pl. senator + libertinus)"]},{"q":"Sorold fel a házasság megszűnésének eseteit!","a":["egyik fél halála (mors)","capitis deminutio maxima vagy media","válás (közös akarat vagy egyoldalú nyilatkozat)","a manus megszüntetése (jogos okból)"]},{"q":"Sorold fel a hozomány fajtáit és lehetséges tárgyait!","a":["dos profecticia (a nő apja adja)","dos adventicia (az önjogú nő adja)","tárgya: tulajdonjog","tárgya: haszonélvezet","tárgya: követelés"]}]},{"num":23,"title":"A gyámság és a gondnokság","essay":[{"prompt":"Fejtsd ki a gyámság (tutela) fogalmát és a serdületlenek gyámságának szabályait!","keyPoints":["A gyámság az önjogú, de kora vagy neme miatt cselekvőképességében korlátozott, vagy ilyen képességgel egyáltalán nem bíró személyeknél e képesség pótlására irányuló intézmény","Korábbi rendeltetése a vagyonegység fenntartása, később a gyámolt érdekeinek védelme","A tutela impuberum létrejötte: végrendelettel (tutela testamentaria), törvény alapján (tutela legitima) vagy hatósági (praetori) kirendeléssel (tutela dativa)","Megszűnése: a gyám vagy gyámolt halála (mors), capitis deminutiója, a gyám kérésére adott felmentés, vagy a gyám büntetésből való elmozdítása","A gyám feladata elsősorban a vagyonkezelés","Tendencia: egyre több korlát – végül a gyámolt ingatlanának elidegenítése tilos, értékes ingóságoké csak hatósági engedéllyel lehetséges","Infans helyett a gyám teszi meg a jognyilatkozatokat","Pupillus esetén a gyám alakszerű hozzájárulása kell a jognyilatkozatokhoz (auctoritas tutoris)","A gyámságnál közvetlen képviselet érvényesül","A törvényes gyám kötelezettsége: praetor előtti stipulatio a vagyonbiztosítás érdekében","A gyám egész vagyonán egyetemes jelzálog áll fenn a gyámolt javára","Nők gyámsága (tutela mulierum): minden önjogú nő gyámság alatt áll, kivéve a Vesta-szüzeket","A nők gyámsága háromféleképpen jön létre (mint a serdületleneké); később a nő szabadon választhat gyámot","A nőknél csak a jelentősebb ügyleteknél kell a gyám hozzájárulása"]},{"prompt":"Mutasd be a gondnokság (cura) fogalmát, a gyámságtól való különbségeit és fajtáit!","keyPoints":["Gondnokság alá kerül az, aki ügyeinek önálló vitelére egészen vagy részben képtelen, és nem áll apai hatalom vagy gyámság alatt","Különbség: a gondnokot kérésre vagy hivatalból (praetor) rendelik ki; a végrendelet csak javaslat","Különbség: szükség esetén a gondnokolt személyi felügyelete is a gondnok feladata","Különbség: csak alakszerűtlen jóváhagyás (consensus curatoris) kell, amely utólagos is lehet","Különbség: a gyámság tartós, a gondnokság eseti jellegű","Cselekvőképes férfi gondnokoltnál a curator hatásköre korlátozott","Gondnokság akár teljesen cselekvőképes személynek is rendelhető (gyámság nem)","Fajtái: elmebeteg gondnoksága (cura furiosi), tékozlók feletti gondnokság (cura prodigi)","Fajtái: 25 évnél fiatalabbak gondnoksága (cura minorum), távollévő gondnoksága (cura absentis)","Fajtái: serdületlenek és nők gondnoksága (cura adiuncta), nyugvó hagyaték (hereditas iacens) gondnoksága","Fajtái: méhmagzat gondnoksága (cura ventris), testileg fogyatékos személy gondnoksága (cura debilium personarum)"]}],"terms":[{"t":"tutela","d":"gyámság – az önjogú, de cselekvőképességében korlátozott vagy cselekvőképtelen személy képességének pótlására szolgáló intézmény"},{"t":"tutela impuberum","d":"serdületlenek gyámsága"},{"t":"tutela testamentaria","d":"végrendelettel létrejövő gyámság"},{"t":"tutela legitima","d":"törvény alapján létrejövő gyámság"},{"t":"tutela dativa","d":"hatósági (praetori) kirendeléssel létrejövő gyámság"},{"t":"auctoritas tutoris","d":"a gyám alakszerű hozzájárulása a pupillus jognyilatkozataihoz"},{"t":"tutela mulierum","d":"nők gyámsága – minden önjogú nőre kiterjed, kivéve a Vesta-szüzeket"},{"t":"cura","d":"gondnokság – azoknak, akik ügyeik önálló vitelére képtelenek, és nem állnak apai hatalom vagy gyámság alatt"},{"t":"consensus curatoris","d":"a gondnok alakszerűtlen (akár utólagos) jóváhagyása"},{"t":"cura furiosi","d":"elmebeteg gondnoksága"},{"t":"cura prodigi","d":"tékozlók feletti gondnokság"},{"t":"cura minorum","d":"25 évnél fiatalabbak gondnoksága"},{"t":"cura absentis","d":"távollévő gondnoksága"},{"t":"cura adiuncta","d":"serdületlenek és nők gondnoksága"},{"t":"hereditas iacens","d":"nyugvó hagyaték – gondnokság alá kerülhet"},{"t":"cura ventris","d":"méhmagzat gondnoksága"},{"t":"cura debilium personarum","d":"testileg fogyatékos személy gondnoksága"}],"drills":[{"q":"Sorold fel a serdületlenek gyámsága létrejöttének módjait!","a":["végrendelet (tutela testamentaria)","törvény alapján (tutela legitima)","hatósági (praetori) kirendelés (tutela dativa)"]},{"q":"Sorold fel a gyámság megszűnésének eseteit!","a":["gyám vagy gyámolt halála (mors)","gyám vagy gyámolt capitis deminutiója","gyám kérésére felmentés","gyám büntetésből való elmozdítása"]},{"q":"Sorold fel a gondnokság fajtáit!","a":["cura furiosi (elmebeteg)","cura prodigi (tékozló)","cura minorum (25 évnél fiatalabb)","cura absentis (távollévő)","cura adiuncta (serdületlenek és nők)","hereditas iacens (nyugvó hagyaték) gondnoksága","cura ventris (méhmagzat)","cura debilium personarum (testileg fogyatékos)"]},{"q":"Sorold fel a gyámság és a gondnokság közti különbségeket!","a":["kirendelés kérésre vagy hivatalból (végrendelet csak javaslat)","szükség esetén a gondnokolt személyi felügyelete is","csak alakszerűtlen jóváhagyás (consensus curatoris) kell, akár utólag","gyámság tartós, gondnokság eseti jellegű","cselekvőképes férfinál a curator hatásköre korlátozott","gondnokság teljesen cselekvőképes személynek is rendelhető"]}]},{"num":24,"title":"A római személyi és családjog továbbélése","essay":[{"prompt":"Foglald össze, mit tartalmaz a vázlat a római személyi és családjog továbbéléséről!","keyPoints":["A személyi és családjog továbbélését a vázlat nem fejti ki, hanem a tankönyvre utal (265–269. oldal)","Ez a fejezet zárja a személyi és családjogi részt","Ezt követi a IV. rész: a dologi jog, amelynek I. szakasza az általános tanokkal foglalkozik"]}],"terms":[],"drills":[]},{"num":25,"title":"A dolgok általában","essay":[{"prompt":"Fejtsd ki a dolog, a vagyon és a dologi jog fogalmát!","keyPoints":["A dolog (res) leggyakrabban olyan önálló testi tárgy, amelyen tulajdon állhat fenn (kivétel: res incorporales)","Nem dolog az alkatrész, mert a kapcsolat folytán elveszíti önállóságát","Nem dolog a dologösszesség, mert a közfelfogás szerint dolgok csoportja","Nem dolog a nem emberi uralom alá hajtható tárgy (pl. bolygók) és a szabad ember teste","A vagyon egy személy dolgainak összessége (ingó és ingatlan)","A familia pecuniaque a jogi vagyon: patrimonium (az apától származó vagyon) és bona (javak)","Jogi értelemben a vagyon a valakit megillető, pénzben kifejezhető jogok és kötelezettségek összessége","Aktív vagyon: a jogosultságok; passzív vagyon: a kötelezettségek","Egyéb vagyonkategóriák: különvagyon (peculium) és a felleltározott örökség az örökös vagyonán belül","A dologi jog az in rem actióval védett jogok köre","Saját dolgokra vonatkozó jog (ius in re sua): a tulajdon","Más dolgán fennálló, idegen dologbeli jogok (iura in re aliena): szolgalom, zálogjog, örökhaszonbérlet, felülépítményi jog"]},{"prompt":"Mutasd be a dolgok osztályozását a forgalomképesség és az isteni-emberi jog szempontjából!","keyPoints":["Res in patrimonio – res extra patrimonium: magánvagyonba tartozó, illetve azon kívül eső dolgok","Res in commercio – res extra commercium: forgalomképes (eladható), illetve forgalmon kívüli (eladása tiltott) dolgok","A res divini iuris körébe tartozik a szent dolog (res sacra): az égi isteneknek szánt, felszentelt dolgok","Ide tartozik a temetkezési hely (res religiosa): emberi holttestet tartalmazó sír","Ide tartozik a sérthetetlen dolog (res sanctae): a város falai és kapui","A res humani iuris körébe tartozik a közdolog (res publicae): a római állam és a városok tulajdonában álló dolgok (pl. közföld, folyók)","Ide tartozik a magándolog (res privata): minden, ami nem közdolog (lehet uratlan is)","Res communes omnium: mindenkit megillető dolgok (pl. levegő, folyóvíz, tenger)","Res nullius: senki dolgai, azaz uratlan dolgok (pl. vadak, madarak)"]},{"prompt":"Ismertesd a dolgok további osztályozási szempontjait (testiség, átruházás, természetük szerint)!","keyPoints":["Res corporales – res incorporales: testi (érzékelhető), illetve testetlen (pénzben kifejezhető) dolgok","Res mancipi: mancipatióval vagy in iure cessióval átruházható dolgok; res nec mancipi: puszta átadással (traditio) átruházhatók","A res mancipi köre (ősi, ünnepélyes tulajdonátruházás): itáliai földön fekvő telek, szimpla telki szolgalmak (út, gyalogút, vízvezetés), rabszolgák, Itáliában honos igavonó négylábúak (pl. marha)","Res immobiles – res mobiles: ingatlanok (telek és az azzal összefüggő dolgok), illetve ingóságok (minden más)","Később az ingó dolgokból kiváltak a mozgó dolgok (res moventes)","Res consumptibiles: elhasználható dolgok (pl. gabona)","Res fungibiles: helyettesíthető dolgok (pl. bor, gabona) – az ügyletben mennyiségben szerepelnek, míg a telek vagy a ló egységként","Res divisibiles – res indivisibiles: osztható és oszthatatlan dolgok","Res simplex: természeténél fogva egy, egységes dolog (pl. fa)","Res composita: részekből (alkatrészekből), több egyszerű dologból tevődik össze (pl. ház)","Universitas rerum: dologösszesség – több, egymáshoz hasonló dolog, adott fajta egyedei (pl. könyvtár)","Instrumentum: felszerelés – az összetett dolog és a dologösszesség közti kategória","Pertinentia: tartozék – a fődolog szolgálatára hivatott dolgok (pl. szekér mint fődolog, pótkerék mint tartozék)"]}],"terms":[{"t":"res","d":"dolog – leggyakrabban önálló testi tárgy, amelyen tulajdon állhat fenn"},{"t":"familia pecuniaque","d":"a jogi vagyon: patrimonium és bona"},{"t":"patrimonium","d":"az apától származó vagyon"},{"t":"bona","d":"javak"},{"t":"peculium","d":"különvagyon"},{"t":"ius in re sua","d":"saját dolgokra vonatkozó jog: a tulajdon"},{"t":"iura in re aliena","d":"más dolgán fennálló, idegen dologbeli jogok (szolgalom, zálogjog, örökhaszonbérlet, felülépítményi jog)"},{"t":"res in patrimonio","d":"magánvagyonba tartozó dolgok"},{"t":"res extra patrimonium","d":"magánvagyonon kívül eső dolgok"},{"t":"res in commercio","d":"forgalomképes (eladható) dolgok"},{"t":"res extra commercium","d":"forgalmon kívüli dolgok (eladásuk tiltott)"},{"t":"res divini iuris","d":"isteni jog alá tartozó dolgok (res sacra, res religiosa, res sanctae)"},{"t":"res humani iuris","d":"emberi jog alá tartozó dolgok (res publicae, res privata)"},{"t":"res sacra","d":"szent dolog – égi isteneknek szánt, felszentelt dolgok"},{"t":"res religiosa","d":"temetkezési hely – emberi holttestet tartalmazó sír"},{"t":"res sanctae","d":"sérthetetlen dolgok – a város falai, kapui"},{"t":"res publicae","d":"közdolgok – a római állam és a városok tulajdonában álló dolgok (pl. közföld, folyók)"},{"t":"res privata","d":"magándolog – minden, ami nem közdolog (lehet uratlan)"},{"t":"res communes omnium","d":"mindenkit megillető dolgok (pl. levegő, folyóvíz, tenger)"},{"t":"res nullius","d":"senki dolgai, uratlan dolgok (pl. vadak, madarak)"},{"t":"res corporales","d":"testi dolgok – érzékelni lehet őket"},{"t":"res incorporales","d":"testetlen dolgok – pénzben kifejezhetők"},{"t":"res mancipi","d":"mancipatióval vagy in iure cessióval átruházható dolgok (ősi, ünnepélyes tulajdonátruházás)"},{"t":"res nec mancipi","d":"puszta átadással (traditio) átruházható dolgok"},{"t":"traditio","d":"puszta átadás mint tulajdonátruházási mód"},{"t":"res immobiles","d":"ingatlanok – telek és azzal összefüggő dolgok"},{"t":"res mobiles","d":"ingóságok – minden, ami nem ingatlan"},{"t":"res moventes","d":"mozgó dolgok – később váltak ki az ingó dolgok közül"},{"t":"res consumptibiles","d":"elhasználható dolgok (pl. gabona)"},{"t":"res fungibiles","d":"helyettesíthető dolgok (pl. bor, gabona) – az ügyletben mennyiségben szerepelnek"},{"t":"res divisibiles","d":"osztható dolgok"},{"t":"res indivisibiles","d":"oszthatatlan dolgok"},{"t":"res simplex","d":"egyszerű dolog – természeténél fogva egy, egységes (pl. fa)"},{"t":"res composita","d":"összetett dolog – több egyszerű dologból, alkatrészekből áll (pl. ház)"},{"t":"universitas rerum","d":"dologösszesség – több, egymáshoz hasonló dolog, adott fajta egyedei (pl. könyvtár)"},{"t":"instrumentum","d":"felszerelés – az összetett dolog és a dologösszesség közti kategória"},{"t":"pertinentia","d":"tartozék – a fődolog szolgálatára hivatott dolog (pl. pótkerék a szekérhez)"}],"drills":[{"q":"Sorold fel, mi nem minősül dolognak!","a":["alkatrész (önállóságát elveszti)","dologösszesség (dolgok csoportja)","nem emberi uralom alá hajtható tárgy (pl. bolygók)","szabad ember teste"]},{"q":"Sorold fel a res divini iuris fajtáit!","a":["szent dolog (res sacra)","temetkezési hely (res religiosa)","sérthetetlen dolog (res sanctae)"]},{"q":"Sorold fel a res humani iuris fajtáit!","a":["közdolog (res publicae)","magándolog (res privata)"]},{"q":"Sorold fel a res mancipi körébe tartozó dolgokat!","a":["itáliai földön fekvő telek","szimpla telki szolgalmak (út, gyalogút, vízvezetés)","rabszolgák","Itáliában honos, igavonó négylábúak (pl. marha)"]},{"q":"Sorold fel az idegen dologbeli jogokat (iura in re aliena)!","a":["szolgalom","zálogjog","örökhaszonbérlet","felülépítményi jog"]},{"q":"Sorold fel a dolgok szerkezet szerinti hármas felosztását!","a":["egyszerű dolog (res simplex)","összetett dolog (res composita)","dologösszesség (universitas rerum)"]}]},{"num":26,"title":"A tulajdon (proprietas)","essay":[{"prompt":"Fejtsd ki a tulajdon jelentőségét és a római tulajdon történeti fejlődését, kitérve a tulajdon megjelöléseire és formáira!","keyPoints":["A tulajdon a legalapvetőbb intézmény minden társadalomban","A tulajdon szabályozása tükör az adott kor társadalmi viszonyairól","Kialakulása idején egyetlen dolog feletti jog, amely a birtoktól nem válik el, és a részjogosultságokat (pl. a későbbi haszonélvezetet) is tartalmazza","Először az ingókon jelent meg (a kézzelvaló megragadás szüksége miatt)","Az ingatlan kezdetben nemzetségi tulajdonban állt","Ezt követte a családi (házközösségi), majd a családfői tulajdon kialakulása","Az ősi tulajdonnak nincs külön neve; a tulajdonos megjelölése: dominus","A dominium (tulajdon) elnevezés későn jelenik meg; a principátus korában használják először a tulajdonra a proprietas kifejezést","A civiljogi (kviritár) tulajdon (dominium ex iure Quiritium) három kritériuma: alanya, tárgya, szerzésmódja","Alanya commerciummal bíró, önjogú személy; egyes dolgok felett nem állhat tulajdon; a szerzésmódok ius civile és ius gentium szerint csoportosíthatók","Kezdetben egyetlen forma volt (civiljogi tulajdon), a preklasszikus korban tulajdonszerű helyzetek jelentek meg: praetori (bonitár) tulajdon, tartományi telek (fundus provincialis), peregrinusok tulajdona (dominium ex iure gentium)","A posztklasszikus és iustinianusi korban a tartományi telek és a peregrinustulajdon különállása megszűnt, az idegen dologbeli jogok korlátozódtak"]},{"prompt":"Fejtsd ki a római tulajdon fogalmát és tartalmát (pozitív és negatív oldal)!","keyPoints":["Első meghatározás: a tulajdon egy dolog feletti teljes hatalom, amelynél fogva a magáéban mindenki megteheti mindazt, amivel nem zavar másokat","A tulajdon mindig dolgokra (és rabszolgákra) vonatkozik","A teljes hatalom a tulajdonost bizonyos korlátok között illeti meg","Második meghatározás: a tulajdon dologi jog, amelynél fogva a tulajdonos a dologra bárki jogosulatlan behatását kizárhatja","A kizárólagosság a nem tulajdonosokkal szemben áll fenn","Összességében a tulajdon a legtágabb, legteljesebb alanyi magánjog","Pozitív oldal: a tulajdonos használhatja a dolgát (ius utendi)","Gyümölcsöztetheti a dolgát (ius fruendi)","Rendelkezhet a dolgával (ius disponendi): elidegenítési jog, megterhelési jog stb.","Bírhatja a dolgot (habere): beleszámít a vagyonába, zavartalanul magánál tarthatja","Birtokolhatja a dolgot (ius possidendi): civilis possessorként birtokvédelem és in rem védelem illeti","Negatív oldal: védelemre való jogosultság (in rem védelem)"]},{"prompt":"Ismertesd a tulajdon korlátait!","keyPoints":["Alapvetés: a tulajdon elvben korlátlan, valójában mégsem az","Másokra tekintettel kell lenni; érvényesül a joggal való visszaélés tilalma","Közérdeket védő törvények: városon belül hamvasztani tilos, a sírhoz vezető út és a folyóparti telek korlátai","Elidegenítési és terhelési tilalmak (pl. a férj hozományként kapott telke, per alatt álló dolog)","Az elidegenítési tilalom alapja lehet törvény, hatósági intézkedés vagy jogügylet","Elkobzás és kisajátítás: mellékbüntetésként, illetve kártérítés gyanánt, közérdekből","A zavartalan együttélés érdekében fellépő korlátok: szomszédjogok (iura vicinitatis)","Szomszédjogi példák: házak építési távolsága, természetes fény szüksége, átlógó fák és áthulló gyümölcsök, telekváltoztatás más kára nélkül, egyes esetekben köteles tűrés","Törvényi szolgalmak (servitutes legales)"]},{"prompt":"Mutasd be a tulajdonközösséget (condominium) és a növedékjogot (ius adcrescendi)!","keyPoints":["Condominium: az egy dolgon fennálló egyetlen tulajdonjog egyszerre több személyt illet meg","Nem a dolog osztott, hanem a tulajdonjog","Előd: a consortium (ercto non cito), amikor a pater familias halála után az önjogúvá válók nem osztják fel a közös vagyont","A consortium tagja a több tulajdonos ellenére az egész dologgal rendelkezett","Alapelv: egy dolgon csak egy tulajdonjog állhat fenn","A tulajdonostársak a tulajdonjogot osztatlanul (pro indiviso), részeik arányában (pro parte) bírják","Eszmei (intellectu) hányaduk van, amely külsőleg nem mutatkozik meg; saját részükön szabadon rendelkeznek","Ius prohibendi (tiltakozási jog): az egész dolgot érintő rendelkezések csak az összes tag beleegyezésével érvényesek; később a többség akarata érvényesül","A tulajdonközösség felbontásának eszköze: actio communi dividundo","A bíró megszüntethette a közösséget: fizikai felosztással vagy licitációval (a rész nélkül maradt tag pénzt kap)","A bíró fenn is tarthatta a közösséget: dologrész bérbeadása a másik tulajdonostársnak, bizonyos mértékű/idejű használat előírása","Növedékjog (ius adcrescendi): a tulajdonos megszerez egy olyan eszmei hányadot vagy tulajdonjogi részjogosultságot, amely addig mást illetett meg"]}],"terms":[{"t":"proprietas","d":"tulajdon (a principátus korától a tulajdonra használt kifejezés)"},{"t":"dominus","d":"tulajdonos"},{"t":"dominium","d":"tulajdon (későn megjelenő megjelölés)"},{"t":"dominium ex iure Quiritium","d":"civiljogi (kviritár) tulajdon"},{"t":"fundus provincialis","d":"tartományi telek"},{"t":"dominium ex iure gentium","d":"a peregrinusok tulajdona"},{"t":"ius utendi","d":"a dolog használatának joga"},{"t":"ius fruendi","d":"a dolog gyümölcsöztetésének joga"},{"t":"ius disponendi","d":"rendelkezési jog (elidegenítési jog, megterhelési jog stb.)"},{"t":"habere","d":"a dolog bírása: beleszámít a vagyonba, zavartalanul magánál tarthatja"},{"t":"ius possidendi","d":"a dolog birtoklásának joga"},{"t":"civilis possessor","d":"birtokvédelemben és in rem védelemben részesülő birtokos"},{"t":"iura vicinitatis","d":"szomszédjogok (a zavartalan együttélés érdekében fellépő tulajdoni korlátok)"},{"t":"servitutes legales","d":"törvényi szolgalmak"},{"t":"condominium","d":"tulajdonközösség: egy dolgon fennálló egy tulajdonjog több személyt illet"},{"t":"consortium (ercto non cito)","d":"a tulajdonközösség elődje: a pater familias halála után fel nem osztott közös vagyon"},{"t":"pro indiviso","d":"osztatlanul (így bírják a tulajdonostársak a tulajdonjogot)"},{"t":"pro parte","d":"részeik arányában"},{"t":"ius prohibendi","d":"tiltakozási jog: a szabad rendelkezés akadálya tulajdonközösség esetén"},{"t":"actio communi dividundo","d":"a tulajdonközösség felbontására irányuló kereset"},{"t":"ius adcrescendi","d":"növedékjog: addig mást megillető eszmei hányad vagy részjogosultság megszerzése"}],"drills":[{"q":"Sorold fel a civiljogi (kviritár) tulajdon három kritériumát!","a":["alanya (commerciummal bíró, önjogú személy)","tárgya (egyes dolgok felett nem állhat tulajdon)","szerzésmód (ius civile és ius gentium szerinti csoportosítás)"]},{"q":"Sorold fel a civiljogi tulajdon mellett a preklasszikus kortól megjelenő egyéb tulajdoni formákat!","a":["praetori (bonitár) tulajdon","tartományi telek (fundus provincialis)","peregrinusok tulajdona (dominium ex iure gentium)"]},{"q":"Sorold fel a tulajdon pozitív oldalának részjogosultságait!","a":["ius utendi (használat)","ius fruendi (gyümölcsöztetés)","ius disponendi (rendelkezés)","habere (a dolog bírása)","ius possidendi (birtoklás)"]},{"q":"Sorold fel a római tulajdon kialakulásának szakaszait!","a":["egyetlen dolog feletti, birtoktól el nem váló jog (részjogosultságokkal együtt)","első megjelenés az ingókon","ingatlan kezdetben nemzetségi tulajdonban","családi (házközösségi) tulajdon","családfői tulajdon"]},{"q":"Sorold fel, min alapulhat az elidegenítési tilalom!","a":["törvény","hatósági intézkedés","jogügylet"]},{"q":"Sorold fel a bíró lehetőségeit az actio communi dividundo során!","a":["közösség megszüntetése fizikai felosztással","közösség megszüntetése licitációval (pénz a rész nélkül maradt tagnak)","közösség fenntartása a dologrész bérbeadásával a másik tulajdonostársnak","közösség fenntartása bizonyos mértékű/idejű használat előírásával"]},{"q":"Sorolj fel példákat a szomszédjogi (iura vicinitatis) korlátokra!","a":["házak építési távolsága","természetes fény szüksége","átlógó fák és áthulló gyümölcsök","telekváltoztatás más kára nélkül","néhány esetben köteles tűrés"]}]},{"num":27,"title":"A birtok (possessio)","essay":[{"prompt":"Fejtsd ki a birtok fogalmát és fajtáit!","keyPoints":["A birtok az a tény, állapot, amikor valakinek fizikai értelemben hatalmában van egy dolog","Tulajdon: enyém-e a dolog? – birtok: nálam van-e a dolog?","A birtoklásban nincs utódlás","A birtok jogi tény; a tényéhez fűződő joghatások összefoglaló neve: birtokjog (ius possessionis)","Possessio naturalis: tényleges birtokos (birlaló) – possessio civilis: szűkebb értelemben vett birtok, amelyhez jogi következmények és birtokjog járul","Civilis possessor (egyes meghatározás szerint: tulajdonosi akarattal birtokló): dominus, jóhiszemű birtokos (bonae fidei possessor), rosszhiszemű birtokos (malae fidei possessor), örökhaszonbérlő (emphyteuta), záloghitelező (creditor pigneraticius), szívességi használó (precarista), a vitás dolog letéteményese (sequester)","Possessio iusta – iniusta: jogos és jogellenes birtok; a birtokos tudatától független, objektív fogalmak","Possessio vitiosa – nec vitiosa: hibás és hibátlan birtok; a hiba (vitium): vi (erőszak), clam (alattom), precario (szívességi használatra kapott dolog vissza nem adása)","A hibás birtok nem azonos a jogellenes birtokkal: tévedésből elvett dolog jogellenes, de hibátlan birtok; a tulajdonos önsegélye jogos, de hibás birtok","A hibás birtokost is megilleti a birtokvédelem","Possessio bonae fidei – malae fidei: jóhiszemű és rosszhiszemű birtoklás, szubjektív minősítés","Possessio ad usucapionem – ad reliquas causas: elbirtokláshoz vezető, illetve egyéb jogkövetkezménnyel járó birtoklás","A birtok tényéhez kapcsolódó fő joghatások: birtokvédelem és tulajdonkeletkeztető hatás","Egyéb következmények: a birtokos kedvező alperesi helyzete a tulajdonjogi perben (a felperest bizonyítási kényszer terheli, sikertelenség esetén a birtokosé a dolog), valamint a birtokos köteles a dolgot felmutatni"]},{"prompt":"Mutasd be a birtok megszerzését: a birtok elemeit, alanyait és a birtokszerzés módjait!","keyPoints":["A birtok elemei: corpus (a birtok ténylegessége, testi ráhatás) és animus (birtoklási szándék)","Először a dolog megszerzésének testileg kell megvalósulnia (corpore); a communis opinio szerint nem kell kézbe venni, elegendő a testi ráhatás","Jogbirtok: jog gyakorlása a corpore","A naturalis possessio alanya megfelelő értelmi képességű (cselekvőképes), a civilis possessio alanya jogok szerzésére képes (jogképes)","Birtokszerzés önhatalmúlag (megengedett vagy jogellenes, tilos; másoktól nem függ) vagy mások közreműködésével (traditio)","Traditio: a testi dolog tényleges, valóságos, kézről kézre való átadása és átvétele, amelyhez akaratmegegyezés kell","Longa manu traditio (rámutatással történő átadás): ingatlannál elegendő a helyszínen kinyilvánítani a birtoklási szándékot – a dolog jelen van, megtekintés (~corpore) + akarat","Quasi traditio (mintegy átadás): nincs közvetlen kézről kézre adás (pl. a tulajdonos engedi földjén a bányászást, a kibányászott kincs birtokosa a bányász)","Traditio symbolica (jelképes átadás): az egész dolog birtokának megszerzése az egész egy részének átadásával (pl. a borospince kulcsa; a római jogban csak a pincében tárolt dolgokra, nem a pincére)","Brevi manu traditio (puszta megállapodás): a birtokszerző eredetileg is naturalis possessor (pl. a bérlő megveszi a bérleményt, nem kell elhagynia)","Constitutum possessorium: a civilis possessorból puszta megállapodással naturalis possessor lesz, tényleges átadás nélkül (pl. valaki eladja a telkét, de haszonélvező marad)","További birtokszerzési tényállások: addictio, missio in possessionem (praetori beavatkozás)"]},{"prompt":"Ismertesd a birtok megszűnésének eseteit!","keyPoints":["Corpus és animus együttes megszűnése: elhagyás (derelictio) – valaki már nem akar birtokolni, és a szándék külsőleg is megjelenik","A corpus és az animus ideiglenes megszűnése nem szünteti meg a birtoklást","Lemondás (traditio): az illető birtoka megszűnik, és más birtokot szerez (őrült nem szerezhet, de az átadó birtoka akkor is megszűnik)","A derelictióval szemben a traditio meghatározott céllal, rendeltetéssel történik","Corpus megszűnése: a birtok attól függetlenül megszűnik, hogy a ráhatás véletlenül vagy más tevékenysége miatt szűnt meg","Kivétel: ha a dolgot így szokás használni (pl. a hegyen lévő ház télen megközelíthetetlen), a birtok nem szűnik meg","Animus megszűnése: a birtoklás tény, puszta akarattal nehezen szüntethető meg, Rómában mégis megszűnik, ha nincs akarat","Kivétel: megtébolyodás esetén a birtok nem szűnik meg (a furiosus birtokot nem szerezhet, de a meglévők megmaradnak)","Az alany miatt: a birtokos halála (mors), capitis deminutio; a birtoklásban nincs utódlás","A tárgy miatt: a dolog elenyészik, megváltoztatják (gyapjúból szövetet szőnek), vagy forgalmon kívülivé válik"]},{"prompt":"Fejtsd ki a birtok védelmét: a posszesszórius és petitórius védelmet, a birtokvédelem indokait és a birtokinterdiktumokat!","keyPoints":["A birtokos (civilis possessor) pusztán azért kap védelmet, mert birtokol: a tény szükséges, nem a jogosultság","A birtokvédelem tényvédelem, nem jogvédelem – látszatvédelem","Posszesszórius védelem: a birtok megvédése anélkül, hogy keresnék az erre való jogosultságot; preventív, előzetes eljárás","Petitórius védelem: in rem actióval érvényesíthető jogvédelem; utólagos, a jogkérdés eldöntésével a birtok sorsa véglegesen eldől; nem a birtokvédelem fajtája","A birtokvédelem indokai: tisztázza, kit illet a kedvező alperesi pozíció; a birtokvédelemből következik a tulajdonvédelem; a közbiztonság és a közrend fenntartása","A birtokinterdiktumok csoportjai: a birtok megszerzésével kapcsolatosak (ezek nem a birtok védelmét szolgálják), a birtok megtartásával kapcsolatosak, a birtok visszaszerzését szolgálók","Interdictum uti possidetis: ingatlanok birtokvédelme; a kibocsátáskor hibátlan birtokos kap jogvédelmet (a jogellenesség nem számít)","Interdictum utrubi: ingóságok birtokvédelme; az kap védelmet, aki a kibocsátástól visszaszámított 1 évben hosszabb ideig birtokolt hibátlanul; az elődök hibátlan birtoklása is beleszámít","Interdictum unde vi: ingatlanok birtokának visszaszerzése, 1 éven belül vehető igénybe; fegyveres erőszak esetén bármeddig (interdictum unde vi armata)","A családtag vagy rabszolga által kivetett pater familias erőszakkal visszaveheti a birtokot (fegyveresen nem, az tilos)","Interdictum de precario: a dolog visszaszerzése a szívességi használótól","Interdictum de clandestina possessione: a clam elvesztett birtok visszaszerzése (nem jellemző, beleolvadt az interdictum unde vi-be)"]}],"terms":[{"t":"possessio","d":"birtok: az a tény, állapot, amikor a dolog valakinek fizikai hatalmában van"},{"t":"ius possessionis","d":"birtokjog: a birtok tényéhez fűződő joghatások összessége"},{"t":"possessio naturalis","d":"tényleges birtok (a birlaló magánál tartja a dolgot)"},{"t":"possessio civilis","d":"szűkebb értelemben vett birtok, amelyhez jogi következmények és birtokjog járul"},{"t":"bonae fidei possessor","d":"jóhiszemű birtokos: tulajdonosnak hitte magát"},{"t":"malae fidei possessor","d":"rosszhiszemű birtokos: tudta, hogy nem tulajdonos, de úgy viselkedett"},{"t":"emphyteuta","d":"örökhaszonbérlő"},{"t":"creditor pigneraticius","d":"záloghitelező"},{"t":"precarista","d":"szívességi használó"},{"t":"sequester","d":"a vitás dolog letéteményese"},{"t":"possessio iusta","d":"jogos birtok (objektív fogalom)"},{"t":"possessio iniusta","d":"jogellenes birtok (objektív fogalom)"},{"t":"possessio vitiosa","d":"hibás birtok"},{"t":"possessio nec vitiosa","d":"hibátlan birtok"},{"t":"vitium","d":"birtokhiba: vi, clam, precario"},{"t":"vi","d":"erőszakkal (birtokhiba)"},{"t":"clam","d":"alattomban (birtokhiba)"},{"t":"precario","d":"a szívességi használatra kapott dolog vissza nem adása (birtokhiba)"},{"t":"possessio bonae fidei","d":"jóhiszemű birtoklás (szubjektív minősítés)"},{"t":"possessio malae fidei","d":"rosszhiszemű birtoklás (szubjektív minősítés)"},{"t":"possessio ad usucapionem","d":"elbirtokláshoz (usucapio) vezető birtoklás"},{"t":"possessio ad reliquas causas","d":"egyéb jogkövetkezménnyel járó birtoklás"},{"t":"corpus","d":"a birtok ténylegessége: testi ráhatás a dologra"},{"t":"animus","d":"birtoklási szándék"},{"t":"traditio","d":"átadás: a testi dolog tényleges, kézről kézre való átadása-átvétele akaratmegegyezéssel"},{"t":"longa manu traditio","d":"rámutatással történő átadás: ingatlannál a helyszínen kinyilvánított birtoklási szándék elegendő"},{"t":"quasi traditio","d":"mintegy átadás: nincs közvetlen kézről kézre adás"},{"t":"traditio symbolica","d":"jelképes átadás: az egész dolog birtokának megszerzése egy részének átadásával (pl. pincekulcs)"},{"t":"brevi manu traditio","d":"puszta megállapodással történő birtokszerzés, ha a szerző eredetileg is naturalis possessor"},{"t":"constitutum possessorium","d":"a civilis possessor puszta megállapodással naturalis possessorrá válik, tényleges átadás nélkül"},{"t":"addictio","d":"birtokszerzési tényállás (odaítélés)"},{"t":"missio in possessionem","d":"birtokbautalás praetori beavatkozással"},{"t":"derelictio","d":"elhagyás: a birtokos már nem akar birtokolni, és e szándék külsőleg is megjelenik"},{"t":"furiosus","d":"őrült: birtokot nem szerezhet, de a meglévő birtokai megmaradnak"},{"t":"mors","d":"a birtokos halála (a birtok megszűnésének oka az alany miatt)"},{"t":"capitis deminutio","d":"a birtok alany miatti megszűnésének oka a birtokos halála mellett"},{"t":"interdictum uti possidetis","d":"ingatlanok birtokvédelmét szolgáló, birtok megtartásával kapcsolatos interdictum"},{"t":"interdictum utrubi","d":"ingóságok birtokvédelme: a visszaszámított 1 évben hosszabb ideig hibátlanul birtoklót védi"},{"t":"interdictum unde vi","d":"ingatlan birtokának visszaszerzése, 1 éven belül igénybe vehető"},{"t":"interdictum unde vi armata","d":"fegyveres erőszakkal elvett ingatlanbirtok visszaszerzése, időbeli korlát nélkül"},{"t":"interdictum de precario","d":"a dolog visszaszerzése a szívességi használótól"},{"t":"interdictum de clandestina possessione","d":"a clam (alattomban) elvesztett birtok visszaszerzése; beleolvadt az interdictum unde vi-be"}],"drills":[{"q":"Sorold fel, kik minősülnek civilis possessornak a római jogban!","a":["tulajdonos (dominus)","jóhiszemű birtokos (bonae fidei possessor)","rosszhiszemű birtokos (malae fidei possessor)","örökhaszonbérlő (emphyteuta)","záloghitelező (creditor pigneraticius)","szívességi használó (precarista)","a vitás dolog letéteményese (sequester)"]},{"q":"Sorold fel a birtok elemeit!","a":["corpus (a birtok ténylegessége, testi ráhatás)","animus (birtoklási szándék)"]},{"q":"Sorold fel a birtokhibák (vitium) eseteit!","a":["vi (erőszak)","clam (alattom)","precario (szívességi használatra kapott dolog vissza nem adása)"]},{"q":"Sorold fel a traditio különleges, könnyített formáit!","a":["longa manu traditio (rámutatással történő átadás)","quasi traditio (mintegy átadás)","traditio symbolica (jelképes átadás)","brevi manu traditio (puszta megállapodás)","constitutum possessorium"]},{"q":"Sorold fel a birtok megszűnésének esetköreit!","a":["corpus és animus együttes megszűnése (derelictio, traditio)","corpus megszűnése","animus megszűnése","megszűnés az alany miatt (mors, capitis deminutio)","megszűnés a tárgy miatt (elenyészés, megváltoztatás, forgalmon kívülivé válás)"]},{"q":"Sorold fel a birtokinterdiktumok csoportjait!","a":["a birtok megszerzésével kapcsolatos interdictumok (nem a birtok védelmét szolgálják)","a birtok megtartásával kapcsolatos interdictumok","a birtok visszaszerzését szolgáló interdictumok"]},{"q":"Sorold fel a birtok megtartásával kapcsolatos interdictumokat!","a":["interdictum uti possidetis (ingatlanok birtokvédelme)","interdictum utrubi (ingóságok birtokvédelme)"]},{"q":"Sorold fel a birtok visszaszerzését szolgáló interdictumokat!","a":["interdictum unde vi (ingatlan, 1 éven belül; fegyveres erőszaknál: interdictum unde vi armata)","interdictum de precario (visszaszerzés a szívességi használótól)","interdictum de clandestina possessione (clam elvesztett birtok)"]}]},{"num":28,"title":"A tulajdon megszerzése","essay":[{"prompt":"Fejtsd ki a tulajdonszerzési módok fogalmát és felosztásait!","keyPoints":["A tulajdonszerzési módok (modi acquirendi dominii) olyan, a törvény által taxatíve meghatározott jogi tények, tényállások, amelyekhez a jogrend a tulajdonszerzés joghatását fűzi","Ius civile szerinti módok: mancipatio, in iure cessio, elbirtoklás (usucapio)","Ius gentium szerinti módok: átadás (traditio), foglalás (occupatio), kincstalálás (thesauri inventio), dologegyesülés, gyümölcsszerzés (fructuum perceptio), feldolgozás (specificatio)","Gaius felosztása: singularis successio (egyes dolgok megszerzése) – universalis successio (több dolog, vagyontömeg megszerzése)","Eredeti szerzés (acquisitio originaria): más jogától függetlenül keletkező új tulajdonjog","Származékos szerzés (acquisitio derivativa): a tulajdonjog mástól származik (van jogelőd); érvényesül a nemo plus iuris szabály","Jogcím (causa/titulus): az a jogi cél, amelynek érdekében a jogalanyok valamilyen jogi tényt véghezvisznek","Jogcím kell: elbirtoklás, traditio; eleve van jogcím: a ius gentiumba tartozó szerzésmódok (a traditio kivételével); nincs jogcím (kauzátlan, absztrakt): mancipatio, in iure cessio","Tulajdonszerzés a törvény erejénél fogva (ex lege): capitis deminutio (annak, aki előidézte), uratlan hagyaték, parlagon hagyott földek megművelése, önbíráskodó hitelező dolgának megszerzése","Hatósági vagy bírói intézkedésen alapuló szerzés: in iure eljáráson belüli praetori addictio, állami árverési addictio, állami telek kiutalása, litis aestimatio megfizetése, bűncselekmény miatt elkobzott vagyon fiscusra háramlása"]},{"prompt":"Mutasd be a ius civile szerinti tulajdonszerzési módokat: a mancipatiót, az in iure cessiót és az elbirtoklást (usucapio)!","keyPoints":["Mancipatio: az egyik legősibb, ius strictum szerinti ünnepélyes ügylet, a mancipális hatalom megszerzésének aktusa (res mancipi és személyek feletti hatalom megszerzése)","A mancipatio jelképes ceremónia, jelképes adásvétel; később egyéb ügyleti célokra is használták (pl. ajándékozás, zálogszerződés)","A mancipatio kauzátlan, absztrakt jellegű: a tulajdonszerzés mindenképpen megtörténik, ha az átadó tulajdonos","In iure cessio: nehézkes, ősi ügylet – színleges rei vindicatio, fiktív tulajdonjogi perindítás","Előzetes megállapodás a tulajdonátruházásról: az új tulajdonos perli a régit, a régi nem ellenkezik, és a dolgot a felperesnek ítélik (addictio)","Az in iure cessio bármilyen dologra, jogra, vagyontömegre alkalmazható; absztrakt jogügylet, független a valós causától","Usucapio: ha valaki egy dolgot a törvény által meghatározott ideig, bizonyos feltételekkel folyamatosan birtokol, tulajdont szerez","Archaikus jog – két fő eset, amelyet az elbirtoklás orvosol: formai hiba (res mancipi átruházása traditióval mancipatio/in iure cessio helyett) és tartalmi hiba (nem tulajdonostól szerzés – nemo plus iuris)","Elbirtoklási idő az archaikus jogban: ingatlanok (fundus) 2 év, egyéb dolgok (ceterae res: ingók, manus, hagyaték) 1 év; usurpatio: a birtoklás megszakad, utána csak új elbirtoklás kezdődhet","Klasszikus jogi feltételek: elbirtoklásra alkalmas dolog (res habilis), idő (tempus: 1 ill. 2 év), elbirtokláshoz vezető birtoklás (possessio), jóhiszeműség (bona fides), megfelelő jogcím (iustus titulus)","A jóhiszeműségnél az elbirtoklás kezdetének pillanata számít (szubjektív elem); a iustus titulus objektív elem (szerződés, ajándékozás, hozományba adás stb.); a vélt (putatív) jogcím korábban nem, később alkalmas elbirtoklásra","Jogutódlás: az elhunyt utáni birtokló folytatja a megkezdett birtoklást","Praescriptio longi temporis (kifogás): a 10 vagy 20 évig megművelt tartományi ingatlan birtokosát védi (aszerint, hogy a felek egy tartományban élnek-e); az elbirtoklás eredetileg csak civiljogi tulajdon tárgyára alkalmas, később a tartományi telekre is","Iustinianusi jog: ingó dolgokra 3 év zavartalan birtoklás; praescriptio longissimi temporis: a jóhiszemű, 30 vagy 40 évig birtokló tulajdont szerez (lopott dologra is, titulus nem kell)"]},{"prompt":"Fejtsd ki a tulajdontraditio, a foglalás (occupatio) és a kincstalálás (thesauri inventio) szabályait!","keyPoints":["Tulajdontraditio: a birtoktraditio olyan esete, amikor nemcsak a birtok (civilis possessio), hanem a tulajdonjog is átszáll","Tárgya csak res nec mancipi és csak res corporalis lehet","Megfelelő jogcím (causa/titulus) kell; szerződő felek esetén a jogcímnek egyeznie kell","Az átadónak magának is tulajdonosnak kell lennie: származékos szerzés (kivétel: zálogjogi alapú traditio)","További feltételek: az átvevő vagyonjogi képessége (ius commercii) és forgalomképes dolog","Később a felek akaratának szerepe nő: adásvételnél csak akkor száll át a tulajdon, ha a vételárat kifizették vagy hitelből biztosították","Occupatio: uratlan dolog birtokba vétele tulajdonszerzési céllal","Okkupálható uratlan dolgok: vadállatok, tengerpart (Iustinianus szerint a part nem lehet tulajdon), elhagyott dolgok (res derelicta)","Res derelicta csak akkor okkupálható, ha az előző tulajdonos szándékosan lemondott a dolog tulajdonáról","Kincs: régen elrejtett értékes dolog, amelyre már nem emlékeznek, így nincs tulajdonosa; ingatlanban (földben) elrejtett dolog","A saját telken talált kincs a telek tulajdonosáé; az idegen telken talált kincs felerészben a megtalálóé, felerészben a telek tulajdonosáé","A kincstalálás és a foglalás különbségei: kincsnél nem kell birtokba vétel, elég a megtalálás; a kincs nem szükségszerűen a találóé; kincs csak értékes dolog lehet; infans is találhat kincset és szerezhet vele tulajdont (okkupálni nem tud)"]},{"prompt":"Ismertesd a dologegyesülés eseteit és jogkövetkezményeit!","keyPoints":["Dologegyesülés: különböző személyek tulajdonában álló dolgok emberi tevékenység vagy egyéb tények folytán olyan szoros fizikai kapcsolatba kerülnek, hogy egyetlen, egységes dologgá válnak","Gyenge egyesülés: szétválasztható, ideiglenes – erős egyesülés: nem szétválasztható, tartós","Járulékos egyesülés (accessio): a fődolog túlsúlyban van, beolvasztja a másik dolgot; a kérdés, melyik dolog van a másikért – a lényegesebb dolog tulajdonjoga a fontosabb","Accessio cedat principali: a járulékos dolog osztja a fődolog sorsát","Actio ad exhibendum: kereset a gyenge egyesülés szétválasztására (visszaállítás)","Erős egyesülés esetén a főtulajdonos kártérítésre kötelezhető","Építés (inaedificatio): beépítés (saját telek, idegen anyaggal dolgozás) – ráépítés (idegen telek, saját anyag)","Minden, ami beépítésre kerül, osztja a telek sorsát, pénzbeli kártérítés mellett","Archaikus jog: beépítésnél a beépített anyag kétszerese jár; ráépítésnél visszatartási jog (retentio), rosszhiszeműnél elviteli jog","Iustinianusi jog: beépítésnél a beépített anyag lebontható, kibontható; ráépítésnél a rosszhiszeműt elviteli jog illeti","Folyókkal kapcsolatos accessiók: a folyó res publica, a folyóparton korlátokkal fennállhat tulajdon","Egyenrangú dolgok egyesülése: összekeverés (confusio: egynemű/különböző folyadékok, pl. bor + méz), összeolvasztás (conflatio: egynemű/különböző fémek, pl. arany + ezüst); ha szétválasztható: kereset, ha szétválaszthatatlan: közös tulajdon","Commixtio: különböző személyek tulajdonában álló dolgok összekeverése (pl. gabonaszemek, téglák); kereset a teljes egész megfelelő hányadának bíró általi kiadására; a pénz összekeveredése speciális eset"]},{"prompt":"Fejtsd ki a gyümölcsszerzés (fructuum perceptio) és a feldolgozás (specificatio) szabályait!","keyPoints":["Gyümölcs (fructus): azok a szaporulatok, amelyek egy termő dologból (anyadolog) időszakonként, természetes úton, az anyadolog sérelme nélkül jönnek létre (a rabszolga gyermeke nem gyümölcs)","Gyümölcsök továbbá az anyadolog fogyásával, sérelmével létrejövő időszaki hozamok (erdőből kivágott fa, ércbányászat), valamint a jogszabály által kimondott gyümölcsök (emberi munkaerő, vadászat)","Megkülönböztetés: fructus naturales – fructus civiles","Függő gyümölcs (pendens): még nem önálló dolog, az anyadolog sorsát osztja – remélt dolog","Elvált gyümölcs (separatus): természetes elválás vagy mesterséges elválasztás; önálló dolog, nem osztja az anyadolog sorsát","Beszedett gyümölcs (perceptus): a jogosult által birtokba vett gyümölcs (a birtokba vétel is számít)","Gyümölcsszerzés módjai: tulajdonos, örökhaszonbérlő és jóhiszemű birtokos elválással; haszonélvező beszedéssel; haszonbérlő és a függő gyümölcs vevője az anyadolog tulajdonosának akaratából, mintegy átadással (quasi traditio)","Gyümölcsmegjelölések a per szerint: meglévő (perindításkor még létezik), elfogyasztott (perindításkor már nincs meg), beszedni elmulasztott (az alperes elmulasztotta beszedni, illetve az alperes vétkessége miatt létre nem jövő gyümölcsök)","Specificatio: más tulajdonában álló ingó dolog emberi munkával történő olyan átalakítása, amelynek révén új dolog jön létre","Klasszikus kori nézetek: anyag nélkül az új dolog nem jött volna létre, ezért az anyagtulajdonosé – illetve az új dolog a feldolgozásig nem létezett, ezért a feldolgozó okkupálja","Iustinianusi megoldás: ha visszaállítható, az anyagtulajdonosé (szobor visszaolvasztható érctömbbé); ha nem visszaállítható, a feldolgozóé (a bor nem lesz újra szőlő); saját és idegen anyag vegyítésekor a feldolgozóé","Kártérítés: a feldolgozót visszatartási jog illeti (a kártérítésig nem kell kiadnia a dolgot); lopás esetén az anyag, illetve a kár perelhető"]}],"terms":[{"t":"modi acquirendi dominii","d":"tulajdonszerzési módok: törvény által taxatíve meghatározott jogi tények, amelyekhez tulajdonszerzés joghatása fűződik"},{"t":"mancipatio","d":"ősi, ünnepélyes, kauzátlan-absztrakt ügylet a mancipális hatalom (res mancipi, személyek feletti hatalom) megszerzésére"},{"t":"in iure cessio","d":"színleges rei vindicatión alapuló, fiktív tulajdonjogi perrel történő absztrakt tulajdonátruházás"},{"t":"usucapio","d":"elbirtoklás: tulajdonszerzés a törvényben meghatározott ideig tartó folyamatos birtoklással"},{"t":"traditio","d":"átadás: ius gentium szerinti, jogcímet igénylő tulajdonszerzési mód"},{"t":"occupatio","d":"foglalás: uratlan dolog birtokba vétele tulajdonszerzési céllal"},{"t":"thesauri inventio","d":"kincstalálás"},{"t":"fructuum perceptio","d":"gyümölcsszerzés"},{"t":"specificatio","d":"feldolgozás: idegen ingó dolog emberi munkával való átalakítása új dologgá"},{"t":"singularis successio","d":"egyes dolgok megszerzése"},{"t":"universalis successio","d":"több dolog, vagyontömeg megszerzése"},{"t":"acquisitio originaria","d":"eredeti szerzésmód: más jogától függetlenül keletkező új tulajdonjog"},{"t":"acquisitio derivativa","d":"származékos szerzésmód: a tulajdonjog mástól (jogelődtől) származik"},{"t":"nemo plus iuris","d":"szabály a származékos szerzésnél: nem tulajdonostól nem lehet tulajdont szerezni"},{"t":"causa / titulus","d":"jogcím: az a jogi cél, amelynek érdekében a jogalanyok valamilyen jogi tényt véghezvisznek"},{"t":"iustus titulus","d":"megfelelő jogcím, jogalap: az elbirtoklás objektív feltétele"},{"t":"ex lege","d":"a törvény erejénél fogva történő tulajdonszerzés"},{"t":"res mancipi","d":"mancipatióval vagy in iure cessióval átruházandó dolgok"},{"t":"res nec mancipi","d":"a tulajdontraditióval átruházható dolgok köre"},{"t":"res corporalis","d":"testi dolog (csak ez lehet a tulajdontraditio tárgya)"},{"t":"rei vindicatio","d":"tulajdonjogi per; színleges formája az in iure cessio alapja"},{"t":"addictio","d":"a dolog odaítélése (az in iure cessióban a bíró a felperesnek ítéli a dolgot)"},{"t":"usurpatio","d":"az elbirtoklási birtoklás megszakadása (utána csak új elbirtoklás kezdődhet)"},{"t":"res habilis","d":"elbirtoklásra alkalmas dolog"},{"t":"tempus","d":"elbirtoklási idő (1, illetve 2 év)"},{"t":"bona fides","d":"jóhiszeműség: az elbirtoklás szubjektív eleme, a kezdet pillanata számít"},{"t":"fundus","d":"ingatlan, telek (archaikus elbirtoklási ideje 2 év)"},{"t":"ceterae res","d":"egyéb dolgok (ingók, manus, hagyaték): archaikus elbirtoklási idejük 1 év"},{"t":"praescriptio longi temporis","d":"kifogás a 10 vagy 20 évig megművelt tartományi ingatlan birtokosa javára"},{"t":"praescriptio longissimi temporis","d":"a jóhiszemű, 30 vagy 40 évig birtokló tulajdont szerez (lopott dologra is, titulus nélkül)"},{"t":"ius commercii","d":"vagyonjogi képesség (a traditióval szerző átvevő feltétele)"},{"t":"res derelicta","d":"elhagyott dolog, amelynek tulajdonáról az előző tulajdonos szándékosan lemondott"},{"t":"infans","d":"gyermekkorú: kincstalálással tulajdont szerezhet, de okkupálni nem tud"},{"t":"accessio","d":"járulékos dologegyesülés: a túlsúlyban lévő fődolog beolvasztja a másik dolgot"},{"t":"accessio cedat principali","d":"a járulékos dolog osztja a fődolog sorsát"},{"t":"actio ad exhibendum","d":"kereset a gyenge egyesülés szétválasztására (visszaállítás)"},{"t":"inaedificatio","d":"építés: beépítés (saját telek, idegen anyag) és ráépítés (idegen telek, saját anyag)"},{"t":"retentio","d":"visszatartási jog (pl. a ráépítőé, illetve a feldolgozóé a kártérítésig)"},{"t":"confusio","d":"összekeverés: egynemű vagy különböző folyadékok egyesülése (pl. bor + méz)"},{"t":"conflatio","d":"összeolvasztás: egynemű vagy különböző fémek egyesülése (pl. arany + ezüst)"},{"t":"commixtio","d":"különböző személyek tulajdonában álló dolgok összekeverése (pl. gabonaszemek, téglák)"},{"t":"res publica","d":"közdolog (a folyó res publica, a folyóparton korlátokkal állhat fenn tulajdon)"},{"t":"fructus","d":"gyümölcs: a termő dologból (anyadolog) időszakonként, sérelme nélkül létrejövő szaporulat"},{"t":"fructus naturales","d":"természetes gyümölcsök"},{"t":"fructus civiles","d":"jogszabály által gyümölcsnek kimondott hozamok (pl. emberi munkaerő, vadászat)"},{"t":"fructus pendens","d":"függő gyümölcs: még nem önálló dolog, az anyadolog sorsát osztja (remélt dolog)"},{"t":"fructus separatus","d":"elvált gyümölcs: önálló dolog, nem osztja az anyadolog sorsát"},{"t":"fructus perceptus","d":"beszedett gyümölcs: a jogosult által birtokba vett gyümölcs"},{"t":"quasi traditio","d":"mintegy átadás: a haszonbérlő és a függő gyümölcs vevője így szerez gyümölcsöt a tulajdonos akaratából"},{"t":"litis aestimatio","d":"perbeli becsérték, amelynek megfizetése hatósági-bírói alapú tulajdonszerzést eredményez"},{"t":"fiscus","d":"államkincstár (a bűncselekmény miatt elkobzott vagyon rá háramlik)"}],"drills":[{"q":"Sorold fel a ius civile szerinti tulajdonszerzési módokat!","a":["mancipatio","in iure cessio","elbirtoklás (usucapio)"]},{"q":"Sorold fel a ius gentium szerinti tulajdonszerzési módokat!","a":["átadás (traditio)","foglalás (occupatio)","kincstalálás (thesauri inventio)","dologegyesülés","gyümölcsszerzés (fructuum perceptio)","feldolgozás (specificatio)"]},{"q":"Sorold fel az elbirtoklás feltételeit a klasszikus jogban!","a":["elbirtoklásra alkalmas dolog (res habilis)","idő (tempus: 1, ill. 2 év)","elbirtokláshoz vezető birtoklás (possessio)","jóhiszeműség (bona fides)","megfelelő jogcím (iustus titulus)"]},{"q":"Sorold fel az elbirtoklási időket az archaikus jogban!","a":["ingatlanok (fundus): 2 év","egyéb dolgok (ceterae res: ingók, manus, hagyaték): 1 év"]},{"q":"Sorold fel a tulajdontraditio feltételeit!","a":["csak res nec mancipi","csak res corporalis","megfelelő jogcím (causa/titulus), szerződő feleknél egyező","az átadó maga is tulajdonos (származékos szerzés; kivétel: zálogjogi alapú traditio)","az átvevő vagyonjogi képessége (ius commercii)","forgalomképes dolog"]},{"q":"Sorold fel az okkupálható (uratlan) dolgokat!","a":["vadállatok","tengerpart (Iustinianus: a part nem lehet tulajdon)","elhagyott dolgok (res derelicta)"]},{"q":"Sorold fel a gyümölcs fajtáit a tulajdonszerzés szempontjából!","a":["függő (pendens)","elvált (separatus)","beszedett (perceptus)"]},{"q":"Sorold fel az egyenrangú dolgok egyesülésének eseteit!","a":["összekeverés (confusio: folyadékok)","összeolvasztás (conflatio: fémek)","commixtio (szilárd dolgok, pl. gabonaszemek, téglák összekeverése)"]}]},{"num":29,"title":"A tulajdon megszűnése","essay":[{"prompt":"Fejtsd ki, milyen módokon szűnhet meg a tulajdon!","keyPoints":["A tulajdon megszűnik a tulajdonos halálával; fennállása általában nem köthető feltételhez (conditio) vagy időhatározáshoz (dies)","Megszűnés más tulajdonszerzése folytán a tulajdonos akaratából: tulajdonátruházás","Megszűnés más tulajdonszerzése folytán a tulajdonos akaratától függetlenül vagy akarata ellenére: egyéb tulajdonszerzési esetek","Megszűnés új tulajdon keletkezése nélkül a tulajdonos akaratából: derelictio","Speciális traditio: át akarták ruházni a tulajdont, de az átvevő hiba miatt (pl. őrült) nem szerzett tulajdont"]}],"terms":[{"t":"conditio","d":"feltétel – a tulajdon fennállása általában nem köthető hozzá"},{"t":"dies","d":"időhatározás – a tulajdon fennállása általában nem köthető hozzá"},{"t":"derelictio","d":"a tulajdon megszűnése a tulajdonos akaratából, új tulajdon keletkezése nélkül (a dologgal való felhagyás)"},{"t":"traditio","d":"tulajdonátruházás átadással; speciális esetben az átvevő hiba miatt (pl. őrült) nem szerez tulajdont"}],"drills":[{"q":"Sorold fel a tulajdon megszűnésének fő esetköreit!","a":["megszűnés általában (a tulajdonos halála)","megszűnés más tulajdonszerzése folytán","megszűnés új tulajdon keletkezése nélkül"]},{"q":"Sorold fel, hogyan szűnhet meg a tulajdon más tulajdonszerzése folytán!","a":["a tulajdonos akaratából: tulajdonátruházás","a tulajdonos akaratától függetlenül / akarata ellenére: egyéb tulajdonszerzési esetek"]}]},{"num":30,"title":"A tulajdon védelme","essay":[{"prompt":"Fejtsd ki a rei vindicatio fogalmát, formuláit, a bizonyítás szabályait és a passzív legitimáció kiterjesztését!","keyPoints":["A tulajdonvédelem a fennálló tulajdonjog jogellenes zavarása esetén lép működésbe","A rei vindicatio in rem actio, a legfontosabb tulajdonvédelmi eszköz","A dolog birtokából kiesett civiljogi tulajdonos keresete a dolgot ténylegesen birtokló civilis possessor ellen","Aktív legitimáció: a felperesi perindítás joga; passzív legitimáció: ki perelhető alperesként","Legis actio sacramento in rem: mindkét félnek azt kell állítania, hogy tulajdonos (kontravindikáció)","Formuláris per: a felperes állítja, hogy tulajdonos, az alperes tagadja","A felperes két dolgot bizonyít: ő a tulajdonos, és a dolog az alperesnél van","Származékos szerzésnél nehéz a felperes helyzete (a mástól szerzés nem bizonyíték – nemo plus iuris); az elbirtoklás segítség","Eredeti szerzésnél egyszerűbb a bizonyítás","A dolog létezése fontos: ha létezik, in rem védelem; ha megsemmisült, in personam actio","Ha a birtokhelyzet is vitás: birtokinterdiktumok, majd később petitórius (tulajdonjogi) per","Actio ad exhibendum: in personam actio ingók esetén az alperes kötelezésére a dolog felmutatására","Az alperes eredetileg csak a birtokló civilis possessor lehetett, később a birtokközvetítő detentor is","Nem birtokló alperes ellen két esetben indítható: dolo desiit possidere (rosszhiszeműen túladott a dolgon) és liti se obtulit (más helyett vállalta az alperesi szerepet)"]},{"prompt":"Fejtsd ki az alperesi magatartásokat a rei vindicatio in iure szakaszában, a beruházások szabályait és az alperes marasztalását!","keyPoints":["Elismerés (confessus): a dolog átengedése (cessio rei)","A birtokközvetítő detentor (naturalis possessor) elődmegnevezéssel szabadul a perből","Jogra hivatkozás: a birtok elvesztésének jogos megtagadása (pl. zálog)","Beruházásokra hivatkozás: az alperes a felperes dolgát módosította","Tagadás: nem kedvező helyzet az alperesnek","A beruházások (impensae) fajtái: szükséges (a dolog e nélkül elpusztulna/rongálódna), hasznos (a dolgot jobbá teszi), fényűző (díszítés, hasznot nem növel)","Szükséges beruházás: jóhiszemű és rosszhiszemű beruházó is a teljes költség megtérítését követelheti (kivéve a tolvaj)","Hasznos beruházás: jóhiszemű a tényleges gazdagodás értékét követelheti (visszatartási joggal); rosszhiszeműt elviteli jog illeti, ha a beruházás szétválasztható, de a felperes felajánlhatja a kifizetését","Fényűző beruházás: jóhiszeműt és rosszhiszeműt is csak elviteli jog illeti","Természetbeni (in natura) teljesítés: a dolog visszaadása minden időközbeni gyarapodásával; az alperesnek olyan helyzetbe kell hoznia a felperest, mintha a teljesítés a litis contestatio pillanatában megtörtént volna","Litis contestatio előtt okozott károkért csak a tolvaj felel, szándékos károkozásért a rosszhiszemű is; az elvált gyümölcsökön a jóhiszemű birtokos tulajdont szerez, de a meglévőket ki kell adnia; a rosszhiszemű gondatlanság esetén felel","Litis contestatio után a jóhiszemű vétkesség esetén felel; a rosszhiszemű minden kárért, vis maiorért is felel, a gyümölcsöket köteles kiadni, értéküket megtéríteni","Ha az alperes vonakodik (dolus) kiadni a dolgot: a felperes becslő esküje után pénzbeli marasztalás; a litis aestimatio becslő eljárás célja a közvetett kényszer","Ha az alperes neki felróható okból nem tudja kiadni a dolgot: kártérítési felelősség"]},{"prompt":"Fejtsd ki a bonitár tulajdonos védelmét (actio Publiciana)!","keyPoints":["Az elbirtoklás megkezdése nem keletkeztet egyből tulajdont: elméletileg függő jogi helyzet","A tényleges helyzet (jogi látszat) szerint az elbirtokló olyan, mintha tulajdonos lenne, ezért az elbirtoklási helyzet erősebb védelme szükséges","Az actio Publiciana ficticia in rem actio: a praetor nem jogbeli, hanem ténybeli fikciót alkalmaz","A ából kiesett civiljogi tulajdonos in rem keresete a dolgot ténylegesen birtokló ellen"},{"t":"in rem actio","d":"dologi kereset – a legfontosabb tulajdonvédelem ilyen"},{"t":"in personam actio","d":"személy elleni kereset – pl. ha a dolog megsemmisült"},{"t":"legis actio sacramento in rem","d":"ősi eljárás, amelyben mindkét fél tulajdonosnak állítja magát (kontravindikáció)"},{"t":"nemo plus iuris","d":"elv, amely szerint a mástól való szerzés nem bizonyítja a tulajdont (senki nem adhat át több jogot, mint amije van)"},{"t":"actio ad exhibendum","d":"in personam kereset ingóknál az alperes kötelezésére a dolog felmutatására"},{"t":"civilis possessor","d":"a dolgot ténylegesen birtokló személy, a rei vindicatio eredeti alperese"},{"t":"dolo desiit possidere","d":"az alperes rosszhiszeműen túladott a dolgon, hogy ne találják meg nála"},{"t":"liti se obtulit","d":"az alperes más helyett vállalta az alperesi szerepet a perben (úgy tekintették, mintha nála lenne a dolog)"},{"t":"confessus","d":"a felperes követelését elismerő alperes"},{"t":"cessio rei","d":"a dolog átengedése az alperes elismerése esetén"},{"t":"detentor","d":"birtokközvetítő (naturalis possessor), elődmegnevezéssel szabadul a perből"},{"t":"naturalis possessor","d":"a birtokközvetítő detentor másik elnevezése"},{"t":"impensae","d":"beruházások – fajtái: szükséges, hasznos, fényűző"},{"t":"in natura","d":"természetbeni teljesítés: a dolog és minden időközbeni gyarapodása kiadása"},{"t":"litis contestatio","d":"perbebocsátkozás – a marasztalásnál e pillanat helyzete az irányadó"},{"t":"litis aestimatio","d":"becslő eljárás, célja a közvetett kényszer a dolog kiadására"},{"t":"vis maior","d":"erőhatalom – a rosszhiszemű birtokos a litis contestatio után ezért is felel"},{"t":"actio Publiciana","d":"a bonitár tulajdonos (elbirtokló) védelmére szolgáló ficticia in rem actio"},{"t":"ficticia in rem actio","d":"ténybeli fikciót alkalmazó dologi kereset (mintha az elbirtoklási idő letelt volna)"},{"t":"bona fi ejtsd ki az örökhaszonbérlet (emphyteusis) fogalmát, főbb szabályait, valamint a tulajdonos és az örökhaszonbérlő viszonyát!","keyPoints":["Mezőgazdasági ingatlan örök időkre való bérbeadása évi bér fizetése ellenében","Eredetileg megmunkálatlan föld használatára adott örökös jog","Az örökhaszonbérlő használhatja, gyümölcsöztetheti a földet és rendelkezhet vele (jogának megterhelése, elidegenítés, átörökítés)","Korlát: nem rosszabbíthatja a földet","Köteles a földet megművelni és termőképességét legalább szinten tartani","A károkat és az adókat ő viseli","Civilis possessor, in rem védelem illeti meg","A halál nem szünteti meg: végrendelet nélkül is az örökösé","Az örökhaszonbérlő évi bért fizet; bizonyos kötelezettségek elmulasztásakor a tulajdonos egyoldalúan megszüntetheti","Elidegenítés esetén a tulajdonost elővásárlási jog illeti; ha nem él vele, az eladásból 2% illeti"]}],"terms":[{"t":"emphyteusis","d":"örökhaszonbérlet – mezőgazdasági ingatlan örök időkre való bérbeadása évi bér fizetése ellenében"},{"t":"civilis possessor","d":"az örökhaszonbérlő birtokjogi minősége, amelyhez in rem védelem társul"}],"drills":[{"q":"Sorold fel az örökhaszonbérlő jogosultságait!","a":["használat","gyümölcsöztetés","rendelkezés (jogának megterhelése, elidegenítés, átörökítés)"]},{"q":"Sorold fel az örökhaszonbérlő kötelezettségeit!","a":["a föld megművelése és termőképességének legalább szinten tartása","nem rosszabbíthatja a földet","a károk és adók viselése","évi bér fizetése a tulajdonosnak"]}]},{"num":33,"title":"Felülépítményi jog (superficies)","essay":[{"prompt":"Fejtsd ki a felülépítményi jog (superficies) lényegét!","keyPoints":["Más telkén emelt építményen fennálló jogosultság, bérleti vagy egyéb causa alapján","A tulajdonjogot megközelítően széleskörű jogosultság, amely in rem védelmet élvez","Hosszú ideig áll fenn („örökre” / 100 év), de legfeljebb az építmény megsemmisüléséig","A jogosítottakat, illetve jogutódaikat illeti meg","A jogosult általában éves bért fizet a föld tulajdonosának"]}],"terms":[{"t":"superficies","d":"felülépítményi jog – más telkén emelt építményen fennálló, a tulajdonjogot megközelítően széleskörű, in rem védelmet élvező jogosultság"},{"t":"causa","d":"jogcím (pl. bérlet), amelynek alapján a felülépítményi jog fennáll"}],"drills":[]},{"num":34,"title":"Zálogjog","essay":[{"prompt":"Fejtsd ki a zálogjog célját és funkcióját!","keyPoints":["A zálogjog célja egy kötelem dologi biztosítása","A kötelem személyi biztosítéka ezzel szemben a kezesség","A záloghitelezőt in rem védelem illeti meg","A zálogjog járulékos jog","Részletes szabályai a kötelmi jognál kerülnek kifejtésre"]}],"terms":[{"t":"in rem védelem","d":"dologi hatályú védelem, amely a záloghitelezőt megilleti"}],"drills":[{"q":"Sorold fel a kötelem biztosítékainak fajtáit!","a":["dologi biztosíték: zálogjog","személyi biztosíték: kezesség"]}]},{"num":35,"title":"A római dologi jog továbbélése","essay":[{"prompt":"Fejtsd ki, mit tartalmaz a vázlat a római dologi jog továbbéléséről és a segédanyagról!","keyPoints":["A dologi jog továbbélését a tankönyv tárgyalja (271–377. oldal)","Segédanyag: 1. ábra – familia proprio iure; 2. ábra – cognatio és agnatio","Az agnatio-ábra feltételezi, hogy az agnát rokonságba tartozó lányok már manusos házasságot kötöttek, emancipálták vagy örökbe adták őket","A filia familias addig nem kerül ki az agnát rokonságból, amíg a fentiek egyike be nem következik"]}],"terms":[{"t":"familia proprio iure","d":"saját jogú familia – a segédanyag 1. ábrájának témája"},{"t":"cognatio","d":"cognát rokonság – a segédanyag 2. ábrájának témája az agnatióval együtt"},{"t":"agnatio","d":"agnát rokonság – a lányok manusos házassággal, emancipatióval vagy örökbeadással kerülnek ki belőle"},{"t":"filia familias","d":"családlány – addig marad az agnát rokonságban, amíg manusos házasság, emancipatio vagy örökbeadás be nem következik"}],"drills":[{"q":"Sorold fel, milyen események folytán kerül ki egy lány az agnát rokonságból!","a":["manusos házasságkötés","emancipatio","örökbeadás"]}]},{"num":101,"title":"A szerzői jog fejlődéstörténete","essay":[{"prompt":"Fejtsd ki a szellemi alkotások védelmének gyökereit az őskortól a könyvnyomtatás elterjedéséig!","keyPoints":["Az alkotó tevékenység egykorú az emberrel; a legrégebbi ismert barlangrajz kb. 73 000 éves, egy afrikai barlangból","Az ókorban és középkorban (Homérosz, építészeti stílusok, egyiptomi szobrok) az alkotók csak társadalmi megbecsülésre és erkölcsi elismerésre számíthattak, jogi oltalomra nem","A római jog csak a kéziratok eredeti példányainak tulajdonosait védte, a mű szellemi értékét nem","A szerzői jogvédelem megszületéséhez technikai feltétel (gyors sokszorosítás) és gazdasági-társadalmi konjunktúra (műkereskedelem) kellett","A szerzői jog 0. pontja Gutenberg nyomdagépe; 1455-ben nyomtatta ki elsőként a 42 soros latin Bibliát","A találmány forradalmasította a könyvkiadást (szétszedhető, metszett betűkészlet, szedőráma), és a német vándor nyomdászok révén futótűzként terjedt Európában","Első nyomdák: Oxford kb. 1468, Velence és Párizs 1469, Magyarországon Hunyadi Mátyás 1473","A 15–16. századi könyvkiadás fő központjai: Velence, Párizs, Lyon, Antwerpen, Lipcse, Köln","A könyvkereskedelem sikeréhez hozzájárult a reneszánsz eszmei váltása: a teocentrizmust emberközpontú világnézetek váltották fel, az ókori irodalom (és a római jog) felelevenítésével","A könyvnyomtatás társadalmi-gazdasági megerősödése kikényszerítette a jogi szabályozást"]},{"prompt":"Mutasd be a privilégiumok (monopóliumok) rendszerét mint a szellemi alkotások védelmének korai eszközét!","keyPoints":["A könyvnyomtatás elterjedését követő két évszázadban a védelem fő eszközei a privilégiumok (monopóliumok) voltak","Kezdetben generálprivilégiumok: egy adott területen kizárólagos és általános nyomtatási jogot biztosítottak","Később árnyaltabb fajták: csak bizonyos művekre, szerzők munkáira, nyelvekre vagy betűkészletekre korlátozott kizárólagosság","Az első privilégiumot Velence Köztársasága állította ki Johannes von Speyer nyomdásznak: 5 évre kizárólagos nyomtatási jog Velence teljes területére","Franciaországban a 16. században, XIII. Lajos idején jelentek meg az első privilégiumok (Szent Pál levelei, Szent Bruno művei)","Angliában a 16. század elején inkább könyvimport folyt; VIII. Henrik 1534-ben hatálytalanította az importot engedélyező rendeletet, ekkor jelent meg a royal prerogative printing patent","A rendszer fennmaradását két érdek találkozása tette lehetővé: a kiadók-nyomdászok kereskedelmi és az uralkodók politikai (cenzúra-) érdeke","A nyomda működtetése kockázatos befektetés volt, amelyet a nem szankcionált, olcsó utánnyomások tovább súlyosbítottak","Franciaországban a 16–17. században a nyomtatáshoz az Egyetem és a Teológiai Kar előzetes jóváhagyása kellett (tartalmi ellenőrzés)","Angliában a special licence (külön engedély) volt a mű közzétételének előfeltétele","A Stationers' Company (könyvkereskedők céhe) hivatalos jegyzéket vezetett a nyomtatási engedélyekről, ellenőrizte és szankcionálta a jogosulatlan nyomdászokat, korlátozva a kalózkiadásokat","A céh gazdag tagjai felvásárolták a kéziratokat és monopolizálták a piacot, a szegényebb tagok jogosulatlan utánnyomásokat adtak ki; az 1585-ös rendelet ezért licenciához kötötte a könyvnyomtatást","A német privilégiumrendszer sajátossága: büntetőjogi védelmet nyújtott az utánnyomás ellen, és a 19. század második feléig fennmaradt","A privilégiumok elsősorban nem a szerzőket, hanem a kiadók kereskedelmi és az uralkodó politikai érdekeit védték; a rendszer az utilitarista copyright-felfogáshoz áll közelebb, nem a droit d'auteur elvekhez"]},{"prompt":"Ismertesd az első szerzői jogi kodifikációkat: a Statute of Anne-t, valamint az amerikai és a francia törvényt!","keyPoints":["A 18. század elején a védelmet még a privilégiumok biztosították; a feudális rendszert az 1710-es Statute of Anne (Stuart Anna statútuma) törte át","A statútum két újítása: a szerző tulajdonjoga az alkotása felett, és a véges védelmi idő fogalma","A korábban korlátlan idejű védelmet a már kinyomtatott könyveknél legfeljebb 21, a még ki nem nyomtatottaknál legfeljebb kétszer 14 évre korlátozta","Az angol papírkereskedők valós és színlelt pereket indítottak, hogy precedensekkel korlátozzák a véges védelmi idő hatályát","A copyright fejlődéséhez hozzájárult John Locke használaton alapuló tulajdonfelfogása","Az első „igazi” szerzői törvényt az Egyesült Államok fogadta el 1790-ben","A kontinentális rendszerben elsőként Franciaország fogadott el szerzői jogi törvényt 1793-ban","Franciaországban korábban a Chambre Syndicale de la Librairie et Imprimerie de Paris céh állította ki a királyi privilégiumokat és biztosította a királyi cenzúrát","Az 1777-es királyi rendeletek már a szerzőnek (nem a kiadónak) biztosítottak örökös monopóliumot; engedményezés esetén a privilégium a szerző halálával hatályát vesztette","A privilégiumrendszert a francia forradalom szüntette meg teljesen a sajtószabadság kinyilvánításával","Az 1793-as francia törvény a szerzőnek élete végéig használati jogot, örököseinek 10 éves haszonélvezeti jogot adott; a védelmi idő lejárta után a mű közkinccsé vált","A francia szakirodalom a személyiségi elméletekbe illő szerzői eredetiséget tekintette a jogvédelem alapjának"]},{"prompt":"Mutasd be a német és a román szerzői jog kialakulását, valamint a nemzeti védelem territoriális korlátait!","keyPoints":["A német tartományokban a 19. század elején eltérő fejlettségű volt a könyvkereskedelem: Lipcsében virágzott a kiadás és privilégiumokkal sajátították ki a kéziratokat, a déli tartományok olcsó utánnyomásokból éltek","A délnémet utánnyomást a hatóságok olykor bátorították is: két 18. század végi osztrák dekrétum tiltotta a tartományon belüli utánnyomást, de engedélyezte a kívülről érkező utánnyomott példányok kereskedelmét","A válság a privilégiumrendszer újragondolására kényszerítette a német jogalkotót, de az egységes szövetségi szerzői jogi törvényt csak 1870-ben fogadták el (hatályba 1871-ben lépett)","A német törvény nem tekinthető modern szerzői jogi törvénynek: nem az alkotó jogait, hanem az utánnyomás tilalmát helyezte középpontba, a szerzői jogokat a tilalom alóli kivételként definiálta","Romániában először az 1862. évi 13-as sajtótörvény külön fejezete szabályozta az írók, zeneszerzők és művészek jogait","A román törvény a szerzőnek életfogytiglani kizárólagos használati jogot, örököseinek halála után 10 évig tartó jogot biztosított","A kölcsönösség elve alapján a külföldi szerzők is védelmet kaptak, ha jogaikat a származási országban is elismerték","A 18–19. századtól beszélhetünk nemzeti szintű oltalomról, ez azonban szigorúan territoriális maradt: csak az állam határain belül és rendszerint csak belföldi szerzőknek","A territorialitás nem kedvezett a nemzetközi könyvkereskedelemnek, ezért már a 18. század végén szükségessé vált a nemzetközi szabályozás"]}],"terms":[{"t":"Privilégium (monopólium)","d":"A könyvnyomtatás utáni két évszázad fő védelmi eszköze: az uralkodó által adott kizárólagos nyomtatási jog, amely elsősorban a kiadók kereskedelmi és az uralkodó politikai érdekeit védte."},{"t":"Generálprivilégium","d":"A privilégiumok kezdeti formája: egy adott területen kizárólagos és általános nyomtatási jogot biztosított birtokosának."},{"t":"Johannes von Speyer privilégiuma","d":"A történelmi feljegyzések szerinti első privilégium, amelyet Velence Köztársasága állított ki: 5 évre kizárólagos nyomtatási jog Velence teljes területére."},{"t":"Royal prerogative printing patent","d":"Az angol privilégiumok alapját képező nyomtatási engedély, amely azután jelent meg, hogy VIII. Henrik 1534-ben hatálytalanította a külföldi könyvimportot engedélyező rendeletet."},{"t":"Special licence","d":"Angliában a mű közzétételének előfeltételét képező, szigorúan szabályozott külön engedély."},{"t":"Stationers' Company","d":"A 16. század elején alakult angol könyvkereskedő céh, amely hivatalos jegyzéket vezetett a nyomtatási engedélyekről, és a bejegyzések alapján szankcionálta a jogosulatlan nyomdászokat, kalózkiadókat."},{"t":"Statute of Anne (1710)","d":"Stuart Anna statútuma, az első, a feudális privilégiumrendszert áttörő jogszabály; két újítása a szerző műve feletti tulajdonjoga és a véges védelmi idő."},{"t":"Chambre Syndicale de la Librairie et Imprimerie de Paris","d":"A legismertebb francia kiadói-nyomdász céh, amely a 17–18. században a királyi privilégiumok kiállítása mellett a királyi cenzúrát is biztosította."},{"t":"1777-es francia királyi rendeletek","d":"Először a szerzőnek (nem a kiadónak) biztosítottak örökös monopóliumot a művét megillető jogok felett; engedményezés esetén a privilégium a szerző halálával hatályát vesztette."},{"t":"1793-as francia szerzői jogi törvény","d":"Az első kontinentális szerzői jogi törvény: a szerzőnek élete végéig használati jogot, örököseinek 10 éves haszonélvezetet adott, majd a mű közkinccsé vált."},{"t":"1870-es német szövetségi szerzői jogi törvény","d":"Egységesítette a német szerzői jogot (hatályba 1871-ben lépett), de nem modern törvény: az utánnyomás tilalmát helyezte középpontba, a szerzői jogokat kivételként definiálta."},{"t":"1862. évi 13-as román sajtótörvény","d":"Romániában először szabályozta a szerzők jogait: életfogytiglani kizárólagos használati jog, az örökösöknek 10 év, a külföldi szerzőknek a kölcsönösség elve alapján védelem."},{"t":"Territorialitás","d":"A korai nemzeti szerzői jogvédelem korlátja: a védelem csak az állam határain belül volt érvényesíthető, és rendszerint csak a belföldi szerzőket illette meg."},{"t":"Copyright (utilitarista felfogás)","d":"Az angolszász (common law) megközelítés, amely a befektetett idő és energia jutalmazására épül; a privilégiumrendszer ehhez áll közelebb."},{"t":"Droit d'auteur","d":"A kontinentális jogban elterjedt szerzői jogi felfogás, amely a szerző jogait helyezi középpontba."},{"t":"John Locke tulajdonfelfogása","d":"Használaton (munkán) alapuló tulajdonelmélet, amely hozzájárult a copyright mint a szerző tulajdonjoga fejlődéséhez."}],"drills":[{"q":"Sorold fel az első nyomdák megjelenésének helyszíneit és évszámait!","a":["Oxford – feltehetőleg 1468","Velence és Párizs – 1469","Magyarország (Hunyadi Mátyás) – 1473"]},{"q":"Sorold fel a 15–16. századi könyvkiadás legfőbb központjait!","a":["Velence","Párizs","Lyon","Antwerpen","Lipcse","Köln"]},{"q":"Milyen két újítást vezetett be a Statute of Anne?","a":["A szerző tulajdonjoga az alkotása felett","A véges védelmi idő fogalma"]},{"q":"Milyen két érdek találkozása tette lehetővé a privilégiumrendszer kialakulását és fennmaradását?","a":["A kiadók és nyomdászok kereskedelmi érdeke","Az uralkodók politikai (cenzúrázási) érdeke"]},{"q":"Sorold fel időrendben az első szerzői jogi jogszabályokat országonként!","a":["Anglia: Statute of Anne – 1710","Egyesült Államok: első „igazi” szerzői törvény – 1790","Franciaország: első kontinentális szerzői jogi törvény – 1793","Románia: 1862. évi 13-as sajtótörvény külön fejezete","Németország: szövetségi szerzői jogi törvény – 1870 (hatályos 1871-től)"]},{"q":"Mennyire korlátozta a Statute of Anne a védelmi időt?","a":["Már kinyomtatott könyvek: legfeljebb 21 év","Még ki nem nyomtatott könyvek: legfeljebb kétszer 14 év"]}]},{"num":102,"title":"Összehasonlító szerzői jog: copyright kontra szerzői jog","essay":[{"prompt":"Hasonlítsd össze az angolszász copyright és a kontinentális szerzői jogi (droit d'auteur) rendszer alapfelfogását!","keyPoints":["A művészi és tudományos alkotások védelmét biztosító jogrendszerek két nagy csoportra oszthatók: angolszász (common law) copyright és kontinentális szerzői jog (droit d'auteur, Urheberrecht)","A copyright a másolásra, pontosabban a befektetett munka, energia és tőke megtérítésére helyezi a hangsúlyt","Az angolszász megközelítés gyakorlatias, pragmatista és utilitarista elvekre épít: az ember hasznos kell legyen a társadalma számára","A polgári jogban a tiszta copyright-elméletek hagyományosan a tulajdonjog körébe tartoznak","A szerzői jog a szerzőt és alkotását helyezi a középpontba: a szerző személyisége és az alkotásához fűződő viszonya a jog alapköve","A kontinentális felfogást természetjogi eszmék befolyásolják: a szerzőt megilletik a szellemi alkotásához fűződő jogai","A polgári jogban a szerzői jogi megközelítések a személyiségi jogok körébe tartoznak","A látszólag összeegyeztethetetlen rendszerek céljaikat és hatásukat illetően sokkal jobban hasonlítanak, mint különböznek"]},{"prompt":"Fejtsd ki a copyright és a szerzői jogi rendszerek közötti, a szakirodalomban megfogalmazott legfőbb különbségeket!","keyPoints":["Négy fő különbség: eredetiségi feltétel, a védett művek fajtája, az eredeti jogosultak köre, a személyhez fűződő jogok","Eredetiség: a szerzői jogi rendszerek magasabb eredetiségi küszöböt igényelnek – a műnek egyéni, eredeti jelleggel kell rendelkeznie és magán kell viselnie a szerző személyes vonásait","A copyright rendszerek az eredetiségnél a szerző hozzáértését és befektetett munkáját nézik, csak minimális kreativitást igényelve","Védett művek: bizonyos jogokat a szerzői jogi rendszerek szomszédos jogként, a copyright rendszerek integrált rendszerben, a szerzőt megillető jogként kezelnek (pl. hangfelvétel-előállítók és műsorszolgáltatók jogai)","Eredeti jogosultak: a kontinentális rendszerekben rendszerint természetes személyek; a copyright rendszerek a jogi személyeket is szerzőnek tekintik","Munkaviszonyban alkotott műveknél kontinentális rendszerben az eredeti jogosult a szerző (természetes személy), aki jogait szerződésben ruházza át a munkaadóra; common law rendszerben az eredeti tulajdonos maga a munkaadó","Részleges kivétel az EU-ban a számítógépes program: a 2009/24/EK irányelv szerint a szoftver feletti vagyoni jogok a kontinentális rendszerekben is a munkaadót illetik","Személyhez fűződő jogok: a szerzői jogi hagyományban szélesebb körűek és erősebb védelműek – rendszerint elidegeníthetetlenek és elévülhetetlenek","A Berni Uniós Egyezmény minimumszabályai miatt a copyright rendszerekben is vannak személyhez fűződő jogok, de számuk és védelmi szintjük jóval alacsonyabb","Példák személyhez fűződő jogokra: névjog, a mű integritásához való jog, a nyilvánosságra hozatalról való döntés joga"]}],"terms":[{"t":"Copyright","d":"Az angolszász (common law) rendszer felfogása: a másolásra, a befektetett munka, energia és tőke megtérítésére helyezi a hangsúlyt; utilitarista alapú, a polgári jogban a tulajdonjog körébe sorolt."},{"t":"Szerzői jog (droit d'auteur, Urheberrecht)","d":"A kontinentális felfogás: a szerzőt és alkotását helyezi középpontba, természetjogi alapon a szerző személyiségéhez kötődik; a polgári jogban a személyiségi jogok körébe tartozik."},{"t":"Eredetiségi küszöb","d":"A kontinentális rendszerekben magasabb: egyéni, eredeti jelleg és a szerző személyes vonásai kellenek; a copyright rendszerekben a hozzáértés és befektetett munka elég, minimális kreativitással."},{"t":"Szomszédos jogok","d":"A szerzői jogi rendszerekben egyes, nem a szerzőt megillető jogok (pl. hangfelvétel-előállítók, műsorszolgáltatók jogai) külön kategóriája; a copyright rendszerek ezeket integráltan, szerzői jogként kezelik."},{"t":"2009/24/EK irányelv","d":"EU-irányelv, amelynek értelmében a számítógépes programok feletti vagyoni jogok a kontinentális jogrendszerekben is a munkaadót illetik meg – részleges kivétel az eredeti jogosultság szabálya alól."},{"t":"Személyhez fűződő jogok","d":"A szerzői jogi hagyományban széles körű, rendszerint elidegeníthetetlen és elévülhetetlen jogok (pl. névjog, a mű integritása, nyilvánosságra hozatal); a copyright rendszerekben a BUE minimumszabályai miatt léteznek, de gyengébb szinten."}],"drills":[{"q":"Sorold fel a copyright és a szerzői jogi rendszerek közötti, a szakirodalomban megfogalmazott legfőbb különbségeket!","a":["Az eredetiségi feltételnek való megfelelés","A védett művek fajtája (szomszédos jog kontra integrált kezelés)","A szerzői jogok eredeti jogosultjai","
