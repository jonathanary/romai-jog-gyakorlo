ogúak és idegenek)","Személyek csak a szabadok (liberi) lehettek","A rabszolgák (servi) jogilag lényegében dolognak számítottak","A személyiség kezdete: szabad anyától való, élve születés","A személyiség vége: a halál (mors); hosszabb idejű eltűnés esetén a halált vélelmezték","Nem személy: a halvaszületett, az elvetélt magzat (abortus), a szörnyszülött (monstrum) és a méhmagzat (nasciturus)","DE fikció és vélelem alapján a méhmagzat örökölhetett a halott apa után – úgy számolták, mintha már megszületett volna"]},{"prompt":"Mutasd be a személyállapot (status) rendszerét a római jogban és az egyes állapotok szerinti kategóriákat!","keyPoints":["Három személyállapot (status) létezett: szabadsági (status libertatis), polgársági (status civitatis) és családi (status familiae)","A statusok sorrendben feltételezik egymást: akinek van családi statusa, annak polgári és szabad statusa is van","Status libertatis szerint az emberek (homines): szabadok (liberi) – szabadon születettek (ingenui) és felszabadítottak (libertini) –, valamint rabszolgák (servi)","Status civitatis szerint a szabadok: római polgárok (cives Romani), latinjogúak (Latini) és római jogi jogképességgel nem rendelkező szabadok (peregrini – külföldiek vagy alattvalók)","Status familiae szerint a római polgárok: önjogú személyek (personae sui iuris) és apai vagy férji hatalom alatt állók (alieni iuris)","A személyi jog anyaga: személyi jog (status libertatis, status civitatis) és családjog (status familiae)","A modern jogrendszerben a személyek természetes és jogi személyek, és elválik a jogképesség és a cselekvőképesség","Rómában ilyen konkrét elkülönülés nincs, de hasonló szabályozás létezik"]}],"terms":[{"t":"persona","d":"személy, jogalany"},{"t":"caput","d":"a személy, illetve jogalanyiság megjelölése a rómaiaknál"},{"t":"liberi","d":"szabadok – csak ők lehettek személyek"},{"t":"servi","d":"rabszolgák – jogilag lényegében dolognak számítottak"},{"t":"mors","d":"halál – a személyiség vége"},{"t":"abortus","d":"elvetélt magzat – nem személy"},{"t":"monstrum","d":"szörnyszülött – nem személy"},{"t":"nasciturus","d":"méhmagzat – nem személy, de fikcióval örökölhet halott apja után"},{"t":"status libertatis","d":"szabadsági állapot"},{"t":"status civitatis","d":"polgársági állapot"},{"t":"status familiae","d":"családi állapot"},{"t":"homines","d":"emberek – a status libertatis szempontjából vizsgált kör"},{"t":"ingenui","d":"szabadon születettek"},{"t":"libertini","d":"felszabadítottak"},{"t":"cives Romani","d":"római polgárok"},{"t":"Latini","d":"latinjogúak"},{"t":"peregrini","d":"római jogi jogképességgel nem rendelkező szabadok – külföldiek vagy alattvalók"},{"t":"personae sui iuris","d":"önjogú személyek"},{"t":"alieni iuris","d":"apai vagy férji hatalom alatt álló személyek"}],"drills":[{"q":"Sorold fel a jogképesség szerinti római jogi felosztást!","a":["jogképtelen","teljesen jogképes","korlátozottan jogképes (nem teljes jogú polgárok, latinjogúak és idegenek)"]},{"q":"Sorold fel a három személyállapotot (status)!","a":["status libertatis (szabadsági)","status civitatis (polgársági)","status familiae (családi)"]},{"q":"Sorold fel, kik nem számítottak személynek!","a":["halvaszületett","elvetélt magzat (abortus)","szörnyszülött (monstrum)","méhmagzat (nasciturus)"]},{"q":"Sorold fel az emberek kategóriáit status libertatis szempontból!","a":["szabadok (liberi): szabadon születettek (ingenui) és felszabadítottak (libertini)","rabszolgák (servi)"]},{"q":"Sorold fel a szabadok kategóriáit status civitatis szempontból!","a":["római polgárok (cives Romani)","latinjogúak (Latini)","római jogi jogképességgel nem rendelkező szabadok (peregrini)"]},{"q":"Sorold fel a római polgárok kategóriáit status familiae szempontból!","a":["önjogú személyek (personae sui iuris)","apai vagy férji hatalom alatt állók (alieni iuris)"]}]},{"num":16,"title":"A személyek kategóriái","essay":[{"prompt":"Fejtsd ki a római polgárjog tartalmát, megszerzésének és elvesztésének módjait!","keyPoints":["A római polgárság (cives Romani) egyszerre közjogi és magánjogi kategória, a kettő elválaszthatatlan","Magánjogi jogosultságok: vagyonjogi jogképesség (ius commercii), családjogi jogképesség (ius conubii), legis actiós keresetek megindításának joga (ius legis actionis)","Közjogi jogosultságok: szavazati jog (ius suffragii – aktív választójog), tisztségviselési jog (ius honorum – passzív választójog), katonáskodás joga (ius militiae), vallási szertartásokon való részvétel joga (ius sacrorum)","További közjogi jogosultságok: halálbüntetés elleni fellebbezési jog (ius provocationis), önkéntes száműzetésbe vonulás joga (ius exulandi), kivándorlás joga (ius migrandi)","Kötelezettségek: hadkötelezettség, közteherviselés és adófizetés, közhivatal-viselési kötelezettség (pl. bíráskodás)","A polgárjog megszerzésének természetes módjai: római polgártól való születés; római házasságból született gyerek, ahol legalább az egyik fél római polgár; római anyától való születés","A polgárjog megszerzésének mesterséges módjai: egyéni vagy csoportos adományozás","A polgárjog elvesztése: kivándorlás (migratio), latin coloniába való letelepülés vagy letelepíttetés, száműzetés, kivételesen egész közösségek lakosságának jogfosztása"]},{"prompt":"Mutasd be a latinjogúak (Latini) és az idegenek (peregrini) kategóriáit, valamint a személyiségi elvet!","keyPoints":["A latinjog eredetileg a latiumi városállamok polgárainak jogképessége volt, később korlátozott római polgárjogot jelentett","Prisci Latini: a latin etnikum tagjai – olyan latin coloniák lakosai, akik nem kaptak római polgárjogot; ius commercii és esetleg ius conubii illette őket","Latini coloniarii: a Róma által alapított coloniák lakói, később mindazok, akiknek Róma megadta a latinjogot (ius Latii); csak ius commercii illette őket","Latini Iuniani: tartalmi hibával felszabadított rabszolgák; csak élők közötti ius commercii illette őket (aktív és passzív öröklési képesség nélkül), gyámságot és gondnokságot (munus tutelae et curae) nem láthattak el","A peregrinusok a birodalom nem római és nem latinjogú alattvalói („harmadrangú birodalmi állampolgárság”), valamint a birodalom határain kívül élő népek","Peregrini alicuius civitatis: Róma államterületén belül vagy kívül élő idegenek – nem személyek, de vagyonjogi jogképességük van, és saját népjoguk szerint élnek","Peregrini nullius certae civitatis (modern szóval „hontalanok”): peregrini dediticii – háborúban legyőzött, rabszolgának el nem adott népek; dediticiorum numero – libertini, akik rabszolgaként súlyos bűncselekményt követtek el","Személyiségi elv: mindenkit a saját joga szerint kell elbírálni","Rómaiak és peregrinusok közti perekben a ius gentium alkalmazandó","A súlyosabb bűncselekmények elkövetőire a személyiségi elv nem érvényes: rájuk mindig a római jog vonatkozik"]},{"prompt":"Fejtsd ki a rabszolgaság (servitus) jogi tartalmát, tényleges helyzetét, keletkezését és megszűnését!","keyPoints":["A rabszolga jogi értelemben jogtárgy (nem jogalany), ura tulajdonában áll","A rabszolga felett rabszolgatartói hatalom (dominica potestas) érvényesül","A szabadokkal ellentétben a rabszolga sírhelye nem forgalomképtelen","A rabszolgakori rokonság a felszabadítás után házassági akadály","A rabszolga cselekvőképes: ura nevében és peculiummal járhat el – urának csak jogokat szerez, kötelezettségeket nem","A rabszolgaság tényleges helyzete hatalmas eltéréseket mutatott, mind a korszakokat összevetve, mind egy korszakon belül","Keletkezés: a fogságba esés a legáltalánosabb forma","Keletkezés: rabszolganőtől való születés – a gyerek az anyja statusát követi (általános szabály)","Favor libertatis (császárkor): ha az anya a terhesség alatt akár egy percre is szabad volt, a gyerek szabadnak születik","Keletkezés: büntetésként is (capitis deminutio maxima, később különféle bűncselekmények)","Megszűnés: felszabadítás (manumissio) – színleges, in iure cessio jellegű per (szabadságper) útján","Augustus korlátozásai: 20 évnél fiatalabb nem szabadítha  (ius migrandi)"]},{"q":"Sorold fel a római polgár kötelezettségeit!","a":["hadkötelezettség","közteherviselés, adófizetés","közhivatal-viselési kötelezettség (pl. bíráskodás)"]},{"q":"Sorold fel a római polgárjog megszerzésének módjait!","a":["természetes mód: római polgártól való születés","természetes mód: római házasságból született gyerek, ahol legalább az egyik fél római polgár","természetes mód: római anyától való születés","mesterséges mód: egyéni adományozás","mesterséges mód: csoportos adományozás"]},{"q":"Sorold fel a római polgárjog elvesztésének eseteit!","a":["kivándorlás (migratio)","latin coloniába való letelepülés vagy letelepíttetés","száműzetés","egész közösségek lakosságának jogfosztása (kivételes eset)"]},{"q":"Sorold fel a latinjogúak kategóriáit!","a":["prisci Latini","Latini coloniarii","Latini Iuniani"]},{"q":"Sorold fel a rabszolgaság keletkezésének módjait!","a":["fogságba esés (legáltalánosabb forma)","rabszolganőtől való születés (a gyerek az anyja statusát követi)","büntetés (capitis deminutio maxima, később különféle bűncselekmények)"]},{"q":"Sorold fel a patronus jogosultságait a libertinusszal szemben!","a":["nevének viselete a libertinus által","engedelmesség (obsequium)","ingyenes vagyon- és ügygondozás (officium)","munkára kötelezhetőség (operae)","elszegényedett patronus eltartása (alimentatio)","bizonyos mértékű öröklési jog a libertinus után"]}]},{"num":17,"title":"A jogképességet befolyásoló tényezők","essay":[{"prompt":"Fejtsd ki a capitis deminutio fogalmát és formáit!","keyPoints":["A capitis deminutio a statusban bekövetkező változás","A szabadság elvesztése a polgárság és a családi status elvesztését is maga után vonja; a polgárság elvesztése a családi status elvesztésével jár; a családi állapotváltozás a másik két statust nem érinti","Capitis deminutio maxima: a szabadság elvesztése – az illető rabszolgává válik","A maximával jár a vagyon elvesztése, valamint a jogok és kötelezettségek megszűnése (a hitelezők érdekében praetori jogsegély állt rendelkezésre)","A maxima okai: hadifogságba esés, hadifogságban bekövetkezett halál, bűncselekmény","Ius postliminii („hátsó küszöb joga”): hadifogságból hazatéréskor csak a jogok állnak vissza","Hadifogságban bekövetkezett halál esetén fikció: úgy tekintették, hogy a hadifogságba esés pillanatában halt meg","Capitis deminutio media: a polgárjog elvesztése – az illető idegenné (peregrinus) válik; okai: a római polgár elköltözése, száműzetés","Capitis deminutio minima: az agnatióból való kiválás, a családi status megváltozása","A minima okai: önjogúvá válás; hatalomalatti gyerek más atyai hatalom alá kerülése (lánynál manusos házasság, fiúnál is előfordul); a hatalom alatti családtag felszabadítása (emancipatio)","A minimánál a caput nem feltétlenül „csökken”: maradhat, sőt egyetlen esetben „növekedhet” is"]},{"prompt":"Mutasd be a jogképességet befolyásoló egyéb tényezőket: a női nemet, a becsületcsökkenést és a további korlátozásokat!","keyPoints":["A nő csak magánjogi jogalany, közjogi jogképessége és politikai jogai nincsenek","A nők további korlátai: nem gyakorolhatnak családfői hatalmat, nem lehetnek gyámok, nem vállalhatnak kezességet","A „becsületcsökkenés” (minutio existimationis) három formája: intestabilitas, infamia, turpitudo","Intestabilitas (tanúképtelenség): az illető nem tanúskodhat, és nem lehet alanya olyan jogi aktusnak, amelyhez tanú kell – később kikopott","Infamia (becstelenség) a köztársasági korban: consul által (a magistratusi névjegyzékből törléssel), censori megrovással, illetve praetori edictum útján állt be","A principátus korában a praetori infamia beállhat ipso facto (közvetlenül, az edictumban meghatározott magatartásokra), sententia condemnatoria (marasztaló ítélet) útján közvetetten (bűncselekmények), valamint a sértettel való kiegyezéssel (közvetett)","Az infamia joghatásai: politikai jogok elvesztése, perbeli képviseletre való képtelenség, házassági tilalom, a senatori rang elvesztése","Turpitudo: közhivatalok betöltésére való képtelenség és bizonyos tanúzási képtelenség (ahol megbízhatóság kell)","Egyéb korlátozás: nem teljes jogú polgárrá minősülés","Alacsonyrendűekhez tartozás: a szegényebb rétegekre speciális és súlyosabb büntetések; a fizikai munkát végző szabadok jogképességének korlátozása","Városi tanácstagok (curiales): a császárkorban lesüllyedtek – felelősség az adókért (a hiányzó rész pótlása), lakhelyükhöz kötés","Egyes vallások követői: a keresztény korszakban a zsidók, eretnekek és hitehagyottak korlátozása"]}],"terms":[{"t":"capitis deminutio","d":"a statusban bekövetkező változás"},{"t":"capitis deminutio maxima","d":"a szabadság elvesztése – rabszolgaság; a vagyon elvész, a jogok és kötelezettségek megszűnnek"},{"t":"capitis deminutio media","d":"a polgárjog elvesztése – az illető peregrinusszá válik"},{"t":"capitis deminutio minima","d":"az agnatióból való kiválás – a családi status megváltozása"},{"t":"ius postliminii","d":"„hátsó küszöb joga”: hadifogságból hazatéréskor csak a jogok állnak vissza"},{"t":"emancipatio","d":"a hatalom alatti családtag felszabadítása"},{"t":"minutio existimationis","d":"„becsületcsökkenés”: intestabilitas + infamia + turpitudo"},{"t":"intestabilitas","d":"tanúképtelenség: nem tanúskodhat, és nem lehet tanút igénylő jogi aktus alanya"},{"t":"infamia","d":"becstelenség – politikai jogok elvesztésével, perbeli képviseleti képtelenséggel, házassági tilalommal, senatori rang elvesztésével jár"},{"t":"ipso facto","d":"közvetlenül, egyből beálló infamia (az edictumban meghatározott magatartásoknál)"},{"t":"sententia condemnatoria","d":"marasztaló ítélet – közvetett infamiát eredményez (bűncselekményeknél)"},{"t":"turpitudo","d":"közhivatalok betöltésére való képtelenség és bizonyos (megbízhatóságot igénylő) tanúzási képtelenség"},{"t":"curiales","d":"városi tanácstagok – a császárkorban lesüllyedtek: adófelelősség, lakhelyükhöz kötés"}],"drills":[{"q":"Sorold fel a capitis deminutio formáit!","a":["capitis deminutio maxima ( ető felelősségre vonható","A vétőképesség korábbi életkorban kezdődik, mint az ügyletképesség","A személyt illetően három fajtája van: cselekvőképes, korlátozottan cselekvőképes, cselekvőképtelen"]},{"prompt":"Mutasd be az életkor számítását és jelentőségét a cselekvőképesség szempontjából!","keyPoints":["Serdületlenek (impuberes) csoportján belül a határ a 7. életév","Infantes: akik „nem tudnak beszélni” (7 év alatt)","Impuberes infantia maiores: „az infantesnél nagyobbak”; közülük a pupilli az önjogú serdületlenek","Serdültek (puberes): minor (25 év alatti) és maior (25. év feletti)","Az infantes teljesen cselekvőképtelen: jognyilatkozatot nem tehet, delictumaiért nem felel, képviselője a szülő vagy a gyám","Az impuberes infantia maiores korlátozottan cselekvőképes: olyan jogügyleteket köthet, amelyekből csak jogokat szerez; amelyben kötelezettséget is vállal, ahhoz a gyám hozzájárulása kell","Az impuberes infantia maiores delictumainál a belátási képességet vizsgálják","A puberes minor teljesen cselekvőképes (kivéve, ha fogyatékos)","A minort sajátos jogvédelem illeti: csalás ellen kereset, teljesítés esetén a korábbi helyzet visszaállítása (in integrum restitutio)","A minor állandó gondnokot kérelmezhet; a túlvédettség miatt kialakult a cura minorum","A puberes maior teljesen cselekvőképes, nagykorú","Nagykorú: aki a 25. évét betöltötte, vagy akit császári privilégiummal nagykorúsítottak"]},{"prompt":"Fejtsd ki a cselekvőképességet befolyásoló egyéb tényezőket: a női nemet, az elmeállapotot, a tékozlást és a testi fogyatékosságot!","keyPoints":["A nőket a cselekvőképességben korlátozások sújtják: életük végéig gyámság alatt állnak","A nő a vagyonát maga kezeli, DE a jelentősebb ügyletekhez gyámi hozzájárulás kell","A nőkre tanúskodási és képviseleti korlátok vonatkoznak","A nők csak a IV. században váltak a férfiakkal egyenjogúvá a cselekvőképesség tekintetében","Az őrültet (furiosi) az infanteshez hasonlóan bírálják el, DE „világos pillanataiban” teljesen csele llett","Az alapításhoz legalább 3 tag szükséges","A jogi szervezetben elkülönülnek a befelé működő ügyintéző szervek és a kifelé eljáró képviselő szervek","Az ügyintéző szervekre nincs állami szabályozás – egyetlen kritérium: az alapszabály ne ütközzön törvénybe","A testület viszonylag teljes jogképességgel bír, de személyhez fűződő jogai és kötelezettségei nincsenek","A képviselet kezdetben közvetett, később közvetlen képviselet","A testület vétőképtelen és jognyilatkozatok megtételére képtelen","Megszűnési okok: a senatus vagy a császár feloszlatja, a cél meghiúsul, a tagok száma 3 alá csökken, a tagság feloszlatja önmagát"]},{"prompt":"Fejtsd ki a jogalanyisággal felruházott vagyontömegek (alapítványok) kialakulását és a pia causa szabályait!","keyPoints":["Az alapítványok kialakulása a keresztény egyház tevékenységéhez kötődik","Lényege: vagyon felajánlása meghatározott, kegyes célra (pia causa) – pl. kórház, szegényház fenntartására","Létesítés: alapító okirattal (amely végrendelet is lehet)","Szervezet: olyan legyen, hogy a jogképességgel felruházott vagyon betölthesse célját","Megszűnés: a vagyon kimerülésével","A pia causa magánjogi jogképességgel bír, de cselekvőképessége nincs – helyette képviselők járnak el (az egyesületekhez hasonlóan)"]}],"terms":[{"t":"universitas personarum","d":"jogképességgel felruházott személyegyesülés (pl. társaságok, egyesületek)"},{"t":"universitas bonorum","d":"jogképességgel felruházott vagyontömeg (pl. alapítvány)"},{"t":"universitas","d":"a személyegyesülés egyik elnevezése – „összesség”"},{"t":"corpus","d":"a személyegyesülés egyik elnevezése"},{"t":"collegium","d":"egy speciális egyesületfajta elnevezése"},{"t":"populus Romanus","d":"a római állam – az állampolgárok személyi változásaitól független, önálló vagyonnal és szerződési képességgel bír"},{"t":"fiscus","d":"a császárkori kincstár – korai szakaszában magánjogi szabályozás vonatkozott rá"},{"t":"pia causa","d":"vagyon meghatározott, kegyes célra való felajánlása (pl. kórház, szegényház fenntartása)"}],"drills":[{"q":"Sorold fel a jogi személyek két fajtáját!","a":["jogképességgel felruházott személyegyesülések (universitas personarum)","jogképességgel felruházott vagyontömegek (universitas bonorum)"]},{"q":"Sorold fel a személyegyesülések elnevezéseit!","a":["universitas (összesség)","corpus","collegium (speciális egyesületfajta)"]},{"q":"Sorold fel az egyesületalapítás feltételeit!","a":["csak megengedett cél (később egyes testületekhez senatusi engedély)","legalább 3 tag"]},{"q":"Sorold fel a testületek, egyesületek megszűnésének okait!","a":["a senatus vagy a császár feloszlatja","a cél meghiúsul","a tagok száma 3 alá csökken","a tagság feloszlatja önmagát"]},{"q":"Sorold fel a magántestületek, egyesületek példáit!","a":["vállalkozói egyesületek","magistratusi segédtestületek","temetkezési egyesületek"]}]},{"num":20,"title":"A család fogalma a rómaiaknál","essay":[{"prompt":"Fejtsd ki a családjogi állapot (status familiae) lényegét a köztársasági és a császárkorban!","keyPoints":["A köztársasági korban a személyek önjogúak (persona sui iuris) vagy hatalom alattiak (persona alieni iuris)","Önjogú a pater familias és a mater familias – ez nem feltétlenül szülőt jelent, hanem önjogúságot","A pater familias teljes jogképességgel és hatalommal (potestas) rendelkezik","A potestas fajtái: patria potestas (apai hatalom), manus (férji hatalom), dominica potestas (rabszolgák felett), mancipium (bizonyos szabad személyek felett)","Hatalom alatti személy: feleség, gyermek, örökbefogadott gyermek, a fiúgyermek és az örökbefogadott fiú családja","A hatalom alattiak jogképessége korlátozott: magánjogilag csak ius commercii és ius conubii illeti őket","A hatalom alatti állapot a politikai jogokat nem érinti","A hatalom alatti által kötött szerződésekben a jogosult a pater familias, a kötelezett ő maga","A fiúgyermek csak apja beleegyezésével köthet házasságot","Császárkori tendencia: a fiúgyermek vagyont (tulajdonjogot) szerezhet","Később a pater familias részére való szerzés már csak kivételes eset","A családjog tárgya a családi viszonyok: szülő-gyermek és szülő-szülő kapcsolat (patria potestas és manus), valamint a gyámság (tutela) és gondnokság (cura)"]},{"prompt":"Mutasd be a familia proprio iure fogalmát és elemeit!","keyPoints":["A família a családfő (pater familias) hatalma alatt álló személyek közössége","Vagyoni, gazdasági és kultikus házközösség","Vagyoni jellege: a pater familias a teljhatalmú úr","A házközösségben élőknek azonban lappangó jogaik vannak (sui heredes – örökösök)","Eleme a férji hatalom alatt álló feleség (uxor in manu)","Eleme az apai hatalom alatt álló gyermek (filius familias, filia familias)","Eleme a hatalom alatti fiú manusos házasságot kötött felesége, a pater familias menye (nurus)","Elemei a hatalom alatti fiú gyermekei és unokái, azaz a pater familias unokái (nepotes, neptes)","Elemei az örökbefogadott gyermekek (arrogati, adoptivi), valamint az örökbefogadott fiú gyermekei és unokái","Felbomlása a családapa halálával: a közvetlen apai hatalom alatt állók önjogúvá válnak"]},{"prompt":"Hasonlítsd össze az agnatiót és a cognatiót mint a rokonság két felfogását!","keyPoints":["Az agnatio a civiljogi rokonság: rokonok, akik azonos pater familias apai hatalma alatt állnak, vagy állnának, ha a közös pater familias még élne","A cognatio a rokonság természetes, ius naturale szerinti fogalma: a vérrokonság","Az agnatio két eleme: a leszármazás (azonos apától származás) és a hatalmi kötelék","A feleség a leszármazásnak manus esetén sem része","A hatalmi kötelék aktuálisan fennálló vagy korábban megszűnt patria potestason alapul","Az agnatio másik neve familia communi iure, amely tágabb a familia proprio iurénél","Agnát rokonok: a szűkebb család (familia proprio iure, kivéve az uxor in manu), a közelebbi agnát rokonok (proximi agnati) és a nemzetség (gens) tagjai (gentiles)","A proximi agnati körébe az anya és a női felmenők nem tartoznak bele","A családfő halála nincs hatással az agnatióra","Az apai hatalom alól kikerülés (manusos házasság, emancipatio, örökbeadás) az agnatióból való kikerülést jelenti","Kognát rokonok: egyenes ági rokonok – felmenők (ascendentes) és lemenők (descendentes)","Kognát oldalági rokonok a közös őstől származók: teljes testvérek (germani) és féltestvérek (consanguinei)","Apaság vélelme: apa az, akit a házasság annak mutat","A rokonság fokát a nemzések száma határozza meg; a sógorságot a házasság, a vérrokonságot a nemzés közvetíti"]}],"terms":[{"t":"status familiae","d":"családjogi állapot"},{"t":"persona sui iuris","d":"önjogú személy (pl. pater familias, mater familias)"},{"t":"pater familias","d":"családapa – önjogú, teljes jogképességű családfő"},{"t":"mater familias","d":"családanya – önjogú nő, nem feltétlenül szülő"},{"t":"potestas","d":"a pater familias hatalma"},{"t":"patria potestas","d":"apai hatalom"},{"t":"manus","d":"férji hatalom"},{"t":"dominica potestas","d":"rabszolgák feletti hatalom"},{"t":"mancipium","d":"bizonyos szabad személyek feletti hatalom"},{"t":"persona alieni iuris","d":"hatalom alatti, korlátozott jogképességű személy"},{"t":"ius commercii","d":"a hatalom alattit magánjogilag megillető vagyoni forgalmi jog"},{"t":"ius conubii","d":"a hatalom alattit magánjogilag megillető házasságkötési jog"},{"t":"tutela","d":"gyámság"},{"t":"cura","d":"gondnokság"},{"t":"familia","d":"egyazon pater familias hatalma alatt álló személyek összessége"},{"t":"agnatio","d":"civiljogi rokonság: azonos pater familias apai hatalma alatt állók (vagy állnának, ha élne)"},{"t":"cognatio","d":"a rokonság természetes fogalma: vérrokonság (ius naturale szerint)"},{"t":"familia proprio iure","d":"a családfő hatalma alatt álló személyek vagyoni, gazdasági, kultikus házközössége"},{"t":"familia communi iure","d":"az agnatio másik neve; tágabb, mint a familia proprio iure"},{"t":"sui heredes","d":"a házközösségben élők lappangó jogai alapján: örökösök"},{"t":"uxor in manu","d":"férji hatalom alatt álló felesé ]}]},{"num":21,"title":"Az apai hatalom (patria potestas)","essay":[{"prompt":"Fejtsd ki az apai hatalom fogalmát, személyi és vagyonjogi tartalmát!","keyPoints":["A patria potestas a családfőnek a családjához tartozó szabad személyek fölötti teljes magánjogi uralma","Pozitív jogosultság: a gyermek élete és halála feletti rendelkezés (ius vitae necisque)","Pozitív jogosultság: a gyermekkitétel joga (ius exponendi) – az elsőszülöttet nem lehet kitenni; a kitett gyermek rabszolga lesz vagy mancipiumba (ideiglenes hatalom alá) kerül","Pozitív jogosultság: a noxába adás joga (ius noxae dedendi) a bűncselekményt elkövető gyermek esetén","Negatív (jogvédelmi) jogosultság: fellépés joga a gyermeket visszatartó személy ellen","Korlátok: ha a családapa háromszor eladja a fiát, a gyermek szabadul az atyai hatalom alól","Korlátok: a gyermek indokolatlan megölése és kitétele büntetendő; később a gyermek egyes esetekben panasszal fordulhatott a bírósághoz","Vagyonjogi tartalom: a peculium (profecticium) a gyermeknek adott különvagyon, amely a pater familias tulajdonában maradt","Később a katonáskodással szerzett peculium felett csak névleges az atyai tulajdon (peculium castrense)","Ezt a szellemi munkával szerzett vagyonra is kiterjesztették (peculium quasi castrense)","Bona materna: az anyától örökölt vagyon a gyermeké, a pater familias nem idegenítheti el","Bona adventicia (jövevény vagyon): a gyermek nem az apától eredő vagyona","SC Macedonianum: a filius familias részére adott pénzkölcsön az apa halála után sem peresíthető"]},{"prompt":"Mutasd be az apai hatalom keletkezésének és megszűnésének eseteit!","keyPoints":["Keletkezés: törvényes római házasságból való születés (matrimonium iuris civilis)","Keletkezés: örökbefogadás (adoptio)","Az örökbefogadás előfeltétele: az örökbefogadó önjogú római polgár, aki az örökbefogadottnál legalább 18 évvel idősebb","Arrogatiónál az arrogator gyermektelen és legalább 60 éves","Arrogatio: önjogú személy örökbefogadása","Adoptio: hatalom bium a római házasságkötési képesség","Civiljogi házasság (matrimonium legitimum): két conubiummal rendelkező római polgár között (illetve római polgár és conubiummal bíró latin jogú között)","Manusos házasság megkötése: confarreatio (10 tanú, ünnepélyes formulák, szertartás) vagy coemptio (mancipatióval végbemenő színleges vételi szerződés)","Manus nélküli házasság: kölcsönös megegyezéssel jön létre; külső jele a nő bevezetése a férj házába, a censor előtti eskü vagy a hozományi okirat","Tendencia: a manus nélküli, consensuson alapuló házasságok térnyerése","A házasság meghatározása: a férfi és nő kapcsolata, egész életre szóló sorsközösség, isteni és emberi jog szerinti közösség","Matrimonium non legitimum (idegenek házassága): pl. latin jogúak vagy peregrinusok egymás közti házassága – nem elismert házasság","Házassághoz hasonló együttélési formák: ágyasság (concubinatus) és a rabszolgák életközössége (contubernium)"]},{"prompt":"Mutasd be a házassági akadályokat, a házasságkötési kényszerintézkedéseket és a házasság megszűnésének eseteit!","keyPoints":["Abszolút házassági akadály: az érintett senkivel nem házasodhat","Abszolút akadályok: serdületlen, rabszolga, elmebeteg (furiosus), már érvényes házasságban élő, kasztrált (eunuchus)","Relatív házassági akadály: bizonyos emberek nem köthetnek házasságot valakivel","Relatív akadályok: vérrokonok, örökbefogadott egyenes ágon, sógorság (egyenes ágon korlátlanul, oldalágon a testvér volt házastársa), gyám a gyámoltjával, gondnok a gondnokolttal","Speciális római tilalmak is léteztek (pl. senator és libertinus között)","Augustus kényszerintézkedése: minden római polgár köteles római házasságban élni – férfi 25 és 60, nő 20 és 50 éves kora között","Megszűnés: az egyik fél halála (mors)","Megszűnés: capitis deminutio maxima vagy media","Megszűnés: válás – a felek közös akaratával vagy egyoldalú nyilatkozattal (később ehhez meghatározott ok kell)","Megszűnés: a manus megszüntetése (jogos ok kell)"]},{"prompt":"Fejtsd ki
