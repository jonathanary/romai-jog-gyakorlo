"},{"t":"Névjog","d":"A szerző joga, hogy nevét a művön és minden arra vonatkozó utalásban feltüntessék, illetve hogy művét név nélkül vagy álnéven hozza nyilvánosságra; a döntés később módosítható."},{"t":"Integritáshoz való jog","d":"A szerző joga műve egységének tiszteletben tartásához: ellenállhat minden olyan változtatásnak, torzításnak, amely becsületét sérti vagy jó hírnevét rontja."},{"t":"Visszavonáshoz való jog","d":"A szerző joga, hogy a már nyilvánosságra hozott műve további felhasználását megtiltsa; feltétele az alapos indok és a felhasználó kárának megtérítése."},{"t":"Vagyoni jellegű szerzői jogok","d":"A szerző kizárólagos joga a mű felhasználására és a felhasználás engedélyezésére (12. cikk); taxatív felsorolásukat a 13. cikk adja."},{"t":"Kötelező díjazás elve","d":"A román szerzői jog alapelve, amely szerint a szerzőt vagy jogutódját a mű felhasználása ellenében díjazás illeti meg; a díjról szerződésben le lehet mondani."},{"t":"Dologi jellegű vagyoni jogok","d":"A tulajdonjog attribútumaival rendelkező, forgalomképes, időben behatárolt, abszolút jellegű jogok, amelyek érvényessége a törvény erejéből következik."},{"t":"Kötelmi (követelési) jogok","d":"Polgári jogi kötelmekből származó, relatív jellegű, elévülő, időben behatárolt vagyoni jogok."},{"t":"Többszörözés joga","d":"Másolatok készítése a mű egészéről vagy részleteiről, közvetlen vagy közvetett módon, időlegesen vagy véglegesen, bármely eszközzel (14. cikk)."},{"t":"Terjesztés joga","d":"A mű eredeti példányának vagy másolatainak visszterhes vagy ingyenes átruházása, illetve felkínálása (15. cikk)."},{"t":"Jogkimerülés","d":"EU-s eredetű intézmény: a szellemi alkotásra vonatkozó jog az első, szerző általi vagy engedélyével történt forgalomba hozatallal kimerül, a továbbiakban nem gyakorolható."},{"t":"Kereskedelmi célú import joga","d":"A mű többszörözött példányainak belső piacon való forgalomba hozatalára vonatkozó jog (16. cikk); a behozott másolatok készítésének jogszerűnek kell lennie."},{"t":"Bérbeadás joga","d":"A mű meghatározott időre, közvetett vagy közvetlen gazdasági/kereskedelmi haszon ellenében történő használatra átadása (17. cikk)."},{"t":"Kölcsönzéshez való jog","d":"A mű meghatározott időre, haszonszerzés nélkül, a közönség hozzáférését lehetővé tevő intézmény általi rendelkezésre bocsátása (18. cikk); a szerző nem mondhat le róla, és nem érvényesül rá a jogkimerülés."},{"t":"Nyilvánossághoz való közvetítés joga","d":"A mű bármely módon, közvetve vagy közvetlenül történő hozzáférhetővé tétele a közönség számára, beleértve az egyénileg választott helyről és időben való hozzáférést (20. cikk); nincs jogkimerülés."},{"t":"Rádiós sugárzás joga","d":"A mű rádió- vagy tévétársaság általi vezeték nélküli/szatellites, illetve vezetékes, kábeles közvetítése a közönséghez (21. cikk); a számítógépes rendszer kivétel."},{"t":"Kábeles továbbközvetítés joga","d":"A mű egyidejű, módosítások nélküli és teljes továbbközvetítése (22. cikk)."},{"t":"Származtatott alkotások létrehozásának joga","d":"Fordítás, gyűjteményes kiadás, átdolgozás vagy más feldolgozás, amelynek eredményeként új, egyéni-eredeti jellegű másodlagos alkotás jön létre (23. cikk)."},{"t":"Plágium","d":"Olyan származékos mű, amely nem tartalmaz egyéni, eredeti elemeket, ezért másolatnak minősül."},{"t":"Követő jog","d":"Eredeti grafikai, képzőművészeti és fényképészeti alkotás szerzőjének joga, hogy a műkereskedő közreműködésével történő minden további visszterhes átruházáskor a nettó ár meghatározott százalékára tartson igényt (24. cikk); lemondhatatlan és átruházhatatlan."},{"t":"Az előadóművészek személyhez fűződő jogai","d":"A 96. cikk szerint: a saját előadásmód szerzőségének elismerése, a névjog és az előadás integritásához való jog; elidegeníthetetlenek és lemondhatatlanok."}],"drills":[{"q":"Sorold fel a szerzőt megillető személyhez fűződő jogokat (10. cikk)!","a":["a nyilvánosságra hozatal joga","a szerzőség elismeréséhez való jog","a nyilvánosságra hozatalhoz használt névről való döntés joga","az integritáshoz való jog","a visszavonáshoz való jog"]},{"q":"Sorold fel, mely személyhez fűződő jogok szállnak át öröklés útján (11. cikk (2) bek.)!","a":["a nyilvánosságra hozatal joga","a szerzőség elismerésének joga","az integritáshoz való jog"]},{"q":"Sorold fel az előadóművészek személyhez fűződő jogait (96. cikk)!","a":["a saját előadásmód szerzőségének elismeréséhez való jog","a névjog (név/művésznév közzététele minden előadásnál és a felvétel lejátszásakor)","az integritáshoz való jog (az előadás minőségének tiszteletben tartása)"]},{"q":"Sorold fel a visszavonáshoz való jog gyakorlásának feltételeit!","a":["a szerzőnek alapos indoka legyen","a nyilatkozat időpontjától felmerült kárt a felhasználó számára meg kell térítenie"]},{"q":"Sorold fel a 13. cikkben taxatíve felsorolt vagyoni jellegű szerzői jogokat!","a":["a többszörözés joga","a terjesztés joga","a kereskedelmi célú import joga","a bérbeadás joga","a kölcsönzéshez való jog","a nyilvánossághoz való közvetítés joga","a rádiós sugárzás joga","a kábeles továbbközvetítés joga","származtatott alkotások létrehozásának joga"]},{"q":"Sorold fel a többszörözés lehetséges formáit!","a":["teljes vagy részleges","közvetlen vagy közvetett","időleges vagy végleges"]},{"q":"Sorold fel a követő jogi díj sávjait!","a":["5% az árból 300 - 3.000 euró között","4% az árból 3.000 - 50.000 euró között","3% az árból 50.000 - 200.000 euró között","1% az árból 200.000 - 350.000 euró között","0,5% az árból 350.000 - 500.000 euró között","0,25% 500.000 eurót meghaladó ár esetében","felső határ: 12.500 euró"]},{"q":"Sorold fel a vagyoni jogok polgári jogi alapú két fajtáját!","a":["dologi jogok (forgalomképesek, időben behatároltak, abszolút jellegűek, a törvény erejéből érvényesek)","kötelmi (követelési) jogok (relatív jellegűek, elévülhetnek, időben behatároltak)"]}]},{"num":114,"title":"Egyes alkotásokra vonatkozó különös szabályok","essay":[{"prompt":"Fejtsd ki a filmalkotások szerzőségének kérdését: mutasd be a két ellentétes elméleti felfogást és a román jog alapvető megoldását!","keyPoints":["A filmalkotások szerzőjének azonosítása a jogi szakirodalomban vitatott kérdés, két ellentmondó elképzelés alakult ki.","Az egyik felfogás szerint a film kizárólagos szerzője minden esetben a filmelőállító vállalkozás.","A copyright-rendszerű országokban ennek hatására a film megrendelt műnek minősül: a művészek a filmelőállító fizetett alkalmazottai, és egyedül az előállító regisztrálhatja a művet copyright-védelem végett.","A másik felfogás (pl. Franciaország, Olaszország, Belgium) szerint a szerzői jog alanya a mű alkotója, mert a film több szerző együttműködésével létrejövő mű.","A román jogban a szerzői jogi törvény 3. cikke irányadó: szerző az a természetes személy, aki a művet megalkotta; jogi személy nem lehet szerző.","A szerzőség közvetlenül a mű megalkotásából fakad: mihelyt a mű konkrét alakot ölt, a szerzői minőség létrejön, függetlenül attól, hogy a mű befejezett-e.","A védelem egyetlen feltétele a mű létrejötte; a román jog nem követeli meg a mű regisztrálását.","A 4. cikk vélelme: szerzőnek azt kell tekinteni, akinek a neve alatt a mű először nyilvánosságra kerül, amíg az ellenkezőjét nem bizonyítják.","A 66. cikk felsorolja az audiovizuális alkotások szerzőit: rendező, átdolgozás szerzője, forgatókönyvíró, zeneszerző, valamint a grafikus animációs filmek és filmrészletek esetén, ha ezek fontos részt játszanak a teljes műben.","Ez a felsorolás nem taxatív, csupán tájékoztató jellegű: más személyek is minősülhetnek a film szerzőinek."]},{"prompt":"Ismertesd, hogyan ismerhetők el további személyek a filmalkotás szerzőiként, és milyen vélelmek állnak fenn a filmelőállító javára!","keyPoints":["A 66. cikk (2) bekezdése szerint az előállító és a rendező (a mű megvalósítója) megállapodhat arról, hogy további, a produkcióhoz hozzájáruló alkotókat is szerzőként tüntetnek fel.","A hozzájárulás konkrét mibenlétének és súlyának megítélését a törvény a rendező és a filmelőállító mérlegelésére bízza.","Ha a rendező és az előállító megtagadja a feltüntetést, az igénylő polgári peres eljárásban, bíróság előtt bizonyíthatja, hogy jelentős mértékben hozzájárult a film megalkotásához; a szerzőség így bírói úton is megállapítható.","Más személy szerzőkénti elismerésének három együttes feltétele: jelentős hozzájárulás a film létrejöttéhez; a rendező és az előállító megállapodása a feltüntetésről; a megállapodás szerződéses formában való rögzítése.","Vélelem: ellenkező megállapodás hiányában a rendező és a többi szerző átengedte a mű kizárólagos felhasználási jogát a filmelőállítónak.","Ugyancsak az előállítót illeti – méltányos javadalmazás fejében – a film szinkronizálásának és feliratozásának engedélyezési joga, ellenkező megállapodás hiányában.","Ha a rendező e jogok valamelyikét fenn kívánja tartani, azt bele kell foglalni az előállítóval kötött szerződésbe.","Ellenkező megállapodás hiányában a film szerzői megőrzik jogaikat saját, egyéni hozzájárulásuk különálló felhasználása tekintetében.","A szerzőket illeti a film jellegétől idegen célú felhasználás engedélyezése vagy megtiltása, pl. filmrészlet reklámcélú felhasználása (ha nem magát a filmet népszerűsíti).","A közös művektől (pl. megzenésített vers) eltérően a fő szerzőkön kívül más szerző nem akadályozhatja meg a film nyilvánosságra hozatalát és további felhasználását.","Ha valamelyik szerző nem véglegesíti (vagy nem tudja véglegesíteni) hozzájárulását, nem ellenezheti munkája felhasználását, ha az a film befejezéséhez szükséges; díjazás ekkor is megilleti."]},{"prompt":"Mutasd be részletesen a rendező jogi helyzetét a román szerzői jogban!","keyPoints":["A 66. cikk felsorolásában a rendező szerepel elsőként; a sorrend arra utal, hogy a román jog szerint is ő a filmalkotás fő szerzője (autor principal).","Művészi tevékenysége szorosan egybefonódik a létrejövő művel, nem választható külön a többi szerző hozzájárulásától.","Tevékenysége jogi szempontból független a film alapjául szolgáló irodalmi mű (suport literar) szerzőjétől és a filmzene zeneszerzőjétől.","A rendező alkotó tevékenysége nem ölt testet önálló mű formájában, ezért önálló felhasználása sem lehetséges (nu este susceptibil de exploatare separată).","A 65. cikk szerint a film rendezője/szerzője az a természetes személy, aki az előállítóval kötött szerződésben főszerzőként vállalja a film megvalósítását.","A film akkor tekintendő befejezettnek, ha a főszerző és az előállító közös megegyezéssel döntött a végleges változatról.","A főszerzőn kívüli szerzők nem akadályozhatják meg a végleges változat teljes vagy részleges nyilvánosságra hozatalát és specifikus feldolgozását.","A film jogi sorsa kizárólag a rendező és az előállító közötti szerződéstől függ.","A rendező és az előállító megállapodása vállalkozási szerződés (contract de antrepriză): a rendező javadalmazás fejében szellemi munkálat elvégzését vállalja.","A román szakirodalom szerint e viszonyban az amerikai work for hire (munkaviszonyban létrehozott mű) tényállás érhető tetten: a rendező a munka elvégzéséért kap fizetséget, nem feltétlenül az alkotó tevékenységét jutalmazzák — ez a rendezők számára előnyös megoldás.","A 70. cikk (2) bekezdése szerinti jogmegőrzéssel (saját hozzájárulás különálló felhasználása) a rendező gyakorlatilag nem élhet: az előállító nem veszélyeztetné a film feletti használati jogait, és a rendezői tevékenység fizikailag sem választható el a többi szerző hozzájárulásától."]},{"prompt":"Ismertesd a forgatókönyvíró, a zeneszerző, a grafikus, valamint a 66. cikkben fel nem sorolt közreműködők (különösen az operatőr) szerzői jogi helyzetét!","keyPoints":["A törvény szerzőnek ismeri el az átdolgozás (adaptáció) szerzőjét: a 68. cikk szerint az audiovizuális átdolgozás a szerző kizárólagos joga arra, hogy már létező művét megfilmesítsék vagy filmalkotásba foglalják.","A forgatókönyvíró a film (társ)szerzője; a forgatókönyv előzően létező műnek (operă preexistentă) is tekinthető, amely a film alapjául szolgált.","Fő szabály szerint a film alapjául szolgáló művek szerzői nem minősülnek a film szerzőinek, de a forgatókönyvírót a törvény kifejezetten szerzőnek ismeri el, így megilleti a szerzői minőség és minden ebből eredő jog.","A grafikus animációs filmek/filmrészletek esetén szerző, ha az animáció hozzájárulása a film egészéhez viszonyítva lényegi.","A zeneszerző akkor válik a film szerzőjévé, ha a filmzene kifejezetten az adott filmnek készült; dalszöveges zeneműnél a zeneszerző és a dalszövegíró is szerzőnek minősül.","Korábban szerzett, már létező zenemű nem minősül filmzenének, alkotói nem társszerzők; a felhasználás csak a zenemű szerzőjének (vagy jogutódainak) beleegyezésével nem jogsértő.","A 66. cikk nem sorolja fel az operatőrt, a díszlettervezőt, a díszletfestőt, a jelmeztervezőt és a kellékest.","Kérdéses a sminkesek, vágók, hangmérnökök helyzete: nélkülözhetetlen feladatot látnak el, de hozzájárulásuk sok esetben nem minősül eredeti műnek.","Gyakran arra hivatkozva nem társszerzők, hogy tevékenységük a rendezőtől vagy előállítótól függ, és utasításra egyszerű technikai szakemberként járnak el.","Az operatőr helyzete sajátos: szerepe nélkülözhetetlen a film képi világának kialakításában, ezért nem tekinthető pusztán technikai szakembernek — analógia: a törvény a fényképek alkotóit is szerzőnek tekinti.","Az operatőr mégsem szerepel a 66. cikk felsorolásában, így rá is a (2) bekezdés alkalmazandó: akkor válik szerzővé, ha ez szerepel a rendező és az előállító szerződéses megállapodásában és a többi feltétel is teljesül."]},{"prompt":"Fejtsd ki az előállító (producer) fogalmát, szerepét és jogállását a román szerzői jogban!","keyPoints":["A 70. cikk szerint a film előállítója az a természetes személy, jogi személy vagy jogi személyiség nélküli társaság, aki/amely saját nevében kezdeményezi és megszervezi a film megvalósítását, gondoskodva annak anyagi feltételeiről.","Kiemelkedő szerepe és felelőssége van: az első mozzanattól az utolsóig kapcsolatban áll az alkotókkal.","Az alkotási folyamatban egyfajta közös nevező: a mű létrehozásának kezdeményezője, az anyagi háttér biztosítója és a film összes alkotója közötti összekötő.","Nem fejt ki művészi értelemben vett alkotói tevékenységet, de a törvényi meghatározásnál aktívabb szerepe lehet: a költségvetésre tekintettel a rendezővel közösen dönt pl. a filmezési helyszínekről.","Rendszerint ő választja ki a technikai személyzetet, és kezeli az alkotási-előállítási fázisokban jelentkező konfliktusokat.","Fontos különbség a rendezőhöz és a többi alkotóhoz képest: az előállító a szerzői jogi törvény értelmében nem minősül szerzőnek.","A megfilmesítési szerződés alapján a szerző — a szöveges/szöveg nélküli zenemű szerzője kivételével — átruházza az előállítóra a film kizárólagos felhasználásának, valamint szinkronizálásának és feliratozásának jogát, méltányos díjazás ellenében.","Az előállító szomszédos jogokkal van felruházva, és javára a vagyoni jellegű szerzői jogok kizárólagos engedményezési vélelme áll fenn."]},{"prompt":"Ismertesd a számítógépes programok (szoftverek) és az adatbázisok szerzői jogi oltalmát a román jogban!","keyPoints":["A számítógép hagyományosan két elemet társít: a látható, anyagi hardware-t és a működéshez elengedhetetlen, nem látható software-t.","A számítógépek alapvetően kétféle szoftvert futtatnak: operációs rendszert (pl. Windows, Linux, MAC OS) és alkalmazói szoftvereket (applikációk, pl. szövegszerkesztő, böngésző).","A szoftver rendeltetésszerű futtatása során többszörözés és átdolgozás valósul meg (háttértár és műveleti memória között), tehát elvben több engedélyköteles felhasználási cselekmény történik (többszörözés, fordítás, átdolgozás).","Védettséget élveznek: az előkészítő tervezési anyag elemei, a forráskód (forráskódban szerkesztett program), a gépi olvasásra alkalmas hordozóra átvett parancssorozat, valamint a program dokumentációja (alapdokumentáció és kiegészítő leírás).","A szerzői jogi törvény 72-81. cikkei szabályozzák a szoftvereket; a 72. cikk szerint a védelem kiterjed a szoftverekre, alkalmazásokra, operációs rendszerekre a programozási nyelvtől függetlenül, továbbá az előkészítő dokumentációra és a vonatkozó tankönyvekre is.","A védelem nem vonatkozik a programok elemeit illető ötletre, elvre, elgondolásra, eljárásra, működési módszerre/matematikai műveletre, sem az interfészek alapját jelentő elvekre.","Más jogforrások is relevánsak: a program nevét a védjegytörvény, a műszaki-fejlesztői tartalmat a gazdasági titokról szóló törvény védi; a szoftver önmagában nem szabadalmaztatható, de műszaki műveletsort végrehajtó program esetén a szabadalmi törvény is releváns lehet.","A kezelői felület vizuális formája (look and feel) is szerzői jogi oltalom tárgya lehet, erről az ipari rajzok és minták oltalmáról szóló törvény rendelkezik.","Adatbázis: művek, adatok vagy önálló elemek egyéni szempontok szerint rendszerezett, elektronikusan vagy más formában hozzáférhető gyűjteménye, függetlenül attól, hogy elemei védettek-e.","A védelem nem terjed ki az elektronikus adatbázisok létrehozásához használt számítógépes programokra.","Korábban az adatbázisokat a gyűjteményes művek szerzői jogi védelme alapján védték; jelenleg sui generis jog védi őket, ami nem zárja ki a párhuzamos szerzői jogi védelmet.","A sui generis oltalom melletti érv: az adatbázis anyagai nem viselhetik a szerző egyéni munkájának jegyeit, mert a gyűjtés a teljesség igényével történik.","Az adatbázis eredményességét két tényező határozza meg: az összegyűjtött információtömeg és a visszakereshetőség módszere (utóbbi az adatbázistól független programra épül).","Az adatbázis előállítója az a természetes vagy jogi személy, aki jelentős mennyiségű és minőségű munkát (pénz-, idő-, munka- vagy energiaráfordítást) fektetett a létrehozásba és a tartalom ellenőrzésébe; az EU Bírósága szerint a ráfordítás akkor releváns, ha kifejezetten az adatbázis létrehozása céljából történt."]},{"prompt":"Mutasd be a képzőművészeti, fotóművészeti és építészeti alkotásokra vonatkozó különös szabályokat, valamint a portré, a levelezés címzettje és az informáló védelmét!","keyPoints":["A vizuális alkotásoknál gondot okozhat a műfaji besorolás a vegyes területek (pl. építészet, iparművészet, belsőépítészet) miatt; a digitális fejlődéssel a fotóművészeti alkotások elterjedtek.","Eredeti műalkotás: a képzőművészeti alkotás (kép, kollázs, festmény, rajz, metszet, nyomat, litográfia), az iparművészeti alkotás (falikárpit, kerámia, üvegtárgy), a szerző által készített fotóművészeti alkotás, valamint a korlátozott számban a szerző által vagy irányításával készült, eredetinek minősülő másolat.","Az építmények festmények, rajzok, fényképek, szobrok tárgyát képezhetik; képzőművészeti célú másolás során új, az építészettől független eredeti alkotás jön létre, az építmény csak ihlető tárgy.","A tárlatot/kiállítást szervező természetes vagy jogi személy felelős a kiállított művek épségéért (fizikai integritásáért), és köteles a kockázatokat elhárítani.","Sokszorosításnál kötelező a művész nevének vagy álnevének feltüntetése; a sokszorosítási szerződésnek tartalmaznia kell a mű azonosítását lehetővé tevő utasításokat (leírás, vázlat, rajz, fénykép, aláírásra vonatkozó információk).","Építészeti alkotásnál a szerző nevét jól látható helyen fel kell tüntetni az építőtelep melletti táblán, majd a munka elvégzése után az épületen is, ha a szerződés másként nem rendelkezik.","Filmkockákról készült kimerevített képek fotóművészeti alkotásnak minősülnek; a levelekről, dokumentumokról, iratokról, műszaki rajzokról készült fotók viszont nem, és nem részesülnek védelemben.","Portrét tartalmazó mű csak az ábrázolt személy beleegyezésével használható fel (RPtk. 73., 74., 79. cikkei).","Az ábrázolt személy halála után 20 évig az örökösök beleegyezése szükséges a kép többszörözéséhez vagy másolásához.","A beleegyezéstől el lehet tekinteni, ha az illető modell volt, vagy pénzt kapott azért, hogy modellt álljon.","A levelezés felhasználásához a címzett (halála után 20 évig az örökösei) beleegyezése szükséges, ha a címzett másként nem rendelkezett.","Az informáló védelme: a kiadó/előállító a szerző kérésére köteles megőrizni a művekben felhasznált információk forrásának titkosságát, és nem hozhatja nyilvánosságra a vonatkozó dokumentációt.","A titok felfedése akkor megengedett, ha az átadó személy beleegyezik, vagy jogerős bírósági döntés rendeli el."]}],"terms":[{"t":"Megrendelt mű (copyright-felfogás)","d":"A copyright-rendszerű országokban a filmalkotás megrendelt mű: az alkotók a filmelőállító fizetett alkalmazottai, és egyedül az előállító regisztrálhatja a művet."},{"t":"Szerzői jogi tv. 3. cikk","d":"Szerző az a természetes személy, aki a művet megalkotta; jogi személy nem lehet szerző, a szerzőség a mű megalkotásából fakad."},{"t":"Szerzőségi vélelem (4. cikk)","d":"Szerzőnek azt kell tekinteni, akinek a neve alatt a mű először nyilvánosságra kerül, amíg az ellenkezőjét nem bizonyítják."},{"t":"66. cikk","d":"Az audiovizuális alkotás szerzőinek nem taxatív felsorolása: rendező, átdolgozás szerzője, forgatókönyvíró, zeneszerző, grafikus (animációs filmeknél, ha hozzájárulásuk fontos)."},{"t":"Főszerző (autor principal)","d":"A rendező: a 65. cikk szerint az a természetes személy, aki az előállítóval kötött szerződésben főszerzőként vállalja a film megvalósítását."},{"t":"Vállalkozási szerződés (contract de antrepriză)","d":"A rendező és az előállító közötti megállapodás: a rendező javadalmazás fejében szellemi munkálat elvégzését vállalja az előállító számára."},{"t":"Work for hire","d":"Az amerikai szerzői jogból ismert tényállás (munkaviszonyban létrehozott mű), amely a román szakirodalom szerint a rendező-előállító viszonyban érhető tetten: a rendező a munka elvégzéséért kap fizetséget."},{"t":"Felhasználási vélelem a filmelőállító javára","d":"Ellenkező megállapodás hiányában a rendező és a többi szerző átengedte az előállítónak a film kizárólagos felhasználásának, szinkronizálásának és feliratozásának jogát, méltányos javadalmazás fejében."},{"t":"Audiovizuális átdolgozás (68. cikk)","d":"A szerző kizárólagos joga már létező műve felett, hogy azt megfilmesítsék vagy filmalkotásba foglalják."},{"t":"Előzően létező mű (operă preexistentă)","d":"A film alapjául szolgáló mű, pl. a forgatókönyv; alapesetben szerzője nem a film szerzője, de a forgatókönyvírót a törvény kifejezetten annak ismeri el."},{"t":"Filmzene","d":"Kifejezetten az adott filmnek készült zenemű; szerzője (dalszöveges műnél a dalszövegíró is) a film társszerzője — korábban szerzett zenemű nem minősül filmzenének."},{"t":"Előállító (producer, 70. cikk)","d":"Az a természetes/jogi személy vagy jogi személyiség nélküli társaság, aki saját nevében kezdeményezi és megszervezi a film megvalósítását és biztosítja anyagi feltételeit; nem szerző, de szomszédos jogok illetik."},{"t":"Megfilmesítési szerződés","d":"A film létrehozására kötött szerződés, amellyel a szerzők (a zenemű szerzője kivételével) átruházzák az előállítóra a film kizárólagos felhasználási, szinkronizálási és feliratozási jogát méltányos díjazásért."},{"t":"Operatőr (directorul de imagine)","d":"A 66. cikk felsorolásában nem szerepel, de nem tekinthető pusztán technikai szakembernek; szerzővé a rendező és az előállító szerződéses megállapodása alapján válhat."},{"t":"Szoftver (számítógépes program)","d":"A számítógépen futó programok összességét jelölő szellemi termék, amely a hardware-egységeket működteti és vezérli."},{"t":"Operációs rendszer","d":"A számítógép működéséhez elengedhetetlen alapprogram (pl. Windows, Linux, MAC OS)."},{"t":"Alkalmazói szoftver (applikáció)","d":"A számítógép alapvető használatán túlmutató célokat támogató specifikus program (pl. szövegszerkesztő, böngésző)."},{"t":"72. cikk","d":"A szoftverek védelmét a programozási nyelvtől függetlenül kimondó rendelkezés; nem védi az ötletet, elvet, eljárást, működési módszert és az interfészek alapelveit."},{"t":"Look and feel","d":"A kezelői felület vizuális formája, grafikai megjelenítése; szerzői jogi oltalom tárgya lehet, az ipari rajzok és minták oltalmáról szóló törvény rendelkezik róla."},{"t":"Adatbázis","d":"Művek, adatok vagy önálló elemek egyéni szempontok szerint rendszerezett, elektronikusan vagy más formában hozzáférhető gyűjteménye, elemei védettségétől függetlenül."},{"t":"Sui generis oltalom","d":"Az adatbázisok jelenlegi, önálló jellegű védelme; nem zárja ki a párhuzamos szerzői jogi védelmet."},{"t":"Adatbázis előállítója","d":"Az a természetes vagy jogi személy, aki jelentős mennyiségű és minőségű munkát (pénz-, idő-, munka- vagy energiaráfordítást) fektetett az adatbázis létrehozásába és tartalmának ellenőrzésébe."},{"t":"EU Bírósága az adatbázisokról","d":"A jelentős munkabefektetés akkor releváns az adatbázis védelme szempontjából, ha kifejezetten az adatbázis létrehozásának céljából történt."},{"t":"Eredeti műalkotás","d":"Képzőművészeti, iparművészeti és a szerző által készített fotóművészeti alkotás, valamint a korlátozott számban a szerző által vagy irányításával készült, eredetinek minősülő másolat."},{"t":"Portré-szabály","d":"Portrét tartalmazó mű csak az ábrázolt személy (halála után 20 évig örökösei) beleegyezésével használható fel; kivétel, ha az illető modell volt vagy fizetséget kapott a modellállásért."},{"t":"Levelezés címzettjének védelme","d":"A kapott levelezés felhasználásához a címzett (halála után 20 évig örökösei) beleegyezése szükséges, ha a címzett másként nem rendelkezett."},{"t":"Informáló védelme","d":"A kiadó/előállító a szerző kérésére köteles titokban tartani a művekben felhasznált információk forrását; a titok csak az átadó beleegyezésével vagy jogerős bírósági döntésre fedhető fel."}],"drills":[{"q":"Sorold fel, kik minősülnek az audiovizuális alkotás szerzőinek a szerzői jogi törvény 66. cikke szerint!","a":["a rendező","az átdolgozás (adaptáció) szerzője","a forgatókönyvíró","a zeneszerző","a grafikus (animációs filmek, filmrészletek esetén, ha fontos részt játszanak a teljes műben)"]},{"q":"Sorold fel a három együttes feltételt, amelyek teljesülése esetén a 66. cikkben fel nem sorolt személy is a filmalkotás szerzőjének minősül!","a":["jelentős mértékben hozzájárul a filmalkotás létrejöttéhez","a rendező és a filmelőállító megállapodott a szerzőként való feltüntetéséről","a megállapodást szerződés formájában rögzítették"]},{"q":"Sorold fel, mely elemek élveznek védettséget a számítógépes programok esetében!","a":["az előkészítő tervezési anyag elemei","a forráskód vagy a forráskódban szerkesztett program","a gépi olvasásra alkalmas hordozóra átvett parancsok (utasítások) sorozata","a program dokumentációja (alapdokumentáció és kiegészítő leírás)"]},{"q":"Sorold fel, mire NEM vonatkozik a szerzői jogi védelem a 72. cikk szerint a számítógépes programok körében!","a":["a programok egyes elemeit illető ötletre","elvre, elgondolásra","eljárásra","működési módszerre / matematikai műveletre","az interfészek alapját jelentő elvekre"]},{"q":"Melyik két tényező határozza meg egy adatbázis felhasználhatóságát, eredményességét?","a":["a benne összegyűjtött információtömeg","az információk visszakereshetőségének módszere"]},{"q":"Sorold fel, milyen alkotások minősülnek eredeti műalkotásnak!","a":["képzőművészeti alkotás (kép, kollázs, festmény, rajz, metszet, nyomat, litográfia)","iparművészeti alkotás (falikárpit, kerámia, üvegtárgy)","fotóművészeti alkotás, ha a szerző maga készítette","a korlátozott számban a szerző által vagy irányításával készült, eredetinek minősülő másolat"]},{"q":"Sorolj fel olyan fontos filmes közreműködőket, akiket a 66. cikk nem sorol fel a szerzők között!","a":["az operatőr","a díszlettervező","a díszletfestő","a jelmeztervező","a kellékes"]},{"q":"Melyik két típusú szoftvert futtatják alapvetően a számítógépek?","a":["operációs rendszer (alapprogram, pl. Windows, Linux, MAC OS)","alkalmazói szoftverek (applikációk, pl. szövegszerkesztő, böngésző)"]}]},{"num":115,"title":"A szerzői művek felhasználása","essay":[{"prompt":"Fejtsd ki a szerzői művek felhasználásának általános szabályait és a szerzői jogok öröklésének rendjét!","keyPoints":["A mű nyilvánosságra hozatala jellemzően nem közvetlenül a szerző által, hanem felhasználási szerződés alapján, harmadik személy (pl. könyvkiadó, lemezkiadó) közbeiktatásával történik","A felhasználási szerződés lényege: a szerző engedélyt ad a mű felhasználására, a felhasználó pedig ennek fejében felhasználási díjat (honoráriumot) fizet","A törvényes feltételek a mű bármilyen felhasználására vonatkoznak: többszörözés, terjesztés, nyilvános előadás, sugárzás, továbbközvetítés, átdolgozás, kiállítás stb.","A felhasználási módokban közös, hogy céljuk a mű hozzáférhetővé tétele a nyilvánosság számára","A szerzői jogok átruházásának két alapvető módja: öröklés vagy élők közti jogügylet","A törvény felsorolja az öröklés útján átadható személyi jellegű jogokat; a vagyoni jogok ex lege öröklődnek az oltalmi időn belül","Az öröklés módjáról a szerzői jogi törvény nem rendelkezik, ezért a Ptk. szabályai szerint kell eljárni","Több örökös esetén a jogokat együttesen, kijelölt képviselő útján vagy közös jogkezelővel megállapodva gyakorolják","Örökösök hiányában a szerzői jogok a közös jogkezelőre szállnak","A jogok mind a nyilvánosságra hozott, mind a még nyilvánosságra nem hozott művek esetében örökölhetők","Ha az örökösök sem hozzák nyilvánosságra a művet, az azt első alkalommal törvényesen nyilvánosságra hozó személy 20 éves oltalmi időt kap"]},{"prompt":"Mutasd be a vagyoni jellegű szerzői jogok élők közti átruházásának szabályait (40–44. cikk)!","keyPoints":["Az élők közti átruházás szerződések útján valósul meg; egyeseket a szerzői jogi törvény nevesít, másokat nem, és megtörténhet más jogág specifikus szerződésén (pl. munkaszerződés, szolgálati mű) keresztül is","A 40. cikk (1) bek. szerint csak a vagyoni jellegű jogok átruházása lehetséges; ezek ingyenes átruházás tárgyát is képezhetik","Semmis a szerző minden jövőbeli művére vonatkozó átruházási szerződés [42. cikk (2) bek.]","Az átruházásnak területi vagy időbeli korlátozása köthető ki, illetve vonatkozhat csak bizonyos jogokra; egy jog átruházása nem érinti a többi jog helyzetét","Kizárólagos átruházásnál a szerző/jogtulajdonos maga sem használhatja a művet a meghatározott időben és területen, és nem adhatja át a jogokat újabb felhasználónak; a kizárólagosságot kifejezetten rögzíteni kell, különben az átruházás nem kizárólagosnak minősül","Nem kizárólagos átruházásnál a szerző továbbra is felhasználhatja a művét és újabb szerződéseket köthet; a felhasználó csak a szerző kifejezett hozzájárulásával adhatja tovább a felhasználást harmadik személynek","A többszörözési jog átruházásánál törvényi vélelem, hogy a másolatok terjesztési jogát is átruházták, kivéve a behozatali (import) jogot (41. cikk)","Az átruházási szerződésben pontosan meg kell határozni az átruházott vagyoni jogokat, és mindegyikre a felhasználás módját, határidejét és a szerzői díjazást; bármely elem hiánya feljogosít a szerződés felbontására (kivétel: ingyenes átruházás)","A 42. cikk szerint a felhasználási szerződés létének és tartalmának bizonyítására kötelező az írott forma, kivéve a sajtóban megjelenő művekre vonatkozó átruházásokat","A szerzői díj mértékét a felek megegyezésére bízza a törvény: meghatározható a bevétellel arányosan, fix összegben vagy bármely más módon","Ha a szerződés nem rendelkezik a díjról, a szerző bíróságtól kérheti annak meghatározását, figyelembe véve az adott műfajta szokásos díjazását, a felhasználás célját, időtartamát","A díjazás és a felhasználó bevétele közötti egyértelmű aránytalanság esetén a szerző bíróságtól kérheti a szerződés felbontását vagy a díj méltányos megnövelését — erről a jogáról nem mondhat le"]},{"prompt":"Ismertesd a sajátos felhasználási esetekre vonatkozó szabályokat (45–48. cikk) és a felhasználási szerződés felmondásának általános szabályait!","keyPoints":["Szolgálati alkotás (45. cikk): főszabály szerint a munkaszerződéses feladatok végzése során készült mű szerzői jogai a szerzőt illetik; a felhasználáshoz a munkáltató engedélye és anyagi hozzájárulásának megfizetése szükséges","Ha a munkaszerződés rendezi a szerzői jogokat, pontosítani kell az átruházás időtartamát, ellenkező esetben az az átadástól számított 3 évig érvényes","A határidő lejárta után a jogok gyakorlása visszaszáll a szerzőre, de a munkáltatónak méltányossági díjazás jár a felhasználási haszonból anyagi hozzájárulása miatt","Sajtóban megjelenő alkotás (46. cikk): ellenkező megegyezés hiányában a periodikában megjelenő mű szerzője rendelkezik a további felhasználás jogával, feltéve hogy nem károsítja a kiadványt","A szerző szabadon rendelkezik művével, ha azt az elfogadástól számítva napilapnál 1 hónapon, más kiadványnál 6 hónapon belül nem jelentették meg","Megrendelt alkotás (47. cikk): jövőbeli műre vonatkozó megrendelésnél ellenkező megegyezés hiányában a vagyoni jogokkal a szerző rendelkezik; a szerződésnek tartalmaznia kell a leadási és elfogadási határidőt","Nem megfelelő teljesítésnél a megrendelő felmondhatja a szerződést, de a már teljesített kifizetéseket nem követelheti vissza; a szerző kérheti az előkészítő munkálatok költségeinek megtérítését","Képzőművészeti/fotóművészeti alkotás: az eredeti mű tulajdonosa kiállíthatja az alkotást akkor is, ha azt még nem hozták nyilvánosságra; a szerző csak akkor tilthatja meg a kiállítást, ha a tilalmat előzetesen az átruházási szerződésben rögzítették [48. cikk (4) bek.]","A felmondáshoz a 48. cikk két feltétel együttes teljesülését írja elő: 1) az engedményes nem vagy nem megfelelően használta fel az átruházott jogokat, 2) ezáltal a szerző törvényes érdekei jelentősen sérülnek","A felmondás nem kérhető az átruházástól számított 2 évnél hamarabb; sajtóban megjelenő alkotásnál napilapoknál 3 hónap, más kiadványoknál 1 év a határidő","Nem kérhető a felmondás, ha a felhasználás elmaradásának oka a szerző saját hibája, harmadik személy cselekedete vagy vis maior"]},{"prompt":"Mutasd be a szerzői jogi törvényben nevesített felhasználási szerződéseket: a kiadói szerződést, a színpadi felhasználási szerződést és a bérleti szerződést!","keyPoints":["A törvény 3 felhasználási szerződést nevesít: kiadói szerződés (49–58. cikk), színpadi felhasználási szerződés (59–63. cikk), bérleti szerződés (64. cikk)","Kiadói szerződés: a szerző átadja művét a kiadónak, a kiadó jogosult azt kiadni és forgalomba hozni a szerzői jogdíj megfizetése mellett; jogi természete megegyezéses, kétoldalú, intuitu personae, visszterhes","Nem kiadói szerződés, ha a szerző saját költségén adatja ki a művét — az egyszerű vállalkozási szerződés","A kiadói szerződés mellett az átdolgozás egyes formái (elsősorban fordítás) is engedélyezhetők, de ezt a szerződésben rögzíteni kell","A kiadói szerződés kötelező tartalma többek között: átruházás időtartama, területi korlátok, kizárólagos/nem kizárólagos jelleg, példányszám minimuma és maximuma, jogdíj, tiszteletpéldányok száma, megjelenési és terjesztési határidők, kézirat-leadási határidő, példányszám-ellenőrzés; az időtartam, területi korlát, kizárólagosság és jogdíj kikötésének hiánya érvénytelenítésre jogosít","A kötetalapú kiadás kiadójának a kiadást követő 3 évben elsőbbségi joga van az elektronikus kiadásra, árazonosság mellett; igényét a szerző írásos ajánlatától számított 30 napon belül kell visszaigazolnia (53. cikk)","Ismétlődő kiadásoknál a szerzőnek lehetőséget kell adni javításokra, ha azok nem növelik jelentősen a kiadó költségeit (54. cikk); a kiadási jog csak a szerző engedélyével ruházható át harmadik személyre (55. cikk); a kiadó köteles visszaszolgáltatni az eredeti kéziratot és a kapott dokumentumokat (56. cikk)","A kiadói szerződés megszűnik a határidő vagy a meghatározott kiadásszám elteltével (57. cikk); egy kiadás kifogyottnak minősül, ha az eladatlan példányok a teljes példányszám 5%-a alatt vannak, vagy 100 darabnál kevesebb maradt","Ha a kiadás nem valósul meg határidőre (kifejezett rendelkezés hiányában az elfogadástól számított 1 éven belül), a szerző kérheti a szerződés érvénytelenítését; a kiadástól számított 2 év után a kiadó megsemmisítheti a megmaradt példányokat, ha azokat előzőleg felajánlotta a szerzőnek","Vis maior miatti megsemmisülésnél: megvalósult kiadásnál a szerző díjigénye megmarad; teljes előkészített kiadás megsemmisülésekor a kiadó újabb díjfizetés nélkül készíthet új kiadást; részleges megsemmisülésnél díjfizetés nélkül pótolhatja a példányokat","A kiadót titoktartási kötelezettség terheli a műben szereplő információs forrásokra nézve; ettől csak az érintett engedélyével vagy bírói határozattal lehet eltekinteni","Színpadi felhasználási szerződés: a jogtulajdonos díjazás ellenében átruházza egy elkészült vagy jövőbeli mű (irodalmi, zenei, pantomim, koreográfiai) közönség előtti bemutatásának jogát; a szerződés intuitu personae, konszenzuális, visszterhes, írott formája ad probationem szükséges; köthető közvetlenül vagy közös jogkezelőn keresztül","Színpadi szerződésnél kötelező rögzíteni a bemutató dátumát vagy határidejét, a kizárólagos/nem kizárólagos jelleget és a területet; ha az előadások 2 évig szünetelnek vagy a bemutató határidőre nem valósul meg, a szerző kérheti a felbontást és kártérítést, a már kifizetett honoráriumát megtarthatja; a felhasználó köteles biztosítani az ellenőrzést, a promóciós anyagok megküldését, és min. évi 1 alkalommal értesíteni a szerzőt az előadásszámról és/vagy bevételről","Bérleti szerződés (64. cikk): a szerző díjfizetés ellenében, meghatározott időre használatba adja művének legalább egy eredeti vagy másolati példányát; az általános polgári jogi szabályok alkalmazandók; jellemzően számítógépes programoknál és audiovizuális alkotásoknál fordul elő; ellenkező rendelkezés hiányában a terjesztés kivételével a szerző marad az összes szerzői jog tulajdonosa"]},{"prompt":"Ismertesd a közös jogkezelés általános szabályait a 144. cikk alapján!","keyPoints":["A szerzői jogok és szomszédos jogok címzettjei jogaikat 2 módon gyakorolhatják: közvetlenül (önállóan) vagy közös jogkezelő által, megbízás alapján","Közös jogkezelés tárgyát csak korábban már nyilvánosságra hozott alkotásokhoz fűződő jogok képezhetik","Szomszédos jogoknál hasonló a szabály: korábban nyilvánosságra hozott hang- és videofelvételekre, illetve korábban rögzített vagy sugárzott alakításokra vonatkozhat","A közös jogkezelőnek adott megbízást közvetlenül a szerzői jogok tulajdonosával, írott formában kell megkötni"]}],"terms":[{"t":"Felhasználási szerződés","d":"A szerző engedélyt ad a mű felhasználására, a felhasználó pedig ennek fejében felhasználási díjat (honoráriumot) fizet; célja a mű nyilvánosság számára való hozzáférhetővé tétele."},{"t":"Kizárólagos átruházás","d":"A szerző/jogtulajdonos maga sem használhatja a művet a meghatározott időben és területen, és nem adhatja át a jogokat újabb felhasználónak; kivételes jellegű, ezért a szerződésben kifejezetten rögzíteni kell."},{"t":"Nem kizárólagos átruházás","d":"A szerző továbbra is felhasználhatja művét és újabb szerződéseket köthet; a felhasználó csak a szerző kifejezett hozzájárulásával adhatja tovább a felhasználást harmadik személynek."},{"t":"Jövőbeli művekre vonatkozó átruházás","d":"A szerző minden (meghatározott vagy meghatározatlan) jövőbeli művére vonatkozó átruházási szerződés semmis [42. cikk (2) bek.]."},{"t":"Szolgálati alkotás","d":"Munkaviszony keretében, a munkaszerződéses feladatok végzése során létrehozott mű; főszabály szerint jogai a szerzőt illetik, a felhasználáshoz a munkáltató engedélye kell, az átruházás rögzített időtartam hiányában 3 évig érvényes."},{"t":"Megrendelt alkotás","d":"Jövőbeli alkotásra vonatkozó megrendelési szerződés; ellenkező megegyezés hiányában a vagyoni jogokkal a szerző rendelkezik, a szerződésnek tartalmaznia kell a leadási és elfogadási határidőt (47. cikk)."},{"t":"Kiadói szerződés","d":"A szerző átadja művét a kiadónak, amely jogosult azt kiadni és forgalomba hozni jogdíjfizetés mellett; megegyezéses, kétoldalú, intuitu personae, visszterhes szerződés (49–58. cikk)."},{"t":"Kifogyott kiadás","d":"Egy kiadás vagy utánnyomás kifogyottnak minősül, ha az eladatlan példányok száma a teljes példányszám 5%-a alatt van, vagy a megmaradt példányok száma 100 darabnál kevesebb."},{"t":"Színpadi felhasználási szerződés","d":"A jogtulajdonos díjazás ellenében átruházza egy elkészült vagy jövőbeli mű közönség előtti bemutatásának jogát; intuitu personae, konszenzuális, visszterhes szerződés, írott formája ad probationem szükséges (59–63. cikk)."},{"t":"Bérleti szerződés (szerzői jogi)","d":"A szerző díjfizetés ellenében, meghatározott időre használatba adja művének legalább egy eredeti vagy másolati példányát; jellemzően számítógépes programoknál és audiovizuális alkotásoknál (64. cikk)."},{"t":"Közös jogkezelés","d":"A szerzői és szomszédos jogok megbízás alapján, közös jogkezelő szervezet útján való gyakorlása; csak korábban nyilvánosságra hozott alkotások jogaira vonatkozhat, a megbízást írott formában kell megkötni."},{"t":"Szerzői díj (honorárium)","d":"A felhasználásért a szerzőnek járó díj; mértéke meghatározható a bevétellel arányosan, fix összegben vagy más módon; kikötése hiányában, illetve egyértelmű aránytalanság esetén a szerző bírósághoz fordulhat."}],"drills":[{"q":"Sorold fel a szerzői jogok átruházásának két alapvető módját!","a":["öröklés","élők közti jogügyletek"]},{"q":"Milyen elemeket kell pontosan meghatározni egy átruházási szerződésben (amelyek hiánya felbontásra jogosít)?","a":["az átruházott vagyoni jellegű jogok","a felhasználás módja mindegyik jogra külön","a felhasználás határideje","a szerzőnek járó díjazás"]},{"q":"Sorold fel a sajátos felhasználási eseteket (45–48. cikk)!","a":["szolgálati alkotások (45. cikk)","sajtóban megjelenő alkotások (46. cikk)","megrendelt alkotások (47. cikk)","képzőművészeti vagy fotóművészeti alkotások (48. cikk)"]},{"q":"Milyen két feltétel együttes teljesülése szükséges a felhasználási szerződés szerző általi felmondásához (48. cikk)?","a":["az engedményes nem vagy nem megfelelően használta fel az átruházott jogokat","a szerző törvényes érdekei ezáltal jelentősen sérülnek"]},{"q":"Sorold fel a szerzői jogi törvényben nevesített felhasználási szerződéseket!","a":["kiadói szerződés (49–58. cikk)","színpadi felhasználási szerződés (59–63. cikk)","bérleti szerződés (64. cikk)"]},{"q":"Sorold fel a kiadói szerződés kötelező tartalmi elemeit!","a":["az átruházás időtartama","területi korlátok, kizárólagos vagy nem kizárólagos jelleg","a példányszám minimuma és maximuma","a szerző jogdíjának meghatározása","az ingyenes tiszteletpéldányok száma","megjelenési és terjesztési határidők kiadásonként","az eredeti kézirat leadásának határideje","a kiadói példányszám ellenőrzésének lehetőségei"]},{"q":"Milyen műfajú alkotás lehet a színpadi felhasználási szerződés tárgya?","a":["irodalmi mű","zenei mű","pantomim","koreográfiai alkotás"]},{"q":"Milyen okok zárják ki, hogy a szerző a felhasználás elmaradása miatt felmondja a szerződést?","a":["a szerző saját hibája","harmadik személy cselekedete","kényszerítő körülmény / vis maior"]}]},{"num":116,"title":"Közös jogkezelés a szerzői jogban","essay":[{"prompt":"Fejtsd ki a közös jogkezelői megbízás formáit, valamint a kötelező és a fakultatív közös jogkezelés eseteit!","keyPoints":["A megbízási szerződés alapján a szerzőt szavazati jog illeti meg a közös jogkezelő közgyűlésében; közös alkotásnál az előadóművészek képviselőt jelölhetnek a szavazati jog gyakorlására","Közvetlen megbízáson kívül közvetett megbízási szerződéssel is felhatalmazható a jogkezelő: pl. külföldi jogkezelő szervezet köt szerződést hazai jogkezelővel tagjai repertoárjának felhasználására — ilyenkor a szerzők nem kapnak szavazati jogot a második jogkezelő közgyűlésében","Bármely szerzői jog tulajdonosa kérheti jogainak megbízás alapján való kezelését, és a közös jogkezelő köteles azt elvállalni","A közös jogkezelés egyes jogokra kötelező lehet, de kötelező közös jogkezelési esetet csak törvény írhat elő","Kötelező közös jogkezelés alá tartozik többek között: magánpéldányért járó kárpótlási díj, közkölcsönzésért járó méltányossági díj [18. cikk (2) bek.], követői jog, zenei művek rádiós lejátszása, zenei alkotások nyilvánossághoz közvetítése (a filmvetítés kivételével), előadóművészek és hangfelvétel-készítők méltányossági díja kereskedelmi felvételeknél, kábeles újraközvetítés, árva művek méltányossági díja, zenei művek multiterritoriális online licenszelése","A kötelező esetekben a jogtulajdonost megbízási szerződés hiányában is a közös jogkezelő képviseli","Fakultatív (lehetséges, de nem kötelező) közös jogkezelés (146. cikk): zenei alkotások hang- és videofelvétellel való többszörözése, egyéb alkotások nyilvánossághoz közvetítése (zenei és audiovizuális művek kivételével), kölcsönzési jog (a közkölcsönzés kivételével), audiovizuális alkotások rádiós sugárzása, a 119. cikk (1) bek. szerinti kölcsönzésből származó méltányossági díj","A fakultatív jogok kezelésére megbízás alapján kerül sor; a jogkezelést az ORDA (Oficiul Roman pentru Drepturile de Autor — Román Szerzői Jogi Hivatal) ellenőrzi és garantálja jogszerűségét","A kötelező eseteket kivéve a jogkezelő a bemutatott megbízási dokumentumok alapján engedélyezi a felhasználásokat","A közös jogkezelők megléte nem akadálya annak, hogy a szerző egyéni jogkezelés esetén más közvetítő szervezethez forduljon"]},{"prompt":"Mutasd be a közös jogkezelő szervezetek szabályozását: létrejöttüket, az ORDA szerepét és az alapszabályzat kötelező tartalmát!","keyPoints":["A közös jogkezelők jogi személyiséggel rendelkező, a szabad társulás elve alapján létrejött szervezetek","Alapvető tevékenységük a megbízóik alkotásaihoz fűződő jogok felhasználása után járó jogdíjak begyűjtése és szétosztása","A non-profit egyesületekre vonatkozó szabályok szerint, a szerzők vagy jogtulajdonosok kezdeményezésére jönnek létre, és az ORDA jóváhagyása mellett működnek","A jogtulajdonosokat a megbízási szerződés keretei között, a szervezet alapszabálya szerint képviselik; létrehozásuk alkotói területenként vagy felhasználási jogok szerint egyaránt lehetséges","A 152. cikk alapján hivatalból nyilvánosságra kell hozniuk: a képviselt jogtulajdonosok körét, a kezelt vagyoni jogokat, a felhasználók és a magánpéldány-díj fizetésére kötelezettek körét, a tevékenység jogszabályi alapját, a jogdíjbegyűjtés módozatait és felelőseit, valamint a tevékenységi beszámolót","Az ORDA működési jóváhagyásának feltételei: a román jogszabályok szerinti megalakulás és működés; a jogkezelésre átadott művek listájának és a külföldi jogkezelőkkel kötött szerződéseknek a benyújtása; törvényes alapszabályzat; a jogkezeléshez szükséges gazdasági képesség, valamint országos lefedettségű emberi és anyagi erőforrások; nyitottság minden, a tevékenységi területükön alkotó jogosult felé","Az ORDA működési engedélye alakisághoz kötött döntés, amelyet kötelező kihirdetni a Hivatalos Közlöny I. részében","Az ORDA hagyja jóvá az alapszabályzatot és annak minden módosítását; a módosítás visszautasítható, de a visszautasítást indokolni kell; az elfogadott alapszabályzat bejegyzés-köteles a területileg illetékes bíróságon","Az alapszabályzatnak a 157. cikk szerint tartalmaznia kell legalább: elnevezés, tevékenységi terület és tárgy, kezelt jogok; a jogkezelés feltételei az egyenlő bánásmód elvének megfelelően; tagsági jogok és kötelezettségek, a vezetőség kinevezése; alaptőke és gazdasági fedezet; a jogdíjak szétosztásának módszertana; a felhasználókkal szembeni képviselet; a tagság pénzügyi ellenőrzési lehetőségei; a tagság hozzájárulása a működési költségekhez","A jogkezelő nem utasíthat el a tevékenységi területéhez tartozó, törvényes feltételeknek megfelelő megbízási kérelmet, és nem lehet közvetlen felhasználója a rá bízott jogoknak","Kötelező közös jogkezelésnél azt az alkotót, aki egyetlen jogkezelőnek sem tagja, a legnagyobb tagsággal rendelkező közös jogkezelő képviseli"]},{"prompt":"Ismertesd a közös jogkezelés jogdíjakra vonatkozó legfőbb szabályait (169. cikk), és mutasd be a Romániában működő közös jogkezelő szervezeteket!","keyPoints":["A közös jogkezelésből származó jogdíjak 3 éves határidőn belül követelhetők, ellenkező esetben felhasználásukról a jogkezelő közgyűlése dönt","Két alapvető szabály: a begyűjtött jogdíjak nem képezhetik a jogkezelő vagyonát, és a megbízási szerződés keretében a szerzői jogok nem ruházhatók át a jogkezelő javára","A jogdíjak begyűjtéséről, kiosztásáról és a jogkezelés jelentős kérdéseiről a tagság dönt a közgyűlésen","A tagdíjak összege nem haladhatja meg az éves szinten begyűjtött összegek 15%-át, és automatikusan levonható a begyűjtött jogdíjakból","A jogdíjakból csak a tagság felhatalmazásával fordíthatók összegek közös célokra, kivéve a tényleges működési költségeket","A jogdíjak kiosztására a begyűjtéstől számított 6 hónapon belül kell sor kerülnie; a kiosztott összeg egyénileg meghatározott és arányos az adott alkotó műveinek felhasználásával","A nem igényelt jogdíjak befektetéséből származó jövedelem és a jogsértésekért megítélt kártérítések is kiosztásra kerülnek a tagság között","A szomszédos jogok felhasználási díja nem haladhatja meg az azonos felhasználótól szerzői jogokért kért összeg egyharmadát","Jelenleg összesen 16 közös jogkezelő szervezet működik Romániában: 8 a szerzői jogok és 8 a szomszédos jogok területén","Szerzői jogi jogkezelők: AOTO (teológiai, tudományos szövegek), ARDAA (videofelvételek, audiovizuális alkotások), COPYRO (írott alkotások), DACIN-SARA (film és audiovizuális alkotások), PERGAM (tudományos alkotások), OPERA SCRISA.RO (írott alkotások), UCMR-ADA (zenei művek), VISARTA (vizuális művészetek)","Szomszédos jogi jogkezelők: ADPFR (hangfelvétel-készítők), ARAIEX (előadóművészek), CREDIDAM (előadóművészek), UNART (előadóművészek), UPFAR-ARGOA (audiovizuális- és filmalkotás-készítők), UPFR (hangfelvétel-készítők), UPIF (hangfelvétel-készítők), SOPFIA (audiovizuális alkotások)"]}],"terms" nbségeket számolják fel","A Lisszaboni Szerződés hatáskört adott egy európai szintű egységes szerzői jogi oltalmi rendszer létrehozására (EUMSZ 118. cikk)","Az EUMSZ 118. cikk alapján a Parlament és a Tanács rendes jogalkotási eljárásban egységes európai oltalmi jogcímeket és uniós szintű központi engedélyezési, koordinációs és ellenőrzési rendszert hozhat létre","Az egységes európai szerzői jogra vonatkozó törekvések koraiaknak bizonyultak: a Wittem-csoport 2010-es európai szerzői jogi mintakódexe és a Bizottság audiovizuális zöld könyvének kódex-felvetése nem talált támogatásra","Ezért a szerzői jogi harmonizáció legfontosabb jogalapja egyelőre továbbra is a 114. cikk marad"]},{"prompt":"Mutasd be az EU szerzői jogra vonatkozó külső hatáskörét és az uniós szerzői jog viszonyát a nemzetközi joghoz!","keyPoints":["A szerződések az Unió kizárólagos hatáskörébe utalták a közös kereskedelempolitikát, amely magába foglalja a szellemi tulajdonjogok kereskedelmi vonatkozásait is","Ezért a szellemi tulajdon kereskedelmi vonatkozásait szabályozó nemzetközi egyezmények megkötése az Unió kizárólagos hatáskörébe tartozik","Ezt a hatáskört a Lisszaboni Szerződés tisztázta, és a Bíróság Daiichi Sankyo ítélete megerősítette","EUMSZ 207. cikk (6) bek.: a közös kereskedelempolitikai hatáskörök gyakorlása nem sértheti az Unió és a tagállamok közötti hatáskörmegosztást, és nem vezethet jogharmonizációhoz ott, ahol a Szerződések azt kizárják","A Bíróság szerint a közösségi jog rendelkezéseit amennyire lehetséges a nemzetközi jog figyelembevételével kell értelmezni","Ez különösen igaz, amikor az uniós rendelkezések éppen a Közösség által megkötött nemzetközi megállapodások végrehajtását szolgálják"]}],"terms":[{"t":"Belső piac","d":"Belső határok nélküli térség, amelyben a Szerződésekkel összhangban biztosított az áruk, a személyek, a szolgáltatások és a tőke szabad mozgása."},{"t":"EUMSZ 26. cikk","d":"Jogalapot biztosít a belső piac létrehozását és fenntartását szolgáló másodlagos uniós jog megalkotásához."},{"t":"EUMSZ 114. cikk","d":"Felhatalmazza az Uniót jogharmonizációs intézkedések elfogadására a belső piac megteremtése és működése érdekében; a szerzői jogi harmonizáció legfontosabb jogalapja."},{"t":"EUMSZ 118. cikk","d":"A Lisszaboni Szerződéssel bevezetett jogalap egységes európai szellemi tulajdonjogi oltalmi jogcímek és uniós szintű központi engedélyezési, koordinációs és ellenőrzési rendszer létrehozására."},{"t":"Wittem-csoport","d":"Az európai szellemi tulajdon vezető akadémikusaiból álló csoport, amely 2010-ben európai szerzői jogi mintakódexet dolgozott ki; a szakirodalom korainak találta a kezdeményezést."},{"t":"Daiichi Sankyo ítélet","d":"A Bíróság ítélete, amely megerősítette, hogy a szellemi tulajdon kereskedelmi vonatkozásai a közös kereskedelempolitika részeként az Unió kizárólagos hatáskörébe tartoznak."},{"t":"EUMSZ 207. cikk (6) bek.","d":"A közös kereskedelempolitikai hatáskörök gyakorlása nem sértheti az Unió és a tagállamok közötti hatáskörmegosztást, és nem vezethet a Szerződések által kizárt jogharmonizációhoz."}],"drills":[{"q":"Sorold fel a belső piacon biztosított négy szabadságot!","a":["az áruk szabad mozgása","a személyek szabad mozgása","a szolgáltatások szabad mozgása","a tőke szabad mozgása"]},{"q":"Sorold fel az EU szerzői jogi hatáskörének legfontosabb EUMSZ-jogalapjait!","a":["26. cikk (belső piac létrehozása és fenntartása)","114. cikk (jogharmonizációs intézkedések)","118. cikk (egységes európai oltalmi jogcímek)","207. cikk (közös kereskedelempolitika, külső hatáskör)"]}]},{"num":118,"title":"A szerzői jog harmonizációjának rövid áttekintése","essay":[{"prompt":"Fejtsd ki az uniós szerzői jogi harmonizáció kezdeteit és a 90-es évek irányelveit!","keyPoints":["A harmonizáció igényéről először 1988-ban tett említést a Bizottság a szerzői jogról és a technológiai kihívásokról szóló zöld könyvében","A Bizottság felismerte a szerzői jog territorialitásából fakadó áru- és szolgáltatásszabadsági akadályok feloldásának és a jogvédett áruk és szolgáltatások közösségi piaca kialakításának szükségességét","A territoriális jelleget teljesen nem lehetett felszámolni, mert a létező szellemi tulajdonjogi egyezmények a nemzeti szabályozás elvére épülnek","A 90-es években 5 irányelv került elfogadásra, ezekből 2 még mindig hatályban van","Az öt irányelv: számítógépi programok irányelv, bérleti és haszonkölcsönzési (és szomszédos jogi) irányelv, műholdas sugárzás irányelv, védelmi idő irányelv, adatbázis irányelv","Mindegyik tematikus: egyik sem törekszik átfogó, horizontális harmonizációra, csak a szerzői jog egyes aspektusaira vonatkozó tagállami jogszabályokat közelítik","Az adatbázis irányelv túlmegy a szerzői jogi védelmen: III. fejezete sui generis jogot biztosít az adatbázis-előállítóknak, ha a tartalom megszerzése, ellenőrzése vagy előállítása minőségileg vagy mennyiségileg jelentős ráfordítással járt","Az 1995-ös zöld könyv a szerzői és szomszédos jogokról az információs társadalomban új irányvonalat jelölt ki","Az 1995-ös zöld könyv alapgondolatai: a nemzeti jogok különbségei korlátozzák az információalapú termékek és szolgáltatások szabad áramlását; a szerzői jogok megerősítése az európai kulturális örökség és művészi alkotótevékenység legfőbb eszköze; elő kell mozdítani az európai gazdaság versenyképességét","A TRIPS-megállapodás elfogadása is hozzájárult a fejlődéshez: az Európai Közösség a tagállamaival közösen fogadta el a WTO-t létrehozó szerződés aláírásakor","Bár a későbbi irányelvek elsősorban nem a TRIPS átültetését célozták, a Bizottság tudatában volt a nemzetközi egyezményeknek való megfelelés szükségességének"]},{"prompt":"Mutasd be az Infosoc irányelvet: céljait, szerkezetét és harmonizációs jellegét!","keyPoints":["A 2000-es évek elején fogadta el a Parlament és a Tanács; az EU legfontosabb szerzői jogi harmonizációs jogforrása","Az európai szerzői jogharmonizáció eddigi legátfogóbb, horizontális jellegű eszköze","Kettős célja: az információs társadalom európai fejlődésének elősegítése és a szellemi tulajdon magas szintű védelmének biztosítása","A (15) preambulumbekezdés szerint a WIPO internetszerződéseinek rendelkezéseit is átültette a közösségi jogba","Három részre osztható: 1) harmonizálja a legfontosabb vagyoni jogokat (többszörözés, nyilvánossághoz közvetítés és nyilvánosság számára hozzáférhetővé tétel, terjesztés)","2) meghatározza a vagyoni jogokra vonatkozó kötelező és opcionális korlátozások és kivételek kimerítő listáját","3) rendelkezik a műszaki intézkedések és a jogkezelési adatok védelméről","Minimumharmonizációt valósít meg: a nemzeti rendelkezéseket csak a belső piac zavartalan működéséhez szükséges mértékben kell módosítani","Csak azokat a tagállami szabályokat kell harmonizálni, amelyek a belső piacot akadályozzák, az információs társadalom fejlődését hátráltatják, jogbizonytalanságot vagy ellentmondásokat eredményeznek","A belső piac működését hátrányosan nem befolyásoló eltérések megszüntetése nem szükséges"]},{"prompt":"Fejtsd ki a 2000-es évek további irányelveit és a DSM-stratégiával elindult uniós szerzői jogi reformot!","keyPoints":["A 21. század első évtizedében az Infosoc irányelv mellett 4 kiemelkedő jelentőségű, szerzői jogot is érintő jogforrás született: a jogérvényesítési irányelv, az árva művek irányelve, a közös jogkezelésről szóló irányelv és az elektronikus kereskedelemről szóló irányelv","2015 májusában a digitális egységes piaci stratégia (DSM-stratégia) nyilvánosságra hozatalával elkezdődött az uniós szerzői jog reformja","A célkitűzések a 2015 júliusában elfogadott Reda-jelentés hatására is hangsúlyosabb szerepet kaptak; a Bizottság 2015 decemberi közleményében felvázolta megvalósításuk módját","2016. szeptember 14-én, az Unió helyzetéről tartott beszédében a Bizottság bejelentette, hogy 3 szinten korszerűsíti az uniós szerzői jogi szabályokat","1. szint: a választék bővítése és a kulturális tartalmak online, tartózkodási helytől független elérésének javítása","2. szint: jobb szabályozás az oktatás, a kutatás és a kulturális örökségvédelem terén, valamint a hozzáférés javítása a fogyatékos személyek számára","3. szint: méltányosabb feltételeket garantáló, fenntartható piactér az alkotók, a kreatív ágazat és a sajtó számára","A 3 célkitűzés elérésére 2 irányelvjavaslatot és 2 rendeletjavaslatot terjesztett elő, ezekből egy irányelv és egy rendelet már elfogadásra került","A 2018-ig kialakult uniós szabályozás továbbra is töredékes és hézagos: nem született átfogó egységes szerzői jogi szabályozás, az Unió pontszerű beavatkozásokkal hárítja el a tagállami szabályozások különbözőségéből fakadó akadályokat"]}],"terms":[{"t":"1988-as zöld könyv","d":"A Bizottság zöld könyve a szerzői jogról és a technológiai kihívásokról; először itt merült fel a szerzői jogi harmonizáció igénye."},{"t":"Adatbázis irányelv (96/9/EK)","d":"A szerzői jogi védelmen túl sui generis jogot biztosít azon adatbázis-előállítóknak, akiknél a tartalom megszerzése, ellenőrzése vagy előállítása jelentős ráfordítással járt."},{"t":"Sui generis jog","d":"Az adatbázis irányelv III. fejezete által az adatbázis-előállítóknak biztosított, a szerzői jogtól független védelem a jelentős ráfordítással létrehozott adatbázisokra."},{"t":"1995-ös zöld könyv","d":"Zöld könyv a szerzői és szomszédos jogokról az információs társadalomban; a nemzeti jogok különbségeinek lebontását, a szerzői jogok megerősítését és a versenyképesség előmozdítását tűzte ki."},{"t":"TRIPS-megállapodás","d":"A szellemi tulajdonjogok kereskedelmi vonatkozásairól szóló megállapodás, amelyet az Európai Közösség a tagállamaival közösen fogadott el a WTO-t létrehozó szerződés aláírásakor."},{"t":"Infosoc irányelv (2001/29/EK)","d":"Az EU legfontosabb, horizontális szerzői jogi harmonizációs jogforrása: harmonizálja a fő vagyoni jogokat, kimerítő listát ad a kivételekről, és védi a műszaki intézkedéseket és jogkezelési adatokat; minimumharmonizáció."},{"t":"Minimumharmonizáció","d":"Az Infosoc irányelv harmonizációs elve: a nemzeti szabályokat csak a belső piac zavartalan működéséhez szükséges mértékben kell módosítani."},{"t":"DSM-stratégia","d":"A 2015 májusában nyilvánosságra hozott digitális egységes piaci stratégia, amellyel elkezdődött az uniós szerzői jog reformálása."},{"t":"Reda-jelentés","d":"2015 júliusában elfogadott jelentés, amelynek hatására a DSM-stratégia szerzői jogi célkitűzései hangsúlyosabb szerepet kaptak."},{"t":"Szerzői jogi acquis","d":"A szerzői jog terén megalkotott uniós normák összessége: tematikus irányelvek és rendeletek 1993-tól (műholdas irányelv) 2017-ig (hordozhatósági rendelet, Marrákes-i átültető irányelv és rendelet)."}],"drills":[{"q":"Sorold fel a 90-es években elfogadott 5 szerzői jogi irányelvet!","a":["számítógépi programok irányelv","bérleti és haszonkölcsönzési, valamint szomszédos jogokról szóló irányelv","műholdas sugárzás irányelv","védelmi idő irányelv","adatbázis irányelv"]},{"q":"Sorold fel az Infosoc irányelv három szabályozási részét!","a":["a legfontosabb vagyoni jogok harmonizálása (többszörözés, nyilvánossághoz közvetítés és hozzáférhetővé tétel, terjesztés)","a kötelező és opcionális korlátozások és kivételek kimerítő listája","a műszaki intézkedések és a jogkezelési adatok védelme"]},{"q":"Sorold fel az Infosoc irányelv kettős célját!","a":["az információs társadalom európai fejlődésének elősegítése","a szellemi tulajdon magas szintű védelmének biztosítása"]},{"q":"Sorold fel a 21. század első évtizedének 4 kiemelkedő, szerzői jogot is érintő jogforrását (az Infosoc irányelven kívül)!","a":["jogérvényesítési irányelv","árva művek irányelve","közös jogkezelésről szóló irányelv","elektronikus kereskedelemről szóló irányelv"]},{"q":"Sorold fel a Bizottság 2016-ban bejelentett 3 szintjét az uniós szerzői jog korszerűsítésére!","a":["a választék bővítése és a kulturális tartalmak online, tartózkodási helytől független elérésének javítása","jobb szabályozás az oktatás, kutatás, kulturális örökségvédelem terén és a fogyatékos személyek hozzáférésének javítása","méltányosabb, fenntartható piactér az alkotók, a kreatív ágazat és a sajtó számára"]},{"q":"Sorold fel az 1995-ös zöld könyv alapgondolatait!","a":["a nemzeti jogok közti különbségek korlátozzák az információalapú termékek és szolgáltatások szabad áramlását","a szerzői jogok megerősítése az európai kulturális örökség és művészi alkotótevékenység legfőbb eszköze","elő kell mozdítani az európai gazdaság versenyképességét"]}]},{"num":119,"title":"A nyilvánossághoz közvetítés az Európai Unió joggyakorlatában","essay":[{"prompt":"Fejtsd ki, milyen szerepet játszik az Európai Unió joga és az EUB joggyakorlata a nyilvánossághoz közvetítés jogának alakításában, és mutasd be az SGAE kontra Rafael Hotels ügyet!","keyPoints":["Az uniós jog elsőbbségének alapelve: az uniós jog és a nemzeti jog ütközése esetén az uniós jogot kell alkalmazni.","Az EU joga kétféleképpen befolyásolta az európai szerzői jogot: a jogharmonizációs tevékenység és az EUB joggyakorlata által.","A szerzői jog terén az előzetes döntéshozatali kérdések jelentős része a nyilvánossághoz közvetítés értelmezésére vonatkozott.","Jogalap: szerzői művek esetén az Infosoc irányelv 3. cikke, szomszédos jogok esetén a Bérlet irányelv 8. cikk (2) bekezdése.","Az SGAE spanyol közös jogkezelő szerint a Rafael szállodáiban működtetett televíziók és zenei háttérkészülékek védett művek jogosulatlan nyilvánossághoz közvetítését tették lehetővé.","Az elsőfokú bíróság a szállodai szobákra alapított keresetet elutasította, de a közös helyiségekben történő használatot jogsértőnek találta; az ügy előzetes döntéshozatalra került az EUB elé.","Az Infosoc irányelv nem definiálja a nyilvánossághoz közvetítést, ezért a Bíróság a Berni Egyezményből és annak 1978-as útmutatójából inspirálódott.","A Bíróság szerint a szálloda vendégköre új közönséget alkot: a szálloda közvetítőként jár el, beavatkozása nélkül a vendégek elvileg nem tudnák a sugárzott művet megtekinteni.","A szállodai szobák magánjellege nem zárja ki, hogy a televíziókészülékek útján történő közvetítés nyilvánossághoz közvetítésnek minősüljön.","Értékelés: az ügy kimenetele igazságos, de az új közönség elméletére alapuló érvelés összeférhetetlen a szerzői jog szerkezetével, ami a későbbi ítéletekből is kiderül."]},{"prompt":"Mutasd be az ITV Broadcasting és társai (TVCatchup) ügyet, és értékeld annak hatását a nyilvánossághoz közvetítés értelmezési kritériumaira!","keyPoints":["A felperesek kereskedelmi televíziós műsorsugárzó szervezetek, amelyek szerzői jogokkal rendelkeznek saját műsoraik, azok elemei és filmalkotásaik tekintetében.","Az alperes TVC internetalapú közvetítési szolgáltatást kínált: a felhasználók élőben, térítésmentesen nézhették a televíziós műsorokat az interneten.","A felhasználók csak olyan tartalomhoz férhettek hozzá, amelyhez érvényes televíziós engedély birtokában is jogosultak voltak; a honlap ellenőrző eszközökkel tagadta meg a hozzáférést a feltételek hiányában.","Ezért új közönségről nem lehetett beszélni: a felhasználók csak azt nézhették, amit televízión is megnézhettek volna.","A High Court of Justice előzetes döntéshozatali kérdése: nyilvánossághoz közvetítés-e az eredeti műsorsugárzótól eltérő szervezet általi továbbközvetítés, ha bizonyíthatóan nincs új közönség.","A Bíróság elutasította az alperes érvét: a földfelszíni sugárzásba foglalt és interneten hozzáférhetővé tett művek közvetítéseit egyénileg és elkülönülten kell engedélyezni, mert specifikus technikai feltételek mellett valósulnak meg.","Ilyen esetben nincs szükség az új nyilvánosság vizsgálatára; az csak az SGAE-hez hasonló helyzetekben releváns.","A Bíróság így szembesült azzal, hogy nyilvánossághoz közvetítés új közönség nélkül is megvalósulhat.","Kritika: a Bíróság mégis fenntartotta az új közönség elméletét, és mellé bevezette a specifikus technikai feltételek kritériumát."]},{"prompt":"Ismertesd a Svensson-ügy tényállását, a Bíróság érvelését és az ítélet jelentőségét a linkelés szerzői jogi megítélésében!","keyPoints":["A felperes újságírók cikkei a Göteborgs-Posten újságban és annak honlapján szabadon hozzáférhetően jelentek meg.","A Retriever Sverige más honlapokon megjelent cikkekre mutató kattintható linkek listáját nyújtotta ügyfeleinek, köztük a felperesek cikkeire; a felperesek kártérítést követeltek engedély nélküli felhasználás miatt.","Az alperes védekezése: nem továbbított védett művet, csupán megjelölte, hol találhatók a művek.","Az EUB elé terjesztett fő kérdés: nyilvánossághoz közvetítés-e a más oldalon szabadon hozzáférhető védett művekre mutató kattintható linkek szolgáltatása.","A Bíróság a fogalom két elemét vizsgálta: a közvetítés cselekményét és a nyilvánosságot.","Első elem: a kattintható linkek szolgáltatása hozzáférhetővé tételnek, így közvetítésnek minősül; a közvetítés fogalmát tágan kell értelmezni — elegendő a hozzáférés lehetősége, nem szükséges, hogy éltek is vele.","Második elem: azonos technikai mód (internet) esetén a közvetítésnek új nyilvánosságot kell megcéloznia, amelyet a jogosultak az eredeti engedélyezéskor nem vettek figyelembe.","Mivel az eredeti közvetítés célközönsége az összes internethasználó volt (a hozzáférést semmi nem korlátozta), a link nem közvetít új nyilvánossághoz, így a jogosultak engedélye nem szükséges.","A második kérdésre a Bíróság kimondta: a tagállam nem határozhatja meg tágabban a nyilvánossághoz közvetítés fogalmát, mint az Infosoc irányelv 3. cikk (1) bekezdése.","Az ítéletet a szakirodalomban rengeteg kritika érte; az új közönség elméletének alkalmatlansága és a nemzetközi szerzői joggal való összeférhetetlensége itt került igazán felszínre."]},{"prompt":"Fejtsd ki a GS Media ügy tényállását és a Bíróság által felállított kritériumrendszert a jogellenesen közzétett művekre mutató hiperlinkek megítélésére!","keyPoints":["2011 októberében a GS Media által működtetett GeenStijl.nl holland bulvároldal hiperlinket tett közzé egy, a filefactory.com ausztrál oldalon tárolt mappára.","A mappa a Sanoma (a Playboy kiadója) megrendelésére készült fényképeket tartalmazta, amelyeknek a Playboy 2011. decemberi számában kellett volna megjelenniük.","A GS Media felszólítások ellenére sem törölte a linkeket, sőt további két linket publikált; a fotók végül 2011 decemberében jelentek meg a Playboyban.","A Hoge Raad (holland legfelső bíróság) előzetes döntéshozatali kérdése: nyilvánossághoz közvetítés-e a jogosult engedélye nélkül hozzáférhető művekre mutató hiperlink elhelyezése, és milyen körülmények között.","A Bíróság: az engedély nélkül közzétett művekre mutató link főszabály szerint nem zárható ki a nyilvánossághoz közvetítés fogalma alól — a jogosultnak minden közvetítési cselekményt engedélyeznie kell.","Ha a link elhelyezője nem haszonszerzési célból jár el, figyelembe kell venni, hogy nem tudja és nem is tudhatja, hogy a művet engedély nélkül tették közzé.","Ha viszont bizonyíthatóan tudta vagy tudnia kellett, hogy a link jogellenesen közzétett műhöz vezet, a link elhelyezése nyilvánossághoz közvetítésnek minősül; ugyanez áll a hozzáférést korlátozó műszaki intézkedések megkerülésére.","Haszonszerzési cél esetén elvárható az ellenőrzés elvégzése, ezért vélelmezhető, hogy az engedély nélküli elhelyezés tudatos; ha a vélelmet nem döntik meg, a link szolgáltatása nyilvánossághoz közvetítés.","Kritika: a tényállás újból bizonyította az új közönség doktrína fenntarthatatlanságát, de a Bíróság a szándékosság és a haszonszerzési jelleg kritériumaival egészítette ki azt.","A szándékosság vizsgálata ellentmond a szerzői jogi alapelveknek, mert a szerzői jogi felelősség alapvetően objektív felelősség.","A haszonszerzési jelleg legfeljebb súlyosbító körülmény lehet a kártérítés összegének meghatározásakor, de nem a nyilvánossághoz közvetítés alkotóeleme."]},{"prompt":"Hasonlítsd össze a Del Corso és a Reha Training ügyeket: tényállás, a Bíróság érvelése és a két ítélet közötti ellentmondás!","keyPoints":["Del Corso: az SCF olasz közös jogkezelő pert indított, mert Del Corso torinói fogorvosi magánrendelőjében háttérzeneként védett hangfelvételeket sugárzott, méltányos díjat követelve.","A Bíróság elhatárolta az Infosoc irányelv 3. cikkét (preventív jellegű jog: a szerző megtilthatja a közvetítést) a Bérlet irányelv 8. cikk (2) bekezdésétől (kompenzációs jellegű, alapvetően gazdasági jog).","A fogorvos nem számíthat arra, hogy a zene növeli a rendelő forgalmát vagy a kezelés árát; a páciensek kizárólag kezelés céljából jönnek, és akaratuktól függetlenül, véletlenszerűen hallják a felvételeket — a sugárzásnak nincs haszonszerző jellege.","A nyilvánosság fogalma: meghatározatlan számú lehetséges címzett és viszonylag jelentős számú egyén; a túlságosan kicsi, jelentéktelen kör kizárt.","A fogorvos páciensei megszilárdult összetételű, meghatározott kört alkotnak, számuk alacsony, és egymást váltva nem ugyanannak a felvételnek a címzettjei — ezért nincs nyilvánossághoz közvetítés, és díjigény sem keletkezik.","Faludi Gábor és Grad-Gyenge Anikó kritikája: a fogorvosi váróterem közönsége nem kevésbé nyilvános, mint a szállodai vendég; a rendelő józan ésszel nem a magánszféra része, hanem a szukcesszív nyilvánosság példája.","Reha Training: a rehabilitációs központ 2012-2013 között várótermeiben és edzőtermében televíziós műsorokat tett elérhetővé a GEMA engedélye nélkül; az ügyet az EUB 13 bíróból álló nagytanácsban tárgyalta.","A Bíróság összefoglalta joggyakorlatát: a fogalom két eleme (közvetítési cselekmény és nyilvánosság), a specifikus technikai módú közvetítések külön engedélyezése, az új közönség követelménye, a haszonszerzési jelleg nem meghatározó, de nem is irreleváns.","A Bíróság különbséget tett a pub, szálloda, gyógyfürdő (nyilvánossághoz közvetítés) és a fogorvosi rendelő (nem az) között.","A rehabilitációs központ helyzetét a pubéval, szállodáéval hasonlította össze: páciensei általánosságban meghatározott személyek, körük nem túlságosan kicsi, a tévésugárzás kiegészítő szolgáltatásként növeli az intézmény vonzerejét és versenyelőnyt ad — tehát nyilvánossághoz közvetítés valósult meg.","A két ítélet összevetése után a jogalkalmazók számára továbbra is bizonytalan, hogy egy adott szolgáltató klienskörét melyik kategóriába kell sorolni."]},{"prompt":"Ismertesd a Globus cirkusz ügyet: a román kötelező közös jogkezelés problémája és a nyilvánossághoz közvetítés fogalmának leszűkítése!","keyPoints":["Az ügy romániai vonatkozású: rámutatott a román szerzői jogi törvény indokolatlan szigorúságára a zeneművek kötelező közös jogkezelését illetően.","A Globus cirkusz 2004 májusa és 2007 szeptembere között nyilvános előadásokon zeneműveket tett érzékelhetővé jövedelemszerzési céllal, az UCMR-ADA engedélye és díjfizetés nélkül.","Az UCMR-ADA az 1996. évi 8. törvény 123. cikk (1) bek. e) pontjára [ma 145. cikk (1) bek. e) pont] hivatkozott: a zeneművek nyilvánossághoz közlésének joga kötelező közös jogkezelés alá tartozik.","A Globus védekezése: közvetlenül a zeneszerzőkkel kötött szerződést és nekik fizetett, mert a jogosultak az egyéni jogkezelést választották.","A Bukaresti Törvényszék és az Ítélőtábla a közös jogkezelő javára döntött: a díjat a szerzőkkel kötött szerződésektől függetlenül meg kellett volna fizetni.","A Legfelső Semmítő- és Ítélőszék szerint az ilyen szabályozás első ránézésre a szerződéses szabadság túlzott korlátozása, és előzetes döntéshozatalt kezdeményezett.","Az első kérdés: a nyilvánossághoz közvetítés csak azt fedi-e le, amikor a nyilvánosság nincs jelen a közvetítés kiindulópontján, vagy a mű bármely, a nyilvánosság számára nyitva álló helyen való közvetlen érzékelhetővé tételét (előadás, bemutatás) is.","A Bíróság az Infosoc irányelv (23) preambulumbekezdése alapján kimondta: a nyilvánossághoz közvetítés nem vonatkozik a közvetlen bemutatásra vagy előadásra — csak arra, amikor a nyilvánosság nincs jelen a közvetítés kiindulópontjául szolgáló helyszínen.","Az irányelv célja az információs társadalom európai fejlődésének elősegítése, így a harmonizáció nem a hagyományos közlési formákat (közvetlen bemutatás, előadás) célozta.","Mivel a közvetlen érzékelhetővé tétel kikerült a fogalomból, a Bíróság a román kötelező közös jogkezelésre vonatkozó 4. kérdést nem válaszolta meg."]}],"terms":[{"t":"Az uniós jog elsőbbségének alapelve","d":"Az uniós jog és a nemzeti jog ütközése esetén az uniós jogot kell alkalmazni."},{"t":"A nyilvánossághoz közvetítés uniós jogalapja","d":"Szerzői művek esetén az Infosoc irányelv 3. cikke, szomszédos jogok esetén a Bérlet irányelv 8. cikk (2) bekezdése."},{"t":"Infosoc irányelv 3. cikke","d":"A nyilvánossághoz közvetítés preventív jellegű jogát biztosítja: a szerző megtilthatja műve nyilvánossághoz közvetítését."},{"t":"Bérlet irányelv 8. cikk (2) bekezdése","d":"A szomszédos jogi jogosultak kompenzációs, alapvetően gazdasági jellegű díjigénye a nyilvánosságra hozott hangfelvétel nyilvánossághoz közvetítése esetén."},{"t":"Új közönség elmélete","d":"Az SGAE-ügyben kialakított doktrína: nyilvánossághoz közvetítés akkor valósul meg, ha a művet olyan közönséghez juttatják el, amelyet a jogosult az eredeti engedélyezéskor nem vett figyelembe."},{"t":"Specifikus technikai feltételek kritériuma","d":"Az ITV Broadcasting-ügyben bevezetett kritérium: az eltérő technikai módon megvalósuló közvetítéseket egyénileg és elkülönülten kell engedélyezni, új közönség vizsgálata nélkül."},{"t":"SGAE kontra Rafael Hotels-ügy","d":"A szállodai szobákban elhelyezett televíziókészülékek útján történő műsorközvetítés nyilvánossághoz közvetítés, mert a szálloda vendégköre új közönséget alkot; a szobák magánjellege ezt nem zárja ki."},{"t":"ITV Broadcasting és társai (TVCatchup)-ügy","d":"A televíziós műsorok más szervezet általi internetes továbbközvetítése új közönség hiányában is nyilvánossághoz közvetítés, mert specifikus technikai feltételek mellett, eltérő módon valósul meg."},{"t":"Svensson-ügy","d":"A más honlapon szabadon hozzáférhető művekre mutató kattintható link közvetítés ugyan, de nem céloz új nyilvánosságot, e erzői jogi felelősség alapvetően objektív, ezért a GS Media-ügyben bevezetett szándékosság-vizsgálat ellentmond a szerzői jogi alapelveknek."}],"drills":[{"q":"Sorold fel a fejezetben tárgyalt, nyilvánossághoz közvetítéssel kapcsolatos EUB-ügyeket!","a":["SGAE kontra Rafael Hotels","ITV Broadcasting és társai (TVCatchup)","Svensson","GS Media","Del Corso","Reha Training","Globus cirkusz"]},{"q":"Sorold fel a nyilvánossághoz közvetítés fogalmának két elemét a Svensson-ítélet alapján!","a":["a közvetítés cselekménye","a nyilvánosság"]},{"q":"Sorold fel, milyen esetekben minősül a GS Media-ítélet szerint nyilvánossághoz közvetítésnek a hiperlink elhelyezése!","a":["ha az elhelyező tudta vagy tudnia kellett, hogy a link jogellenesen közzétett műhöz vezet","ha a link a hozzáférést korlátozó műszaki intézkedések megkerülését teszi lehetővé","ha az elhelyezés haszonszerzési célból történik, és a tudatosság vélelmét nem döntik meg"]},{"q":"Sorold fel, milyen érvekkel zárta ki a Bíróság a Del Corso-ügyben a fogorvosi rendelő pácienseit a nyilvánosság fogalmából!","a":["megszilárdult összetételű, meghatározott kört alkotnak, nem általánosságban meghatározott személyek","számuk alacsony, sőt jelentéktelen, az egyidejűleg jelen lévők köre behatárolt","egymást váltva nem ugyanannak a hangfelvételnek a címzettjei","a sugárzásnak nincs haszonszerző jellege, a páciensek akaratuktól függetlenül hallják"]},{"q":"Sorold fel, milyen helyszíneken minősül a Reha Training-ítélet szerint nyilvánossághoz közvetítésnek a védett művek sugárzása, és hol nem!","a":["nyilvánossághoz közvetítés: pub","nyilvánossághoz közvetítés: szálloda","nyilvánossághoz közvetítés: gyógyfürdő-intézmény","nyilvánossághoz közvetítés: rehabilitációs központ","nem az: fogorvosi rendelő"]},{"q":"Sorold fel, milyen kritériumokkal egészítette ki az EUB az új közönség elméletét az egyes ítéletekben!","a":["specifikus technikai feltételek kritériuma (ITV Broadcasting/TVCatchup)","a jogsértő szándékosságának kritériuma (
