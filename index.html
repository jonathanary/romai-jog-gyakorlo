<!doctype html>
<html lang="hu">
<meta charset="utf-8">
<title>Római jog gyakorló</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --surface2:#F2ECE3;
  --ink:#2A2430; --muted:#6E6577; --line:#E4DCD0;
  --accent:#7A1F4D; --accent-ink:#FFF6FB; --accent-soft:#F3E2EB;
  --bronze:#9C7A45; --bronze-soft:#EFE6D6;
  --ok:#2E7D4F; --ok-soft:#DFEEE5; --warn:#B45309; --warn-soft:#F6E8D7; --bad:#A33B3B; --bad-soft:#F2DEDE;
  --shadow:0 1px 3px rgba(42,36,48,.08),0 4px 16px rgba(42,36,48,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191322; --surface:#241C2E; --surface2:#2E2439;
    --ink:#EFE7DC; --muted:#A79DB0; --line:#3A2F47;
    --accent:#D486AE; --accent-ink:#2B0E1E; --accent-soft:#3D2233;
    --bronze:#C9A26B; --bronze-soft:#3A3040;
    --ok:#6FBF8F; --ok-soft:#22382D; --warn:#E0A458; --warn-soft:#3D3222; --bad:#D98A8A; --bad-soft:#3E2727;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#191322; --surface:#241C2E; --surface2:#2E2439;
  --ink:#EFE7DC; --muted:#A79DB0; --line:#3A2F47;
  --accent:#D486AE; --accent-ink:#2B0E1E; --accent-soft:#3D2233;
  --bronze:#C9A26B; --bronze-soft:#3A3040;
  --ok:#6FBF8F; --ok-soft:#22382D; --warn:#E0A458; --warn-soft:#3D3222; --bad:#D98A8A; --bad-soft:#3E2727;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Alegreya Sans",system-ui,sans-serif;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:640px;margin:0 auto;padding:0 16px 48px}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.topbar{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 2px 10px;border-bottom:1px solid var(--line)}
.topbar .back{font-family:"Alegreya Sans";font-weight:700;font-size:15px;color:var(--accent);padding:6px 10px 6px 0;flex:none}
.topbar h1{font-family:Cinzel,serif;font-weight:700;font-size:17px;margin:0;letter-spacing:.04em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub{font-size:13px;color:var(--muted);flex:none}
.hero{padding:26px 2px 6px}
.hero .kicker{font-family:"Alegreya Sans";font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze)}
.hero h1{font-family:Cinzel,serif;font-weight:700;font-size:26px;margin:4px 0 2px;text-wrap:balance}
.hero p{font-family:Alegreya,serif;color:var(--muted);margin:4px 0 0;font-size:16px}
.progressline{display:flex;align-items:center;gap:10px;margin:16px 2px 4px}
.progressline .bar{flex:1;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.progressline .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.progressline span{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.weakcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:14px 16px;margin:14px 0 4px}
.weakcard .n{font-family:Cinzel,serif;font-weight:700;font-size:24px;color:var(--accent);min-width:34px;text-align:center}
.weakcard .t{flex:1}
.weakcard .t b{display:block;font-size:15px}
.weakcard .t small{color:var(--muted);font-size:13px}
.weakcard .go{font-weight:800;color:var(--accent)}
.part{margin-top:26px}
.part>h2{font-family:Cinzel,serif;font-weight:600;font-size:13px;letter-spacing:.12em;color:var(--bronze);margin:0 2px 8px;text-transform:uppercase}
.chlist{display:flex;flex-direction:column;gap:8px}
.chrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.chrow .num{font-family:Cinzel,serif;font-weight:700;font-size:15px;color:var(--bronze);min-width:26px;text-align:right}
.chrow .title{flex:1;font-size:15px;font-weight:500;min-width:0}
.chrow .dots{display:flex;gap:5px;flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.dot.part-done{background:var(--warn);border-color:var(--warn)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.weak{background:var(--bad);border-color:var(--bad)}
.legend{display:flex;gap:14px;margin:10px 2px 0;color:var(--muted);font-size:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.modes{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.mode .ic{font-family:Cinzel,serif;font-weight:700;font-size:20px;color:var(--accent);width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);border-radius:10px;flex:none}
.mode .tx{flex:1}
.mode .tx b{display:block;font-size:16px}
.mode .tx small{color:var(--muted);font-size:13px}
.mode .st{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.mode .st.done{color:var(--ok)}
.mode .st.weak{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-top:16px}
.card .label{font-family:"Alegreya Sans";font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze);margin-bottom:8px}
.prompt{font-family:Alegreya,serif;font-size:19px;line-height:1.5;margin:0}
.hint{color:var(--muted);font-size:14px;margin-top:14px}
.kplist{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.kp{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.4}
.kp .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--accent-ink)}
.kp.on{border-color:var(--ok);background:var(--ok-soft)}
.kp.on .box{background:var(--ok);border-color:var(--ok)}
.btn{display:block;width:100%;text-align:center;font-weight:800;font-size:16px;padding:14px;border-radius:14px;margin-top:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--accent)}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btnrow .btn{margin-top:0;flex:1}
.btn.okb{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.btn.badb{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.flip{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px 18px}
.flip .term{font-family:Alegreya,serif;font-style:italic;font-size:26px;line-height:1.3;text-wrap:balance}
.flip .def{font-family:Alegreya,serif;font-size:18px;line-height:1.5;text-wrap:balance}
.flip .tap{color:var(--muted);font-size:13px}
.sessionmeta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-weight:700;margin-top:16px;font-variant-numeric:tabular-nums}
.score{font-family:Cinzel,serif;font-weight:700;font-size:40px;text-align:center;margin:10px 0 0}
.score.good{color:var(--ok)} .score.mid{color:var(--warn)} .score.poor{color:var(--bad)}
.center{text-align:center}
.pill{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);font-family:Alegreya,serif;font-size:16px;text-align:center;padding:30px 10px}
.drillans{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.drillans li{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px}
.laurel{color:var(--bronze);letter-spacing:.3em;text-align:center;margin-top:8px;font-size:13px}
.reveal-anim{animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.reveal-anim{animation:none}}
.weaksec{margin-top:22px}
.weaksec h3{font-family:"Alegreya Sans";font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 2px 8px}
a{color:var(--accent)}
</style>

<script>
const DATA = [{"num":2,"title":"A római jog fejlődésének korszakai","essay":[{"prompt":"Fejtsd ki, milyen szempontok szerint korszakolható a római jog története, és mutasd be az egyes korszakolásokat!","keyPoints":["a római jog története több szempont szerint korszakolható: gazdasági fejlődés, állam és jog változása, jogtudomány fejlődése szerint","a jogtudomány fejlődése szerinti korszakolás a legfontosabb","gazdasági fejlődés szerint: kisparaszti (házközösségi), patriarchális korszak és „kereskedelmi” korszak","államformák szerint sorrendben: királyság (regnum), köztársaság (libera res publica), császárság (imperium)","a jog belső fejlődése szerint sorrendben: civiljog; civiljog és praetori jog; a civiljog és a praetori jog összeolvadása; császári (egységes) jog"]},{"prompt":"Mutasd be a római jogtörténet korszakait a jogtudomány fejlődése alapján, időhatárokkal és jellemzőkkel!","keyPoints":["archaikus jog: az alapítástól Kr. e. III. század közepéig","az archaikus jog a királyság és a korai köztársaság ideje, a paraszti életviszonyok szabályozása","preklasszikus jog: Kr. e. III. század közepétől Kr. e. I. század végéig, az érett/kései köztársaság ideje","a preklasszikus korban rakják le a fejlett magán- és közjog alapjait","klasszikus jog: Kr. e. I. század végétől a III. század közepéig, a principátus ideje","a klasszikus jog a magánjog intézményeinek tökéletesítése","posztklasszikus jog (a késő császárkor joga): a III. század közepétől a VI. század elejéig, a dominátus ideje","a posztklasszikus korra válságok sora és vulgárjogi gondolkodás jellemző, a nyugati provinciákban a jog egyszerűsödik","iustinianusi jog (527–565): az ókori római jog kodifikációja (Iustinianus)","a iustinianusi jog az ókori római jog fejlődésének lezárása"]}],"terms":[{"t":"regnum","d":"királyság (államforma)"},{"t":"libera res publica","d":"köztársaság (államforma)"},{"t":"imperium","d":"császárság (államforma)"}],"drills":[{"q":"Sorold fel a római jog történetének korszakolási szempontjait!","a":["gazdasági fejlődés szerinti","állam és jog változása szerinti","jogtudomány fejlődése szerinti (a legfontosabb)"]},{"q":"Sorold fel a gazdasági fejlődés szerinti korszakokat!","a":["kisparaszti (házközösségi), patriarchális korszak","„kereskedelmi” korszak"]},{"q":"Sorold fel sorrendben az államformák szerinti korszakokat!","a":["királyság (regnum)","köztársaság (libera res publica)","császárság (imperium)"]},{"q":"Sorold fel sorrendben a jog belső fejlődése szerinti korszakokat!","a":["civiljog","civiljog és praetori jog","a civiljog és a praetori jog összeolvadása","császári (egységes) jog"]},{"q":"Sorold fel a római jogtörténet korszakait a jogtudomány fejlődése alapján!","a":["archaikus jog","preklasszikus jog","klasszikus jog","posztklasszikus jog (a késő császárkor joga)","iustinianusi jog"]}]},{"num":3,"title":"A római állam és jog az archaikus korban","essay":[{"prompt":"Mutasd be az archaikus Róma társadalmát (nemzetségi szervezet, a társadalom tagozódása), valamint a patríciusok és plebejusok küzdelmeit a törvényhozás tükrében!","keyPoints":["patriarchális nemzetségi szervezet; a Kr. e. VII. században etruszk uralom","nemzetség (gens): eleinte vérségi kapcsolat (közös ős), később közös név, ünnepek, sírhely","a genshez közös föld (pagus), névbeli közösség és meghatározott családi és öröklési rend tartozik","a gens önálló törvénykezést gyakorol tagjai (gentiles) felett","család (familia): eleinte házközösségben élő parasztcsalád","a familia tagjai a házban (domus) lakók: családfő (pater familias), feleség (uxor), gyerekek (liberi), (rab)szolga (famuli)","szabadok: patricius (az ősi nemzetségfők leszármazottja), plebeius (köznép), cliens (a patríciusoknak alávetett)","a társadalom másik nagy csoportja: rabszolgák (servi)","Kr. e. 494: a plebs első kivonulása a Szent Hegyre, ennek eredménye a néptribunusi tisztség létrehozása","Kr. e. 445: a plebejus és patrícius közötti házasság lehetővé válik","Kr. e. 367–366: leges Liciniae Sextiae – a plebs adósságterheinek csökkentése, a közföldekből elfoglalható területek korlátozása, az egyik consul a plebsből kerül ki","Kr. e. 287: lex Hortensia – a plebiscitumok az egész populus Romanusra kiterjedő hatállyal bírnak"]},{"prompt":"Ismertesd az államszervezetet a királykorban és a korai köztársaság idején, valamint Itália területi szervezetét az archaikus korban!","keyPoints":["a római állam: civitas (polgárok), res publica („a nép dolga”, a császárkortól jelentése: köztársaság); tartalmi megnevezése: senatus populusque Romanus (SPQR)","szervezeti formák: curia (katonai, jogi és kultikus közösség, 1 curia = 10 gens, később centuria) és tribus (törzs, katonai egység, 1 tribus = 10 curia)","király (rex): legfőbb bíró, hadvezér, pap és a végrehajtó hatalom teljességének (imperium) birtokosa","a rex ideiglenes helyettese a praefectus urbi; halálakor az új királyig interrex (a senatus tagja, 5 naponkénti váltás); választás korábban isteni jel (auspicia), később a curiák alapján","királykori senatus: patrícius nemzetségfők gyülekezete (100, majd 300 fő), az állami felségjog állandó hordozója, tagjait a rex jelöli ki","királykori népgyűlés (comitia curiata): a forum Romanum területén, 30 curia, eredetileg csak patríciusok, szakrális feladatok, közjogi funkció nélkül","magistratus: állami főhatalmat gyakorló tisztségviselő, illetve maga a tisztség; jellemzői: annuitás, kollegialitás, díjazás nélkül, tisztségüktől nem megfoszthatók (lemondhatnak)","magistratusok osztályozása: imperiummal rendelkező / nem rendelkező; állandó (magistratus ordinarii) / rendkívüli (magistratus extraordinarii); nagyobb (magistratus maiores) / kisebb (magistratus minores)","köztársasági senatus: az állam folyamatos működéséért felel; feladatai: külpolitika és hadügy, államháztartás ellenőrzése, szakrális szféra felügyelete, közigazgatás irányítása; auctoritas patrum: törvényszentesítés, később senatusi határozat","a senatusba később gazdag plebejusok is bekerülnek (conscripti); a névsort a consul, később a censor határozza meg","comitia centuriata: a 17–60 év közötti férfiak gyűlése a Város falain kívül; magistratus maiores megválasztása, törvényhozás, hadüzenet és béke jóváhagyása, büntetőbíráskodás","comitia tributa: polgári jellegű népgyűlés a falakon belül (a forumon), összehívója a consul vagy a praetor; magistratus minores megválasztása, törvényhozás, szövetségek kötése, törvénykezés nem politikai ügyekben","concilium plebis: a plebs tagjainak gyűlése, elnöke és összehívója a néptribunus (tribunus plebis); határozatai eleinte csak a plebsre, később az egész populus Romanusra hatnak","Itália: városállam (civitas) = központi település (oppidum) + hozzá tartozó föld (ager); ager Romanus elemei: közföldek (ager publicus), helyi közösségek (fora), meghódított városok (oppida); csoportosítás: ager publicus és ager privatus; Rómán kívül: ager peregrinus, ager hosticus, ager incertus"]},{"prompt":"Mutasd be részletesen a magistratusok hatalmának elemeit (imperium, potestas), valamint a rendes és rendkívüli magistratusokat!","keyPoints":["imperium (állami főhatalom): legfőbb polgári hatalom a Város határán belül, a hadsereg főparancsnoksága a falakon kívül, jogszolgáltatás (iurisdictio), a népgyűlés összehívása és törvények előterjesztése, a senatus összehívása és tanács kérése, büntetések és kényszerítő intézkedések kiszabása","általános potestas: hivatali hatalom, nagysága a tisztségtől függ (hierarchia); azonos hierarchiai fokon intercessiós (közbelépési) jog","a potestas elemei: auspicium (isteni jel) kérése, a nép összehívása egy ügy megvitatására, tiltakozás a collegával szemben (intercessio), edictum kibocsátása (ius edicendi – csak a magistratus curules joga)","a rendes magistratusokat a népgyűlések választják, hivatalba lépés előtt esküt tesznek a fennálló törvényekre","consul: az állam élén, 2 consul, imperiummal; végrehajtó, hadvezéri és bírói jogkörök","praetor: peres jogszolgáltatás; eredetileg 1 praetor (kivétel a kollegialitás alól), később 2 (praetor peregrinus), még később 16; imperiummal; a consulok helyettesítésekor consuli jogköröket gyakorol","censor: 18 hónapra választott 2 censor (kivétel az annuitás alól), imperium nélkül; feladatai: választási, katonai és adózási összeírások, a senatus névjegyzékének összeállítása, erkölcsrendészeti szankciók, állami javak felügyelete és szerződéskötés az állam nevében","aedilis curulis: 2 fő, imperium nélkül, de van iurisdictio és ius edicendi (továbbá bírságolási, zálogolási, lefoglalási jog); középületek felügyelete, rendészet, piaci árak ellenőrzése és gabonaellátás, nyilvános játékok megrendezése","quaestor: a consul beosztottja; az államkincstár és a levéltár felügyelete, tevékenység a (pénzügyi) igazgatásban","néptribunus: a plebs saját vezetői (2, később 10 fő), a Városon belül szent és sérthetetlen (sacrosanctus); jogai: a plebs gyűléseinek összehívása, később a senatus összehívása, vétójog, menedéknyújtás a plebs üldözötteinek","plebejus aedilisek: 2 aedilis; plebejusi templomok őrzése, a néptribunus segítése (levéltár és pénztár kezelése); joggyakorlásuk az aedilis curuliséhez hasonló, kivéve a bíráskodást","rendkívüli magistratusok: különleges esetben kijelölés (nem választás), megszabott időtartam és meghatározott feladat; legfontosabb a dictator, egyéb: interrex, praefectus urbi, decemviri legibus scribundi, triumvirek","dictator: szükséghelyzetben az egyik consul jelöli ki a senatus egyetértésével (a népgyűlés véleménye nem kell); a másik consul intercessiója nem érvényesül","a dictator legfeljebb 6 hónapra, a főhatalom teljességének (summum imperium) birtokosa; maga nevezi ki helyettesét, a lovasság parancsnokát"]},{"prompt":"Fejtsd ki az archaikus Róma normarendszereit (ius, fas, mos) és fejlődésüket!","keyPoints":["az archaikus kor elején a jogi, vallási és erkölcsi normák összefonódnak: mos / mores maiorum","a szokásjog egyre inkább elválik a vallási és erkölcsi normáktól – a jog önálló normarendszerré válik","a jog mai formáját a rómaiak „találták i állam és jog a kései köztársaság korában","essay":[{"prompt":"Mutasd be a kései köztársaság korának társadalmát és politikai küzdelmeit!","keyPoints":["Róma terjeszkedik Itáliában és a Mediterráneumban","az arisztokraták helyébe a nobilitas („nemesség”) lép, amely patríciusi és plebejusi származású","senatori rend (ordo senatorius): a szenátorok és családtagjaik – földbirtokos arisztokrácia","lovagrend (ordo equester): vagyonos plebejusok","további rétegek: antik proletariátus és rabszolgák","politikai küzdelmek: a Gracchus-fivérek földreformjai, amelyek polgárháborúhoz vezetnek"]},{"prompt":"Ismertesd a kései köztársaság államszervezetét: Róma városa, Itália és a provinciák jogi szervezetét!","keyPoints":["a római birodalom három elkülönült része: Róma városa, Itália és a provinciák","Róma városállami magistratusai: 2 consul, 2 praetor (köztük a praetor peregrinus), aedilis curulisek, quaestorok, censorok, néptribunus, aedilis plebis","problémák: a betöltési kritériumok szerint lehetőleg csak jómódúak tölthetik be a tisztségeket","cursus honorum: a tisztségek betöltése meghatározott sorrendben és életkorban","egyre gyakoribb a magistratusok főhatalmának meghosszabbítása","promagistratus: leköszönt magistratus, aki felmerült költségei kompenzálására a provincia élén helytartóként működik","monarchikus törekvések: Marius, Sulla, az (első) triumvirátus","a senatus egyre többször szavaz meg rendkívüli teljhatalmat; a népgyűlések jelentősége visszaszorul","Itália: megosztottság és lázongások → lex Iulia de civitate: Róma szövetségesei római polgárjogot kapnak","a római területek (ager Romanus) a hódításokkal nőttek; tendencia a római polgárjog kiterjedése","itáliai „idegen területek” (ager peregrinus): a latin városállamokkal (nomen Latinum) szövetségi szerződés – kezdetben a népjog egyenlőként ismeri el őket, később „másodfokú állampolgárság”; az itáliai szövetségesek (socii Italici) általában peregrinusi községek, római jogképességük alig van","provincia: eredetileg
